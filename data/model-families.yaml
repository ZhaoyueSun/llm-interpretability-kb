schema_version: 1
version: 1
status: active
updated_at: '2026-10-09'
proposal_id: tp_20261009_research_objects_v2
change_reason: >-
  Separate model architecture from the Research Objects taxonomy while providing a
  stable selector, architecture-specific terminology, and primary/secondary paper views.
families:
- model_family_id: generic-neural-network
  title: General and Cross-Architecture Models
  selector_label: General / Cross-Architecture
  introduction:
    en: >-
      Use this view for work whose central claim is formulated across neural architectures,
      in a theoretical model, or directly over data and predictions. It is not a residual
      category for unknown models; papers belong here only when architecture independence
      is part of the research design.
    zh: >-
      此视图用于核心结论跨越多种神经架构、建立在理论模型上，或直接针对数据与预测展开的研究。它不是“模型
      未知”的兜底类别；只有当架构无关性属于研究设计的一部分时，论文才以此为主模型族。
- model_family_id: transformer-language-model
  title: Transformer Language Models
  selector_label: Transformer LM
  introduction:
    en: >-
      Transformer language models process token sequences through attention, residual
      streams, and feed-forward blocks. The view exposes language-model terms such as
      token embeddings, QK/OV computation, MLP neurons, and vocabulary logits.
    zh: >-
      Transformer Language Models 通过 attention、residual stream 与 feed-forward block 处理 token 序列。
      选择此视图时，应展示 token embedding、QK/OV 计算、MLP neuron 与词表 logits 等语言模型术语。
- model_family_id: recurrent-neural-network
  title: Recurrent Neural Networks
  selector_label: RNN
  introduction:
    en: >-
      Recurrent networks update a bounded hidden state as a sequence advances. Their
      characteristic objects are recurrent states, gates, update rules, and the temporal
      persistence or loss of information.
    zh: >-
      Recurrent Neural Networks 随序列推进反复更新一个有限隐藏状态。其特征对象包括 recurrent state、gate、
      状态更新规则，以及信息随时间的保持或遗失。
- model_family_id: convolutional-neural-network
  title: Convolutional Neural Networks
  selector_label: CNN
  introduction:
    en: >-
      Convolutional networks build spatial representations through shared kernels and
      channels. This view uses feature maps, filters, receptive fields, and convolutional
      normalization rather than forcing transformer terminology onto vision models.
    zh: >-
      Convolutional Neural Networks 通过共享 kernel 与 channel 构建空间表征。此视图使用 feature map、filter、
      感受野与卷积归一化等术语，避免把 Transformer 术语强行套到视觉模型上。
- model_family_id: vision-transformer
  title: Vision Transformers
  selector_label: Vision Transformer
  introduction:
    en: >-
      Vision transformers turn image patches into a token-like sequence and process it
      with transformer blocks. Their view replaces token embeddings with patch embeddings
      where appropriate while retaining attention, residual, and MLP objects.
    zh: >-
      Vision Transformers 把图像 patch 转换成类似 token 的序列，再用 Transformer block 处理。此视图会在适当
      位置显示 patch embedding，同时保留 attention、residual 与 MLP 等共享对象。
- model_family_id: vision-language-model
  title: Vision–Language Models
  selector_label: Vision–Language
  introduction:
    en: >-
      Vision–language models align or combine visual and linguistic representations.
      Besides objects inherited from their encoders and language models, this view
      highlights visual tokens, modality projectors, cross-modal attention, and similarity scores.
    zh: >-
      Vision–Language Models 对齐或组合视觉与语言表征。除继承视觉编码器和语言模型的对象外，此视图还突出
      visual token、modality projector、cross-modal attention 与相似度分数。
- model_family_id: state-space-model
  title: State-Space Models
  selector_label: State-Space / Mamba
  introduction:
    en: >-
      State-space sequence models propagate a structured latent state, with modern
      selective variants making transitions input dependent. Their vocabulary centers on
      state-space states, selective gates, transition modes, and long-range memory.
    zh: >-
      State-Space Models 传播结构化潜在状态，现代 selective 变体还让状态转移依赖输入。此视图的核心对象是
      state-space state、selective gate、转移模态与长程记忆。
- model_family_id: mixture-of-experts
  title: Mixture-of-Experts Models
  selector_label: Sparse MoE
  introduction:
    en: >-
      Mixture-of-experts models route each token or state through a sparse subset of
      expert networks. This view adds routers, gates, expert networks, expert outputs,
      and expert units to the shared transformer objects.
    zh: >-
      Mixture-of-Experts Models 把每个 token 或状态路由到稀疏选择的一组 expert network。此视图在共享的
      Transformer 对象之外，增加 router、gate、expert network、expert output 与 expert unit。
- model_family_id: diffusion-model
  title: Diffusion Models
  selector_label: Diffusion
  introduction:
    en: >-
      Diffusion models generate or reconstruct data through a trajectory of noisy latent
      states and denoising predictions. Their view exposes denoising latents, conditioned
      blocks, timestep-dependent computation, and noise, velocity, or score predictions.
    zh: >-
      Diffusion Models 通过带噪潜在状态与去噪预测组成的轨迹生成或重建数据。此视图展示 denoising latent、
      条件化 block、时间步依赖计算，以及 noise、velocity 或 score prediction。
