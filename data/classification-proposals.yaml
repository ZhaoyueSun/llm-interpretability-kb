  kind: taxonomy_and_classification
  status: rejected
  resolved_at: '2026-10-09'
  superseded_by: tp_20261009_research_objects_v2
  resolution_reason: >-
    Superseded after review: the draft mixed interpretability tools and their outputs
    with target objects, coupled object names too tightly to Transformer terminology,
    and covered only the original 110 papers.
  created_at: '2026-10-09'
  title: Research-object taxonomy v1 for the 110-paper corpus
  taxonomy_id: research-object
  proposed_version: 1
  evidence_sources:
  - paper_id: p_2026_wang_mechanist_ai_as
    role: source taxonomy for interpretable objects and mechanism-method families
  - paper_id: p_2026_zhang_locate_steer_and
    role: operational definitions of Transformer objects, localization targets, and steering targets
  - source: project_corpus
    handoff_id: 2026-10-08__llm-interpretability-final-corpus
    role: titles and abstracts of all 110 selected papers
  design_decisions:
  - Architecture and modality are orthogonal facets, not branches of the object tree.
  - A circuit is a composed mechanism and is not a peer subtype of a neuron or attention head.
  - Learned sparse features are representation objects; the trained dictionary or SAE is an explanation artifact.
  - Papers evaluating interpretability methods may use the evaluated explanation artifact as their primary research object.
  - Every paper has exactly one primary object; secondary objects record other materially studied targets.
  orthogonal_facets:
  - name: architecture
    examples: [transformer, cnn, recurrent-network, vision-language-model, architecture-agnostic]
  - name: modality
    examples: [language, vision, vision-language, biological-sequence, architecture-agnostic]
  - name: granularity
    examples: [token, feature, unit, component, layer, path, circuit, model, training-run]
  proposed_nodes:
  - node_id: research-object
    parent_id: null
    title: Research Objects
    description_en: Objects whose representation, computation, causal role, learning, or explanation is directly studied.
    description_zh: 论文直接研究其表征、计算、因果作用、学习过程或解释质量的对象。
  - node_id: interface-object
    parent_id: research-object
    title: Interface Objects
    description_en: Objects at the model input or output boundary.
    description_zh: 位于模型输入或输出边界的对象。
  - node_id: input-token-embedding
    parent_id: interface-object
    title: Input Tokens and Embeddings
    description_en: Discrete input units and their initial continuous embeddings, including visual-token embeddings.
    description_zh: 离散输入单元及其初始连续嵌入，包括视觉 token 嵌入。
  - node_id: output-logit-distribution
    parent_id: interface-object
    title: Output Logits and Distributions
    description_en: Pre-softmax logits, output probabilities, and decision margins studied as direct objects.
    description_zh: 作为直接研究对象的 softmax 前 logits、输出概率与决策间隔。
  - node_id: internal-representation
    parent_id: research-object
    title: Internal States and Representations
    description_en: Dynamic internal states and representational structures carried by model activations.
    description_zh: 由模型激活承载的动态内部状态与表征结构。
  - node_id: layer-residual-state
    parent_id: internal-representation
    title: Layer and Residual-Stream States
    description_en: Token-position-specific hidden states, block outputs, and residual-stream activations across layers.
    description_zh: 跨层的特定 token 位置隐藏状态、模块输出与残差流激活。
  - node_id: linear-direction-vector
    parent_id: internal-representation
    title: Linear Directions and Vectors
    description_en: One-dimensional activation directions used to encode, read, or steer a concept, function, or behavior.
    description_zh: 用于编码、读出或操控概念、函数或行为的一维激活方向。
  - node_id: subspace-manifold-geometry
    parent_id: internal-representation
    title: Subspaces, Manifolds, and Geometry
    description_en: Multidimensional representational structure, including subspaces, manifolds, intrinsic dimension, and relational geometry.
    description_zh: 多维表征结构，包括子空间、流形、内在维度与关系几何。
  - node_id: learned-sparse-feature
    parent_id: internal-representation
    title: Learned Sparse Features
    description_en: Individual learned coordinates or feature vectors obtained from sparse dictionary methods such as SAEs.
    description_zh: 由 SAE 等稀疏字典方法得到的单个学习坐标或特征向量。
  - node_id: native-component
    parent_id: research-object
    title: Native Model Components
    description_en: Components present in the target model's own computational graph.
    description_zh: 目标模型自身计算图中原生存在的组件。
  - node_id: attention-system
    parent_id: native-component
    title: Attention Components
    description_en: Attention routing and value-writing components.
    description_zh: 注意力路由与值写回组件。
  - node_id: attention-pattern-qk
    parent_id: attention-system
    title: Attention Patterns and QK Routing
    description_en: Attention weights, score matrices, and query-key routing behavior.
    description_zh: 注意力权重、分数矩阵及 query-key 路由行为。
  - node_id: attention-head-output-ov
    parent_id: attention-system
    title: Attention Heads and Head Outputs
    description_en: Whole attention heads, their outputs, and value-output behavior as functional units.
    description_zh: 作为功能单元的完整注意力头、head output 与 value-output 行为。
  - node_id: ffn-system
    parent_id: native-component
    title: MLP and Feed-Forward Components
    description_en: Position-wise feed-forward modules and their native units.
    description_zh: 逐位置前馈模块及其原生单元。
  - node_id: ffn-layer-output
    parent_id: ffn-system
    title: MLP/FFN Layers and Outputs
    description_en: Feed-forward modules, sublayers, and their aggregate outputs.
    description_zh: 前馈模块、子层及其整体输出。
  - node_id: neuron-hidden-unit
    parent_id: ffn-system
    title: Neurons and Hidden Units
    description_en: Individual native neurons or hidden units, including CNN units in architecture-agnostic work.
    description_zh: 单个原生神经元或隐藏单元，也包括架构无关研究中的 CNN units。
  - node_id: model-parameter
    parent_id: research-object
    title: Model Parameters
    description_en: Individual weights, matrices, localized parameter sets, and parameter-space changes.
    description_zh: 单个权重、矩阵、局部参数集合与参数空间变化。
  - node_id: composed-mechanism
    parent_id: research-object
    title: Composed Mechanisms
    description_en: Explanatory objects formed from multiple states, components, parameters, or causal relations.
    description_zh: 由多个状态、组件、参数或因果关系组成的解释对象。
  - node_id: path-edge-information-flow
    parent_id: composed-mechanism
    title: Paths, Edges, and Information Flow
    description_en: Directed interactions or information routes between model states and components.
    description_zh: 模型状态与组件之间的有向交互或信息流路径。
  - node_id: circuit-subgraph
    parent_id: composed-mechanism
    title: Circuits and Computational Subgraphs
    description_en: Multi-component subgraphs claimed to be sufficient, necessary, or faithful for a behavior.
    description_zh: 被主张对某种行为具有充分性、必要性或忠实性的多组件计算子图。
  - node_id: causal-variable-algorithm
    parent_id: composed-mechanism
    title: Causal Variables and Algorithms
    description_en: High-level variables, programs, or algorithms aligned with lower-level model computation.
    description_zh: 与底层模型计算对齐的高层变量、程序或算法。
  - node_id: learning-process
    parent_id: research-object
    title: Learning Processes
    description_en: Objects defined by change during training rather than by one fixed forward pass.
    description_zh: 由训练过程中的变化定义、而非单次固定前向传播定义的对象。
  - node_id: checkpoint-training-trajectory
    parent_id: learning-process
    title: Checkpoints and Training Trajectories
    description_en: How representations, components, and mechanisms emerge or change across checkpoints.
    description_zh: 表征、组件与机制如何随 checkpoint 出现或变化。
  - node_id: optimization-dynamics-landscape
    parent_id: learning-process
    title: Optimization Dynamics and Landscapes
    description_en: Gradient dynamics, phase transitions, identifiability, critical points, and loss-landscape structure.
    description_zh: 梯度动力学、相变、可辨识性、临界点与损失景观结构。
  - node_id: explanation-artifact
    parent_id: research-object
    title: Interpretability Artifacts
    description_en: Auxiliary objects produced or evaluated by interpretability methods rather than native model internals.
    description_zh: 由可解释性方法产生或评估、而非目标模型原生内部结构的辅助对象。
  - node_id: probe-lens-readout
    parent_id: explanation-artifact
    title: Probes, Lenses, and Readouts
    description_en: Learned or constructed decoders used to read information from model states.
    description_zh: 用于从模型状态中读出信息的学习型或构造型解码器。
  - node_id: feature-dictionary
    parent_id: explanation-artifact
    title: Feature Dictionaries
    description_en: The learned dictionary or auxiliary decomposition model, distinguished from any one learned feature.
    description_zh: 学习得到的字典或辅助分解模型，与其中任一单独特征相区分。
  - node_id: attribution-localization-artifact
    parent_id: explanation-artifact
    title: Attribution and Localization Results
    description_en: Saliency maps, localization claims, and attribution outputs whose validity is itself under study.
    description_zh: 其有效性本身成为研究对象的显著性图、定位结论与归因结果。
  - node_id: benchmark-evaluation-metric
    parent_id: explanation-artifact
    title: Benchmarks and Evaluation Metrics
    description_en: Datasets, protocols, and quantitative metrics designed to compare interpretability objects or methods.
    description_zh: 用于比较可解释对象或方法的数据集、评估协议与定量指标。
