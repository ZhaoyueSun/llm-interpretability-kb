    principal evidential limitation. The tree structure and paper assignments are unchanged.
- proposal_id: tp_20261009_application_scenarios_v2
  replaces_draft: tp_20261009_application_scenarios_v1
  kind: taxonomy_and_classification
  status: approved
  created_at: '2026-10-09'
  approved_at: '2026-10-09'
  approval_basis: >-
    After reviewing the expanded tree and the experiment-grounded assignments, the user
    approved materializing the taxonomy and classifications in the formal data model.
    The user also requested reader-oriented bilingual node introductions, strict
    separation from the Techniques and Research Objects tabs, and removal of internal
    coverage-gap commentary from node overviews.
  title: Experiment-grounded Application and Scenarios taxonomy for the 123-paper corpus
  taxonomy_id: application-scenarios
  resulting_taxonomy_version: 1
  taxonomy_file: data/taxonomies/application-scenarios.yaml
  corpus_id: llm-interpretability-kb
  corpus_version: 2
  corpus_size: 123
  node_count: 30
  event_write:
    primary_events: 123
    secondary_events: 128
    first_event_id: ce_20261009_application_scenarios_0001
    last_event_id: ce_20261009_application_scenarios_0251
  revision_reason: >-
    Rebuild the taxonomy from the datasets and tasks used in each paper's experiments.
    Remove contribution types, techniques, and research objects from the scenario tree.
  evidence_basis: >-
    Full-text review of the experiment setup, datasets, tasks, benchmarks, case studies,
    and relevant appendices for all 123 papers. Titles and abstracts are used only as
    navigation aids and never override experimental evidence.
  classification_model:
    primary: >-
      The task family that best represents the paper's central empirical claim. When the
      paper deliberately evaluates unrelated task families, the primary is Cross-Domain
      Task Suites; when it uses only ordinary next-token data without a downstream task,
      the primary is General Language Modeling; and when the task is deliberately
      generated to isolate a mechanism, the primary is Synthetic Controlled Tasks.
    secondary: >-
      Other task families materially used in experiments or causal validation. A dataset
      used only to train an interpretability artifact, a motivating example, or a passing
      feature illustration is not sufficient by itself.
    multiplicity: Each paper has exactly one primary relation and zero or more secondary relations.
    leaf_only_assignments: true
  exclusion_rules:
  - SAE, probing, patching, attribution, circuit discovery, and steering are techniques, not scenarios.
  - Attention heads, neurons, residual streams, sparse features, and representations are research objects, not scenarios.
  - Method evaluation, faithfulness, learning dynamics, and representation geometry are contribution or analysis types, not scenarios.
  - Model architecture and modality do not determine the scenario; the dataset task does.
