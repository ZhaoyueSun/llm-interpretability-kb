  superseded_by: tp_20261009_application_scenarios_v2
  resolution_reason: >-
    Superseded after review because the draft relied too heavily on titles, abstracts,
    contribution types, and existing object/technique labels. In particular, General
    Interpretability, Interpretability Evaluation, and Learning and Representation
    Dynamics are not application scenarios. The replacement is grounded in the
    datasets and tasks actually used in each paper's experiments.
