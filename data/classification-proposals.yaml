- proposal_id: tp_20261009_techniques_v3
  replaces_draft: tp_20261009_techniques_v2
  kind: taxonomy
  status: approved
  created_at: '2026-10-09'
  approved_at: '2026-10-09'
  approval_basis: >-
    The user approved the recommended restructuring during the taxonomy review and,
    after PaperManage added the thirteen requested supplement papers, explicitly
    authorized construction of the expanded Techniques data model.
  title: Expanded Techniques taxonomy v1 for the 123-paper corpus
  taxonomy_id: techniques
  resulting_taxonomy_version: 1
  taxonomy_file: data/taxonomies/techniques.yaml
  corpus_size: 123
  node_count: 77
  revision_reason: >-
    This revision incorporates the approved multi-level method families, separates
    techniques from target objects and paper attributes, and fills the field-coverage
    gaps identified from Mechanist and Locate, Steer, and Improve.
  approved_structure:
  - Readout and Measurement
  - Feature Discovery and Decomposition
  - Causal Intervention and Attribution
  - Circuit Discovery
  - Steering and Model Change
  - Formal and Temporal Mechanism Analysis
  - Evaluation and Falsification Protocols
  structural_decisions:
  - Feature-Basis Construction is replaced by Feature Discovery and Decomposition.
  - Sparse Autoencoders are one family within Feature Dictionary Learning; Transcoders
    and Crosscoders are sibling technique families.
  - ICA Lens is represented as ICA-Based Decomposition rather than as an SAE variant.
  - Causal Localization is broadened to Causal Intervention and Attribution.
  - Optimized Localization is replaced by the direct operation Learned Masks and Gates.
  - Circuit and Algorithm Reconstruction is renamed Circuit Discovery because the
    recovered algorithm is a research object or result rather than an operation.
  - Multimodal-specific interpretability is decomposed into concrete techniques; modality
    remains a paper attribute.
  - Attention heads, neurons, residual states, parameters, and learned features remain
    target objects rather than technique branches.
  added_or_expanded_families:
  - Shapley-Value Attribution, including Kernel and Sampling SHAP and Amortized SHAP
  - Layer-Wise and Concept Relevance Propagation
  - Magnitude-Based Scoring
  - Network Dissection and CLIP-Based Unit Labeling
  - Transcoders, Crosscoders, and ICA-Based Decomposition
  - Attribution Patching
  - Parameter-Space Task Vectors and Task Arithmetic
  - Neural Feature-Learning Analysis, including NFM-AGOP/EGOP, kernel/NTK, and convolutional regimes
  content_requirement: >-
    Every root, intermediate, and leaf node has a unique English title and bilingual
    Markdown introduction in the formal taxonomy file.
  classification_follow_up:
    status: proposal_created
    proposal_id: cp_20261009_techniques_v1_123
    scope: >-
      Reclassify all 123 corpus papers with one primary technique and any materially
      used secondary technique leaves. Submit the relations as a separate proposal
      before appending approved classification events.
