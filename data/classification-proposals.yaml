- proposal_id: tp_20261009_research_objects_v2
  replaces_draft: tp_20261009_research_objects_v1
  kind: taxonomy
  status: approved
  created_at: '2026-10-09'
  approved_at: '2026-10-09'
  approval_basis: >-
    After iterative review of the object-versus-technique distinction and the
    architecture-general design, the user explicitly requested construction of this
    data model, including the thirteen supplement papers and visualization handoff.
  title: Architecture-general Research Objects taxonomy for the 123-paper corpus
  taxonomy_id: research-object
  resulting_taxonomy_version: 1
  taxonomy_file: data/taxonomies/research-object.yaml
  corpus_size: 123
  node_count: 69
  structural_decisions:
  - Model family is an independent selector and view dimension, not a parent branch of the object tree.
  - Discrete data units are separated from continuous representations; for example, token and token embedding are distinct objects.
  - Object role is explicit as input, internal, output, structural, or process, so an embedding is not duplicated merely because it appears at an interface.
  - Probes, lenses, SAEs, transcoders, crosscoders, and attribution procedures are techniques; only the states, features, parameters, or mechanisms they analyze belong here.
  - Architecture-specific names are leaves under stable general branches and are exposed selectively through applicable_model_families.
  - Scores and predictions remain a cross-architecture branch; the model-family selector changes its applicable children rather than removing the branch.
  supplement_review:
    result: no_new_top_level_branch_required
    added_or_confirmed_leaves: [input-feature, transcoder-feature, crosscoder-feature, independent-component, concept-aligned-feature, parameter-delta-task-vector, feature-map, channel-filter, weight-matrix-kernel]
    note: >-
      The thirteen supplement papers broaden the leaf vocabulary but still fit the six
      general branches: representations, scores, components, parameters, mechanisms,
      and learning processes.
  model_family_follow_up:
    data_file: data/model-families.yaml
    schema_file: schemas/model-families.schema.json
    families: [generic-neural-network, transformer-language-model, recurrent-neural-network, convolutional-neural-network, vision-transformer, vision-language-model, state-space-model, mixture-of-experts, diffusion-model]
