schema_version: 1
proposals:
- proposal_id: tp_20261009_techniques_v2
  replaces_draft: tp_20261009_techniques_v1
  kind: taxonomy_and_classification
  status: pending
  created_at: '2026-10-09'
  title: Technique primitives taxonomy v2 for the 110-paper corpus
  taxonomy_id: techniques
  revision_reason: >-
    The first draft mixed contribution types such as theory, training dynamics, and
    evaluation with operational techniques. This revision classifies reusable method
    primitives and records contribution role, evidence strength, target object, and
    modality as separate facets.
  evidence_sources:
  - paper_id: p_2026_wang_mechanist_ai_as
    role: mechanism-method families and executable method definitions
  - paper_id: p_2026_zhang_locate_steer_and
    role: localization and steering operations, targets, strengths, and limitations
  classification_model:
    primary_technique: the most distinctive reusable operation introduced or centrally used
    secondary_techniques: other operations materially required by the paper's main pipeline
    orthogonal_facets:
    - name: evidence_strength
      values: [descriptive, decodable, sensitivity, causal-local, causal-structural, formal, audit]
    - name: target_object
      values: [token, residual-stream, attention-head, neuron-mlp, learned-feature, edge-circuit, parameter, logit, training-trajectory]
    - name: contribution_role
      values: [method, empirical-discovery, theory, evaluation, application]
    - name: modality
      values: [language, vision, vision-language, architecture-agnostic]
    notes:
    - A paper may receive several technique leaves, but exactly one primary leaf.
    - Diagnostic ablation and steering ablation share an operation but differ in purpose;
      they are separated by causal-localization versus steering-and-model-change.
    - Heads, neurons, residual streams, parameters, and SAE features are target objects,
      not top-level technique families.
    - Multimodal is a modality facet, not a technique family.
  evidence_ladder:
  - level: descriptive
    claim: A pattern or direction is present.
  - level: decodable
    claim: A property can be recovered from an internal state.
  - level: sensitivity
    claim: A local change in the target affects the metric to first order.
  - level: causal-local
    claim: An intervention changes or restores the behavior.
  - level: causal-structural
    claim: A set of components and edges is necessary or sufficient as a mechanism.
  - level: formal
    claim: The mechanism satisfies a mathematical or solver-checkable specification.
  - level: audit
    claim: A method's reliability, robustness, or utility is measured.
  proposed_nodes:
  - node_id: technique
    parent_id: null
    title: Technique Primitives
  - node_id: readout-measurement
    parent_id: technique
    title: Readout and Measurement
  - node_id: activation-statistics
    parent_id: readout-measurement
    title: Activation Statistics
    operation: Measure activation frequency, sparsity, magnitude, selectivity, entropy, or norm.
    evidence_strength: descriptive
  - node_id: attention-pattern-analysis
    parent_id: readout-measurement
    title: Attention Pattern and OV/QK Analysis
    operation: Inspect routing patterns and decompose attention heads into QK and OV behavior.
    evidence_strength: descriptive
  - node_id: vocabulary-projection
    parent_id: readout-measurement
    title: Native Vocabulary Projection
    operation: Project residual, head, neuron-value, or feature vectors through the model unembedding.
    evidence_strength: descriptive
  - node_id: learned-lenses
    parent_id: readout-measurement
    title: Learned and Model-Internal Lenses
    operation: Learn or construct layer/head-specific decoders, including Tuned Lens, Future Lens, Attention Lens, and model-internal readout.
    evidence_strength: decodable
  - node_id: supervised-probing
    parent_id: readout-measurement
    title: Supervised and Sparse Probing
    operation: Fit linear, nonlinear, or sparsity-constrained predictors to internal states.
    evidence_strength: decodable
  - node_id: unsupervised-contrastive-probing
    parent_id: readout-measurement
    title: Unsupervised Contrastive Probing
    operation: Recover latent directions from unlabeled contrastive or consistency constraints.
    evidence_strength: decodable
  - node_id: representation-geometry
    parent_id: readout-measurement
    title: Representation Geometry and Subspace Analysis
    operation: Estimate directions, subspaces, manifolds, intrinsic dimension, or relational geometry.
    evidence_strength: descriptive
  - node_id: gradient-sensitivity
    parent_id: readout-measurement
    title: Gradient Sensitivity
    operation: Score inputs, states, neurons, or parameters with gradients, gradient-times-input, or integrated gradients.
    evidence_strength: sensitivity
  - node_id: decomposition-attribution
    parent_id: readout-measurement
    title: Decomposition and Component Attribution
    operation: Decompose a prediction into component or token contributions without exhaustive interventions.
    evidence_strength: sensitivity
  - node_id: feature-basis-construction
    parent_id: technique
    title: Feature-Basis Construction
  - node_id: concept-unit-alignment
    parent_id: feature-basis-construction
    title: Concept-Unit Alignment
    operation: Match native units to semantic concepts using labeled concept sets or cross-modal alignment.
    evidence_strength: decodable
  - node_id: vanilla-topk-sae
    parent_id: feature-basis-construction
    title: Vanilla and Top-K Sparse Autoencoders
    operation: Learn an overcomplete sparse linear feature basis for model activations.
    evidence_strength: descriptive
  - node_id: gated-jumprelu-sae
    parent_id: feature-basis-construction
    title: Gated and JumpReLU Sparse Autoencoders
    operation: Separate feature selection from magnitude or learn discontinuous activation thresholds.
    evidence_strength: descriptive
  - node_id: specialized-feature-aligned-sae
    parent_id: feature-basis-construction
    title: Specialized and Feature-Aligned Dictionaries
    operation: Bias dictionary learning toward rare domains, stable features, or input-aligned concepts.
    evidence_strength: descriptive
  - node_id: end-to-end-functional-dictionary
    parent_id: feature-basis-construction
    title: End-to-End Functional Dictionary Learning
    operation: Train a dictionary against downstream model behavior rather than activation reconstruction alone.
    evidence_strength: causal-local
  - node_id: subspace-aware-dictionary
    parent_id: feature-basis-construction
    title: Subspace-Aware Dictionary Learning
    operation: Represent a feature with a learned multidimensional subspace rather than one decoder direction.
    evidence_strength: descriptive
  - node_id: cross-model-feature-alignment
    parent_id: feature-basis-construction
    title: Cross-Model Feature Alignment and Stitching
    operation: Learn mappings that compare or transfer feature bases across models or scales.
    evidence_strength: descriptive
  - node_id: causal-localization
    parent_id: technique
    title: Causal Localization
  - node_id: activation-ablation-replacement
    parent_id: causal-localization
    title: Activation Ablation and Replacement
    operation: Zero, mean-replace, resample, or substitute component activations.
    evidence_strength: causal-local
  - node_id: activation-patching
    parent_id: causal-localization
    title: Activation Patching and Causal Tracing
    operation: Restore clean activations in corrupted runs or exchange activations between contexts.
    evidence_strength: causal-local
  - node_id: path-patching
    parent_id: causal-localization
    title: Path Patching
    operation: Isolate causal effects transmitted along selected sender-receiver paths.
    evidence_strength: causal-structural
  - node_id: learned-gates-masks
    parent_id: causal-localization
    title: Learned Masks and Gates
    operation: Optimize differentiable gates or masks to identify task-relevant components.
    evidence_strength: causal-local
  - node_id: causal-mediation
    parent_id: causal-localization
    title: Causal Mediation Analysis
    operation: Quantify how much a component mediates the input-to-output effect.
    evidence_strength: causal-local
  - node_id: interchange-intervention
    parent_id: causal-localization
    title: Interchange Interventions and Distributed Alignment Search
    operation: Swap aligned internal variables and optimize alignments to test high-level causal roles.
    evidence_strength: causal-structural
  - node_id: circuit-reconstruction
    parent_id: technique
    title: Circuit and Algorithm Reconstruction
  - node_id: manual-circuit-analysis
    parent_id: circuit-reconstruction
    title: Hypothesis-Driven Circuit Analysis
    operation: Iteratively inspect, intervene, and refine a human-specified computational graph.
    evidence_strength: causal-structural
  - node_id: automated-intervention-search
    parent_id: circuit-reconstruction
    title: Automated Intervention-Based Circuit Search
    operation: Search and prune graph components or edges using repeated causal interventions, including ACDC-style procedures.
    evidence_strength: causal-structural
  - node_id: attribution-edge-search
    parent_id: circuit-reconstruction
    title: Attribution-Based Edge Search
    operation: Approximate edge effects with EAP, EAP-IG, contextual decomposition, or information-flow attribution.
    evidence_strength: sensitivity
  - node_id: feature-circuit-discovery
    parent_id: circuit-reconstruction
    title: Sparse Feature Circuit Discovery
    operation: Build causal graphs whose nodes are learned dictionary features rather than native components.
    evidence_strength: causal-structural
  - node_id: circuit-comparison-universality
    parent_id: circuit-reconstruction
    title: Circuit Comparison and Universality Testing
    operation: Align and compare circuit structure across tasks, modalities, architectures, or scales.
    evidence_strength: causal-structural
  - node_id: solver-checkable-verification
    parent_id: circuit-reconstruction
    title: Solver-Checkable Circuit Verification
    operation: Prove bounded equivalence, invariance, necessity, or robustness properties of a localized circuit.
    evidence_strength: formal
  - node_id: steering-model-change
    parent_id: technique
    title: Steering and Model Change
  - node_id: activation-scaling-suppression
    parent_id: steering-model-change
    title: Activation Scaling, Suppression, and Runtime Gating
    operation: Change behavior by scaling, suppressing, replacing, or gating runtime activations.
    evidence_strength: causal-local
  - node_id: activation-vector-addition
    parent_id: steering-model-change
    title: Activation Vector Addition and Representation Engineering
    operation: Add a contrastive, task, function, or feature direction to an internal state.
    evidence_strength: causal-local
  - node_id: projection-erasure
    parent_id: steering-model-change
    title: Projection Erasure and Direction Removal
    operation: Remove a direction or subspace from runtime activations or component outputs.
    evidence_strength: causal-local
  - node_id: logit-steering
    parent_id: steering-model-change
    title: Logit-Space Steering
    operation: Add or subtract a learned direction directly in the output distribution.
    evidence_strength: causal-local
  - node_id: targeted-parameter-editing
    parent_id: steering-model-change
    title: Targeted Parameter Editing and Local Fine-Tuning
    operation: Apply localized rank-one, low-rank, masked, or neuron-specific weight updates.
    evidence_strength: causal-local
  - node_id: mechanism-induction-construction
    parent_id: steering-model-change
    title: Mechanism Induction and Circuit Construction
    operation: Train or construct a model to implement a specified causal or algorithmic mechanism.
    evidence_strength: causal-structural
  - node_id: formal-temporal-analysis
    parent_id: technique
    title: Formal and Temporal Mechanism Analysis
  - node_id: toy-model-construction
    parent_id: formal-temporal-analysis
    title: Controlled Toy-Model Construction
    operation: Build a minimal model in which a proposed mechanism can be derived and exhaustively inspected.
    evidence_strength: formal
  - node_id: checkpoint-trajectory-analysis
    parent_id: formal-temporal-analysis
    title: Checkpoint and Training-Trajectory Analysis
    operation: Track components, circuits, representations, and loss phases across training checkpoints.
    evidence_strength: descriptive
  - node_id: analytic-training-dynamics
    parent_id: formal-temporal-analysis
    title: Analytic Optimization and Training Dynamics
    operation: Derive how gradient-based optimization produces a mechanism or phase transition.
    evidence_strength: formal
  - node_id: causal-abstraction-formalism
    parent_id: formal-temporal-analysis
    title: Causal-Abstraction and Counterfactual Formalism
    operation: Define mechanistic explanations as transformations or abstractions between causal models.
    evidence_strength: formal
  - node_id: optimization-landscape-analysis
    parent_id: formal-temporal-analysis
    title: Optimization-Landscape Analysis
    operation: Analyze identifiability, convexity, critical points, and spurious solutions of interpretability objectives.
    evidence_strength: formal
  - node_id: evaluation-protocols
    parent_id: technique
    title: Evaluation and Falsification Protocols
  - node_id: randomized-sanity-controls
    parent_id: evaluation-protocols
    title: Randomization and Sanity Controls
    operation: Randomize parameters or labels to test whether an explanation depends on the trained model and data.
    evidence_strength: audit
  - node_id: probe-controls
    parent_id: evaluation-protocols
    title: Probe Controls and Detectability Analysis
    operation: Separate information encoded by the model from information learned or missed by the probe.
    evidence_strength: audit
  - node_id: intervention-faithfulness
    parent_id: evaluation-protocols
    title: Intervention Faithfulness and Robustness Tests
    operation: Test sensitivity to baselines, corruption, metrics, thresholds, side effects, and distribution shift.
    evidence_strength: audit
  - node_id: dictionary-quality-metrics
    parent_id: evaluation-protocols
    title: Dictionary Quality and Monosemanticity Metrics
    operation: Measure reconstruction, sparsity, interpretability, functional fidelity, absorption, and feature coherence.
    evidence_strength: audit
  - node_id: benchmark-comparison
    parent_id: evaluation-protocols
    title: Controlled Benchmarking and Method Comparison
    operation: Compare interpretability or steering methods against common datasets, metrics, and baselines.
    evidence_strength: audit
