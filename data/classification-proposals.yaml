- proposal_id: tp_20261010_techniques_v10_attribution_sensitivity_calculation
  kind: taxonomy_content
  status: approved
  created_at: '2026-10-10'
  approved_at: '2026-10-10'
  approval_basis: >-
    The user approved the revised introduction after requesting that the main sentence
    structure foreground what is scored, that calculation examples be moved into
    parentheses, and that sensitivity be distinguished from attribution.
  title: Explain attribution and sensitivity calculations
  taxonomy_id: techniques
  from_taxonomy_version: 9
  resulting_taxonomy_version: 10
  taxonomy_file: data/taxonomies/techniques.yaml
  affected_node_ids: [attribution-sensitivity]
  revision_reason: >-
    Describe the output and internal elements being scored, summarize common attribution
    calculations parenthetically, and distinguish estimated current contribution from
    local sensitivity to an additional change. The tree structure and paper assignments
    are unchanged.
  approved_introduction:
    en: >-
      Attribution tries to assign credit for a prediction to the inputs or internal
      elements that may have contributed to it. Researchers usually begin by selecting
      an output to explain, such as the target token's logit, and then calculate how much
      each token, neuron, attention head, or feature contributes to that output. The
      specific methods all estimate an element's contribution to the current output
      (for example, Gradient × Input, Integrated Gradients, Relevance Propagation, or the
      change in output after removing the element). Sensitivity does not estimate how
      much a factor has already contributed; instead, it measures how rapidly the
      prediction would change under a small additional change to that factor, usually
      using an output gradient or the output difference caused by a small perturbation.
      These scores are useful for narrowing a large search space, but their meaning
      depends on the chosen baseline, approximation, and definition of a “missing”
      feature; high attribution should therefore not be read as causal proof.
    zh: >-
      Attribution 试图把一次预测的“功劳”分配给可能参与其中的输入或内部元素。研究者通常先选定要解释的
      输出（如目标 token 的 logit），再为不同 token、神经元、attention head 或特征计算它们对该输出的
      归因分数。具体方法都在估计各元素对当前输出的贡献（例如 Gradient × Input、Integrated Gradients、
      Relevance Propagation，或移除元素前后的输出差异）。Sensitivity 不估计某个因素“已经贡献了多少”，
      而是衡量继续对它做小幅改变时，预测会变化多快，通常通过输出梯度或小扰动造成的输出差值来计算。
      这些分数很适合缩小庞大的搜索空间，但其含义依赖基线、近似方式以及“特征缺失”的定义，因此高归因分数
      不应直接读成因果证明。
- proposal_id: tp_20261010_techniques_v11_gradient_sensitivity_workflow
  kind: taxonomy_content
  status: approved
  created_at: '2026-10-10'
  approved_at: '2026-10-10'
  approval_basis: >-
    The user approved a paper-grounded rewrite that connects the parent node's distinction
    between sensitivity and attribution to the concrete workflows used by Knowledge
    Neurons, Attribution Patching, and EAP-IG.
  title: Explain the gradient-sensitivity workflow with corpus examples
  taxonomy_id: techniques
  from_taxonomy_version: 10
  resulting_taxonomy_version: 11
  taxonomy_file: data/taxonomies/techniques.yaml
  affected_node_ids: [gradient-sensitivity]
  revision_reason: >-
    Explain the selected output metric, gradient sign and magnitude, the transition from
    local sensitivity to attribution, and the approximation limits documented by papers
    assigned to this branch. The tree structure and paper assignments are unchanged.
  approved_introduction:
    en: >-
      Gradient sensitivity begins by selecting an output metric to explain, such as the
      probability of the correct token or the logit difference between two candidate
      tokens, and then computes the gradient of that metric with respect to inputs or
      internal activations. The sign of a gradient indicates whether increasing an
      element would raise or lower the metric, while its magnitude measures how sensitive
      the output is to a small local change; one backward pass can usually obtain
      gradients for many elements at once. Estimating an element's contribution to the
      current prediction additionally requires combining the gradient with a range of
      actual change. Knowledge Neurons integrates gradients along the path from a zero
      neuron activation to its observed value to find neurons associated with a factual
      prediction. Attribution Patching instead multiplies a gradient by the activation
      difference between clean and corrupted runs to linearly approximate the output
      change caused by patching a node or edge; EAP-IG integrates gradients along that
      path. Gradient methods efficiently screen candidate elements, but they rely on
      local or path-based approximations. Saturation, interactions, and nonlinearity can
      make their scores diverge from exact patching, so sanity checks or direct
      interventions are still needed.
    zh: >-
      Gradient Sensitivity 首先选定一个需要解释的输出指标，例如正确 token 的概率或两个候选 token 的 logit
      差，然后计算这个指标对输入或内部激活的梯度。梯度的正负表示增大该元素会让指标上升还是下降，绝对值则表示
      输出对它的局部变化有多敏感；一次反向传播通常可以同时得到许多元素的梯度。若要进一步估计某个元素对当前
      预测的贡献，还需要把梯度与一个实际变化范围结合起来：Knowledge Neurons 从神经元激活为零的基线到实际
      激活值累积梯度，以寻找与事实预测相关的神经元；Attribution Patching 则把梯度与 clean、corrupted 两次
      运行之间的激活差相乘，用线性近似估计 patching 某个节点或边会造成的输出变化，EAP-IG 再沿这段变化路径
      累积梯度。梯度方法适合快速筛选候选元素，但它依赖局部或路径近似；模型饱和、元素交互和非线性都可能使分数
      偏离精确 patching 的结果，因此还需要 sanity check 或实际干预验证。
- proposal_id: tp_20261010_techniques_v12_decomposition_component_attribution
  kind: taxonomy_content
  status: approved
  created_at: '2026-10-10'
  approved_at: '2026-10-10'
  approval_basis: >-
    The user approved a rewrite that explicitly represents both halves of the node title:
    algebraic or contextual decomposition and intervention-based component attribution.
  title: Distinguish decomposition from component attribution
  taxonomy_id: techniques
  from_taxonomy_version: 11
  resulting_taxonomy_version: 12
  taxonomy_file: data/taxonomies/techniques.yaml
  affected_node_ids: [decomposition-attribution]
  revision_reason: >-
    Explain how additive and contextual decomposition trace contributions through a model,
    contrast that workflow with component attribution based on ablations or fitted additive
    models, and connect both routes to papers assigned to this branch. The tree structure
    and paper assignments are unchanged.
  approved_introduction:
    en: >-
      This branch comprises two different analytical routes: Decomposition and Component
      Attribution.
      Decomposition leaves the model's current computation unchanged and follows its
      operations to separate an internal state or final output into contributions from
      different sources. A Transformer's residual stream is formed by successively adding
      embeddings and the outputs of attention heads and MLPs, so these additive terms can
      be tracked separately. Information Flow Routes further splits an attention update
      into information-transfer edges associated with different source tokens and heads,
      then connects high-contribution edges across layers into a graph for one prediction.
      For operations such as attention, layer normalization, and nonlinear functions that
      cannot be separated by addition alone, CD-T partitions activations into a part
      relevant to the target factor and a part containing other information, then uses
      predefined rules to propagate both parts through the model. Component Attribution
      instead changes which components participate in the computation and estimates their
      contributions from the resulting output changes. For example, LVLM Head Attribution
      ablates different combinations of attention heads and uses linear regression to
      estimate each head's contribution to the answer logit; Ships/Sahara identifies
      safety-related heads from changes in refusal probability or safety representations
      after head ablation. These methods can show how multiple components jointly support
      a prediction, but their results still depend on component boundaries, baselines,
      decomposition rules, and the treatment of interactions. Researchers therefore
      usually test faithfulness by retaining or ablating the identified components.
    zh: >-
      Decomposition and Component Attribution 包含两条不同的分析路线。Decomposition 不改变模型的这次
      计算，而是沿着模型的运算过程，把内部状态或最终输出拆成不同来源的贡献。Transformer 的 residual stream
      由 embedding、attention head 和 MLP 输出逐步相加形成，因此这些加法项可以分别追踪；Information Flow
      Routes 还会把 attention 输出进一步拆成由不同来源 token 和 head 形成的信息传递边，并逐层连接成一次预测的
      信息流图。对于 attention、layer normalization 和非线性函数等不能直接按加法拆开的运算，CD-T 会把激活
      划分成“与目标因素相关”和“其他信息”两部分，再按照预先定义的规则让两部分继续通过模型。Component
      Attribution 则主动改变哪些组件参与计算，再根据输出变化估计贡献：例如 LVLM Head Attribution 消融不同
      attention head 组合，并用线性回归估计各个 head 对答案 logit 的贡献；Ships/Sahara 根据消融 head 后拒答
      概率或安全表征的变化来寻找安全相关 head。这些方法可以展示多个组件如何共同支持预测，但结果仍取决于组件
      划分、基线、分解规则以及如何处理组件交互，因此通常还需要通过保留或消融所得组件来验证解释是否忠实。
- proposal_id: tp_20261010_techniques_v13_relevance_propagation_workflow
  kind: taxonomy_content
  status: approved
  created_at: '2026-10-10'
  approved_at: '2026-10-10'
  approval_basis: >-
    The user approved a rewrite that identifies relevance propagation as attribution,
    explains its score-redistribution workflow, and distinguishes LRP from CRP.
  title: Explain relevance propagation as attribution
  taxonomy_id: techniques
  from_taxonomy_version: 12
  resulting_taxonomy_version: 13
  taxonomy_file: data/taxonomies/techniques.yaml
  affected_node_ids: [relevance-propagation]
  revision_reason: >-
    Explain how relevance scores are redistributed from a selected output to inputs or
    internal channels, distinguish this process from gradient sensitivity, clarify the
    different questions answered by LRP and CRP, and state the method's evidential limits.
    The tree structure and paper assignments are unchanged.
  approved_introduction:
    en: >-
      Relevance Propagation explains how much different inputs or internal concepts
      contribute to the model's current prediction. The researcher first selects an
      output to explain, such as a class score or the logit of a target token, and treats
      its value as the total relevance. Using a chosen propagation rule, the method then
      combines each layer's activations, weights, and connections to redistribute an
      upper-layer unit's relevance among the lower-layer units that contributed to it,
      continuing backward until it reaches the input. What travels backward here is a
      relevance score, not a gradient used directly to measure sensitivity. The result
      assigns each pixel, token, or intermediate channel a score indicating how it
      supports or opposes the current prediction. Layer-Wise Relevance Propagation (LRP)
      typically combines contributions from different concepts in a single attribution
      map and mainly shows where the evidence lies. Concept Relevance Propagation (CRP)
      instead retains only the relevance that flows through a selected concept channel
      and uses representative examples to interpret what that channel means. For a
      "dog" prediction, for instance, CRP can separately show how much concepts such as
      "fur" and "eye" contribute and where they appear in the image, thereby answering
      both what the evidence is and where it occurs. The result still depends on the
      propagation rule, stabilization choices, and the selected concept channels. It is
      therefore an attribution of the current prediction rather than causal proof;
      establishing that the model must use a concept requires interventions that remove,
      replace, or insert it.
    zh: >-
      Relevance Propagation 解释的是哪些输入或内部概念对当前预测贡献了多少。计算时，
      研究者先选定需要解释的输出，例如某个类别分数或目标 token 的 logit，并把这个数值作为总的
      relevance。算法随后结合每一层的激活、权重和连接关系，按照预先选定的传播规则，将上层单元的
      relevance 分配给对它有贡献的下层单元，再逐层传回输入。这里向后传递的是 relevance 分数，
      而不是直接使用梯度衡量敏感性。最终，每个 pixel、token 或中间通道都会得到支持或反对当前预测的归因分数。
      Layer-Wise Relevance Propagation（LRP）通常把不同概念的贡献汇总在一张 attribution map 中，主要回答
      证据出现在哪里。Concept Relevance Propagation（CRP）则在向后传播时只保留经过某个概念通道的
      relevance，并结合能够代表该通道的样本解释其含义。例如，对于 “dog” 预测，CRP 可以分别显示 “fur” 和
      “eye” 概念贡献了多少，以及这些概念出现在图像的什么位置，从而同时回答证据“是什么”和“在哪里”。
      这些结果会受到传播规则、稳定化方式和概念通道选择的影响，因此仍然是对当前预测的归因，而不是因果证明；
      若要确认模型是否必须使用某个概念，还需要通过移除、替换或插入该概念进行干预验证。
- proposal_id: tp_20261010_techniques_v14_shap_workflow
  kind: taxonomy_content
  status: approved
  created_at: '2026-10-10'
  approved_at: '2026-10-10'
  approval_basis: >-
    The user approved a more concrete explanation of SHAP's marginal-contribution
    calculation, output interpretation, practical approximations, and dependence on the
    definition of a missing feature.
  title: Explain the SHAP attribution workflow
  taxonomy_id: techniques
  from_taxonomy_version: 13
  resulting_taxonomy_version: 14
  taxonomy_file: data/taxonomies/techniques.yaml
  affected_node_ids: [shapley-attribution]
  revision_reason: >-
    Replace the abstract cooperative-game analogy with an operational explanation,
    illustrate positive and negative SHAP values, connect the parent node to KernelSHAP
    and FastSHAP, and make the method's baseline-dependent evidential scope explicit.
    The tree structure and paper assignments are unchanged.
  approved_introduction:
    en: >-
      SHAP explains, for a particular input, how much each feature raises or lowers the
      model's prediction relative to a baseline. It treats tokens, image regions, or
      tabular variables as members that participate in making the prediction. To estimate
      one feature's contribution, SHAP adds it to many different combinations of the
      other features, measures how the model output changes, and takes a weighted average
      of these marginal changes. In sentiment classification, for example, "not" may
      receive a negative SHAP value because it pulls the positive-class score down, while
      "excellent" may receive a positive value because it pushes that score up. Adding
      all feature-level SHAP values to the baseline output reconstructs the prediction
      being explained. Exact computation requires considering a number of combinations
      that grows exponentially with the number of features, so KernelSHAP estimates the
      values through sampling and weighted regression, while FastSHAP trains an explainer
      to predict them directly. The result nevertheless depends on what counts as a
      feature and how an absent feature is represented: deleting a token, masking it,
      setting it to zero, or sampling a replacement from a conditional distribution can
      produce different attributions. SHAP therefore provides an attribution under a
      particular baseline and definition of absence, not causal proof.
    zh: >-
      SHAP 解释的是：对于某个具体输入，各个特征分别让模型的预测相对于基线升高或降低了多少。
      它把 token、图像区域或表格变量等视为参与预测的“成员”。为了计算某个特征的贡献，SHAP 会把它加入许多不同的特征组合，
      比较加入前后模型输出的变化，再对这些边际变化进行加权平均。例如，在情感分类中，“not” 可能得到负的 SHAP 值，表示它把正面预测向下拉；
      “excellent” 可能得到正值，表示它把预测向上推。各特征的 SHAP 值与基线输出相加，可以还原当前预测。
      精确计算需要考察数量随特征数指数增长的组合，因此 KernelSHAP 通过抽样和加权回归进行估计，FastSHAP 则训练一个解释器直接预测这些值。
      不过，结果会受到“什么算一个特征”以及“特征缺失时怎样替代”的影响；删除 token、使用掩码、置零或从条件分布采样，可能得到不同的归因。
      因此，SHAP 提供的是在特定缺失定义和基线下的归因，而不是因果证明。
- proposal_id: tp_20261010_techniques_v15_representation_geometry
  kind: taxonomy_content
  status: approved
  created_at: '2026-10-10'
  approved_at: '2026-10-10'
  approval_basis: >-
    The user approved a more detailed introduction explaining how activation vectors
    become geometric objects and distinguishing directions, subspaces, manifolds, and
    intrinsic dimension with examples from the corpus.
  title: Explain representation geometry and subspace analysis
  taxonomy_id: techniques
  from_taxonomy_version: 14
  resulting_taxonomy_version: 15
  taxonomy_file: data/taxonomies/techniques.yaml
  affected_node_ids: [representation-geometry]
  revision_reason: >-
    Explain the measurements used in geometric analysis, distinguish its main geometric
    objects, connect them to representative findings in the corpus, and state why causal
    interventions remain necessary. The tree structure and paper assignments are unchanged.
  approved_introduction:
    en: >-
      Representation Geometry treats the activation vectors produced for different
      tokens, examples, or prompts as points in a high-dimensional space and studies
      their distances, angles, arrangement, and degrees of freedom. Researchers usually
      collect activations for a controlled set of examples and look for structure using
      cosine similarity, Euclidean distance, mean differences, PCA or SVD, local
      neighborhoods, or intrinsic-dimension estimators. If positive and negative texts
      are separated mainly along one direction, sentiment can be described as an
      approximately linear direction. If a concept requires several independent
      directions, it is better described as a subspace; if the points lie on a curved
      low-dimensional surface with complex local structure, they can instead be modeled
      as a manifold. Intrinsic dimension measures not the full width of a model's hidden
      state, but the number of independent degrees of freedom needed to describe how the
      observed representations actually vary. Studies in this corpus, for example, find
      sentiment arranged along a single direction, entity-binding IDs forming a
      continuous subspace with meaningful distances, belief states exhibiting complex
      fractal geometry, and prompt-level intrinsic dimension varying with predictive
      uncertainty. These analyses reveal how information is organized and whether
      relationships are preserved across layers or models, but geometric structure may
      still be only a readable correlation. Showing that the model uses it requires
      projecting it out, removing it, or moving activations along the relevant direction
      and then testing whether computation or behavior changes.
    zh: >-
      Representation Geometry 把模型为不同 token、样本或 prompt 产生的激活向量看作高维空间中的点，
      并研究这些点之间的距离、夹角、排列方式和自由度。研究者通常先收集一组受控样本的激活，再用余弦相似度、
      欧氏距离、均值差、PCA/SVD、局部邻域或内在维度估计等方法寻找结构。如果正面与负面文本主要沿同一个方向分开，
      可以说情感近似由一条线性方向表示；如果一个概念需要多个相互独立的方向才能描述，则更适合看作一个子空间；
      如果样本位于弯曲或具有复杂局部结构的低维表面上，则可以用流形来描述。内在维度估计的则不是模型 hidden state 的总维数，
      而是这些表征实际变化所需的独立自由度数量。例如，相关研究发现情感可以沿单一方向排列，实体绑定 ID 构成距离具有意义的连续子空间，
      belief state 甚至可能形成复杂的分形结构，而 prompt 表征的内在维度会随预测不确定性变化。这些分析可以揭示信息怎样被组织、
      不同关系是否在层间或模型间得到保持，但几何结构本身仍可能只是可读出的相关规律；要证明模型确实使用它，还需要通过投影、移除或沿相应方向进行干预，
      并观察模型计算或行为是否随之改变。
- proposal_id: tp_20261010_techniques_v16_internal_vocabulary
  kind: taxonomy_content
  status: approved
  created_at: '2026-10-10'
  approved_at: '2026-10-10'
  approval_basis: >-
    The user approved completing the parent-node explanation by stating why an internal
    vocabulary is needed and what researchers use it to do.
  title: Complete the internal vocabulary explanation
  taxonomy_id: techniques
  from_taxonomy_version: 15
  resulting_taxonomy_version: 16
  taxonomy_file: data/taxonomies/techniques.yaml
  affected_node_ids: [feature-discovery-decomposition]
  revision_reason: >-
    Clarify that concepts can be distributed or superposed, define the purpose of an
    internal vocabulary, and connect native-unit labeling with learned-basis and
    statistical-decomposition approaches. The tree structure and paper assignments are
    unchanged.
  approved_introduction:
    en: >-
      Many concepts are not represented independently by single neurons, but are
      distributed or superposed across multiple dimensions. Researchers therefore need
      an "internal vocabulary" better suited to the model than its native neurons alone:
      a set of features in which complex model activity can be identified, named,
      compared, and intervened on. Some methods directly search for semantic labels for
      the model's existing neurons or channels; others learn a new basis that separates
      signals superposed within the same activation vector into latent features. This
      branch brings these approaches together while distinguishing whether the resulting
      features come from native components, a learned dictionary, or a statistical
      decomposition.
    zh: >-
      许多概念并不是由单个神经元独立表示，而是分布或叠加在多个维度上。因此，研究者需要寻找一套比原生神经元更合适的
      “内部词汇表”，把复杂的模型活动表达成可以识别、命名、比较和干预的特征。有些方法直接为模型已有的神经元或通道寻找语义标签，
      另一些方法则学习新的基底，把叠加在同一激活向量中的信号分离成潜在特征。本分支把这些路线放在一起，同时区分所得特征究竟来自原生组件、
      学习字典，还是统计分解。
- proposal_id: tp_20261010_techniques_v17_concept_unit_alignment
  kind: taxonomy_content
  status: approved
  created_at: '2026-10-10'
  approved_at: '2026-10-10'
  approval_basis: >-
    The user approved separate rewrites for the Concept–Unit Alignment parent and its
    Network Dissection and CLIP-Based Unit Labeling children, keeping implementation
    details in the child nodes.
  title: Clarify concept-unit alignment and its child methods
  taxonomy_id: techniques
  from_taxonomy_version: 16
  resulting_taxonomy_version: 17
  taxonomy_file: data/taxonomies/techniques.yaml
  affected_node_ids: [concept-unit-alignment, network-dissection, clip-unit-labeling]
  revision_reason: >-
    Make the parent describe only the shared operation of labeling native units, explain
    Network Dissection's thresholded spatial-IoU workflow, and accurately describe
    CLIP-Dissect as matching cross-image activation and concept-score patterns rather
    than captioning preferred images. The tree structure and paper assignments are unchanged.
  approved_introductions:
  - node_id: concept-unit-alignment
    en: >-
      Concept–Unit Alignment does not learn new feature coordinates. Instead, it treats
      the model's existing neurons or channels as candidate entries in an "internal
      vocabulary." Researchers collect a unit's activations over many inputs and compare
      the resulting activation pattern with human-defined concept evidence, candidate
      text descriptions, or semantic representations supplied by another model. The
      resulting label describes what the unit frequently responds to under the chosen
      data and scoring method; it is not a complete definition of the unit's function. A
      single unit may respond to several concepts, and one concept may be distributed
      across many units. Even a stable semantic correspondence does not by itself show
      that the unit causally contributes to model behavior.
    zh: >-
      Concept–Unit Alignment 不学习新的特征坐标，而是把模型已有的神经元或通道当作“内部词汇表”的候选条目。
      研究者会收集某个单元在大量输入上的激活，并将这种激活规律与人工定义的概念证据、候选文本或其他模型提供的语义表示进行比较，
      从而为该单元寻找候选描述。这个标签描述的是单元在给定数据和评分方法下经常响应什么，而不是对其功能的完整定义。
      同一单元可能响应多个概念，一个概念也可能分布在多个单元中；稳定的语义对应也不能单独证明该单元对模型行为具有因果作用。
  - node_id: network-dissection
    en: >-
      Network Dissection tests whether an individual convolutional unit in a CNN behaves
      like a detector for a visual concept. Researchers collect the unit's spatial
      activation maps on annotated images, resize each map to the image resolution, and
      threshold it into a binary region. They then compute Intersection over Union (IoU)
      between this region and pixel-level masks for concepts such as objects, parts,
      scenes, textures, materials, and colors. If the unit's active region consistently
      overlaps a concept across many images, the unit is labeled as a candidate detector
      for that concept. Counting how many distinct concepts align with units in a layer
      also supports comparisons of axis-aligned interpretability across networks. The
      result depends on which concepts the annotation set contains and on the activation
      and IoU thresholds. It measures spatial alignment between one unit and one concept:
      a missed concept may simply be absent from the vocabulary, while high overlap does
      not show that the unit represents only that concept or causally drives behavior.
    zh: >-
      Network Dissection 检查 CNN 中的单个卷积单元是否表现得像某个视觉概念的 detector。研究者先收集该单元在标注图像上的空间激活图，
      将激活图放大到原图尺寸并按阈值转换成二值区域，再与对象、部件、场景、纹理、材质和颜色等概念的像素级标注区域计算
      Intersection over Union（IoU）。如果一个单元的激活区域与某个概念在大量图像上持续重合，就把它标记为该概念的候选 detector；
      一层中能够与多少种概念形成这种对应，也可以用来比较不同网络表征的 axis-aligned interpretability。这个结果依赖标注数据包含哪些概念、
      激活与 IoU 阈值如何设置，并且只衡量单个单元与概念的空间对应关系：未被识别的概念可能不在标注词表中，高重合也不代表该单元只表示这个概念或对模型行为具有因果作用。
  - node_id: clip-unit-labeling
    en: >-
      CLIP-Based Unit Labeling uses a vision–language model to find text labels for units
      in a vision network, avoiding the need for pixel-level annotations for every
      candidate concept. Researchers begin with a set of unlabeled probe images and a
      set of candidate text descriptions. CLIP scores how well every image matches every
      candidate description, producing a score pattern across images for each concept;
      the vision model being interpreted produces the target unit's activation pattern
      over the same images. CLIP-Dissect compares these two cross-image patterns and uses
      the best-matching candidate text as the unit's description, rather than simply
      captioning its most activating images. Probe images and candidate descriptions can
      be changed independently, so the method is not tied to a fixed pixel-annotated
      dataset. It must still choose from the supplied candidate texts, however, and its
      output depends on CLIP's semantic distinctions, the probe images, the activation
      summary, and the matching function. The label describes a correlated response
      pattern; it may not capture all of the unit's meanings and does not by itself
      establish a causal function.
    zh: >-
      CLIP-Based Unit Labeling 使用视觉—语言模型为视觉网络中的单元寻找文本标签，从而避免为每个候选概念准备像素级标注。
      研究者先准备一组无需人工标注的 probe images 和一个候选文本集合。CLIP 为每张图像和每个候选文本计算匹配分数，由此得到每个概念在整组图像上的得分变化；
      待解释的视觉模型则给出某个单元在同一组图像上的激活变化。CLIP-Dissect 比较这两种跨图像的变化模式，并把最匹配的候选文本作为该单元的描述，
      而不是简单地给最高激活图像生成 caption。它可以灵活更换 probe images 和候选文本，不受固定像素标注数据集限制，但仍只能从提供的候选文本中选择标签，
      结果也会受到 CLIP 的语义能力、probe images、激活汇总方式和匹配函数影响。所得标签描述的是相关的响应模式，不一定覆盖单元的全部语义，也不能单独证明其因果功能。
