  corpus_size: 123
  reference_basis: >-
    The user-provided reference figure organizes interpretability work by application
    scenarios, including social computation and communication, factual knowledge,
    sycophancy, persona, science, safety, bias, code, and mathematics. This proposal
    preserves those concerns while adding corpus-driven branches for general methods,
    language and context use, formal reasoning, trustworthiness, and multimodality.
  evidence_basis: >-
    Titles, abstracts, paper-level modality and contribution attributes, and the
    approved Research Objects and Techniques classifications for all 123 corpus papers.
  classification_model:
    primary: >-
      The application domain or behavior that supplies the paper's central empirical
      target. General or cross-domain leaves are used when no single substantive
      scenario dominates a method, theory, or evaluation paper.
    secondary: >-
      Other application domains or behaviors that are materially analyzed, intervened
      on, or evaluated in the main experiments; motivation-only mentions and incidental
      examples are excluded.
    multiplicity: Each paper has exactly one primary relation and zero or more secondary relations.
    leaf_only_assignments: true
  structural_decisions:
  - Application Scenarios is orthogonal to Research Objects, Techniques, Model Families, and paper contribution attributes.
  - General and Cross-Domain is an explicit branch so method papers are not forced into a narrow downstream application.
  - Truthfulness and Latent Knowledge is separated from Hallucination and Grounding: the former concerns mismatch between internal knowledge and expressed answers, while the latter concerns unsupported content relative to an input or evidence source.
  - Safety and Refusal, Bias and Fairness, Sycophancy and Social Alignment, and Backdoors and Model Security remain separate because they denote different failure modes and intervention goals.
  - Vision-Language Interaction is a scenario, not a model-family label; it is assigned only when cross-modal transfer or behavior is itself central to the study.
  - Code and Scientific Applications are retained as explicit coverage targets from the reference taxonomy even though the current corpus has no primary paper in either leaf.
