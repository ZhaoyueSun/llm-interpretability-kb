nodes:
- node_id: technique
  parent_id: null
  title: Technique Primitives
  status: active
  proposal_id: tp_20261009_techniques_v2_reader_intros
  introduction:
    en: >-
      This taxonomy is a guide to the practical tools researchers use to open up a
      neural network: observing its internal activity, turning that activity into
      human-readable evidence, testing causal hypotheses, tracing circuits, and
      deliberately changing behavior. It is organized around the operation being
      performed, while the object being studied and the strength of the resulting
      evidence are recorded separately.
    zh: >-
      这棵树是一份理解机制可解释性工具箱的导读：研究者怎样观察模型内部活动，怎样把内部信号转化为人能理解的证据，
      怎样检验因果假设、追踪 circuit，以及怎样有目的地改变模型行为。分类依据是研究者实际执行的操作；
      被研究的对象以及证据有多强，则在其他属性中单独记录。
- node_id: readout-measurement
  parent_id: technique
  title: Readout and Measurement
  status: active
  proposal_id: tp_20261009_techniques_v2_reader_intros
  introduction:
    en: >-
      Before reconstructing a mechanism, researchers usually need to find out what is
      present inside the model and where it becomes visible. Readout and measurement
      methods turn activations, weights, or outputs into quantities that can be
      inspected—such as decoded concepts, geometric directions, importance scores, or
      attribution maps. They are often the first stage of an investigation rather than
      its final causal proof.
    zh: >-
      在重建完整机制之前，研究者通常先要知道：模型内部存在什么信息，它在什么位置变得可见。
      Readout and Measurement 方法把激活、权重或输出转换成可检查的量，例如可解码概念、几何方向、重要性分数或归因图。
      它们往往是机制研究的起点，而不是最终的因果证明。
- node_id: activation-statistics
  parent_id: readout-measurement
  title: Activation Statistics
  status: active
  proposal_id: tp_20261010_techniques_v6_activation_statistics_aggregation
  introduction:
    en: >-
      Activation statistics ask a simple exploratory question: which internal units
      respond, how often do they respond, and how strongly or selectively? Researchers
      collect an internal unit's activations as it processes different tokens and, over
      many examples, summarize its activation frequency, sparsity, magnitude distribution,
      variance, entropy, and norm. The resulting patterns are useful for finding candidates
      worth studying, although a conspicuous activation is not necessarily one the model
      relies on.
    zh: >-
      Activation Statistics 回答的是一个直观的探索性问题：哪些内部单元会响应、响应得多频繁、强度和选择性如何。
      研究者会收集某个内部单元在处理不同 token 时产生的激活，并在大量样本上统计其激活频率、稀疏性、
      强度分布、方差、熵和范数等指标。
      这些规律可以帮助筛选值得深入研究的候选对象，但“激活很显眼”并不等于“模型必须依赖它”。
- node_id: attention-pattern-analysis
  parent_id: readout-measurement
  title: Attention Pattern and OV/QK Analysis
  status: active
  proposal_id: tp_20261010_techniques_v5_attention_analysis_focus
  introduction:
    en: >-
      Attention analysis divides a head's computation into routing and writing. First,
      the QK score matrix assigns a routing score to each query–key token pair. After
      softmax, these scores form the attention pattern, which specifies how much the head
      reads from each source token and is commonly displayed as an attention-weight
      heatmap. The OV transformation then converts each source-token representation into
      a vector that can be written to the residual stream, and the attention pattern
      determines how these vectors are weighted and combined. QK and the attention
      pattern therefore answer "where does the head read from, and how much?", while OV
      answers "how is the retrieved information written back?". An attention-weight
      heatmap shows routing alone; it does not reveal the content actually written or
      establish the head's causal effect on the final prediction.
    zh: >-
      注意力分析可以把一个 head 的计算分成“路由”和“写入”两步。首先，QK score matrix 为不同的
      query–key token 对计算路由分数；这些分数经过 softmax 后形成 attention pattern，也就是这个 head
      从各个来源 token 读取多少信息，通常显示为 attention 权重热力图。随后，OV transformation 把来源
      token 的表示转换成准备写入 residual stream 的向量，再由 attention pattern 对这些向量加权求和。
      因此，QK 和 attention pattern 回答“从哪里读、读多少”，OV 回答“读到的信息怎样写回模型”。
      只看 attention 权重热力图只能看到路由，不能看到实际写入的内容，也不能单独证明这个 head 对最终预测
      具有因果作用。
- node_id: vocabulary-projection
  parent_id: readout-measurement
  title: Native Vocabulary Projection
  status: active
  proposal_id: tp_20261009_techniques_v2_reader_intros
  introduction:
    en: >-
      Vocabulary projection asks, “If this internal vector were interpreted through the
      model's output vocabulary, which tokens would it favor?” The vector may come from
      the residual stream, an attention head, an MLP value vector, or a learned feature;
      multiplying it by the unembedding produces a familiar list of token logits. This
      is a quick way to form semantic hypotheses, but it only reveals information that
      is aligned with the model's output space.
    zh: >-
      Vocabulary Projection 试图回答：“如果用模型自己的输出词表来解释这个内部向量，它会偏向哪些 token？”
      这个向量可以来自 residual stream、attention head、MLP value vector 或学习特征；将其乘以 unembedding，
      就能得到熟悉的 token logits。这种方法适合快速形成语义假设，但只能看到与输出空间线性对齐的信息。
- node_id: learned-lenses
  parent_id: readout-measurement
  title: Learned and Model-Internal Lenses
  status: active
  proposal_id: tp_20261010_techniques_v7_lens_decoding_workflows
  introduction:
    en: >-
      Intermediate-layer residual-stream states usually have the same dimensionality as
      the final-layer state, but their representational basis may change across layers.
      Directly applying the unembedding can therefore mistake a coordinate mismatch for
      a change in prediction. A learned lens trains a linear or affine transformation for
      a particular layer or attention head. The transformation can produce vocabulary
      logits directly, or produce a vector aligned with the final-layer state that the
      model's original final layer normalization and unembedding convert into vocabulary
      probabilities. For example, Tuned Lens learns such a transformation for each layer
      to correct the mismatch between intermediate states and the final output space;
      Attention Lens learns a dedicated transformation for each attention head and reads
      its output as vocabulary tokens; Future Lens asks whether the current token's hidden
      state can anticipate tokens that the model may generate several positions later.
      Future Lens uses two approaches: one trains a linear model to predict these future
      tokens directly; the other places the hidden state into a new prompt, lets the model
      continue generating, and checks whether the future tokens predicted in the original
      context still appear. Patchscopes generalizes the latter approach into a model-internal
      readout framework: the researcher designs a prompt that poses a question, patches the
      hidden state into the corresponding model computation, and lets the model generate an
      answer. By varying the prompt and insertion site, researchers can ask which token or
      entity the state represents, or what properties and relations it contains.
    zh: >-
      中间层的 residual-stream state 通常与最终层状态维度相同，但其表征基底可能随层变化，因此直接套用
      unembedding 可能把坐标差异误认为预测变化。学习型 Lens 会为特定层或 attention head 训练一个线性或
      仿射变换。变换结果可以直接是词表 logits，也可以是接近最终层状态的向量，再由模型原有的 final layer
      normalization 和 unembedding 转换成词表概率。例如，Tuned Lens 为每一层学习这种变换，以校正中间状态
      与最终输出空间之间的偏差；Attention Lens 则为不同 attention head 学习专用变换，将其输出读成词表中的
      token；Future Lens 研究当前 token 的 hidden state 能否提前读出模型之后几个位置可能生成的 token。
      Future Lens 采用两种办法：一种是训练线性模型直接预测这些未来 token；另一种是把这个 hidden state 放进
      一段新的提示中，让模型继续生成，观察原来预测的未来 token 是否仍会出现。Patchscopes 进一步将后一种
      做法推广为通用的 model-internal readout 框架：研究者先设计一段用于提问的提示，把待解释的 hidden state
      插入提示对应的模型计算中，再让模型继续生成答案。通过改变提示和插入位置，可以询问这个状态表示的是哪个
      token、实体，或者包含什么属性和关系。
- node_id: probing
  parent_id: readout-measurement
  title: Probing
  status: active
  proposal_id: tp_20261010_techniques_v9_probing_examples
  introduction:
    en: >-
      Probing asks whether a separate, usually simple predictor can recover a target
      property from a model representation—for example, a token's part of speech,
      grammatical number, or another linguistic attribute; the sentiment expressed by
      a text; or an entity category. A successful probe tells us that the information is
      accessible in the representation, which is often an important first finding. It
      does not yet tell us that the original model reads or uses that information when
      producing its behavior.
    zh: >-
      Probing 询问一个额外的、通常较简单的预测器能否从模型表征中恢复某种目标属性（例如某个 token 的词性、
      单复数等语言学属性，文本表达的情感或实体类别）。探针成功说明这种信息在表征中是可访问的，这往往是重要的
      第一步发现。但它还不能说明原模型在产生行为时真的读取或使用了这部分信息。
- node_id: supervised-probing
  parent_id: probing
  title: Supervised and Sparse Probing
  status: active
  proposal_id: tp_20261009_techniques_v2_reader_intros
  introduction:
    en: >-
      In supervised probing, labeled examples teach an auxiliary classifier or
      regressor to read a property from model states. Linear and sparse probes are
      popular because their limited capacity makes the resulting direction or feature
      set easier to inspect. Even then, researchers compare against control tasks and
      capacity-matched baselines, because a powerful probe can learn patterns that were
      not readily represented by the model.
    zh: >-
      Supervised Probing 使用带标签的样本，训练辅助分类器或回归器从模型状态中读出某种属性。
      线性探针和稀疏探针很常见，因为它们容量有限，得到的方向或特征集合也更容易检查。
      即便如此，仍需与控制任务和容量匹配的基线比较，因为过强的探针可能自行学到模型原本并未清晰表示的模式。
- node_id: unsupervised-contrastive-probing
  parent_id: probing
  title: Unsupervised Contrastive Probing
  status: active
  proposal_id: tp_20261009_techniques_v2_reader_intros
  introduction:
    en: >-
      Sometimes reliable labels are unavailable or would bake the desired answer into
      the analysis. Unsupervised contrastive probes instead look for a direction that
      consistently separates paired or contrasting examples, using agreement and
      symmetry constraints rather than explicit class labels. The central challenge is
      to design contrasts that isolate the intended concept instead of an accidental
      difference between the example groups.
    zh: >-
      有时可靠标签难以获得，或者标签本身会把研究者希望看到的答案预先写进分析。
      Unsupervised Contrastive Probing 不使用显式类别标签，而是从成对或对比样本中寻找稳定的分离方向，
      借助一致性与对称性约束恢复潜在概念。关键难点是设计真正隔离目标概念的对比，而不是捕捉两组样本间的偶然差异。
- node_id: representation-geometry
  parent_id: readout-measurement
  title: Representation Geometry and Subspace Analysis
  status: active
  proposal_id: tp_20261010_techniques_v15_representation_geometry
  introduction:
    en: >-
      Representation Geometry treats the activation vectors produced for different
      tokens, examples, or prompts as points in a high-dimensional space and studies
      their distances, angles, arrangement, and degrees of freedom. Researchers usually
      collect activations for a controlled set of examples and look for structure using
      cosine similarity, Euclidean distance, mean differences, PCA or SVD, local
      neighborhoods, or intrinsic-dimension estimators. If positive and negative texts
      are separated mainly along one direction, sentiment can be described as an
      approximately linear direction. If a concept requires several independent
      directions, it is better described as a subspace; if the points lie on a curved
      low-dimensional surface with complex local structure, they can instead be modeled
      as a manifold. Intrinsic dimension measures not the full width of a model's hidden
      state, but the number of independent degrees of freedom needed to describe how the
      observed representations actually vary. Studies in this corpus, for example, find
      sentiment arranged along a single direction, entity-binding IDs forming a
      continuous subspace with meaningful distances, belief states exhibiting complex
      fractal geometry, and prompt-level intrinsic dimension varying with predictive
      uncertainty. These analyses reveal how information is organized and whether
      relationships are preserved across layers or models, but geometric structure may
      still be only a readable correlation. Showing that the model uses it requires
      projecting it out, removing it, or moving activations along the relevant direction
      and then testing whether computation or behavior changes.
    zh: >-
      Representation Geometry 把模型为不同 token、样本或 prompt 产生的激活向量看作高维空间中的点，
      并研究这些点之间的距离、夹角、排列方式和自由度。研究者通常先收集一组受控样本的激活，再用余弦相似度、
      欧氏距离、均值差、PCA/SVD、局部邻域或内在维度估计等方法寻找结构。如果正面与负面文本主要沿同一个方向分开，
      可以说情感近似由一条线性方向表示；如果一个概念需要多个相互独立的方向才能描述，则更适合看作一个子空间；
      如果样本位于弯曲或具有复杂局部结构的低维表面上，则可以用流形来描述。内在维度估计的则不是模型 hidden state 的总维数，
      而是这些表征实际变化所需的独立自由度数量。例如，相关研究发现情感可以沿单一方向排列，实体绑定 ID 构成距离具有意义的连续子空间，
      belief state 甚至可能形成复杂的分形结构，而 prompt 表征的内在维度会随预测不确定性变化。这些分析可以揭示信息怎样被组织、
      不同关系是否在层间或模型间得到保持，但几何结构本身仍可能只是可读出的相关规律；要证明模型确实使用它，还需要通过投影、移除或沿相应方向进行干预，
      并观察模型计算或行为是否随之改变。
- node_id: attribution-sensitivity
  parent_id: readout-measurement
  title: Attribution and Sensitivity
  status: active
  proposal_id: tp_20261010_techniques_v10_attribution_sensitivity_calculation
  introduction:
    en: >-
      Attribution tries to assign credit for a prediction to the inputs or internal
      elements that may have contributed to it. Researchers usually begin by selecting
      an output to explain, such as the target token's logit, and then calculate how much
      each token, neuron, attention head, or feature contributes to that output. The
      specific methods all estimate an element's contribution to the current output
      (for example, Gradient × Input, Integrated Gradients, Relevance Propagation, or the
      change in output after removing the element). Sensitivity does not estimate how
      much a factor has already contributed; instead, it measures how rapidly the
      prediction would change under a small additional change to that factor, usually
      using an output gradient or the output difference caused by a small perturbation.
      These scores are useful for narrowing a large search space, but their meaning
      depends on the chosen baseline, approximation, and definition of a “missing”
      feature; high attribution should therefore not be read as causal proof.
    zh: >-
      Attribution 试图把一次预测的“功劳”分配给可能参与其中的输入或内部元素。研究者通常先选定要解释的
      输出（如目标 token 的 logit），再为不同 token、神经元、attention head 或特征计算它们对该输出的
      归因分数。具体方法都在估计各元素对当前输出的贡献（例如 Gradient × Input、Integrated Gradients、
      Relevance Propagation，或移除元素前后的输出差异）。Sensitivity 不估计某个因素“已经贡献了多少”，
      而是衡量继续对它做小幅改变时，预测会变化多快，通常通过输出梯度或小扰动造成的输出差值来计算。
      这些分数很适合缩小庞大的搜索空间，但其含义依赖基线、近似方式以及“特征缺失”的定义，因此高归因分数
      不应直接读成因果证明。
- node_id: gradient-sensitivity
  parent_id: attribution-sensitivity
  title: Gradient Sensitivity
  status: active
  proposal_id: tp_20261010_techniques_v11_gradient_sensitivity_workflow
  introduction:
    en: >-
      Gradient sensitivity begins by selecting an output metric to explain, such as the
      probability of the correct token or the logit difference between two candidate
      tokens, and then computes the gradient of that metric with respect to inputs or
      internal activations. The sign of a gradient indicates whether increasing an
      element would raise or lower the metric, while its magnitude measures how sensitive
      the output is to a small local change; one backward pass can usually obtain
      gradients for many elements at once. Estimating an element's contribution to the
      current prediction additionally requires combining the gradient with a range of
      actual change. Knowledge Neurons integrates gradients along the path from a zero
      neuron activation to its observed value to find neurons associated with a factual
      prediction. Attribution Patching instead multiplies a gradient by the activation
      difference between clean and corrupted runs to linearly approximate the output
      change caused by patching a node or edge; EAP-IG integrates gradients along that
      path. Gradient methods efficiently screen candidate elements, but they rely on
      local or path-based approximations. Saturation, interactions, and nonlinearity can
      make their scores diverge from exact patching, so sanity checks or direct
      interventions are still needed.
    zh: >-
      Gradient Sensitivity 首先选定一个需要解释的输出指标，例如正确 token 的概率或两个候选 token 的 logit
      差，然后计算这个指标对输入或内部激活的梯度。梯度的正负表示增大该元素会让指标上升还是下降，绝对值则表示
      输出对它的局部变化有多敏感；一次反向传播通常可以同时得到许多元素的梯度。若要进一步估计某个元素对当前
      预测的贡献，还需要把梯度与一个实际变化范围结合起来：Knowledge Neurons 从神经元激活为零的基线到实际
      激活值累积梯度，以寻找与事实预测相关的神经元；Attribution Patching 则把梯度与 clean、corrupted 两次
      运行之间的激活差相乘，用线性近似估计 patching 某个节点或边会造成的输出变化，EAP-IG 再沿这段变化路径
      累积梯度。梯度方法适合快速筛选候选元素，但它依赖局部或路径近似；模型饱和、元素交互和非线性都可能使分数
      偏离精确 patching 的结果，因此还需要 sanity check 或实际干预验证。
- node_id: decomposition-attribution
  parent_id: attribution-sensitivity
  title: Decomposition and Component Attribution
  status: active
  proposal_id: tp_20261010_techniques_v12_decomposition_component_attribution
  introduction:
    en: >-
      This branch comprises two different analytical routes: Decomposition and Component
      Attribution.
      Decomposition leaves the model's current computation unchanged and follows its
      operations to separate an internal state or final output into contributions from
      different sources. A Transformer's residual stream is formed by successively adding
      embeddings and the outputs of attention heads and MLPs, so these additive terms can
      be tracked separately. Information Flow Routes further splits an attention update
      into information-transfer edges associated with different source tokens and heads,
      then connects high-contribution edges across layers into a graph for one prediction.
      For operations such as attention, layer normalization, and nonlinear functions that
      cannot be separated by addition alone, CD-T partitions activations into a part
      relevant to the target factor and a part containing other information, then uses
      predefined rules to propagate both parts through the model. Component Attribution
      instead changes which components participate in the computation and estimates their
      contributions from the resulting output changes. For example, LVLM Head Attribution
      ablates different combinations of attention heads and uses linear regression to
      estimate each head's contribution to the answer logit; Ships/Sahara identifies
      safety-related heads from changes in refusal probability or safety representations
      after head ablation. These methods can show how multiple components jointly support
      a prediction, but their results still depend on component boundaries, baselines,
      decomposition rules, and the treatment of interactions. Researchers therefore
      usually test faithfulness by retaining or ablating the identified components.
    zh: >-
      Decomposition and Component Attribution 包含两条不同的分析路线。Decomposition 不改变模型的这次
      计算，而是沿着模型的运算过程，把内部状态或最终输出拆成不同来源的贡献。Transformer 的 residual stream
      由 embedding、attention head 和 MLP 输出逐步相加形成，因此这些加法项可以分别追踪；Information Flow
      Routes 还会把 attention 输出进一步拆成由不同来源 token 和 head 形成的信息传递边，并逐层连接成一次预测的
      信息流图。对于 attention、layer normalization 和非线性函数等不能直接按加法拆开的运算，CD-T 会把激活
      划分成“与目标因素相关”和“其他信息”两部分，再按照预先定义的规则让两部分继续通过模型。Component
      Attribution 则主动改变哪些组件参与计算，再根据输出变化估计贡献：例如 LVLM Head Attribution 消融不同
      attention head 组合，并用线性回归估计各个 head 对答案 logit 的贡献；Ships/Sahara 根据消融 head 后拒答
      概率或安全表征的变化来寻找安全相关 head。这些方法可以展示多个组件如何共同支持预测，但结果仍取决于组件
      划分、基线、分解规则以及如何处理组件交互，因此通常还需要通过保留或消融所得组件来验证解释是否忠实。
- node_id: relevance-propagation
  parent_id: attribution-sensitivity
  title: Layer-Wise and Concept Relevance Propagation
  status: active
  proposal_id: tp_20261010_techniques_v13_relevance_propagation_workflow
  introduction:
    en: >-
      Relevance Propagation explains how much different inputs or internal concepts
      contribute to the model's current prediction. The researcher first selects an
      output to explain, such as a class score or the logit of a target token, and treats
      its value as the total relevance. Using a chosen propagation rule, the method then
      combines each layer's activations, weights, and connections to redistribute an
      upper-layer unit's relevance among the lower-layer units that contributed to it,
      continuing backward until it reaches the input. What travels backward here is a
      relevance score, not a gradient used directly to measure sensitivity. The result
      assigns each pixel, token, or intermediate channel a score indicating how it
      supports or opposes the current prediction. Layer-Wise Relevance Propagation (LRP)
      typically combines contributions from different concepts in a single attribution
      map and mainly shows where the evidence lies. Concept Relevance Propagation (CRP)
      instead retains only the relevance that flows through a selected concept channel
      and uses representative examples to interpret what that channel means. For a
      "dog" prediction, for instance, CRP can separately show how much concepts such as
      "fur" and "eye" contribute and where they appear in the image, thereby answering
      both what the evidence is and where it occurs. The result still depends on the
      propagation rule, stabilization choices, and the selected concept channels. It is
      therefore an attribution of the current prediction rather than causal proof;
      establishing that the model must use a concept requires interventions that remove,
      replace, or insert it.
    zh: >-
      Relevance Propagation 解释的是哪些输入或内部概念对当前预测贡献了多少。计算时，
      研究者先选定需要解释的输出，例如某个类别分数或目标 token 的 logit，并把这个数值作为总的
      relevance。算法随后结合每一层的激活、权重和连接关系，按照预先选定的传播规则，将上层单元的
      relevance 分配给对它有贡献的下层单元，再逐层传回输入。这里向后传递的是 relevance 分数，
      而不是直接使用梯度衡量敏感性。最终，每个 pixel、token 或中间通道都会得到支持或反对当前预测的归因分数。
      Layer-Wise Relevance Propagation（LRP）通常把不同概念的贡献汇总在一张 attribution map 中，主要回答
      证据出现在哪里。Concept Relevance Propagation（CRP）则在向后传播时只保留经过某个概念通道的
      relevance，并结合能够代表该通道的样本解释其含义。例如，对于 “dog” 预测，CRP 可以分别显示 “fur” 和
      “eye” 概念贡献了多少，以及这些概念出现在图像的什么位置，从而同时回答证据“是什么”和“在哪里”。
      这些结果会受到传播规则、稳定化方式和概念通道选择的影响，因此仍然是对当前预测的归因，而不是因果证明；
      若要确认模型是否必须使用某个概念，还需要通过移除、替换或插入该概念进行干预验证。
- node_id: shapley-attribution
  parent_id: attribution-sensitivity
  title: Shapley-Value Attribution
  status: active
  proposal_id: tp_20261010_techniques_v14_shap_workflow
  introduction:
    en: >-
      SHAP explains, for a particular input, how much each feature raises or lowers the
      model's prediction relative to a baseline. It treats tokens, image regions, or
      tabular variables as members that participate in making the prediction. To estimate
      one feature's contribution, SHAP adds it to many different combinations of the
      other features, measures how the model output changes, and takes a weighted average
      of these marginal changes. In sentiment classification, for example, "not" may
      receive a negative SHAP value because it pulls the positive-class score down, while
      "excellent" may receive a positive value because it pushes that score up. Adding
      all feature-level SHAP values to the baseline output reconstructs the prediction
      being explained. Exact computation requires considering a number of combinations
      that grows exponentially with the number of features, so KernelSHAP estimates the
      values through sampling and weighted regression, while FastSHAP trains an explainer
      to predict them directly. The result nevertheless depends on what counts as a
      feature and how an absent feature is represented: deleting a token, masking it,
      setting it to zero, or sampling a replacement from a conditional distribution can
      produce different attributions. SHAP therefore provides an attribution under a
      particular baseline and definition of absence, not causal proof.
    zh: >-
      SHAP 解释的是：对于某个具体输入，各个特征分别让模型的预测相对于基线升高或降低了多少。
      它把 token、图像区域或表格变量等视为参与预测的“成员”。为了计算某个特征的贡献，SHAP 会把它加入许多不同的特征组合，
      比较加入前后模型输出的变化，再对这些边际变化进行加权平均。例如，在情感分类中，“not” 可能得到负的 SHAP 值，表示它把正面预测向下拉；
      “excellent” 可能得到正值，表示它把预测向上推。各特征的 SHAP 值与基线输出相加，可以还原当前预测。
      精确计算需要考察数量随特征数指数增长的组合，因此 KernelSHAP 通过抽样和加权回归进行估计，FastSHAP 则训练一个解释器直接预测这些值。
      不过，结果会受到“什么算一个特征”以及“特征缺失时怎样替代”的影响；删除 token、使用掩码、置零或从条件分布采样，可能得到不同的归因。
      因此，SHAP 提供的是在特定缺失定义和基线下的归因，而不是因果证明。
- node_id: kernel-sampling-shap
  parent_id: shapley-attribution
  title: Kernel and Sampling SHAP
  status: active
  proposal_id: tp_20261009_techniques_v2_reader_intros
  introduction:
    en: >-
      Exact Shapley values require considering exponentially many feature coalitions,
      which is rarely practical. KernelSHAP and related estimators sample coalitions and
      fit a specially weighted local linear model whose coefficients approximate the
      desired values. The method can be applied to almost any prediction model, but the
      number of evaluations can still become large when there are many features.
    zh: >-
      精确 Shapley 值需要考察指数数量的特征联盟，实际中通常无法承受。
      KernelSHAP 等估计方法会抽样部分联盟，再拟合一个特殊加权的局部线性模型，用其系数近似目标 Shapley 值。
      它几乎可用于任何预测模型，但当特征很多时，所需模型调用仍可能非常庞大。
- node_id: amortized-shap
  parent_id: shapley-attribution
  title: Amortized SHAP
  status: active
  proposal_id: tp_20261009_techniques_v2_reader_intros
  introduction:
    en: >-
      Amortized SHAP moves the expensive work from explanation time to training time.
      A separate explainer, such as FastSHAP, learns to predict the Shapley values for a
      new example in one forward pass instead of solving a fresh estimation problem each
      time. This is attractive when many examples must be explained, although the result
      is now an approximation produced by another learned model.
    zh: >-
      Amortized SHAP 把昂贵计算从“每次解释时”转移到“预先训练时”。
      FastSHAP 等独立解释器学会对新样本一次前向传播就预测 Shapley 值，而无需每次重新求解估计问题。
      当需要解释大量样本时这很有吸引力，但结果也变成了由另一个学习模型给出的近似。
- node_id: magnitude-based-scoring
  parent_id: readout-measurement
  title: Magnitude-Based Scoring
  status: active
  proposal_id: tp_20261009_techniques_v2_reader_intros
  introduction:
    en: >-
      Magnitude-based methods follow a useful exploratory intuition: unusually large
      weights, activations, or representational changes may point to places where
      something important is happening. Researchers therefore rank candidates using
      norms, absolute values, or distances before applying more expensive analyses.
      Large magnitude is a clue rather than an explanation—it may reflect scale or
      normalization effects without being necessary for the behavior.
    zh: >-
      Magnitude-Based Scoring 遵循一个实用的探索直觉：异常大的权重、激活或表征变化，可能提示“这里正在发生重要事情”。
      因此研究者常先用范数、绝对值或距离给候选对象排序，再进行成本更高的分析。
      但大幅值只是线索而非解释；它也可能只是尺度或归一化造成的，并不一定是行为所必需的。
- node_id: static-parameter-magnitude
  parent_id: magnitude-based-scoring
  title: Static Parameter Magnitude
  status: active
  proposal_id: tp_20261009_techniques_v2_reader_intros
  introduction:
    en: >-
      Static magnitude analysis examines quantities that are already present in the
      trained weights, such as unusually large matrix entries, row or column norms, and
      concentrated values in QK projections. Because it does not require running a
      dataset through the model, it is a fast way to discover structural outliers. The
      next question is whether those outliers actually affect computation on real inputs.
    zh: >-
      Static Parameter Magnitude 直接检查训练完成后已经存在于权重中的量，例如异常大的矩阵元素、行列范数，
      或集中在 QK projection 中的巨大数值。由于不需要让数据经过模型，它能快速发现结构异常点。
      随后的关键问题是，这些异常点在真实输入上是否真的影响了计算。
- node_id: dynamic-component-magnitude
  parent_id: magnitude-based-scoring
  title: Dynamic Activation and Component Magnitude
  status: active
  proposal_id: tp_20261009_techniques_v2_reader_intros
  introduction:
    en: >-
      Dynamic magnitude analysis observes the model while it processes data and ranks
      neurons, heads, or learned features by how strongly, frequently, or selectively
      they activate. Conditioning the statistics on a behavior—such as a language or a
      refusal response—can reveal components associated with that behavior. Because the
      ranking changes with the input distribution, it should be treated as a candidate
      map rather than a statement of causal necessity.
    zh: >-
      Dynamic Magnitude Analysis 在模型处理数据时观察它，并按照激活强度、频率或选择性给神经元、attention head
      或学习特征排序。若按语言、拒绝响应等行为对统计量进行条件化，还可以发现与特定行为相关的组件。
      由于排名会随输入分布改变，它更适合作为候选地图，而不是因果必要性的结论。
- node_id: layerwise-representation-distance
  parent_id: magnitude-based-scoring
  title: Layer-Wise Representation Distance
  status: active
  proposal_id: tp_20261009_techniques_v2_reader_intros
  introduction:
    en: >-
      Instead of inspecting one layer in isolation, this method follows how a
      representation changes as it moves through the network. Distances between vectors,
      subspaces, or distributions can reveal a layer where two classes separate, a
      concept rotates, or a new structure emerges. The result localizes a transition in
      representation space, but does not by itself identify the computation that caused it.
    zh: >-
      这种方法不是孤立地看某一层，而是追踪表征在网络中逐层流动时如何改变。
      向量、子空间或分布之间的距离，可以揭示两个类别从哪一层开始分离、某个概念在哪里旋转，或新结构在哪里出现。
      它能定位表征转变，却不能单独说明究竟是哪一种计算造成了转变。
- node_id: feature-discovery-decomposition
  parent_id: technique
  title: Feature Discovery and Decomposition
  status: active
  proposal_id: tp_20261010_techniques_v16_internal_vocabulary
  introduction:
    en: >-
      Many concepts are not represented independently by single neurons, but are
      distributed or superposed across multiple dimensions. Researchers therefore need
      an "internal vocabulary" better suited to the model than its native neurons alone:
      a set of features in which complex model activity can be identified, named,
      compared, and intervened on. Some methods directly search for semantic labels for
      the model's existing neurons or channels; others learn a new basis that separates
      signals superposed within the same activation vector into latent features. This
      branch brings these approaches together while distinguishing whether the resulting
      features come from native components, a learned dictionary, or a statistical
      decomposition.
    zh: >-
      许多概念并不是由单个神经元独立表示，而是分布或叠加在多个维度上。因此，研究者需要寻找一套比原生神经元更合适的
      “内部词汇表”，把复杂的模型活动表达成可以识别、命名、比较和干预的特征。有些方法直接为模型已有的神经元或通道寻找语义标签，
      另一些方法则学习新的基底，把叠加在同一激活向量中的信号分离成潜在特征。本分支把这些路线放在一起，同时区分所得特征究竟来自原生组件、
      学习字典，还是统计分解。
- node_id: concept-unit-alignment
  parent_id: feature-discovery-decomposition
  title: Concept–Unit Alignment
  status: active
  proposal_id: tp_20261010_techniques_v17_concept_unit_alignment
  introduction:
    en: >-
      Concept–Unit Alignment does not learn new feature coordinates. Instead, it treats
      the model's existing neurons or channels as candidate entries in an "internal
      vocabulary." Researchers collect a unit's activations over many inputs and compare
      the resulting activation pattern with human-defined concept evidence, candidate
      text descriptions, or semantic representations supplied by another model. The
      resulting label describes what the unit frequently responds to under the chosen
      data and scoring method; it is not a complete definition of the unit's function. A
      single unit may respond to several concepts, and one concept may be distributed
      across many units. Even a stable semantic correspondence does not by itself show
      that the unit causally contributes to model behavior.
    zh: >-
      Concept–Unit Alignment 不学习新的特征坐标，而是把模型已有的神经元或通道当作“内部词汇表”的候选条目。
      研究者会收集某个单元在大量输入上的激活，并将这种激活规律与人工定义的概念证据、候选文本或其他模型提供的语义表示进行比较，
      从而为该单元寻找候选描述。这个标签描述的是单元在给定数据和评分方法下经常响应什么，而不是对其功能的完整定义。
      同一单元可能响应多个概念，一个概念也可能分布在多个单元中；稳定的语义对应也不能单独证明该单元对模型行为具有因果作用。
- node_id: network-dissection
  parent_id: concept-unit-alignment
  title: Network Dissection
  status: active
  proposal_id: tp_20261010_techniques_v17_concept_unit_alignment
  introduction:
    en: >-
      Network Dissection tests whether an individual convolutional unit in a CNN behaves
      like a detector for a visual concept. Researchers collect the unit's spatial
      activation maps on annotated images, resize each map to the image resolution, and
      threshold it into a binary region. They then compute Intersection over Union (IoU)
      between this region and pixel-level masks for concepts such as objects, parts,
      scenes, textures, materials, and colors. If the unit's active region consistently
      overlaps a concept across many images, the unit is labeled as a candidate detector
      for that concept. Counting how many distinct concepts align with units in a layer
      also supports comparisons of axis-aligned interpretability across networks. The
      result depends on which concepts the annotation set contains and on the activation
      and IoU thresholds. It measures spatial alignment between one unit and one concept:
      a missed concept may simply be absent from the vocabulary, while high overlap does
      not show that the unit represents only that concept or causally drives behavior.
    zh: >-
      Network Dissection 检查 CNN 中的单个卷积单元是否表现得像某个视觉概念的 detector。研究者先收集该单元在标注图像上的空间激活图，
      将激活图放大到原图尺寸并按阈值转换成二值区域，再与对象、部件、场景、纹理、材质和颜色等概念的像素级标注区域计算
      Intersection over Union（IoU）。如果一个单元的激活区域与某个概念在大量图像上持续重合，就把它标记为该概念的候选 detector；
      一层中能够与多少种概念形成这种对应，也可以用来比较不同网络表征的 axis-aligned interpretability。这个结果依赖标注数据包含哪些概念、
      激活与 IoU 阈值如何设置，并且只衡量单个单元与概念的空间对应关系：未被识别的概念可能不在标注词表中，高重合也不代表该单元只表示这个概念或对模型行为具有因果作用。
- node_id: clip-unit-labeling
  parent_id: concept-unit-alignment
  title: CLIP-Based Unit Labeling
  status: active
  proposal_id: tp_20261010_techniques_v17_concept_unit_alignment
  introduction:
    en: >-
      CLIP-Based Unit Labeling uses a vision–language model to find text labels for units
      in a vision network, avoiding the need for pixel-level annotations for every
      candidate concept. Researchers begin with a set of unlabeled probe images and a
      set of candidate text descriptions. CLIP scores how well every image matches every
      candidate description, producing a score pattern across images for each concept;
      the vision model being interpreted produces the target unit's activation pattern
      over the same images. CLIP-Dissect compares these two cross-image patterns and uses
      the best-matching candidate text as the unit's description, rather than simply
      captioning its most activating images. Probe images and candidate descriptions can
      be changed independently, so the method is not tied to a fixed pixel-annotated
      dataset. It must still choose from the supplied candidate texts, however, and its
      output depends on CLIP's semantic distinctions, the probe images, the activation
      summary, and the matching function. The label describes a correlated response
      pattern; it may not capture all of the unit's meanings and does not by itself
      establish a causal function.
    zh: >-
      CLIP-Based Unit Labeling 使用视觉—语言模型为视觉网络中的单元寻找文本标签，从而避免为每个候选概念准备像素级标注。
      研究者先准备一组无需人工标注的 probe images 和一个候选文本集合。CLIP 为每张图像和每个候选文本计算匹配分数，由此得到每个概念在整组图像上的得分变化；
      待解释的视觉模型则给出某个单元在同一组图像上的激活变化。CLIP-Dissect 比较这两种跨图像的变化模式，并把最匹配的候选文本作为该单元的描述，
      而不是简单地给最高激活图像生成 caption。它可以灵活更换 probe images 和候选文本，不受固定像素标注数据集限制，但仍只能从提供的候选文本中选择标签，
      结果也会受到 CLIP 的语义能力、probe images、激活汇总方式和匹配函数影响。所得标签描述的是相关的响应模式，不一定覆盖单元的全部语义，也不能单独证明其因果功能。
- node_id: feature-dictionary-learning
  parent_id: feature-discovery-decomposition
  title: Feature Dictionary Learning
  status: active
  proposal_id: tp_20261010_techniques_v18_feature_dictionary_sae
  introduction:
    en: >-
      Feature Dictionary Learning does not attach labels directly to the model's native
      neurons. Instead, it learns a new set of feature elements whose sparse weighted
      combinations approximate the model's dense activations or a target transformation.
      For each input, an encoder converts model activity into latent feature strengths,
      of which usually only a small number are active; a decoder then combines the
      corresponding feature directions to reconstruct the target. Each latent coordinate
      and its decoder direction therefore become a candidate entry in an internal
      vocabulary. These dictionary elements need not be orthogonal, unique, or identical
      to real concepts. A single concept may be split across several features, several
      concepts may be mixed in one feature, and an accurate reconstruction may still fail
      to preserve model behavior. A learned dictionary must therefore be assessed through
      sparsity, reconstruction quality, semantic consistency, and functional faithfulness.
    zh: >-
      Feature Dictionary Learning 不直接给模型的原生神经元贴标签，而是学习一组新的特征元素，
      用它们的稀疏加权组合来近似模型原有的稠密激活或目标变换。对于每个输入，编码器把模型活动转换成一组潜在特征强度，
      其中通常只有少数特征处于激活状态；解码器再把这些特征对应的方向组合起来，重构目标。每个潜在坐标及其 decoder direction
      因而成为一个候选的内部词汇条目。这些字典元素不一定正交、唯一或等同于真实概念：一个概念可能被拆成多个特征，
      多个概念也可能混在同一特征中；即使重构准确，也可能没有保留模型行为。因此，还需要同时检查稀疏性、重构质量、语义一致性和功能忠实度。
- node_id: sparse-autoencoders
  parent_id: feature-dictionary-learning
  title: Sparse Autoencoders
  status: active
  proposal_id: tp_20261010_techniques_v18_feature_dictionary_sae
  introduction:
    en: >-
      Sparse Autoencoders learn a feature dictionary for the activations at a particular
      location in a model. Their motivation is superposition: the model may encode more
      features than it has activation dimensions, so a native neuron can respond to
      several unrelated patterns. An SAE's encoder maps a dense activation vector into a
      usually wider set of latent feature strengths and encourages only a small number to
      be active for each input. Its decoder combines the corresponding directions to
      reconstruct the original activation. Researchers interpret a latent by examining
      the inputs that activate it, generating candidate descriptions, and testing what
      happens when its value is changed. The sparse coordinates can be easier to study
      than native neurons, but they are learned approximations rather than guaranteed
      atomic concepts. Evaluation must account for dead latents, feature splitting or
      mixing, reconstruction error, and whether replacing the original activation with
      the reconstruction preserves downstream model behavior.
    zh: >-
      Sparse Autoencoder 针对模型某个位置的激活学习特征字典。它的出发点是 superposition：模型需要表示的特征可能多于激活空间的维数，
      因此一个原生神经元可能同时响应多种无关模式。SAE 的编码器把稠密激活向量转换到通常更宽的潜在特征空间，并让每个输入只激活少数特征；
      解码器再组合对应的特征方向，重构原始激活。研究者可以通过查看某个潜在特征被哪些输入激活、为它生成候选描述，以及改变其数值后观察模型变化来解释它。
      这些稀疏坐标可能比原生神经元更容易研究，但它们仍是学习得到的近似，不能保证对应不可再分的真实概念。评估时还需要考虑 dead latents、特征拆分或混合、
      重构误差，以及用重构结果替换原激活后是否保留了模型的后续行为。
- node_id: vanilla-topk-sae
  parent_id: sparse-autoencoders
  title: Vanilla and Top-K Sparse Autoencoders
  status: active
  proposal_id: tp_20261010_techniques_v18_feature_dictionary_sae
  introduction:
    en: >-
      Vanilla and Top-K SAEs differ mainly in how they make latent activations sparse. A
      Vanilla SAE usually uses a ReLU encoder and adds an \(L_1\) penalty on latent
      activations to the reconstruction loss. The penalty encourages most latents to be
      zero or close to zero, but it also suppresses the magnitudes of features that are
      active, creating a systematic bias in the reconstruction. A Top-K SAE does not use
      \(L_1\) to induce sparsity indirectly. For each input, it permits only the \(k\)
      strongest encoder outputs to remain nonzero and reconstructs the original
      activation from their decoder directions. This gives direct control over the number
      of features used in each reconstruction, although one fixed \(k\) may be too large
      for simple inputs and too small for complex ones, and latents that are rarely
      selected can still become dead. The two designs should be compared at similar
      sparsity using reconstruction quality, preservation of model performance, and
      feature interpretability rather than assuming that either sparsity mechanism is
      automatically superior.
    zh: >-
      Vanilla SAE 和 Top-K SAE 的主要区别在于如何让 latent activations 保持稀疏。Vanilla SAE 通常使用 ReLU encoder，
      并在 reconstruction loss 之外对 latent activations 加入 \(L_1\) penalty。这个 penalty 鼓励大多数潜变量保持为零或接近零，
      但也会压低已经激活的特征强度，使重构结果出现系统性的幅值偏差。Top-K SAE 不再通过 \(L_1\) 间接推动稀疏，而是在每个输入上只允许 encoder 输出中最强的
      \(k\) 个潜变量保留非零值，再用它们对应的 decoder directions 重构原始激活。这样可以直接控制每次重构使用多少个特征，
      但固定的 \(k\) 对简单输入可能过大、对复杂输入又可能过小，也仍需要处理长期不被选中的 dead latents。比较两类方法时，需要在相近稀疏程度下同时考察重构质量、
      模型性能保留程度和特征可解释性，而不能假定某种稀疏机制必然更好。
- node_id: gated-jumprelu-sae
  parent_id: sparse-autoencoders
  title: Gated and JumpReLU Sparse Autoencoders
  status: active
  proposal_id: tp_20261010_techniques_v18_feature_dictionary_sae
  introduction:
    en: >-
      A conventional \(L_1\) penalty affects both whether a feature activates and how
      large its activation is, so minimizing the combined objective can systematically
      underestimate feature magnitudes. A Gated SAE computes these two questions
      separately: a gating mechanism first decides which latent features should be
      active, and a magnitude calculation then estimates the strengths of those active
      features. The sparsity constraint acts mainly on feature selection and therefore
      does not directly suppress the magnitudes used for reconstruction. A JumpReLU SAE
      instead learns a positive threshold for each latent feature. Responses below the
      threshold become zero, while those above it largely retain their original sizes;
      approximate-gradient training provides more direct control over the number of
      nonzero features. Both methods seek to reduce the feature-magnitude shrinkage
      caused by \(L_1\) and improve the trade-off between sparsity and reconstruction,
      but better reconstruction does not automatically make the learned features more
      semantically consistent or causally important.
    zh: >-
      普通的 \(L_1\) penalty 同时影响一个特征是否激活以及激活后的强度，因此可能为了降低稀疏惩罚而系统性地低估特征幅值。
      Gated SAE 将这两个问题分开计算：首先通过 gating mechanism 判断哪些潜在特征应当激活，再通过 magnitude calculation 估计这些已激活特征的强度。
      稀疏约束主要作用于前一步的特征选择，因此不会直接压低用于重构的特征幅值。JumpReLU SAE 则为每个潜在特征学习一个正阈值；低于阈值的响应直接归零，
      超过阈值的响应基本保留原有大小，并通过近似梯度训练更直接地控制非零特征的数量。两者都试图缓解 \(L_1\) 引起的特征幅值收缩，并改善稀疏性与重构质量之间的权衡，
      但更好的重构表现并不自动意味着学到的特征更具语义一致性或因果作用。
- node_id: specialized-feature-aligned-sae
  parent_id: sparse-autoencoders
  title: Specialized and Feature-Aligned Sparse Autoencoders
  status: active
  proposal_id: tp_20261010_techniques_v18_feature_dictionary_sae
  introduction:
    en: >-
      Some methods improve the coverage or training stability of the features learned by
      a standard SAE by changing its training process. A Specialized SAE targets domains
      or long-tail concepts that occur infrequently in general training data. Researchers
      use a small seed set to retrieve relevant examples, fine-tune a general-purpose SAE
      on the selected domain data, and may give greater weight to examples that are
      difficult to reconstruct so that limited dictionary capacity is devoted to the
      target features. A Feature-Aligned SAE instead asks whether separate training runs
      recover stable, consistent features. Mutual Feature Regularization, for example,
      trains several SAEs on the same model activations, encourages corresponding decoder
      directions to align across the SAEs, and reinitializes features that perform poorly
      or remain inactive. Specialization can improve coverage of a target domain but may
      reduce general coverage and depends on the seed data and retrieval quality.
      Cross-run alignment can improve consistency, but similar directions learned by
      several SAEs are not proof that they represent a real, single human concept.
    zh: >-
      一些方法通过调整训练过程，改善标准 SAE 对特征的覆盖能力或训练稳定性。其中，Specialized SAE 面向通用训练数据中较少出现的目标领域或长尾概念：
      研究者先用少量种子样本检索相关数据，再用筛选出的领域数据微调通用 SAE；还可以提高难重构样本的训练权重，使有限的字典容量更多地用于目标特征。
      Feature-Aligned SAE 则关注不同训练运行能否得到稳定一致的特征。例如，Mutual Feature Regularization 会在同一批模型激活上同时训练多个 SAE，
      鼓励不同 SAE 中相互对应的 decoder directions 对齐，并重新初始化表现不佳或长期不激活的特征。前者提高特定领域的覆盖率，却可能牺牲通用覆盖，并依赖种子数据和检索质量；
      后者提高跨训练运行的一致性，但多个 SAE 学到相似方向仍不能证明这些方向必然对应真实、单一的人类概念。
- node_id: end-to-end-functional-dictionary
  parent_id: sparse-autoencoders
  title: End-to-End Functional Dictionary Learning
  status: active
  proposal_id: tp_20261010_techniques_v18_feature_dictionary_sae
  introduction:
    en: >-
      A conventional SAE minimizes reconstruction error at the layer where it is trained,
      but a small local error does not guarantee that it preserves the information used
      by the model's later computation. An End-to-End SAE inserts its reconstructed
      activation into the frozen model, passes it through the downstream layers, and is
      trained with both a sparsity constraint and a KL-divergence objective comparing the
      original and SAE-modified output distributions. It can therefore prioritize
      information important to the model's final behavior without reproducing every
      variation in the local activation. A downstream-loss variant additionally compares
      states at several later layers, discouraging the SAE from finding a different
      internal route that happens to yield similar outputs. Similar outputs still do not
      prove that the original internal mechanism has been faithfully recovered, so
      downstream states, stability across random seeds, feature semantics, and
      intervention effects must also be checked.
    zh: >-
      普通 SAE 主要要求重构某一层的激活，但局部 reconstruction error 较小，并不保证模型后续计算仍然产生相同的结果。
      End-to-End SAE 把 SAE 重构出的激活真正送入冻结模型的后续层，并比较原模型与 SAE 介入后模型的输出分布，通常通过 KL divergence 与稀疏约束共同训练字典。
      它因此可以优先保留对模型最终行为重要的信息，而不必精确复原局部激活中的所有变化。进一步的 downstream-loss 版本还会比较若干后续层的状态，以减少 SAE 借助另一条计算路径得到相似输出的可能性。
      不过，输出相近仍不等于原有内部机制被忠实还原，因此还需要检查后续状态、跨随机种子的稳定性、特征语义和干预效果。
- node_id: subspace-aware-dictionary
  parent_id: sparse-autoencoders
  title: Subspace-Aware Dictionary Learning
  status: active
  proposal_id: tp_20261010_techniques_v18_feature_dictionary_sae
  introduction:
    en: >-
      A standard SAE usually represents each latent feature with one decoder direction.
      If a concept varies with context, position, or state along several related
      directions, this one-vector assumption can split it into many nearly aligned
      dictionary atoms. Subspace-aware methods instead represent one candidate feature
      with a group of decoder directions. The encoder supplies coordinates within each
      group, and group-level sparse selection keeps only a small number of groups active,
      so sparsity is measured by how many feature subspaces are used rather than by every
      direction inside them. Some methods also constrain the effective rank used within
      a group to prevent unconstrained growth in representational capacity. This design
      can preserve continuous variation or geometry within a concept, but it assumes that
      the grouped directions really form one coherent feature. A group may still mix
      several concepts, and naming or causally intervening on a subspace is more complex
      than working with a single direction.
    zh: >-
      标准 SAE 通常用一个 decoder direction 表示一个潜在特征，但有些概念会随着上下文、位置或状态变化而沿多个相关方向展开。
      强行用单个方向表示它们，可能使同一概念被拆成许多彼此接近的 dictionary atoms。Subspace-aware 方法改为用一组 decoder directions 共同表示一个候选特征：
      encoder 先给出各组内部的坐标，再只激活少数几个方向组，使稀疏性约束作用于“使用了多少个特征子空间”，而不是单独计算其中的每个方向。
      部分方法还会限制每个子空间实际使用的有效维度，以避免无约束地扩大表示容量。这类方法能够保留概念内部的连续变化或几何结构，但它假设相关方向确实构成一个连贯特征；
      一个方向组仍可能混合多个概念，而且特征命名和因果干预也比单方向字典更复杂。
- node_id: transcoders
  parent_id: feature-dictionary-learning
  title: Transcoders
  status: active
  proposal_id: tp_20261010_techniques_v18_feature_dictionary_sae
  introduction:
    en: >-
      Whereas an SAE reconstructs the same activation that it receives, a Transcoder
      learns the input–output transformation performed by a dense model component such as
      an MLP. Its encoder reads the component's input activation and converts it into a
      sparse set of latent feature strengths; its decoder combines output directions to
      predict the component's output activation. Each latent therefore connects a pattern
      that is detected at the input with a direction written at the output. Researchers
      can use these sparse input–output links to trace how one feature contributes to
      later features and to build feature-level approximations of circuits. A Transcoder
      is nevertheless a learned surrogate rather than a literal decomposition of the
      original component. Its apparent links can depend on the training distribution and
      reconstruction error, and a sparse approximation may hide interactions implemented
      by the original nonlinear computation.
    zh: >-
      SAE 重构它接收到的同一个激活，而 Transcoder 学习 MLP 等稠密模型组件执行的输入—输出变换。它的编码器读取该组件的输入激活，
      并将其转换成一组稀疏的潜在特征强度；解码器再组合对应的输出方向，预测该组件的输出激活。因此，每个潜在特征都将一种在输入端被识别的模式与一个写入输出端的方向联系起来。
      研究者可以利用这些稀疏的输入—输出联系，追踪一个特征如何促成后续特征，并构建特征层面的 circuit 近似。不过，Transcoder 是学习得到的代理模型，而不是对原组件的逐项拆解。
      它显示的联系可能受训练数据分布和重构误差影响，稀疏近似也可能隐藏原有非线性计算实现的特征交互。
- node_id: crosscoders
  parent_id: feature-dictionary-learning
  title: Crosscoders
  status: active
  proposal_id: tp_20261010_techniques_v18_feature_dictionary_sae
  introduction:
    en: >-
      A Crosscoder learns one sparse latent vocabulary from two or more activation spaces,
      such as corresponding layers in a base model and a fine-tuned model. Its encoder
      uses the related activations to produce latent feature strengths, while separate
      decoder directions reconstruct each activation space. A latent can therefore write
      strongly into several spaces, mainly into one of them, or in different directions
      in each. Researchers use these patterns to identify candidate shared, model-specific,
      or changed features without first training unrelated dictionaries and matching
      their entries afterward. The result is still a learned alignment: decoder norms,
      activation normalization, training choices, and reconstruction error can make an
      ordinary shared feature appear model-specific or can merge distinct features into
      one latent. A shared latent also does not by itself establish that different models
      use the feature in the same computation or for the same behavior.
    zh: >-
      Crosscoder 从两个或多个激活空间中学习同一套稀疏潜在词汇，例如基础模型与微调模型对应层的激活。它的编码器利用这些相关激活产生潜在特征强度，
      再用各个激活空间各自的 decoder directions 完成重构。因此，同一个潜在特征可以同时强烈写入多个空间，主要写入其中一个，或在不同空间中对应不同方向。
      研究者可以据此寻找候选的共享特征、模型特有特征或发生变化的特征，无需先分别训练互不相关的字典，再事后匹配其条目。不过，这仍然是一种学习得到的对齐。decoder norm、激活归一化、
      训练设置和重构误差都可能把普通共享特征显得像模型特有特征，或把不同特征合并到同一潜变量中。共享潜变量也不能单独证明不同模型使用它执行了相同计算或产生了相同行为。
- node_id: ica-based-decomposition
  parent_id: feature-discovery-decomposition
  title: ICA-Based Decomposition and ICA Lens
  status: active
  proposal_id: tp_20261010_techniques_v19_ica_stitching
  introduction:
    en: >-
      ICA-Based Decomposition is a classical statistical decomposition method. Rather
      than training another encoder–decoder, it searches for approximately independent
      components directly in model activations collected from many tokens. A standard
      FastICA pipeline first centers and whitens the activations, removing linear
      correlations between dimensions and normalizing their variances. It then rotates
      the whitened space to find directions whose activation distributions depart
      strongly from a Gaussian distribution. If the observed activations are mixtures of
      approximately independent sources, these directions may separate those sources
      into distinct statistical components. Projecting a token activation onto a
      component produces a signed component score. Researchers can inspect examples with
      the highest positive and negative scores to form semantic hypotheses, and use the
      inverse transformation to obtain activation-space directions for comparison or
      intervention. ICA Lens builds on this classical pipeline rather than introducing a
      separate decomposition principle. It adds per-sample normalization, GPU-parallel
      FastICA, per-component convergence diagnostics, and adaptive component counts to
      address large-norm outliers and unstable convergence in language-model activations.
      Statistical independence or non-Gaussianity does not imply that a component is
      semantically atomic or causally important. The recovered components also depend on
      the corpus, preprocessing, and convergence quality, so their stability,
      interpretability, and intervention effects must be evaluated separately.
    zh: >-
      ICA-Based Decomposition 是一种经典的统计分解方法。它不训练新的 encoder–decoder，而是直接从大量 token 的模型激活中寻找近似独立的统计成分。
      标准 FastICA 流程会先将激活减去均值并进行 whitening，也就是消除维度之间的线性相关并统一方差；随后旋转这个经过处理的空间，寻找激活分布明显偏离高斯分布的方向。
      如果观测到的激活确实由若干近似独立的来源混合而成，这些方向就可能将它们分离为不同的统计成分。每个 token 在某个成分上的投影形成一个带正负号的 component score；
      研究者可以查看正向和负向得分最高的样本来提出语义解释，也可以通过逆变换得到激活空间中的方向，用于比较或干预。ICA Lens 是在这一经典流程上的改进，而不是另一种分解原理。
      它针对语言模型激活中的异常大范数样本和不稳定收敛问题，加入逐样本归一化、GPU 并行 FastICA、逐成分收敛诊断和自适应成分数量，使 ICA 更适合作为低成本的初步探索工具。
      但统计独立或非高斯并不等于语义单一，更不能自动证明因果作用；所得成分还会受到语料、预处理和收敛状态影响，因此需要进一步检查稳定性、可解释性和干预效果。
- node_id: cross-model-feature-alignment
  parent_id: feature-discovery-decomposition
  title: Cross-Model Feature Alignment and Stitching
  status: active
  proposal_id: tp_20261010_techniques_v19_ica_stitching
  introduction:
    en: >-
      Even when two models represent similar information, their residual-stream
      coordinates, dimensions, and scales may differ, so directions cannot be compared
      or transferred directly. Cross-Model Feature Alignment typically runs both models
      on the same inputs, collects activations at corresponding token positions, and
      learns a linear or affine mapping from one activation space to the other. Alignment
      estimates this coordinate correspondence; Model Stitching goes further by using the
      mapping as an interface between models. An activation from a layer in model A is
      mapped into model B's space, substituted for the activation at a corresponding
      layer in B, and then processed by B's downstream layers. If this substitution
      preserves low prediction loss or the target behavior, the mapping has some
      functional validity rather than merely fitting activation values. The same mapping
      can also transfer SAE weights, probes, or steering vectors across models, supporting
      comparisons between model sizes or training stages. A linear mapping may,
      nevertheless, favor common or high-variance patterns while missing rare semantic
      features and nonlinear relationships. Its performance also depends on the paired
      data, layer selection, model family, and tokenizer. Low reconstruction error or
      successful stitching does not by itself establish a one-to-one feature
      correspondence or show that the two models implement the same internal algorithm.
    zh: >-
      即使两个模型表示了相似信息，它们的 residual-stream 坐标、维度和尺度也可能不同，因此不能直接比较或迁移其中的方向。
      Cross-Model Feature Alignment 通常让两个模型处理相同输入，收集对应 token 位置的激活，再学习从一个模型激活空间到另一个空间的线性或 affine mapping。
      Alignment 指的是估计这种坐标对应关系；Model Stitching 则进一步把映射当作两个模型之间的接口：将模型 A 某一层的激活映射到模型 B 的空间，替换模型 B 对应层的激活，
      再让模型 B 的后续层继续计算。只有当这种替换仍能保留较低的预测损失或目标行为时，映射才不仅是在数值上拟合激活，也具有一定的功能意义。
      学到的映射还可以用于迁移 SAE 权重、probe 或 steering vector，从而比较不同规模或不同训练阶段模型中的特征。不过，线性映射可能优先保留常见或高方差模式，而遗漏稀有语义和非线性关系；
      其效果也取决于配对数据、层的选择、模型家族和 tokenizer。较低的重构误差或成功的 stitching 不能单独证明两个模型具有逐特征的一一对应关系，也不能证明它们执行了相同的内部算法。
- node_id: causal-intervention-attribution
  parent_id: technique
  title: Causal Intervention
  status: active
  proposal_id: tp_20261010_techniques_v20_causal_intervention_parent
  introduction:
    en: >-
      Causal Intervention actively changes a model's internal states or components to test
      whether they affect a target behavior. Researchers first define the behavioral
      contrast to be explained and the corresponding output metric. They then remove,
      replace, restore, exchange, or gate activations, parameters, components, or
      information-transfer paths and compare the model's outputs before and after the
      change. This branch includes both interventions that are actually executed and
      approximation methods that estimate the effect of a clearly specified intervention.
      Whereas observational methods inspect activations, correlations, or decodable
      information during an unmodified model run, a causal intervention poses a concrete
      counterfactual question, such as, "How would the model behave if this internal state
      were replaced by another one?" Different experiments can provide evidence about a
      component's conditional necessity, its ability to restore a behavior, the paths
      through which an effect travels, or how a high-level variable is implemented, but
      these conclusions are not interchangeable. Results also depend on the replacement
      baseline, component granularity, input distribution, and evaluation metric.
      Redundancy and interactions can hide a real contribution, while an unnatural
      replacement can create an out-of-distribution state. Reliable conclusions therefore
      compare several intervention settings, include appropriate controls, and verify
      important candidates from approximate methods with exact experiments.
    zh: >-
      Causal Intervention 通过主动改变模型的内部状态或组件，检验它们是否会影响目标行为。研究者首先定义需要解释的行为差异和相应的输出指标，
      再对激活、参数、组件或信息传递路径进行移除、替换、恢复、交换或门控，并比较干预前后的模型输出。本分支既包括实际执行的内部干预，也包括以某种明确干预为目标、用于估计其效果的近似方法。
      与观察模型自然运行时的激活、相关性或可解码信息不同，因果干预构造了一个具体的反事实问题，例如“如果这个内部状态被另一个状态替换，模型行为会怎样变化”。
      不同实验可以分别提供组件必要性、行为恢复能力、效应传递路径或高层变量实现方式的证据，但这些结论不能相互替代。干预结果还取决于替换基线、组件粒度、输入分布和评价指标；
      模型中的冗余与组件交互可能掩盖作用，不自然的替换也可能产生分布外状态。因此，可靠的结论通常需要比较多种干预设置、加入适当控制，并用精确实验验证近似方法发现的重要候选。
- node_id: activation-ablation-replacement
  parent_id: causal-intervention-attribution
  title: Activation Ablation and Replacement
  status: active
  proposal_id: tp_20261010_techniques_v21_causal_intervention_children
  introduction:
    en: >-
      Activation Ablation and Replacement changes the activation of a selected component
      during a forward pass and measures how a target output metric responds. Common
      operations set the activation to zero, reduce its magnitude, replace it with a
      dataset mean, or substitute an activation produced by another example. These
      replacements define different counterfactuals: zeroing attempts to remove the
      signal, mean replacement puts the component in a more typical state, and resampling
      asks what would happen if the component carried information from another case. If
      an intervention substantially damages the target behavior, the model depends on the
      component under that intervention, but this does not show that the component is
      uniquely necessary. Conversely, a small effect may reflect redundancy, compensating
      paths, or an insensitive metric rather than irrelevance. Because zeroing and other
      replacements can also create states outside the model's normal activation
      distribution, reliable analysis compares several baselines and checks whether the
      result is stable.
    zh: >-
      Activation Ablation and Replacement 在一次 forward pass 中改变选定组件的激活，再观察目标输出指标如何变化。常见操作包括把激活置零、缩小其幅值、
      替换为数据集均值，或换成另一个样本产生的激活。不同替换值定义了不同的反事实：置零试图模拟信号被移除，均值替换让组件处于较典型的状态，resampling 则询问如果该组件携带另一个样本的信息会发生什么。
      若干预使目标行为明显受损，可以说明模型在这一干预条件下依赖该组件；但这不证明它是唯一必要的组件。相反，效果很小也可能来自功能冗余、补偿路径或不敏感的评价指标。
      尤其是置零等操作可能产生偏离正常激活分布的状态，因此需要比较多种替换基线，并检查结果是否稳定。
- node_id: activation-patching
  parent_id: causal-intervention-attribution
  title: Activation Patching and Causal Tracing
  status: active
  proposal_id: tp_20261010_techniques_v21_causal_intervention_children
  introduction:
    en: >-
      Activation Patching usually begins with a clean input that elicits the target
      behavior and a corrupted input that removes or changes it. Researchers save the
      internal activations from both runs and then perform a hybrid run: a clean
      activation can replace the corresponding corrupted activation to test whether the
      behavior is restored, or a corrupted activation can be inserted into the clean run
      to test whether the behavior is damaged. Causal Tracing typically applies the
      restoration experiment systematically across layers, token positions, or components
      to locate states that carry the behavioral difference between the clean and
      corrupted conditions. A substantial patching effect shows that the state at that
      location can influence the target output in the specified counterfactual setting.
      It does not establish that the information was originally computed there or that
      the location is uniquely necessary. Conclusions also depend on the corruption
      method, patch granularity, evaluation metric, and whether the resulting hybrid state
      is natural for the model.
    zh: >-
      Activation Patching 通常先构造一个能够产生目标行为的 clean input，以及一个使该行为消失或改变的 corrupted input，并保存两次运行中的内部激活。
      研究者随后进行一次混合运行，在某个位置用 clean activation 替换 corrupted activation，观察目标行为能否恢复；也可以反向把 corrupted activation 放入 clean run，检查行为是否受到破坏。
      Causal Tracing 通常把这种恢复实验系统地应用到不同层、token 位置或组件上，以定位哪些内部状态能够传递 clean 与 corrupted 条件之间的行为差异。显著的 patching effect 说明该位置的状态能够在给定反事实设置下影响目标输出，
      但不能单独说明相关信息最初在这里产生，也不能证明该位置是唯一必要的。结果还会受到 corruption 方法、patch 粒度、评价指标以及混合状态是否自然的影响。
- node_id: path-patching
  parent_id: causal-intervention-attribution
  title: Path Patching
  status: active
  proposal_id: tp_20261010_techniques_v21_causal_intervention_children
  introduction:
    en: >-
      Ordinary Activation Patching changes a component's output for all of its downstream
      consumers at once. It can therefore show that the component matters without
      identifying the particular connection through which its effect travels. Path
      Patching expresses a hypothesis as a set of directed computational paths and
      controls signals sent from the same component to different receivers separately.
      Paths retained by the hypothesis use values from a reference run, while other paths
      use values from a counterfactual run. Researchers then compare this patched subgraph
      with the original model to measure how much of the target behavior the selected
      paths explain. The method can test whether a sender acts through a specified receiver
      or whether a larger path set forms a sufficiently faithful approximation. Its result
      depends on how the computational graph is decomposed, how reference and
      counterfactual inputs are paired, and which error or recovery metric is used. A low
      average error can also conceal severe failures on a minority of inputs. Path
      Patching therefore tests a precise path hypothesis rather than automatically
      discovering or conclusively proving the model's true information flow.
    zh: >-
      普通 Activation Patching 改变一个组件的输出后，这个变化通常会同时传到它的所有下游接收者，因此只能说明组件整体是否重要，不能确定作用沿哪条连接传递。
      Path Patching 把假说表述为一组有向计算路径，并分别控制同一组件发往不同接收者的信号：假说中保留的路径使用 reference run 的值，其他路径则使用 counterfactual run 的值。
      研究者再比较这个经过 patch 的子图与原模型输出之间的差异，判断所选路径能够解释多少目标行为。它既可以检验某个 sender 是否通过指定 receiver 发挥作用，也可以评价一整组路径是否形成足够忠实的模型近似。
      不过，结果依赖计算图如何拆分、reference 与 counterfactual inputs 如何配对，以及采用平均误差还是其他指标；较低的平均误差也可能掩盖少数输入上的严重失败。因此，Path Patching 检验的是一个明确的路径假说，
      而不是自动发现或最终证明真实信息流。
- node_id: attribution-patching
  parent_id: causal-intervention-attribution
  title: Attribution Patching
  status: active
  proposal_id: tp_20261010_techniques_v21_causal_intervention_children
  introduction:
    en: >-
      Attribution Patching uses gradients to approximate the effect of Activation
      Patching instead of executing a separate intervention for every candidate. For an
      activation or computational edge, researchers compute the gradient of the target
      metric and multiply it by the difference between the corresponding clean and
      corrupted activations. This gradient–difference product is a first-order Taylor
      approximation of how much the metric would change if that location were replaced
      by its corrupted state. A clean forward pass, a corrupted forward pass, and one
      backward pass can therefore score a very large number of components or edges,
      making the method useful for quickly screening candidate circuits. It estimates a
      local linear effect around the clean state rather than actually performing every
      patch. The estimate can fail when the gradient is near zero, the activation change
      is large, or saturation and component interactions create strong nonlinear effects.
      Attribution Patching scores are consequently useful for ranking and narrowing the
      search space, but important candidates should still be verified with exact
      Activation Patching.
    zh: >-
      Attribution Patching 用梯度近似 Activation Patching 的效果，而不为每个候选位置分别执行一次干预。研究者先计算目标指标对某个 activation 或 edge 的梯度，
      再将该梯度与 clean activation 和 corrupted activation 之间的差值相乘；这个 gradient–difference product 是一阶 Taylor approximation，用来估计把该位置从 clean 状态替换为 corrupted 状态会使指标变化多少。
      一次 clean forward pass、一次 corrupted forward pass 和一次 backward pass 就可以同时得到大量组件或边的近似分数，因此很适合快速筛选候选 circuit。它测量的是 clean 状态附近的局部线性效应，并没有真正执行每个 patch；
      当梯度接近零、变化幅度较大，或存在饱和与组件交互时，估计可能失真。因此这些分数适合排序和缩小搜索范围，重要候选仍应通过精确 Activation Patching 验证。
- node_id: learned-gates-masks
  parent_id: causal-intervention-attribution
  title: Learned Intervention Masks and Gates
  status: active
  proposal_id: tp_20261010_techniques_v21_causal_intervention_children
  introduction:
    en: >-
      Learned Intervention Masks and Gates turn the combinatorial search over which
      components to intervene on into a differentiable optimization problem. Researchers
      freeze the original model, place learnable multiplicative coefficients on weights
      or component outputs, and jointly adjust those coefficients to find components that
      should be retained, suppressed, or ablated. Different methods define the target
      subset differently. Circuit Probing learns a sparse, nearly binary mask over model
      weights and uses a hypothesized intermediate variable as supervision, encouraging
      the retained subnetwork's outputs to form classes corresponding to that variable.
      Mask training only identifies a candidate subnetwork; the causal evidence comes
      from subsequently inverting the mask, ablating the subnetwork, and measuring model
      behavior. Causal Head Gating instead learns soft gates directly on attention-head
      outputs under the model's original next-token loss. It asks which heads must remain
      active, which improve performance when suppressed, and which can be switched on or
      off with little effect, describing them as facilitating, interfering, or irrelevant.
      A learned mask or gate represents one intervention solution under a particular
      dataset, objective, and regularization scheme rather than a uniquely true circuit.
      Redundancy, component interactions, initialization, and regularization strength can
      all produce different solutions, so independent ablations, repeated optimization,
      and held-out data are needed to assess stability.
    zh: >-
      Learned Intervention Masks and Gates 将“应该干预哪些组件”的组合搜索转化为可微优化。研究者冻结原模型，在权重或组件输出上加入可学习的乘法系数，
      再根据目标函数联合调整这些系数，以寻找应当保留、抑制或消融的组件。不同方法对“目标子集”的定义并不相同。Circuit Probing 在模型权重上学习接近二值的稀疏 mask，
      并使用一个预先假设的中间变量作为监督信号，使被保留子网络的输出能够按照该变量形成不同类别；mask 训练只能发现候选子网络，真正的因果证据来自随后反转 mask、消融该子网络并检查模型行为。
      Causal Head Gating 则直接在 attention head 的输出上学习软门，并根据模型原有的 next-token loss 判断哪些 head 被关闭后使性能下降、改善或基本不变，从而将它们描述为 facilitating、interfering 或 irrelevant。
      学习得到的 mask 或 gate 只代表特定数据、目标函数和正则设置下找到的一种干预方案，不一定对应唯一的真实 circuit；模型冗余、组件交互、初始化和正则强度都可能产生不同结果，
      因此还需要通过独立消融、重复训练和未见数据检查其稳定性。
- node_id: causal-mediation
  parent_id: causal-intervention-attribution
  title: Causal Mediation Analysis
  status: active
  proposal_id: tp_20261010_techniques_v21_causal_intervention_children
  introduction:
    en: >-
      Causal Mediation Analysis treats a model component as a mediator between an input
      condition and an output, asking how much of the output difference caused by changing
      the input can be transmitted by changing that mediator's state. Researchers usually
      construct base–counterfactual input pairs with different properties or answers and
      record the mediator activation in both runs. In a hybrid run, the input remains in
      one condition while the mediator is replaced by its activation from the other. The
      resulting change in output probability or logits is reported as a mediated or
      indirect effect. Operationally, this resembles Activation Patching, but the goal is
      not merely to locate a state that restores behavior. The experiment is organized
      around a predefined input treatment, mediator, and outcome in order to decompose a
      causal effect. The estimate depends on how inputs are paired, the granularity at
      which the mediator is defined, and the output metric. With nonlinearities and
      interactions, mediated effects for different components may overlap and need not
      add up to the total effect.
    zh: >-
      Causal Mediation Analysis 把某个模型组件视为输入条件与输出之间的 mediator，并询问输入变化造成的输出差异中，有多少能够通过改变这个 mediator 的状态来传递。
      研究者通常准备一组具有不同属性或答案的 base–counterfactual input pairs，记录两次运行中的 mediator activation，再进行混合运行：输入保持来自一种条件，但 mediator 被替换为另一种条件下的激活。
      替换前后的输出概率或 logit 差异构成 mediated effect 或 indirect effect。它在操作上与 Activation Patching 很接近，但重点不是单纯定位哪个位置能恢复行为，而是围绕预先定义的 input treatment、mediator 和 outcome 分解一条因果效应。
      所得效应依赖输入如何配对、mediator 选择在哪种粒度，以及用什么输出指标衡量；在存在非线性和变量交互时，不同 mediator 的效应可能重叠，也未必能相加为完整的总效应。
- node_id: causal-abstraction-analysis
  parent_id: causal-intervention-attribution
  title: Causal Abstraction and Counterfactual Analysis
  status: active
  proposal_id: tp_20261010_techniques_v24_causal_abstraction_branch
  introduction:
    en: >-
      Causal Abstraction and Counterfactual Analysis asks whether a neural network's
      internal states and causal relationships implement an intelligible high-level
      variable or algorithm. Correlation between a neural state and a concept is not
      sufficient: the high-level model and the neural network must also agree under
      matched interventions. Researchers therefore specify the conditions that make such
      a correspondence meaningful, test it by exchanging internal states, and, when the
      correspondence is unknown, search for candidate alignments in a distributed
      representation. Causal abstraction thereby turns a proposed high-level mechanism
      into causal hypotheses that can be defined, tested, and compared.
    zh: >-
      Causal Abstraction and Counterfactual Analysis 研究如何判断神经网络中的内部状态和计算关系，
      是否实现了某个可理解的高层变量或算法。它不只观察内部状态与概念是否相关，而是要求高层模型和神经网络在相匹配的干预下产生一致的反事实结果。
      研究者需要先明确这种对应关系应满足的理论条件，再在神经网络中执行相应的交换实验；如果高层变量与神经表征之间的对应关系未知，还可以从分布式表征中搜索可能的对齐方式。
      由此，因果抽象把高层机制解释转化为可以定义、检验和比较的因果假设。
- node_id: causal-abstraction-formalism
  parent_id: causal-abstraction-analysis
  title: Causal-Abstraction Formalism
  status: active
  proposal_id: tp_20261010_techniques_v24_causal_abstraction_branch
  introduction:
    en: >-
      Causal-Abstraction Formalism gives precise meaning to the claim that a neural
      network implements a high-level variable or algorithm. Researchers represent the
      neural network and the high-level explanation as causal models, then specify how
      low-level neural states map to high-level variables and how high-level interventions
      are realized by low-level interventions. If intervening on the neural model and then
      translating its result agrees with translating to the high-level model and applying
      the corresponding intervention there, the high-level model qualifies as a causal
      abstraction within the stated scope. The theory can also describe approximate or
      graded agreement and accommodate distributed, polysemantic, or linear
      representations. It supplies definitions and theoretical criteria; it does not by
      itself discover the correct high-level model or neural alignment.
    zh: >-
      Causal-Abstraction Formalism 为“神经网络实现了某个高层变量或算法”给出严格定义。
      研究者分别把神经网络和高层解释表示成因果模型，并规定底层神经状态如何映射为高层变量，以及高层干预应由什么底层干预来实现。
      如果先在神经网络中实施干预、再把结果映射到高层，与先在高层模型中实施对应干预得到的结果一致，高层模型就可以在所声明的范围内被视为神经网络的一种 causal abstraction。
      相关理论还可以描述近似或分级的一致性，以及分布式表征、polysemantic representation 和 linear representation 等情况。
      这类工作提供定义、判据和理论结果，但不会自动找到正确的高层模型或神经对应关系。
- node_id: interchange-intervention
  parent_id: causal-abstraction-analysis
  title: Interchange Intervention Testing
  status: active
  proposal_id: tp_20261010_techniques_v24_causal_abstraction_branch
  introduction:
    en: >-
      Interchange Intervention Testing asks whether a specified neural location or
      subspace performs the function of a proposed high-level causal variable.
      Researchers prepare a base input and a source input. In the high-level model, they
      replace the variable's value in the base case with its value from the source case to
      obtain an expected counterfactual output. In the neural network, they replace the
      candidate internal state in the base run with the state produced by the source
      input. Agreement between the two counterfactual results across many input pairs and
      held-out examples supports a causal correspondence between the neural state and the
      high-level variable. The test requires a high-level model and a candidate alignment
      to be specified in advance. High agreement supports that particular hypothesis but
      does not rule out other high-level models or alternative neural implementations.
    zh: >-
      Interchange Intervention Testing 用于检验一个已经指定的神经位置或子空间，是否承担了某个高层因果变量的功能。
      研究者准备 base input 和 source input，在高层模型中把该变量在 source case 中的值换入 base case，得到预期的反事实输出；
      在神经网络中，则把 source input 在候选位置产生的内部状态换入 base run。然后比较两个系统的反事实结果是否一致。
      如果这种一致性能够在大量输入组合和未见样本上保持，就支持所假设的神经状态与高层变量之间存在因果对应关系。
      该方法要求研究者事先提出高层模型，并指定候选对应位置；较高的一致率只支持这项具体假设，不能排除其他高层模型或其他神经实现方式。
- node_id: distributed-alignment-search
  parent_id: causal-abstraction-analysis
  title: Distributed Alignment Search
  status: active
  proposal_id: tp_20261010_techniques_v24_causal_abstraction_branch
  introduction:
    en: >-
      Distributed Alignment Search is used when a high-level variable may be distributed
      across several neural directions and its corresponding location cannot be specified
      directly. It learns a rotation, projection, or subspace that places the distributed
      representation in coordinates suitable for Interchange Intervention, optimizing the
      alignment so that the neural network's counterfactual outputs match those of the
      high-level model. A successful search identifies a candidate alignment that supports
      the required counterfactual exchanges, but that alignment need not be unique.
      High-dimensional representation spaces may also admit accidental solutions, so the
      result should be tested on held-out inputs and compared with alternative high-level
      models, random networks, random subspaces, or other controls.
    zh: >-
      Distributed Alignment Search 用于高层变量可能分布在多个神经方向中、无法直接指定对应位置的情况。
      它学习一个旋转、投影或子空间，把分布式神经表征转换到更适合执行 Interchange Intervention 的坐标系，并以神经网络与高层模型的反事实结果尽可能一致为优化目标。
      搜索成功意味着找到了一个能够支持所需反事实交换的候选对齐关系，但这种对齐未必唯一；高维表征空间还可能产生偶然有效的解。
      因此，需要在未参与搜索的输入上验证，并与替代高层模型、随机网络、随机子空间或其他控制条件比较。
- node_id: circuit-discovery
  parent_id: technique
  title: Circuit Discovery
  status: active
  proposal_id: tp_20261010_techniques_v22_circuit_discovery_branch
  introduction:
    en: >-
      A model usually performs a task through a sequence of information transfers among
      several internal components rather than through a single attention head, MLP, or
      feature acting alone. Circuit Discovery starts from a clearly specified model
      behavior, represents the model as a computational graph of components and directed
      connections, and searches for a relatively compact subgraph that accounts for that
      behavior. It also seeks to explain how information is read, transformed, and passed
      through the subgraph until it affects the output. A complete circuit analysis
      typically identifies candidate components and connections, interprets their
      functional roles, tests whether the resulting subgraph faithfully preserves the
      target behavior, and asks whether the explanation generalizes to other inputs,
      tasks, or models. The child nodes therefore cover complementary choices in search
      strategy, representational granularity, and validation rather than mutually
      exclusive methods; one paper may use several of them.
    zh: >-
      模型完成一项任务，通常依赖多个内部组件之间连续的信息传递，而不是某个 attention head、MLP 或特征单独发挥作用。
      Circuit Discovery 围绕一个明确的模型行为，把模型看作由组件和有向连接构成的计算图，从中寻找一个相对紧凑的子图，
      并解释信息如何在这个子图中被读取、转换和传递，最终影响模型输出。完整的 circuit 分析通常包括确定候选组件和连接、
      解释它们承担的功能、检验所得子图能否忠实保留目标行为，以及判断该解释能否推广到其他输入、任务或模型。
      下面的子节点分别涉及 circuit 的搜索方式、表示粒度和验证方法，因此同一篇论文可能同时使用其中多种技术。
- node_id: manual-circuit-analysis
  parent_id: circuit-discovery
  title: Hypothesis-Driven Circuit Analysis
  status: active
  proposal_id: tp_20261010_techniques_v22_circuit_discovery_branch
  introduction:
    en: >-
      Hypothesis-Driven Circuit Analysis builds an explanation of a model's computation
      step by step around a particular behavior. Researchers combine evidence from
      attention patterns, weights and activations, vocabulary projections, patching, and
      ablation to propose functional roles for candidate components, then repeatedly test
      and revise those hypotheses. The goal is not merely to list important components,
      but to explain the sequence in which they read, transform, and transmit information
      to carry out a computation. For example, one head may locate a relevant token and
      another may write the corresponding information to the prediction position. This
      approach can produce detailed mechanistic explanations, but it requires substantial
      human judgment and may miss components or alternative circuits outside the initial
      hypotheses.
    zh: >-
      Hypothesis-Driven Circuit Analysis 由研究者围绕某个具体行为逐步建立对模型计算过程的解释。研究者通常结合 attention pattern、
      权重和激活分析、vocabulary projection、patching 与 ablation 等证据，提出某些组件可能承担的功能，再通过干预不断检验和修正这些假设。
      最终目标不只是列出哪些组件重要，而是说明它们按什么顺序读取、转换和传递信息，从而共同实现某种计算。例如，一个 head 可能找到相关 token，
      另一个 head 再把相应信息写入预测位置。这种方法能够形成细致的机制解释，但依赖大量人工判断，也可能遗漏初始假设之外的组件或替代 circuit。
- node_id: automated-intervention-search
  parent_id: circuit-discovery
  title: Automated Intervention-Based Circuit Search
  status: active
  proposal_id: tp_20261010_techniques_v22_circuit_discovery_branch
  introduction:
    en: >-
      Automated Intervention-Based Circuit Search treats the model's nodes and
      connections as a search space and automatically tests which parts can be removed,
      replaced, or patched without substantially damaging the target behavior. Methods
      such as ACDC use a chosen dataset and evaluation metric to intervene repeatedly on
      candidate edges or components, discard unnecessary elements, and recover a sparse
      subgraph that largely preserves the original behavior. What these methods automate
      is the search for which components and connections belong in the circuit; the
      functional role of each retained element usually still requires further analysis.
      Results also depend on the intervention baseline, graph granularity, search order,
      and behavioral metric.
    zh: >-
      Automated Intervention-Based Circuit Search 把模型中的节点和连接视为候选搜索空间，并自动测试哪些部分可以移除、替换或 patch，
      而不使目标行为明显受损。ACDC 等方法会根据预先选定的数据集和评价指标反复干预候选边或组件，逐步删去不必要的部分，
      得到一个能够较好保留原模型行为的稀疏子图。这类方法主要自动化的是“哪些组件和连接应被纳入 circuit”的搜索过程；
      所得子图中各组件具体承担什么功能，通常仍需进一步分析。结果也会受到干预基线、计算图粒度、搜索顺序和行为指标的影响。
- node_id: attribution-edge-search
  parent_id: circuit-discovery
  title: Attribution-Based Edge Search
  status: active
  proposal_id: tp_20261010_techniques_v22_circuit_discovery_branch
  introduction:
    en: >-
      Attribution-Based Edge Search avoids running a complete intervention experiment on
      every candidate connection. Instead, it scores each edge's contribution to the
      target output and uses those scores to select a candidate circuit. EAP and EAP-IG
      use gradients to approximate the intervention effect of changing an edge, whereas
      methods such as contextual decomposition estimate contributions by decomposing the
      model's computation. These approaches can search large computational graphs much
      more quickly, but a local edge score may miss cooperation or substitution among
      several connections. The selected subgraph must therefore still be tested with
      actual ablation, patching, or retained-circuit evaluations to determine whether it
      faithfully reproduces the target behavior.
    zh: >-
      Attribution-Based Edge Search 不对每条候选连接分别运行完整的干预实验，而是先为各条边计算其对目标输出的贡献分数，
      再根据分数筛选出候选 circuit。EAP 和 EAP-IG 使用梯度近似改变一条边所产生的干预效果，contextual decomposition 等方法则通过分解模型计算来估计不同连接传递的贡献。
      这样可以更快地处理大型计算图，但边的局部分数不一定能反映多条连接之间的协同或替代关系。因此，筛选出的子图仍需通过实际消融、patching 或保留子图后的行为测试，
      检查它是否忠实地复现目标行为。
- node_id: feature-circuit-discovery
  parent_id: circuit-discovery
  title: Sparse Feature Circuit Discovery
  status: active
  proposal_id: tp_20261010_techniques_v22_circuit_discovery_branch
  introduction:
    en: >-
      Conventional circuits often use attention heads, MLPs, or neurons as nodes, but
      these units may participate in several unrelated computations and leave the graph
      difficult to interpret. Sparse Feature Circuit Discovery instead uses sparse
      features learned by SAEs, transcoders, or other dictionary-learning methods as
      finer-grained nodes. Researchers then trace which features activate, how they
      influence one another, and which features ultimately affect the model's output.
      The resulting circuit can correspond more closely to interpretable semantics and
      intermediate computations, but its reliability also depends on whether the feature
      dictionary adequately reconstructs the model's activity and whether the inferred
      feature-to-feature connections faithfully reflect the original computation.
    zh: >-
      传统 circuit 通常以 attention head、MLP 或神经元作为节点，但这些单元可能同时参与多种不相关的计算，使所得图仍然难以解释。
      Sparse Feature Circuit Discovery 使用 SAE、Transcoder 或其他字典学习方法得到的稀疏特征作为更细粒度的节点，再追踪哪些特征被激活、
      它们之间如何传递影响，以及哪些特征最终作用于模型输出。这样得到的 circuit 往往更接近可理解的语义和中间计算，
      但其可靠性同时取决于特征字典是否充分重构原模型活动，以及基于这些特征建立的连接是否忠实反映原模型中的计算。
- node_id: circuit-comparison-universality
  parent_id: circuit-discovery
  title: Circuit Comparison and Universality Testing
  status: active
  proposal_id: tp_20261010_techniques_v22_circuit_discovery_branch
  introduction:
    en: >-
      A circuit that works for one task, prompt, or model does not necessarily recur under
      other conditions. Circuit Comparison and Universality Testing compares circuits
      across tasks, input forms, random seeds, model scales, architectures, or modalities
      to determine which components, connections, or functional roles are reused. The
      comparison cannot rely only on matching component names or graph overlap: different
      components may perform the same function, while apparently similar components may
      play different roles in different settings. This analysis helps distinguish a
      local case study from a computation reused across tasks or a mechanism with broader
      universality.
    zh: >-
      一个 circuit 在某个任务、prompt 或模型中成立，并不意味着相同机制会在其他条件下重复出现。Circuit Comparison and Universality Testing
      比较不同任务、输入形式、随机种子、模型规模、架构或模态中的 circuit，考察哪些组件、连接或功能角色得到复用。比较时不能只看组件名称或图结构是否重合，
      因为不同组件可能承担相同功能，相似组件也可能在不同情境中发挥不同作用。该方法帮助判断一个机制解释是局部案例、可跨任务复用的计算模块，还是具有更广泛普适性的模型机制。
- node_id: solver-checkable-verification
  parent_id: circuit-discovery
  title: Solver-Checkable Circuit Verification
  status: active
  proposal_id: tp_20261010_techniques_v22_circuit_discovery_branch
  introduction:
    en: >-
      Ordinary circuit validation relies on ablation, patching, or behavioral tests over
      a finite collection of examples, so it establishes only what happened in the cases
      that were tested. Solver-Checkable Circuit Verification translates a circuit claim
      into formal constraints that an automated solver can prove or refute over an
      explicitly bounded input domain. Such claims may concern functional equivalence,
      edge necessity, invariance, or robustness to specified perturbations. A formal
      proof can provide a stronger guarantee than adding more test examples, but the
      guarantee applies only to the model, domain, and assumptions encoded in the
      constraints. If the verified object has been simplified, replaced, or recalibrated,
      the result is not automatically a proof about the original unmodified model.
    zh: >-
      一般的 circuit 验证依赖有限样本上的消融、patching 或行为测试，因此只能说明该 circuit 在已经测试的案例中有效。
      Solver-Checkable Circuit Verification 把 circuit 主张转化为形式约束，让自动求解器在明确限定的输入范围内证明或反驳某些性质，
      例如子图与目标计算是否等价、关键边是否必要，或输出是否对特定扰动保持不变。形式证明能够提供比增加测试样本更强的保证，
      但保证只适用于编码进约束的模型、输入域和假设；如果验证对象经过了简化、替换或重新校准，结论也不能直接视为对未经修改原模型的证明。
- node_id: steering-model-change
  parent_id: technique
  title: Steering and Model Change
  status: active
  proposal_id: tp_20261010_techniques_v23_steering_model_change
  introduction:
    en: >-
      Steering and Model Change covers methods whose primary purpose is to alter a
      model's behavior or internal computation deliberately. Researchers may modify
      intermediate activations or output logits during inference, change stored weights,
      or train and construct a model to implement a specified mechanism. The same
      operation may also appear under Causal Intervention: there it is used as an
      experiment to investigate how the original model works, whereas here it is judged
      by whether it produces reliable control. Evaluation must therefore consider not
      only whether the target behavior changes, but also whether the effect generalizes,
      preserves unrelated capabilities, remains stable, and is temporary or persistent.
      Successful control identifies an effective handle on behavior; it does not by
      itself establish that the manipulated object is the unique or complete mechanism.
    zh: >-
      Steering and Model Change 收录以主动改变模型行为或内部计算为主要目的的方法。研究者可以在推理时修改中间激活或输出 logits，
      也可以改变模型权重，或者通过训练和直接构造让模型实现预先指定的机制。同一种操作也可能出现在 Causal Intervention 中：
      作为因果实验时，它用于检验模型原本如何工作；作为 steering 时，重点则是能否稳定地产生预期行为。评价 steering 不能只看目标行为是否发生，
      还需要检查效果能否泛化、是否影响无关能力、控制是否稳定，以及改变是临时的还是持久的。控制成功说明找到了一个能够影响行为的操作入口，
      但不自动证明它对应唯一或完整的内部机制。
- node_id: inference-time-steering
  parent_id: steering-model-change
  title: Inference-Time Steering
  status: active
  proposal_id: tp_20261010_techniques_v23_steering_model_change
  introduction:
    en: >-
      Inference-Time Steering temporarily changes the computation while the model is
      processing an input or generating tokens, without saving the modification into the
      model's weights. The intervention may act on an intermediate activation or directly
      on output logits. It can usually be enabled, adjusted, or removed at runtime, which
      makes it useful for real-time control. The intervention must, however, be applied
      again on each run, and its effect may vary with the input, generation position, and
      control strength.
    zh: >-
      Inference-Time Steering 在模型处理输入或生成 token 的过程中临时改变计算状态，而不把修改保存进模型权重。
      干预可以发生在中间激活上，也可以直接发生在输出 logits 上。它通常能够随时启用、调整或撤销，适合实时控制；
      但每次推理都需要重新施加，效果也可能随输入、生成位置和控制强度变化。
- node_id: activation-space-intervention
  parent_id: inference-time-steering
  title: Activation-Space Intervention
  status: active
  proposal_id: tp_20261010_techniques_v23_steering_model_change
  introduction:
    en: >-
      Activation-Space Intervention intercepts an activation at a selected layer or
      position during a forward pass, modifies it, and returns the altered value to the
      model's later computation. The activation may be a residual-stream state, an
      attention-head or MLP output, an individual neuron's activation, or a feature
      learned by an SAE or a related method. The child methods respectively change the
      strength of existing activity, add a new direction, or remove the component of the
      state that lies in a chosen direction or subspace. Although the stored weights stay
      unchanged, repeatedly applying the intervention across tokens or layers can still
      alter generation substantially. Results depend on the intervention layer, token
      position, strength, and reference value, and researchers must check whether the
      operation also disrupts other information correlated with the target behavior.
    zh: >-
      Activation-Space Intervention 会在前向传播的某一层或位置截取模型产生的激活，对其进行修改，再把修改后的值交给后续层继续计算。
      这里的激活可以是 residual-stream state、attention head 或 MLP 输出、单个神经元的激活，也可以是 SAE 等方法得到的特征激活。
      下面的方法分别改变已有活动的强度、加入一个新的方向，或者移除状态在某个方向或子空间上的分量。模型权重虽然保持不变，
      但持续在多个 token 或层上施加干预仍可能显著改变生成行为。结果通常取决于干预层、token 位置、强度和使用的参考值，
      也需要检查是否同时扰乱了与目标行为相关联的其他信息。
- node_id: activation-scaling-suppression
  parent_id: activation-space-intervention
  title: Activation Scaling, Suppression, Replacement, and Runtime Gating
  status: active
  proposal_id: tp_20261010_techniques_v23_steering_model_change
  introduction:
    en: >-
      These methods directly control how much information an internal component
      contributes to the current computation. Researchers may multiply a neuron, head,
      or feature activation by a coefficient, attenuate or zero it, replace it with a
      reference activation, or use a runtime gate to decide whether its output enters
      later computation. Unlike Activation Vector Addition, these operations primarily
      adjust or replace activity that a component has already produced rather than add a
      new direction to the whole state. The same operations can serve as ablation tests;
      in this node, their purpose is to produce a desired behavior, such as suppressing
      an incorrect knowledge flow or strengthening a target one. Effects may vary across
      prompts, decoding positions, and control strengths, and a component that serves
      several functions can introduce unintended side effects.
    zh: >-
      这类方法直接控制一个内部组件在当前计算中贡献多少信息。研究者可以把某个神经元、attention head 或特征的激活乘以系数，
      将其压低或置零，用参考激活替换它，或者通过运行时 gate 决定其输出是否进入后续计算。它与 Activation Vector Addition 的区别在于，
      这里主要调节或替换组件已经产生的活动，而不是向整个状态加入一个新的方向。相同操作也可以用作消融实验；在本节点中，
      关注点是利用它产生预期行为，例如压制错误知识流或增强目标信息流。效果仍可能依赖 prompt、解码位置和门控强度，
      并可能因组件承担多种功能而产生副作用。
- node_id: activation-vector-addition
  parent_id: activation-space-intervention
  title: Activation Vector Addition and Representation Engineering
  status: active
  proposal_id: tp_20261010_techniques_v23_steering_model_change
  introduction:
    en: >-
      Activation Vector Addition first identifies a direction in activation space that
      is associated with a target attribute or capability. At selected layers and token
      positions, the method adds that vector to the current state with a chosen strength
      and lets the model's later computation process the shifted representation. A
      steering vector may come from the difference between mean activations for positive
      and negative examples, a direction learned by a probe, a function vector, a
      separately optimized direction, or an SAE decoder direction. Unlike Activation
      Scaling, this operation introduces a direction rather than merely changing the
      strength of an existing component; unlike Projection Erasure, it moves the state
      rather than removing the component already present along a direction. A strong
      behavioral effect shows that the direction can control the model, but does not
      establish that the target concept is represented only along that direction, since
      the vector may also contain correlated differences in the data.
    zh: >-
      这类方法先在激活空间中确定一个与目标属性或能力相关的方向，再在指定层和 token 位置把该向量按一定强度加入当前状态，
      让模型的后续计算处理这个经过移动的表示。Steering vector 可以来自正负样本的平均激活差、probe 学到的方向、function vector、
      专门优化得到的方向，或 SAE decoder direction。调整系数可以控制干预方向和强度。它与 Activation Scaling 的区别是加入一个方向，
      而不是只调节现有组件；与 Projection Erasure 的区别是主动移动状态，而不是移除状态原有的某个分量。明显的行为变化说明该方向可以控制模型，
      但不能单独证明目标概念只沿这一方向表示，因为向量也可能携带数据中的相关差异。
- node_id: projection-erasure
  parent_id: activation-space-intervention
  title: Projection Erasure and Direction Removal
  status: active
  proposal_id: tp_20261010_techniques_v23_steering_model_change
  introduction:
    en: >-
      Projection Erasure first measures how much of the current activation lies in a
      target direction or subspace, then subtracts that component so that later layers
      receive only the remaining orthogonal part. This differs from simply adding a
      reverse steering vector. Projection Erasure determines how much to remove from each
      input according to the target component already present, so different inputs may
      receive changes of different sizes; a fixed steering vector instead adds or
      subtracts the same vector at a predetermined strength for every input. If removing
      the direction weakens the target behavior, the information carried along it has a
      functional role. The direction may also contain other related information, however,
      so unrelated behaviors and overall capability must be checked for damage. This node
      covers projection from runtime activations; permanently removing a direction by
      changing weights belongs under Parameter-Space Editing.
    zh: >-
      Projection Erasure 先测量当前激活在某个目标方向或子空间上包含多少分量，再从激活中减去这部分信息，使后续层只能接收到剩余的正交分量。
      与简单加入一个反向 steering vector 不同，Projection Erasure 根据每个输入当前包含的目标分量决定减去多少，因此不同输入受到的改动可能不同；
      固定的 steering vector 则只是按预先设定的强度，对所有输入加入或减去同一个向量。若移除该方向后目标行为减弱，说明沿该方向传递的信息对行为具有功能作用。
      但目标方向可能同时包含其他相关信息，因此还需要检查无关行为和整体能力是否受到影响。本节点只描述推理时对激活进行投影移除；
      如果通过修改权重永久消除某个方向，则属于 Parameter-Space Editing。
- node_id: logit-steering
  parent_id: inference-time-steering
  title: Logit-Space Steering
  status: active
  proposal_id: tp_20261010_techniques_v23_steering_model_change
  introduction:
    en: >-
      Logit-Space Steering modifies vocabulary logits before softmax and token sampling.
      It may add a bias to desired tokens, suppress tokens that should not be generated,
      or combine output scores from contrasting model runs. The modification immediately
      changes the distribution of the next token, which then enters the context and can
      redirect the rest of the autoregressive generation. Because it need not locate the
      internal components that produced the behavior, logit steering often provides
      direct and transparent control. For the same reason, it offers little evidence
      about the model's internal mechanism and may mask rather than repair the computation
      that originally produced the logits.
    zh: >-
      Logit-Space Steering 在 softmax 和 token 采样之前直接修改词表中各 token 的 logits，例如为目标 token 加入偏置、
      压低不希望生成的 token，或组合不同运行得到的输出分数。修改后的 logits 会立即改变下一 token 的概率，而这个 token 又会进入后续上下文，
      因此局部调整可能逐步改变整段生成。它不需要找到模型内部产生该行为的组件，控制效果通常也比较直接；相应地，
      它只能提供很有限的内部机制证据，并可能通过改变输出分布掩盖而不是修复原有计算过程。
- node_id: persistent-model-modification
  parent_id: steering-model-change
  title: Persistent Model Modification
  status: active
  proposal_id: tp_20261010_techniques_v23_steering_model_change
  introduction:
    en: >-
      Persistent Model Modification changes or retrains stored parameters so that the new
      behavior remains after the modified model is saved and used on later inputs. Unlike
      inference-time steering, it does not require the control signal to be injected on
      every run, but its effects are also harder to contain. The child methods include
      arithmetic on existing weight differences, localized optimization for a specified
      target, and training or installing a mechanism whose structure is chosen in
      advance. Evaluation must examine the target effect, generalization to paraphrases
      and new inputs, and changes to unrelated knowledge and capabilities.
    zh: >-
      Persistent Model Modification 直接改变或重新训练模型的参数，使新的行为在修改被保存后继续作用于后续输入。
      与推理时 steering 不同，它不需要每次运行都重新注入控制信号，但影响范围也更难限制。下面的方法包括对已有权重差分进行代数运算、
      针对特定目标优化局部参数，以及训练或安装预先设计的机制。评估需要同时检查目标效果、对改写和新输入的泛化，
      以及对无关知识和能力的影响。
- node_id: parameter-space-editing
  parent_id: persistent-model-modification
  title: Parameter-Space Editing
  status: active
  proposal_id: tp_20261010_techniques_v23_steering_model_change
  introduction:
    en: >-
      Parameter-Space Editing produces a persistent behavioral change by modifying the
      model's stored weights. This branch contains two main routes. Task-vector methods
      treat the difference between whole models as a reusable direction, whereas targeted
      editing optimizes a localized update under a target objective and preservation
      constraints. Both can alter behavior through a comparatively small change, but the
      same weights are reused across many inputs and computational paths, so a localized
      parameter update does not guarantee a localized behavioral effect.
    zh: >-
      Parameter-Space Editing 通过修改模型保存的权重产生持久变化。本分支包含两条主要路线：Task Vector 方法把两个模型之间的整体权重差当作可复用的方向；
      Targeted Editing 则根据目标行为和保留要求，优化一个受限制的局部更新。两者都可能用较小改动改变模型行为，
      但权重会在大量输入和计算路径中被重复使用，因此局部参数变化并不保证只产生局部行为影响。
- node_id: task-vector-arithmetic
  parent_id: parameter-space-editing
  title: Parameter-Space Task Vectors and Task Arithmetic
  status: active
  proposal_id: tp_20261010_techniques_v23_steering_model_change
  introduction:
    en: >-
      A task vector is usually obtained by subtracting a pretrained model's weights from
      the weights of the same model after task-specific fine-tuning. Researchers can add
      a scaled version of this difference back to a base model to strengthen the
      capability, negate it to suppress the capability, or combine several task vectors
      to merge behaviors. These operations require compatible architectures and
      parameter correspondence. A fine-tuning difference may contain changes caused by
      the dataset, optimizer, and randomness in addition to the intended task, and
      several vectors may interfere with one another. Successful arithmetic therefore
      does not establish that the capability is implemented by one unique and independent
      direction in weight space.
    zh: >-
      Task Vector 通常由任务微调模型的权重减去同一预训练模型的权重得到。研究者可以把这一差分按系数加回基础模型以增强相应能力，
      取反以压制它，或组合多个 task vectors 以合并不同能力。这种运算要求模型具有兼容的架构和参数对应关系。
      微调产生的权重差不一定只包含目标任务，也可能混入训练数据、优化过程和随机性带来的变化；多个向量还可能相互干扰。
      因此，行为可以通过向量运算转移，并不意味着能力由一个唯一、独立的权重方向实现。
- node_id: targeted-parameter-editing
  parent_id: parameter-space-editing
  title: Targeted Parameter Editing and Local Fine-Tuning
  status: active
  proposal_id: tp_20261010_techniques_v23_steering_model_change
  introduction:
    en: >-
      Targeted Parameter Editing first specifies a fact, association, or behavior to
      change, then restricts the update to selected layers, modules, neurons, or a
      low-rank parameter subspace. Methods such as ROME apply a rank-one update to
      particular MLP weights, while local fine-tuning allows only a selected parameter
      subset to receive gradients. The objective typically combines a target change with
      a requirement to preserve other model outputs. A convincing edit should work on
      paraphrases, related contexts, and downstream reasoning while leaving unrelated
      knowledge and capabilities intact. The best place to perform an edit need not be
      the only place where the original model stored the knowledge, so editing success
      does not by itself validate a localization claim.
    zh: >-
      Targeted Parameter Editing 先定义希望改变的事实、关联或行为，再把参数更新限制在选定的层、模块、神经元或低秩子空间中。
      ROME 等方法对特定 MLP 权重施加 rank-one 更新；局部微调则只允许被选中的参数接收梯度。优化目标通常同时包含改变目标行为和保留原模型其他输出两部分。
      有说服力的编辑不仅要在一个测试 prompt 上生效，还应适用于改写、相关语境和后续推理，并保持无关知识与能力。
      适合执行编辑的位置不一定就是原模型唯一存储该知识的位置，因此编辑成功也不能单独证明定位结论。
- node_id: mechanism-induction-construction
  parent_id: persistent-model-modification
  title: Mechanism Induction and Circuit Construction
  status: active
  proposal_id: tp_20261010_techniques_v23_steering_model_change
  introduction:
    en: >-
      This branch does not search an existing model for a naturally learned mechanism.
      Instead, it makes a model implement a causal structure or algorithm proposed in
      advance. Mechanism induction may add counterfactual training constraints—for
      example, Interchange Intervention Training teaches a neural network to reproduce a
      high-level causal model when aligned internal variables are exchanged. Circuit
      construction may directly design or install weights and computational paths that
      implement a known algorithm, such as a cryptographic computation inside a
      Transformer. Because the intended mechanism is known beforehand, researchers can
      test the model directly against behavioral and causal specifications. The result
      shows that such a mechanism can be trained or constructed, not that an unconstrained
      model would learn it naturally. Alternative bypass paths, robustness to distribution
      shift, and stability under further training still require evaluation.
    zh: >-
      这一分支不是在已有模型中寻找自然形成的机制，而是让模型按照预先提出的因果结构或算法工作。Mechanism Induction 可以在训练中加入反事实约束，
      例如使用 Interchange Intervention Training，使神经网络在交换内部变量时复现高层因果模型的行为；Circuit Construction 则可以直接设计或安装实现某个算法的权重和计算路径，
      例如构造执行特定密码学过程的 Transformer circuit。由于目标机制事先已知，研究者可以直接检查模型是否满足相应的行为和因果规范。
      不过，这类结果说明的是一个机制可以被训练或构造出来，不代表未经约束训练的模型会自然形成相同机制；还需检查是否存在绕过目标 circuit 的其他路径，
      以及机制在分布变化和进一步训练后是否保持稳定。
- node_id: formal-temporal-analysis
  parent_id: technique
  title: Formal and Temporal Mechanism Analysis
  status: active
  proposal_id: tp_20261010_techniques_v25_formal_temporal_intros
  introduction:
    en: >-
      Formal and Temporal Mechanism Analysis studies how features, circuits, and other
      computational structures form, change, and stabilize during training, and why
      particular training conditions produce them. A snapshot of a trained model shows
      how it computes now, but not when that computation emerged, how it changed along the
      way, or whether optimization could have selected a different solution. Researchers
      can isolate a phenomenon in a controlled toy model, compare internal structure
      across checkpoints, derive its evolution from training equations, or characterize
      the stable solutions permitted by an objective. Neural Feature-Learning Analysis
      asks how training selects and amplifies features, while Optimization-Landscape
      Analysis examines why learned explanatory features admit alternative solutions or
      recurring pathologies. Together, these approaches trace mechanism formation through
      empirical trajectories and mathematical theory, subject to the simplifying models,
      training settings, data distributions, and optimization assumptions they use.
    zh: >-
      Formal and Temporal Mechanism Analysis 研究模型内部的特征、circuit 和其他计算结构怎样在训练中形成、变化并逐渐稳定，
      以及训练条件为什么会产生这些结构。训练完成后的静态快照只能显示模型现在怎样计算，却难以说明这种计算方式何时出现、经历过哪些变化，或者是否还存在其他同样可行的解。
      研究者可以构造受控的 Toy Model 来隔离目标现象，比较不同 checkpoint 中的内部结构，从训练方程推导机制的演化过程，或分析优化目标允许形成哪些稳定解。
      Neural Feature-Learning Analysis 进一步研究训练依据什么原则选择和强化特征，而 Optimization-Landscape Analysis 则考察学习得到的解释性特征为何会出现不同解或系统性缺陷。
      这些方法从经验轨迹和数学理论两个角度追溯机制的形成过程，但结论仍会受到模型简化、训练设置、数据分布和优化假设的限制。
- node_id: toy-model-construction
  parent_id: formal-temporal-analysis
  title: Controlled Toy-Model Construction
  status: active
  proposal_id: tp_20261010_techniques_v25_formal_temporal_intros
  introduction:
    en: >-
      A Controlled Toy Model deliberately simplifies the data distribution, task,
      architecture, or training objective so that a phenomenon such as superposition,
      polysemanticity, grokking, or circuit formation can be observed in full.
      Researchers can inspect every relevant weight and activation, vary capacity,
      sparsity, or data structure, repeat training across random seeds, and sometimes
      derive the optimal representation or learned algorithm analytically. This differs
      from Mechanism Induction and Circuit Construction: that family requires a model to
      implement a mechanism specified in advance, whereas a toy model usually creates an
      analyzable environment and lets training select the solution. Toy models can reveal
      conditions under which a mechanism may form and suggest why, but their conclusions
      must still be tested in larger models, natural data, and more complex tasks.
    zh: >-
      Controlled Toy Model 有意简化数据分布、任务、模型架构或训练目标，使 superposition、polysemanticity、grokking 或 circuit formation 等现象能够被完整观察。
      研究者可以检查所有相关权重和激活，改变容量、稀疏度或数据结构，在不同随机种子下重复训练，有时还能解析推导模型的最优表示或学习到的算法。
      它与 Mechanism Induction and Circuit Construction 不同：后者要求模型实现一个事先指定的机制，而 Toy Model 通常只是创造一个可以分析的环境，让模型通过训练自行选择解决方案。
      Toy Model 可以揭示某种机制可能形成的条件和原因，但仍需进一步验证这些结论能否推广到更大模型、自然数据和复杂任务。
- node_id: checkpoint-trajectory-analysis
  parent_id: formal-temporal-analysis
  title: Checkpoint and Training-Trajectory Analysis
  status: active
  proposal_id: tp_20261010_techniques_v25_formal_temporal_intros
  introduction:
    en: >-
      Checkpoint and Training-Trajectory Analysis saves a model at different stages of
      training and repeats the same representation measurements, probes, circuit
      analyses, or causal experiments at each checkpoint. This reveals when a capability
      appears, whether its associated features or circuits emerge gradually or reorganize
      abruptly, and whether the model changes its internal solution while preserving
      similar behavior. Matching components by index alone can be misleading because a
      function may migrate, split, or be recombined during training; cross-checkpoint
      comparisons may instead require alignment by function, activation pattern, or
      representational similarity. An internal change that precedes a behavioral change
      narrows the set of plausible mechanism hypotheses, but does not by itself show that
      the former caused the latter. Random seeds, data order, and training hyperparameters
      can also alter the observed trajectory.
    zh: >-
      Checkpoint and Training-Trajectory Analysis 保存训练不同阶段的模型，并在各个 checkpoint 上重复相同的表征测量、probe、circuit analysis 或因果实验。
      这样可以观察某种能力何时出现，相关特征或 circuit 是逐渐形成还是突然重组，以及模型在行为表现相近时是否更换了内部解决方案。
      比较时不能只追踪编号相同的神经元或 attention head，因为组件的功能可能在训练中迁移、分裂或重新组合；必要时需要根据功能、激活模式或表示相似性进行跨 checkpoint 对齐。
      内部变化先于行为变化可以缩小机制假设的范围，但不能单独证明前者造成了后者；随机种子、数据顺序和训练超参数也可能改变观察到的轨迹。
- node_id: analytic-training-dynamics
  parent_id: formal-temporal-analysis
  title: Analytic Optimization and Training Dynamics
  status: active
  proposal_id: tp_20261010_techniques_v25_formal_temporal_intros
  introduction:
    en: >-
      Analytic Optimization and Training Dynamics writes down parameter-update equations
      for simplified models, data distributions, and optimization rules, then derives how
      features or circuits evolve during training. Researchers can ask which solutions
      appear first, which eventually become stable, when a phase transition occurs, and
      how data scale, initialization, learning rate, or regularization changes the
      process. Such analyses can explain, for example, why a solution that memorizes the
      training data emerges before a better-generalizing solution later becomes dominant.
      The distinction from Checkpoint Analysis is that checkpoints record what happened,
      whereas analytic dynamics aims to explain why it happened and predict the effects
      of changing the training conditions. Its conclusions require empirical validation
      and apply only within the simplified assumptions used in the derivation.
    zh: >-
      Analytic Optimization and Training Dynamics 为经过简化的模型、数据分布和优化规则写出参数更新方程，并从这些方程推导特征或 circuit 随训练变化的轨迹。
      研究者可能分析哪些解首先出现、哪些解最终稳定、何时发生相变，以及数据规模、初始化、学习率和正则化如何改变这些过程。
      例如，这类分析可以解释为什么记忆训练样本的解先形成，而具有更好泛化能力的解在更晚阶段占据主导。
      它与 Checkpoint Analysis 的区别在于：Checkpoint Analysis 记录实际发生了什么，这里则试图从训练方程解释为什么发生，并预测改变训练条件后会出现什么结果。
      推导能够提供比经验曲线更明确的机制解释，但其结论只在采用的模型和简化假设范围内成立，仍需通过实际训练实验检验。
- node_id: neural-feature-learning-analysis
  parent_id: formal-temporal-analysis
  title: Neural Feature-Learning Analysis
  status: active
  proposal_id: tp_20261010_techniques_v25_formal_temporal_intros
  introduction:
    en: >-
      Neural Feature-Learning Analysis asks why training causes the original model to
      emphasize particular input directions or data patterns. Here, a feature is mainly a
      direction that can affect prediction and acquires a distinguished role in the
      geometry of the weights or model function; it need not correspond directly to a
      concept that can be named in natural language. By comparing weights, input
      gradients, kernels, and training parameterizations, researchers determine whether a
      model merely adjusts its outputs over nearly fixed features or continually reshapes
      its representation during training. This differs from Feature Dictionary Learning,
      which fits a separate feature decomposition to activations after the target model
      has been trained. The child nodes study weight–gradient alignment, feature learning
      versus fixed-kernel behavior at infinite width, and the corresponding theory for
      convolutional networks.
    zh: >-
      Neural Feature-Learning Analysis 研究训练为什么会让原模型强调某些输入方向或数据模式。
      这里的“特征”主要指能够影响预测，并在权重或模型函数的几何结构中获得特殊地位的方向，不一定直接对应可以用自然语言命名的概念。
      研究者通过比较权重、输入梯度、kernel 和不同训练参数化，判断模型是在一组近似固定的特征上调整输出，还是会在训练中不断重塑用于表示数据的方向。
      它与 Feature Dictionary Learning 不同：字典学习是在模型训练完成后，另外学习一套特征来分解已有激活；这里分析的是原网络自身如何在训练中形成特征。
      下面的子节点分别研究梯度外积与权重几何的对应、无限宽和 kernel 极限下是否发生特征学习，以及这些思想在卷积网络中的形式。
- node_id: nfm-agop-egop
  parent_id: neural-feature-learning-analysis
  title: NFM–AGOP/EGOP Alignment and Recursive Feature Machines
  status: active
  proposal_id: tp_20261010_techniques_v25_formal_temporal_intros
  introduction:
    en: >-
      For a trained predictor, researchers can differentiate the output with respect to
      the input or a layer's input. A single gradient indicates which small changes most
      readily affect the current prediction. Taking its outer product and averaging over
      a finite dataset gives an AGOP; taking the expectation over a data distribution
      gives an EGOP. Their stronger directions summarize sensitivities that persist across
      many examples. The Neural Feature Ansatz tests whether this gradient geometry aligns
      with the weight geometry formed by training, motivating the hypothesis that training
      amplifies directions important to prediction. This alignment must be established
      theoretically or empirically; it is not an automatic identity and correlation alone
      does not prove a unique learning mechanism. Recursive Feature Machines turn the
      relationship into an algorithm by using the current predictor's AGOP to update a
      kernel's feature metric, refitting the predictor, and iterating so that an initially
      fixed-kernel model can learn task-relevant features.
    zh: >-
      对于一个已经训练的预测函数，研究者可以计算模型输出相对于输入或某层输入的梯度。
      一个样本上的梯度表示，沿哪些输入方向做小幅改变最容易影响当前预测；将梯度与自身做外积，再在有限数据集上取平均得到 AGOP，在数据分布上取期望则得到 EGOP。
      矩阵中较强的方向因此概括了模型在许多样本上持续敏感的输入方向。Neural Feature Ansatz 检查这种梯度几何是否与网络训练后形成的权重几何对齐，并据此提出一种特征学习解释：训练会在权重中强化对预测重要的方向。
      这种对齐是一项需要通过理论和实验检验的假设，并不意味着权重几何与梯度外积天然相同，也不能单靠相关性证明唯一的训练机制。
      Recursive Feature Machine 进一步把这一关系转化为学习算法：用当前预测器的 AGOP 更新 kernel 中衡量样本距离的特征度量，再重新拟合预测器并反复迭代，使原本使用固定相似度的 kernel model 也能逐步学习与任务有关的特征。
- node_id: kernel-ntk-feature-regimes
  parent_id: neural-feature-learning-analysis
  title: Kernel and NTK Feature Regimes
  status: active
  proposal_id: tp_20261010_techniques_v25_formal_temporal_intros
  introduction:
    en: >-
      Infinite-width analysis studies the limit in which network width grows without
      bound, making aspects of neural-network training mathematically tractable. Under
      standard Neural Tangent Kernel conditions, the network usually remains close to its
      initialization: training changes the prediction while the hidden representation and
      the kernel that defines sample similarity barely move. This is often called lazy
      training. Other parameterizations, such as Maximal Update Parameterization, permit
      order-one changes to hidden representations even at infinite width and therefore
      retain genuine feature learning. Kernel and NTK Feature Regime Analysis identifies
      which choices of initialization, learning rate, and width scaling produce fixed
      features and which allow the task to reshape the representation. It clarifies when
      a fixed-kernel account is adequate and when feature formation must be modeled, while
      recognizing that an infinite-width limit need not directly describe a finite network
      trained for a finite time.
    zh: >-
      无限宽分析通过研究网络宽度不断增加时的极限，简化对神经网络训练的数学描述。
      在标准 Neural Tangent Kernel（NTK）条件下，网络通常停留在初始化附近：训练可以改变最终预测，但隐藏表示和决定样本相似度的 kernel 几乎保持不变，这种情况常被称为 lazy training。
      其他参数化方式，例如 Maximal Update Parameterization，可以让隐藏表示在无限宽极限下仍发生常数量级的变化，从而保留真正的 feature learning。
      Kernel and NTK Feature Regime Analysis 研究哪些初始化、学习率和宽度缩放方式会产生固定特征，哪些设置允许任务重新塑造表示。
      它帮助判断模型的训练行为是否可以由固定 kernel 解释，还是必须考虑特征本身的形成和演化；不过，无限宽极限中的结论不一定能够直接描述有限宽、有限训练时间的实际网络。
- node_id: convolutional-nfm
  parent_id: neural-feature-learning-analysis
  title: Convolutional NFM and Network-as-Filter Analysis
  status: active
  proposal_id: tp_20261010_techniques_v25_formal_temporal_intros
  introduction:
    en: >-
      A convolutional network applies the same filters at different spatial locations, so
      its feature learning can be studied through local image patches. The Convolutional
      Neural Feature Ansatz computes outer products of output gradients with respect to
      these patches and compares their average geometry with the covariance of the filters
      formed by training, testing whether the network amplifies local directions important
      to the task. Convolutional Recursive Feature Machines turn the relationship into an
      algorithm by alternating convolutional-kernel regression with AGOP-based patch
      transformations; deeper variants can learn transformations at successive scales.
      This analysis explains which local variations the filter population emphasizes. It
      does not directly assign a semantic label to each filter or show how the filters
      compose into a complete computational circuit.
    zh: >-
      卷积网络在不同空间位置重复使用同一组滤波器，因此其特征学习需要在局部图像 patch 上分析。
      Convolutional Neural Feature Ansatz 计算模型输出相对于这些局部 patch 的梯度外积，并比较其平均几何与卷积层训练后形成的滤波器协方差，检验网络是否强化了对任务预测重要的局部方向。
      Convolutional Recursive Feature Machine 则把这种关系转化为算法：在卷积 kernel 回归与基于 AGOP 的 patch 变换之间反复迭代，使 kernel 逐渐适应数据中的局部结构；深层版本还可以逐层学习不同尺度的变换。
      该方法解释的是卷积滤波器整体偏向哪些局部变化，而不是直接为单个滤波器贴上语义标签，也不会自动说明这些滤波器怎样组合成完整的计算 circuit。
- node_id: optimization-landscape-analysis
  parent_id: formal-temporal-analysis
  title: Optimization-Landscape Analysis
  status: active
  proposal_id: tp_20261010_techniques_v25_formal_temporal_intros
  introduction:
    en: >-
      The explanatory features produced by an SAE, Transcoder, or Crosscoder are
      themselves formed by optimization. Optimization-Landscape Analysis asks which
      solutions reconstruction and sparsity objectives permit, whether different
      solutions are equivalent, whether the decomposition is identifiable from the data,
      and whether the landscape contains spurious local minima or unstable solutions.
      Analyses of Sparse Dictionary Learning show that dead features, feature absorption,
      duplicate features, or polysemantic features may be genuine optima or local minima
      of the standard objective rather than mere implementation failures. Researchers can
      characterize the biconvex structure within a fixed activation pattern or add
      constraints such as feature anchoring to reduce equivalent and spurious solutions.
      The goal is to distinguish an optimizer that failed to find a suitable solution
      from an objective that cannot uniquely specify the desired explanation. Theoretical
      conclusions remain conditional on assumptions about sparsity, linear generative
      structure, and the data distribution.
    zh: >-
      通过 SAE、Transcoder 或 Crosscoder 得到的解释性特征，本身也是优化过程形成的结果。
      Optimization-Landscape Analysis 研究重构与稀疏目标允许产生哪些解、不同解之间是否等价、目标分解能否由数据唯一确定，以及训练中是否存在伪局部极小值或不稳定解。
      对 Sparse Dictionary Learning 的分析表明，即使优化器成功降低了 loss，所得字典仍可能出现 dead features、feature absorption、重复特征或 polysemantic features；这些现象有时是目标函数允许的真正最优解或局部极小值，而不只是代码或训练失败。
      研究者可以进一步分析固定激活模式下的双凸结构，或通过 feature anchoring 等约束减少等价解和伪解。
      该方向帮助区分两个问题：优化器没有找到合适的解，还是目标函数本身就无法唯一确定所期待的解释。相关结论仍依赖稀疏性、线性生成过程和数据分布等理论假设。
- node_id: evaluation-protocols
  parent_id: technique
  title: Evaluation and Falsification Protocols
  status: active
  proposal_id: tp_20261009_techniques_v2_reader_intros
  introduction:
    en: >-
      An explanation can look persuasive while depending on an arbitrary baseline,
      leaking information through a probe, or failing to predict what happens under
      intervention. Evaluation and falsification protocols are designed to expose these
      failures. They do not usually discover a mechanism themselves; instead, they ask
      whether another interpretability method is sensitive to the trained model, faithful
      to behavior, robust to reasonable choices, and useful compared with alternatives.
    zh: >-
      一个解释可能看起来很有说服力，却依赖任意基线、被 probe 的信息泄漏误导，或无法预测真实干预的结果。
      Evaluation and Falsification Protocols 就是为了暴露这些失败。
      它们通常不直接发现机制，而是检验其他方法是否真正依赖训练后的模型、是否忠实于行为、
      是否对合理选择保持稳健，以及相较替代方案是否有用。
- node_id: randomized-sanity-controls
  parent_id: evaluation-protocols
  title: Randomization and Sanity Controls
  status: active
  proposal_id: tp_20261009_techniques_v2_reader_intros
  introduction:
    en: >-
      A basic sanity check asks whether an explanation changes when the structure it is
      supposed to explain is destroyed. Researchers randomize model layers, labels, or
      other learned dependencies and rerun the explanation method. If nearly the same
      saliency map or ranking survives, the method may be responding to the input or its
      own design rather than to what the trained network learned.
    zh: >-
      一个最基本的 sanity check 是：当被解释的学习结构遭到破坏时，解释是否随之改变。
      研究者会随机化模型层、标签或其他学习依赖，再重新运行解释方法。
      如果几乎相同的 saliency map 或排序仍然存在，方法可能主要响应输入或自身设计，而不是训练网络真正学到的内容。
- node_id: probe-controls
  parent_id: evaluation-protocols
  title: Probe Controls and Detectability Analysis
  status: active
  proposal_id: tp_20261009_techniques_v2_reader_intros
  introduction:
    en: >-
      Probe evaluation must guard against two opposite mistakes: a powerful probe may
      manufacture a pattern from weak signals, while a poorly chosen probe may miss
      information that is genuinely present. Control tasks, matched-capacity baselines,
      description-length measures, and detectability analyses help separate these cases.
      The goal is to learn what the representation supports, not merely how accurate one
      particular classifier happened to be.
    zh: >-
      Probe 评估要防止两种相反错误：容量过强的 probe 可能从微弱信号中“制造”模式，选择不当的 probe 又可能漏掉真实存在的信息。
      控制任务、容量匹配基线、描述长度和 detectability analysis 用来区分这些情况。
      目标是理解表征究竟支持什么，而不只是报告某个分类器恰好取得了多高准确率。
- node_id: intervention-faithfulness
  parent_id: evaluation-protocols
  title: Intervention Faithfulness and Robustness Tests
  status: active
  proposal_id: tp_20261009_techniques_v2_reader_intros
  introduction:
    en: >-
      Intervention-based explanations contain many choices: what value replaces an
      activation, how the input is corrupted, which behavior is scored, and where a
      circuit is thresholded. Robustness testing repeats the analysis across plausible
      choices and checks whether the selected mechanism continues to predict exact
      interventions and held-out behavior. A conclusion that disappears under a small
      methodological change is not yet a stable mechanistic finding.
    zh: >-
      干预式解释包含许多选择：用什么值替换激活、怎样污染输入、用哪个行为指标评分，以及在何处截断 circuit。
      Robustness Test 会在多种合理选择下重复分析，并检查所得机制能否继续预测精确干预和留出行为。
      若结论随着很小的方法变化就消失，它还不能算稳定的机制发现。
- node_id: dictionary-quality-metrics
  parent_id: evaluation-protocols
  title: Dictionary Quality and Monosemanticity Metrics
  status: active
  proposal_id: tp_20261009_techniques_v2_reader_intros
  introduction:
    en: >-
      A feature dictionary can reconstruct activations well while producing features
      that are redundant, fragmented, or behaviorally irrelevant. Dictionary evaluation
      therefore examines several dimensions: sparsity, reconstruction, downstream
      fidelity, semantic coherence, feature splitting, absorption, and usefulness for
      intervention. These goals can conflict, so there is no single number that certifies
      a dictionary as “interpretable.”
    zh: >-
      一本特征字典即使重构激活很好，也可能产生冗余、碎片化或与行为无关的特征。
      因此字典评估会同时考察稀疏性、重构、下游忠实度、语义一致性、feature splitting、absorption 和干预用途。
      这些目标之间可能冲突，所以不存在一个数字可以单独认证字典“具有可解释性”。
- node_id: benchmark-comparison
  parent_id: evaluation-protocols
  title: Controlled Benchmarking and Method Comparison
  status: active
  proposal_id: tp_20261009_techniques_v2_reader_intros
  introduction:
    en: >-
      A benchmark places competing methods under the same tasks, datasets, metrics, and
      computational constraints. This reveals trade-offs that isolated case studies can
      hide—for example, a method may localize well but steer poorly, or produce readable
      features at the cost of faithfulness. Good benchmarking does more than rank methods:
      it clarifies which scientific question and operating regime each method is suited for.
    zh: >-
      Benchmark 把竞争方法放到相同任务、数据集、指标和计算约束下比较。
      它能揭示孤立案例容易隐藏的权衡，例如某方法定位准确却不善于 steering，或特征容易阅读但功能忠实度较差。
      好的 benchmark 不只是排出名次，还应说明每种方法适合回答什么科学问题、适合在哪种工作区间使用。
