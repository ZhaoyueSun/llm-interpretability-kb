  en: 'Sparse autoencoders (SAEs) are a popular method for interpreting concepts represented
    in large language model (LLM) activations. However, there is a lack of evidence
    regarding the validity of their interpretations due to the lack of a ground truth
    for the concepts used by an LLM, and a growing number of works have presented
    problems with current SAEs. One alternative source of evidence would be demonstrating
    that SAEs improve performance on downstream tasks beyond existing baselines. We
    test this by applying SAEs to the real-world task of LLM activation probing in
    four regimes: data scarcity, class imbalance, label noise, and covariate shift.
    Due to the difficulty of detecting concepts in these challenging settings, we
    hypothesize that SAEs'' basis of interpretable, concept-level latents should provide
    a useful inductive bias. However, although SAEs occasionally perform better than
    baselines on individual datasets, we are unable to design ensemble methods combining
    SAEs with baselines that consistently outperform ensemble methods solely using
    baselines. Additionally, although SAEs initially appear promising for identifying
    spurious correlations, detecting poor dataset quality, and training multi-token
    probes, we are able to achieve similar results with simple non-SAE baselines as
    well. Though we cannot discount SAEs'' utility on other tasks, our findings highlight
    the shortcomings of current SAEs and the need to rigorously evaluate interpretability
    methods on downstream tasks with strong baselines.'
  zh: >-
    稀疏自编码器（SAE）是一种常用于解释大语言模型（LLM）激活所表征概念的方法。然而，由于语言模型使用的概念不存在真值，而且越来越多研究指出当前 SAE 存在问题，其解释的有效性仍缺乏证据。另一种证据来源，是证明 SAE 能在下游任务上超越现有基线。我们通过把 SAE 应用于真实的语言模型激活探测任务来检验这一点，覆盖四种设置：数据稀缺、类别不平衡、标签噪声和协变量偏移。由于在这些具有挑战性的设置中很难检测概念，我们假设，SAE 由可解释的概念级潜变量构成的基底应当提供有益的归纳偏置。然而，尽管 SAE 偶尔会在个别数据集上优于基线，我们无法设计出一种结合 SAE 和基线的集成方法，使其持续优于只使用基线的集成方法。此外，虽然 SAE 起初似乎有望用于识别虚假相关、检测低质量数据集和训练多 token 探针，但简单的非 SAE 基线也能取得相似结果。尽管我们不能排除 SAE 在其他任务上的价值，研究结果仍凸显了当前 SAE 的不足，以及使用强基线在下游任务上严格评估可解释性方法的必要性。
