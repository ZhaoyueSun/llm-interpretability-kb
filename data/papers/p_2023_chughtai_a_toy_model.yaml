abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2302.03025
  en: 'Universality is a key hypothesis in mechanistic interpretability -- that different
    models learn similar features and circuits when trained on similar tasks. In this
    work, we study the universality hypothesis by examining how small neural networks
    learn to implement group composition. We present a novel algorithm by which neural
    networks may implement composition for any finite group via mathematical representation
    theory. We then show that networks consistently learn this algorithm by reverse
    engineering model logits and weights, and confirm our understanding using ablations.
    By studying networks of differing architectures trained on various groups, we
    find mixed evidence for universality: using our algorithm, we can completely characterize
    the family of circuits and features that networks learn on this task, but for
    a given network the precise circuits learned -- as well as the order they develop
    -- are arbitrary.'
  zh: >-
    普适性是机制可解释性中的一个关键假设：不同模型在相似任务上训练时，会学到相似的特征和回路。本文通过研究小型神经网络如何学习实现群复合运算，考察这一普适性假设。我们基于数学表示论，提出一种神经网络可以用于实现任意有限群复合运算的新算法。随后，我们通过逆向分析模型的
    logit 和权重，证明网络会稳定地学到这一算法，并通过消融实验确认我们的理解。通过研究在不同群上训练、架构各异的网络，我们发现支持普适性的证据并不一致：借助所提出的算法，我们可以完整刻画网络在该任务上学到的回路和特征家族；但对于某个具体网络，其实际学到的精确回路以及这些回路的形成顺序具有任意性。
