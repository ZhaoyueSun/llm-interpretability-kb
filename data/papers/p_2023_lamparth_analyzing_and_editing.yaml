  en: 'Poisoning of data sets is a potential security threat to large language models
    that can lead to backdoored models. A description of the internal mechanisms of
    backdoored language models and how they process trigger inputs, e.g., when switching
    to toxic language, has yet to be found. In this work, we study the internal representations
    of transformer-based backdoored language models and determine early-layer MLP
    modules as most important for the backdoor mechanism in combination with the initial
    embedding projection. We use this knowledge to remove, insert, and modify backdoor
    mechanisms with engineered replacements that reduce the MLP module outputs to
    essentials for the backdoor mechanism. To this end, we introduce PCP ablation,
    where we replace transformer modules with low-rank matrices based on the principal
    components of their activations. We demonstrate our results on backdoored toy,
    backdoored large, and non-backdoored open-source models. We show that we can improve
    the backdoor robustness of large language models by locally constraining individual
    modules during fine-tuning on potentially poisonous data sets. Trigger warning:
    Offensive language.'
  zh: >-
    数据集投毒是大语言模型面临的一种潜在安全威胁，可能产生带后门的模型。对于后门语言模型的内部机制，以及它们如何处理触发输入（例如切换为有毒语言），目前尚缺乏清晰描述。在这项工作中，我们研究基于 Transformer 的后门语言模型的内部表征，并发现早期层的 MLP 模块与初始嵌入投影共同构成后门机制中最重要的部分。我们利用这一认识，通过人工设计的替代模块移除、插入和修改后门机制；这些替代模块将 MLP 模块的输出压缩为后门机制所需的核心成分。为此，我们提出 PCP 消融：根据模块激活的主成分，用低秩矩阵替换 Transformer 模块。我们在带后门的玩具模型、带后门的大模型和无后门的开源模型上展示了结果。我们还表明，在可能含有投毒数据的数据集上微调时，通过对个别模块施加局部约束，可以增强大语言模型抵御后门的能力。触发警告：冒犯性语言。
