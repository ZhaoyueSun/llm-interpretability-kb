  en: 'Neural network models have achieved high performance on a wide variety of complex
    tasks, but the algorithms that they implement are notoriously difficult to interpret.
    It is often necessary to hypothesize intermediate variables involved in a network''s
    computation in order to understand these algorithms. For example, does a language
    model depend on particular syntactic properties when generating a sentence? Yet,
    existing analysis tools make it difficult to test hypotheses of this type. We
    propose a new analysis technique - circuit probing - that automatically uncovers
    low-level circuits that compute hypothesized intermediate variables. This enables
    causal analysis through targeted ablation at the level of model parameters. We
    apply this method to models trained on simple arithmetic tasks, demonstrating
    its effectiveness at (1) deciphering the algorithms that models have learned,
    (2) revealing modular structure within a model, and (3) tracking the development
    of circuits over training. Across these three experiments we demonstrate that
    circuit probing combines and extends the capabilities of existing methods, providing
    one unified approach for a variety of analyses. Finally, we demonstrate circuit
    probing on a real-world use case: uncovering circuits that are responsible for
    subject-verb agreement and reflexive anaphora in GPT2-Small and Medium.'
  zh: >-
    神经网络模型在多种复杂任务上取得了很高的性能，但它们所实现的算法却出了名地难以解释。要理解这些算法，往往必须对网络计算中涉及的中间变量提出假设。例如，语言模型在生成句子时是否依赖某些特定的句法属性？然而，现有分析工具很难检验这类假设。我们提出一种新的分析技术——回路探测（circuit probing），它能自动发现计算假设中间变量的底层回路，从而支持在模型参数层面通过定向消融开展因果分析。我们将该方法应用于在简单算术任务上训练的模型，并展示它在以下方面的有效性：（1）解析模型学到的算法；（2）揭示模型内部的模块化结构；（3）追踪回路在训练过程中的形成。通过这三项实验，我们表明回路探测综合并扩展了现有方法的能力，为多类分析提供了一种统一方法。最后，我们在真实用例中演示回路探测：发现 GPT2-Small 和 GPT2-Medium 中负责主谓一致与反身照应的回路。
