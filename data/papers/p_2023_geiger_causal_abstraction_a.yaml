abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2301.04709
  en: Causal abstraction provides a theoretical foundation for mechanistic interpretability,
    the field concerned with providing intelligible algorithms that are faithful simplifications
    of the known, but opaque low-level details of black box AI models. Our contributions
    are (1) generalizing the theory of causal abstraction from mechanism replacement
    (i.e., hard and soft interventions) to arbitrary mechanism transformation (i.e.,
    functionals from old mechanisms to new mechanisms), (2) providing a flexible,
    yet precise formalization for the core concepts of polysemantic neurons, the linear
    representation hypothesis, modular features, and graded faithfulness, and (3)
    unifying a variety of mechanistic interpretability methods in the common language
    of causal abstraction, namely, activation and path patching, causal mediation
    analysis, causal scrubbing, causal tracing, circuit analysis, concept erasure,
    sparse autoencoders, differential binary masking, distributed alignment search,
    and steering.
  zh: >-
    因果抽象为机制可解释性提供了理论基础。机制可解释性关注如何给出可理解的算法，使其成为对黑箱 AI 模型中已知但不透明的底层细节的忠实简化。本文的贡献包括：（1）把因果抽象理论从机制替换（即硬干预与软干预）推广到任意机制变换（即从旧机制到新机制的泛函）；（2）为多义神经元、线性表征假说、模块化特征和分级忠实性等核心概念提供既灵活又精确的形式化定义；（3）使用因果抽象这一共同语言统一多种机制可解释性方法，包括激活修补与路径修补、因果中介分析、因果擦洗、因果追踪、回路分析、概念擦除、稀疏自编码器、差分二值掩码、分布式对齐搜索和模型引导。
