abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2410.20526
  en: Sparse Autoencoders (SAEs) have emerged as a powerful unsupervised method for
    extracting sparse representations from language models, yet scalable training
    remains a significant challenge. We introduce a suite of 256 SAEs, trained on
    each layer and sublayer of the Llama-3.1-8B-Base model, with 32K and 128K features.
    Modifications to a state-of-the-art SAE variant, Top-K SAEs, are evaluated across
    multiple dimensions. In particular, we assess the generalizability of SAEs trained
    on base models to longer contexts and fine-tuned models. Additionally, we analyze
    the geometry of learned SAE latents, confirming that \emph{feature splitting}
    enables the discovery of new features. The Llama Scope SAE checkpoints are publicly
    available at~\url{https://huggingface.co/fnlp/Llama-Scope}, alongside our scalable
    training, interpretation, and visualization tools at \url{https://github.com/OpenMOSS/Language-Model-SAEs}.
    These contributions aim to advance the open-source Sparse Autoencoder ecosystem
    and support mechanistic interpretability research by reducing the need for redundant
    SAE training.
  zh: >-
    稀疏自编码器（SAE）已成为从语言模型中提取稀疏表征的强大无监督方法，但可扩展训练仍是一项重大挑战。我们推出一套包含 256 个 SAE 的资源，它们分别在 Llama-3.1-8B-Base 模型的每一层和子层上训练，特征数量为 32K 或 128K。我们从多个维度评估了对先进 SAE 变体 Top-K SAE 的修改。特别是，我们评估在基础模型上训练的 SAE 对更长上下文和微调模型的泛化能力。此外，我们分析所学 SAE 潜变量的几何结构，确认特征拆分能够发现新特征。Llama Scope 的 SAE 检查点公开于 https://huggingface.co/fnlp/Llama-Scope；可扩展训练、解释和可视化工具见 https://github.com/OpenMOSS/Language-Model-SAEs。这些贡献旨在推动开源稀疏自编码器生态发展，并通过减少重复训练 SAE 的需要来支持机制可解释性研究。
