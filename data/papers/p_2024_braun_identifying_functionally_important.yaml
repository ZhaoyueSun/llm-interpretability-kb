ai_summary:
  basis: PaperKnowledgeBase Docling full text, verified abstract, and project research-question review
  en: |-
    **Research Question.** What should sparse representation learning optimize to balance sparsity, reconstruction faithfulness, and functional fidelity? In this paper, *Identifying Functionally Important Features with End-to-End Sparse Dictionary Learning* addresses that question through its specific object of study and tests how far the resulting claim can be supported. Identifying the features learned by neural networks is a core challenge in mechanistic interpretability. Sparse autoencoders (SAEs), which learn a sparse, overcomplete dictionary that reconstructs a network's internal activations, have been used to identify these features. However, SAEs may learn more about the structure of the datatset than the computational structure of the network.

    **Method.** We propose end-to-end (e2e) sparse dictionary learning, a method for training SAEs that ensures the features learned are functionally important by minimizing the KL divergence between the output distributions of the original model and the model with SAE activations inserted. E2e dictionary learning brings us closer to methods that can explain network behavior concisely and accurately. We release our library for training e2e SAEs and reproducing our analysis at https://github.com/ApolloResearch/e2e_sae

    **Validation.** We explore geometric and qualitative differences between e2e SAE features and standard SAE features.

    **Conclusion & Evidence.** Compared to standard SAEs, e2e SAEs offer a Pareto improvement: They explain more network performance, require fewer total features, and require fewer simultaneously active features per datapoint, all with no cost to interpretability. The interventions provide local causal evidence for the targeted components or representations. The conclusion remains bounded to the tested models, tasks, and intervention design and need not constitute a complete mechanism.
  zh: |-
    **研究问题。** 以局部 activation MSE 训练 稀疏自编码器（Sparse Autoencoder, SAE） 是否把容量浪费在对模型行为不重要的细节上？直接优化替换 SAE 后输出 logits 的 KL divergence，并约束 downstream reconstruction，能否以更少、更稀疏的 features 保留模型功能并减少 feature splitting？

    **方法。** 我们提出端到端（e2e）稀疏字典学习：通过最小化原始模型与插入 SAE 激活后模型的输出分布之间的 KL 散度，训练 SAE 并确保所学特征具有功能重要性。端到端字典学习使我们更接近能够简洁、准确解释网络行为的方法。用于训练 e2e SAE 和复现分析的代码库见 https://github.com/ApolloResearch/e2e_sae。

    **实验验证。** 我们还探索了 e2e SAE 特征与标准 SAE 特征之间的几何和定性差异。

    **结论与证据。** 与标准 SAE 相比，e2e SAE 实现了帕累托改进：它们能解释更多网络性能，需要的特征总数更少，每个数据点同时激活的特征也更少，同时不损害可解释性。这些干预为目标组件或表示提供了局部因果证据；结论仍受所测模型、任务和干预设计限制，也不必然构成完整机制。
