ai_summary:
  basis: PaperKnowledgeBase Docling full text, verified abstract, and project research-question review
  en: |-
    **Research Question.** Can sparse features serve as more interpretable and scalable circuit nodes than native model components? In this paper, *Sparse Feature Circuits: Discovering and Editing Interpretable Causal Graphs in Language Models* addresses that question through its specific object of study and tests how far the resulting claim can be supported.

    **Method.** We introduce methods for discovering and applying sparse feature circuits.

    **Validation.** These are causally implicated subnetworks of human-interpretable features for explaining language model behaviors. Circuits identified in prior work consist of polysemantic and difficult-to-interpret units like attention heads or neurons, rendering them unsuitable for many downstream applications.

    **Conclusion & Evidence.** In contrast, sparse feature circuits enable detailed understanding of unanticipated mechanisms. Because they are based on fine-grained units, sparse feature circuits are useful for downstream tasks: We introduce SHIFT, where we improve the generalization of a classifier by ablating features that a human judges to be task-irrelevant. Finally, we demonstrate an entirely unsupervised and scalable interpretability pipeline by discovering thousands of sparse feature circuits for automatically discovered model behaviors. The coordinated interventions provide comparatively strong structural causal evidence for the proposed information flow or circuit. Completeness, uniqueness, and transfer to other models still require separate validation.
  zh: |-
    **研究问题。** 能否以 稀疏自编码器（Sparse Autoencoder, SAE） features 取代 polysemantic components，并用线性归因高效发现 feature-to-feature causal graphs，从而解释未知行为？这些 sparse feature circuits 能否识别并删除 spurious features，且扩展到成千上万种自动发现的行为？

    **方法。** 我们提出用于发现和应用稀疏特征回路的方法。稀疏特征回路是由人类可解释特征组成、与因果作用相关的子网络，用于解释语言模型行为。

    **实验验证。** 以往工作识别的回路由注意力头或神经元等多义且难以解释的单元构成，因此不适合许多下游应用。相比之下，稀疏特征回路能够帮助我们细致理解未曾预料的机制。由于它们以细粒度单元为基础，稀疏特征回路也适用于下游任务。我们提出 SHIFT：消融经人类判断与任务无关的特征，以改善分类器的泛化能力。

    **结论与证据。** 最后，我们通过为自动发现的模型行为找出数千个稀疏特征回路，展示了一条完全无监督且可扩展的可解释性流水线。相互配合的干预为所提出的信息流或电路提供了较强的结构因果证据，但机制的完备性、唯一性以及跨模型迁移仍需独立验证。
