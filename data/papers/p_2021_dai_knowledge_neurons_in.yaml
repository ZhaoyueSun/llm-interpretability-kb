abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2104.08696
  en: Large-scale pretrained language models are surprisingly good at recalling factual
    knowledge presented in the training corpus. In this paper, we present preliminary
    studies on how factual knowledge is stored in pretrained Transformers by introducing
    the concept of knowledge neurons. Specifically, we examine the fill-in-the-blank
    cloze task for BERT. Given a relational fact, we propose a knowledge attribution
    method to identify the neurons that express the fact. We find that the activation
    of such knowledge neurons is positively correlated to the expression of their
    corresponding facts. In our case studies, we attempt to leverage knowledge neurons
    to edit (such as update, and erase) specific factual knowledge without fine-tuning.
    Our results shed light on understanding the storage of knowledge within pretrained
    Transformers.
  zh: >-
    大规模预训练语言模型在回忆训练语料中出现的事实知识方面表现出乎意料地出色。本文通过引入“知识神经元”概念，对事实知识如何存储在预训练 Transformer 中开展初步研究。具体而言，我们考察 BERT 的填空完形任务。给定一个关系事实，我们提出知识归因方法，用于识别表达该事实的神经元。我们发现，这类知识神经元的激活与其对应事实的表达呈正相关。在案例研究中，我们尝试利用知识神经元，在无需微调的情况下编辑——例如更新或擦除——特定事实知识。结果有助于理解预训练 Transformer 内部的知识存储。
