  en: |-
    **Research Question.** Do different training runs, models, and architectures reproduce the same mechanism, or only share an abstract algorithm? In this paper, *Circuit Component Reuse Across Tasks in Transformer Language Models* addresses that question through its specific object of study and tests how far the resulting claim can be supported. Recent work in mechanistic interpretability has shown that behaviors in language models can be successfully reverse-engineered through circuit analysis. A common criticism, however, is that each circuit is task-specific, and thus such analysis cannot contribute to understanding the models at a higher level.

    **Method.** In this work, we present evidence that insights (both low-level findings about specific heads and higher-level findings about general algorithms) can indeed generalize across tasks.

    **Validation.** We further present a proof-of-concept intervention experiment, in which we adjust four attention heads in middle layers in order to 'repair' the Colored Objects circuit and make it behave like the indirect object identification (IOI) circuit. In doing so, we boost accuracy from 49.6% to 93.7% on the Colored Objects task and explain most sources of error.

    **Conclusion & Evidence.** Specifically, we study the circuit discovered in Wang et al. (2022) for the Indirect Object Identification (IOI) task and 1.) show that it reproduces on a larger GPT2 model, and 2.) that it is mostly reused to solve a seemingly different task: Colored Objects (Ippolito & Callison-Burch, 2023). We provide evidence that the process underlying both tasks is functionally very similar, and contains about a 78% overlap in in-circuit attention heads. The intervention affects downstream attention heads in specific ways predicted by their interactions in the IOI circuit, indicating that this subcircuit behavior is invariant to the different task inputs. Overall, our results provide evidence that it may yet be possible to explain large language models' behavior in terms of a relatively small number of interpretable task-general algorithmic building blocks and computational components. The coordinated interventions provide comparatively strong structural causal evidence for the proposed information flow or circuit. Completeness, uniqueness, and transfer to other models still require separate validation.
  zh: |-
    **研究问题。** Transformer 在 间接宾语识别（Indirect Object Identification, IOI） 与 Colored Objects 等表面不同的任务中，是否复用相同的 attention heads 和算法功能？从一个任务获得的电路知识能否预测并改善另一个任务的机制分析？

    **方法。** 然而，一种常见批评认为，每个回路都只适用于特定任务，因此这类分析无法帮助我们在更高层面理解模型。在本研究中，我们给出证据，说明相关认识——既包括关于特定注意力头的底层发现，也包括关于一般算法的高层发现——确实能够跨任务泛化。

    **实验验证。** 具体而言，我们研究 Wang 等（2022）为间接宾语识别（IOI）任务发现的回路，并证明：（1）该回路能在更大的 GPT2 模型上复现；（2）它在很大程度上被复用于解决一个表面上不同的任务：彩色物体（Colored Objects；Ippolito 与 Callison-Burch，2023）。我们还给出一个概念验证式干预实验：调整中间层的四个注意力头，以“修复”彩色物体回路，使其像 IOI 回路一样工作。由此，我们将彩色物体任务的准确率从 49.6% 提升至 93.7%，并解释了大多数错误来源。

    **结论与证据。** 我们提供证据表明，这两个任务背后的过程在功能上非常相似，其回路内注意力头约有 78% 重叠。该干预以 IOI 回路中组件交互所预测的特定方式影响下游注意力头，说明这一子回路的行为对不同任务输入保持不变。总体而言，我们的结果表明，或许可以用相对少量、可解释且跨任务通用的算法构件与计算组件来解释大语言模型的行为。相互配合的干预为所提出的信息流或电路提供了较强的结构因果证据，但机制的完备性、唯一性以及跨模型迁移仍需独立验证。
