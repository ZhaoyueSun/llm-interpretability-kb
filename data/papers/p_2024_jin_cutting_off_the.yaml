  en: |-
    **Research Question.** How does a model arbitrate between parametric and contextual knowledge when they conflict? In this paper, *Cutting Off the Head Ends the Conflict: A Mechanism for Interpreting and Mitigating Knowledge Conflicts in Language Models* addresses that question through its specific object of study and tests how far the resulting claim can be supported. Recently, retrieval augmentation and tool augmentation have demonstrated a remarkable capability to expand the internal memory boundaries of language models (LMs) by providing external context. However, internal memory and external context inevitably clash, leading to knowledge conflicts within LMs.

    **Method.** We find there are some attention heads with opposite effects in the later layers, where memory heads can recall knowledge from internal memory, and context heads can retrieve knowledge from external context.

    **Validation.** In this paper, we aim to interpret the mechanism of knowledge conflicts through the lens of information flow, and then mitigate conflicts by precise interventions at the pivotal point. Inspired by the insights, we propose a novel method called Pruning Head via PatH PatcHing (PH3), which can efficiently mitigate knowledge conflicts by pruning conflicting attention heads without updating model parameters. PH3 can flexibly control eight LMs to use internal memory ($\uparrow$ 44.0%) or external context ($\uparrow$ 38.5%).

    **Conclusion & Evidence.** Moreover, we reveal that the pivotal point at which knowledge conflicts emerge in LMs is the integration of inconsistent information flows by memory heads and context heads. Moreover, PH3 can also improve the performance of LMs on open-domain QA tasks. We also conduct extensive experiments to demonstrate the cross-model, cross-relation, and cross-format generalization of our method. The interventions provide local causal evidence for the targeted components or representations. The conclusion remains bounded to the tested models, tasks, and intervention design and need not constitute a complete mechanism.
  zh: |-
    **研究问题。** 当 parametric memory 与 external context 冲突时，冲突在何处、经何种信息流产生？late-layer memory heads 与 context heads 如何竞争，能否通过 path patching 定位并剪除特定 heads 来控制模型遵从内部或外部知识？

    **方法。** 我们发现，后部层中存在一些作用相反的注意力头：记忆头可以从内部记忆中召回知识，而上下文头可以从外部上下文中检索知识。

    **实验验证。** 本文旨在从信息流的角度解释知识冲突的机制，并通过在关键位置进行精确干预来缓解冲突。受这些认识启发，我们提出一种名为“通过路径修补剪枝注意力头”（Pruning Head via PatH PatcHing，PH3）的新方法；它无需更新模型参数，只需剪除发生冲突的注意力头，便能高效缓解知识冲突。PH3 可以灵活控制八种语言模型使用内部记忆（$\uparrow$ 44.0%）或外部上下文（$\uparrow$ 38.5%）。

    **结论与证据。** 我们进一步揭示，语言模型中知识冲突出现的关键点，是记忆头与上下文头对不一致信息流的整合。此外，PH3 还能提升语言模型在开放域问答任务上的表现。我们还进行了广泛实验，证明该方法能够跨模型、跨关系和跨格式泛化。这些干预为目标组件或表示提供了局部因果证据；结论仍受所测模型、任务和干预设计限制，也不必然构成完整机制。
