abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/1610.01644
  en: "Neural network models have a reputation for being black boxes. We propose to
    monitor the features at every layer of a model and measure how suitable they are
    for classification. We use linear classifiers, which we refer to as \"probes\",
    trained entirely independently of the model itself. \nThis helps us better understand
    the roles and dynamics of the intermediate layers. We demonstrate how this can
    be used to develop a better intuition about models and to diagnose potential problems.
    \nWe apply this technique to the popular models Inception v3 and Resnet-50. Among
    other things, we observe experimentally that the linear separability of features
    increase monotonically along the depth of the model."
  zh: >-
    神经网络模型素有“黑箱”之名。我们提出监测模型每一层的特征，并衡量它们对分类任务的适用程度。我们使用完全独立于模型本身训练的线性分类器，并称之为“探针”。这有助于我们更好地理解中间层的作用和动力学。我们展示了如何使用该方法建立对模型更好的直觉，并诊断潜在问题。我们把这一技术应用于常用模型 Inception v3 和 ResNet-50。实验观察之一是，特征的线性可分性会沿模型深度单调增加。
