abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2408.05147
  en: Sparse autoencoders (SAEs) are an unsupervised method for learning a sparse
    decomposition of a neural network’s latent representations into seemingly interpretable
    features.Despite recent excitement about their potential, research applications
    outside of industry are limited by the high cost of training a comprehensive suite
    of SAEs.In this work, we introduce Gemma Scope, an open suite of JumpReLU SAEs
    trained on all layers and sub-layers of Gemma 2 2B and 9B and select layers of
    Gemma 2 27B base models.We primarily train SAEs on the Gemma 2 pre-trained models,
    but additionally release SAEs trained on instruction-tuned Gemma 2 9B for comparison.We
    evaluate the quality of each SAE on standard metrics and release these results.We
    hope that by releasing these SAE weights, we can help make more ambitious safety
    and interpretability research easier for the community. Weights and a tutorial
    can be found at https://huggingface.co/google/gemma-scope and an interactive demo
    can be found at https://neuronpedia.org/gemma-scope.
  zh: >-
    稀疏自编码器（SAE）是一种无监督方法，用于把神经网络的潜在表征稀疏分解为看似可解释的特征。尽管近期研究者对其潜力十分关注，但训练一套覆盖全面的 SAE 成本很高，限制了工业界之外的研究应用。本文推出 Gemma Scope：一套开放的 JumpReLU SAE，覆盖 Gemma 2 2B 和 9B 基础模型的所有层与子层，以及 Gemma 2 27B 基础模型的若干选定层。我们主要在 Gemma 2 预训练模型上训练 SAE，同时也发布在经过指令调优的 Gemma 2 9B 上训练的 SAE 以供比较。我们使用标准指标评估每个 SAE 的质量，并公开评估结果。我们希望通过发布这些 SAE 权重，帮助研究社区更容易开展更具雄心的安全性与可解释性研究。权重和教程见 https://huggingface.co/google/gemma-scope，交互式演示见 https://neuronpedia.org/gemma-scope。
