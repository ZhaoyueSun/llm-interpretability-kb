  en: |-
    **Research Question.** The paper asks when a neural network can be said to implement an interpretable high-level causal model rather than merely correlate with its variables. It seeks a formal criterion for aligning low-level neural representations with high-level variables and testing whether their counterfactual behaviors agree.

    **Method.** A proposed high-level causal model is related to the neural network through an alignment that maps groups of neurons and representation values to causal variables and their values. Interchange interventions replace an internal representation from one input with the representation produced by another; the corresponding high-level intervention swaps the aligned causal variable. Agreement over these paired interventions defines causal abstraction.

    **Validation.** The framework is demonstrated on neural networks trained for synthetic and natural-language reasoning tasks with known candidate algorithms. The authors search over alignments, compare ordinary input–output accuracy with intervention accuracy, and use counterexamples to show that models with similar observational behavior can implement different internal causal structures.

    **Conclusion & Evidence.** Interchange-intervention agreement provides a rigorous behavioral test of whether a network realizes a specified high-level causal process. It is stronger than probing or observational correlation because it requires matched counterfactual effects. The evidence and definitions support the framework as a causal criterion, but a successful result is relative to the proposed high-level model and searched alignment; failure may reflect a poor hypothesis or search procedure rather than absence of interpretable structure.
  zh: |-
    **研究问题。** 论文研究在什么条件下可以说神经网络实现了一个可解释的高层因果模型，而不仅是与高层变量相关；目标是形式化低层神经表示与高层变量的对齐，并检验两者的反事实行为是否一致。

    **方法。** 作者通过一种对齐关系，把神经元群及其表示值映射到高层因果变量及变量值。交换干预（interchange intervention）把某个输入产生的内部表示替换成另一输入的表示，并在高层模型中同步交换与之对齐的因果变量。如果两种系统在成对干预下保持输出一致，则神经网络可被视为该高层模型的因果抽象。

    **实验验证。** 框架在具有已知候选算法的合成任务和自然语言推理任务网络上展示。作者搜索可能的对齐，比较普通输入—输出准确率与干预准确率，并利用反例说明：观察行为相近的模型仍可能实现不同的内部因果结构。

    **结论与证据。** 交换干预的一致性为“网络是否实现某个指定高层因果过程”提供了严格的行为检验。由于它要求低层和高层系统产生匹配的反事实效应，其证据强于探针或观察相关性。不过，成功结论总是相对于所提出的高层模型和找到的对齐而言；检验失败也可能源于高层假说或搜索过程不合适，而不必然意味着模型没有可解释结构。
