abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2402.16438
  en: Large language models (LLMs) demonstrate remarkable multilingual capabilities
    without being pre-trained on specially curated multilingual parallel corpora.
    It remains a challenging problem to explain the underlying mechanisms by which
    LLMs process multilingual texts. In this paper, we delve into the composition
    of Transformer architectures in LLMs to pinpoint language-specific regions. Specially,
    we propose a novel detection method, language activation probability entropy (LAPE),
    to identify language-specific neurons within LLMs. Based on LAPE, we conduct comprehensive
    experiments on several representative LLMs, such as LLaMA-2, BLOOM, and Mistral.
    Our findings indicate that LLMs' proficiency in processing a particular language
    is predominantly due to a small subset of neurons, primarily situated in the models'
    top and bottom layers. Furthermore, we showcase the feasibility to"steer"the output
    language of LLMs by selectively activating or deactivating language-specific neurons.
    Our research provides important evidence to the understanding and exploration
    of the multilingual capabilities of LLMs.
  zh: >-
    即使没有在专门整理的多语言平行语料库上预训练，大语言模型（LLM）也表现出卓越的多语言能力。解释语言模型处理多语言文本的底层机制仍是一项具有挑战性的问题。本文深入分析语言模型中 Transformer 架构的组成，以定位语言特定区域。具体而言，我们提出一种新的检测方法——语言激活概率熵（LAPE），用于识别语言模型内部的语言特定神经元。基于 LAPE，我们在 LLaMA-2、BLOOM 和 Mistral 等多个代表性语言模型上进行了全面实验。结果表明，语言模型处理某种特定语言的能力主要来自一小部分神经元，它们主要位于模型的顶部层和底部层。此外，我们展示了通过选择性激活或停用语言特定神经元来“引导”语言模型输出语言的可行性。本研究为理解和探索语言模型的多语言能力提供了重要证据。
