  en: |-
    **Research Question.** How do circuits implementing a capability form progressively from random initialization? In this paper, *How Transformers Learn Causal Structure with Gradient Descent* addresses that question through its specific object of study and tests how far the resulting claim can be supported. The incredible success of transformers on sequence modeling tasks can be largely attributed to the self-attention mechanism, which allows information to be transferred between different parts of a sequence. Self-attention allows transformers to encode causal structure which makes them particularly suitable for sequence modeling. However, the process by which transformers learn such causal structure via gradient-based training algorithms remains poorly understood.

    **Method.** To better understand this process, we introduce an in-context learning task that requires learning latent causal structure.

    **Validation.** We prove that gradient descent on a simplified two-layer transformer learns to solve this task by encoding the latent causal graph in the first attention layer. The key insight of our proof is that the gradient of the attention matrix encodes the mutual information between tokens. As a consequence of the data processing inequality, the largest entries of this gradient correspond to edges in the latent causal graph.

    **Conclusion & Evidence.** As a special case, when the sequences are generated from in-context Markov chains, we prove that transformers learn an induction head (Olsson et al., 2022). We confirm our theoretical findings by showing that transformers trained on our in-context learning task are able to recover a wide variety of causal structures. The formal result is strong under its stated assumptions, with experiments or constructions supporting the predicted consequences. Its scope is limited by those assumptions and does not automatically extend to every architecture or training regime.
  zh: |-
    **研究问题。** Transformer 为完成 in-context learning 所需的 causal structure（如 Markov transition 与 input–output pairing）如何从随机初始化经 gradient descent 形成？能否在简化的两层模型中解析 attention circuits 的训练动力学？

    **方法。** 为更好地理解这一过程，我们引入一个需要学习潜在因果结构的上下文学习任务。

    **实验验证。** 根据数据处理不等式，该梯度中最大的条目对应潜在因果图中的边。

    **结论与证据。** 我们证明，在一个简化的两层 Transformer 上，梯度下降会通过在第一注意力层中编码潜在因果图来学会解决该任务。证明的关键认识是，注意力矩阵的梯度编码 token 之间的互信息。作为一个特例，当序列由上下文中的马尔可夫链生成时，我们证明 Transformer 会学到归纳注意力头（Olsson 等，2022）。我们还发现，在该上下文学习任务上训练的 Transformer 能恢复多种因果结构，从而验证了理论结果。形式结果在明确假设下具有较强支持，实验或构造也验证了其预测后果；结论范围受这些假设约束，不能自动推广到所有架构和训练设置。
