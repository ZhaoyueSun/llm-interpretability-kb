abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2005.00719
  en: Although neural models have achieved impressive results on several NLP benchmarks,
    little is understood about the mechanisms they use to perform language tasks.
    Thus, much recent attention has been devoted to analyzing the sentence representations
    learned by neural encoders, through the lens of ‘probing’ tasks. However, to what
    extent was the information encoded in sentence representations, as discovered
    through a probe, actually used by the model to perform its task? In this work,
    we examine this probing paradigm through a case study in Natural Language Inference,
    showing that models can learn to encode linguistic properties even if they are
    not needed for the task on which the model was trained. We further identify that
    pretrained word embeddings play a considerable role in encoding these properties
    rather than the training task itself, highlighting the importance of careful controls
    when designing probing experiments. Finally, through a set of controlled synthetic
    tasks, we demonstrate models can encode these properties considerably above chance-level,
    even when distributed in the data as random noise, calling into question the interpretation
    of absolute claims on probing tasks.
  zh: >-
    尽管神经模型在多项 NLP 基准上取得了出色结果，人们对它们执行语言任务所使用的机制仍了解很少。因此，近期大量研究通过“探测”任务分析神经编码器学到的句子表征。然而，探针所发现的句子表征信息，在多大程度上真正被模型用于完成任务？本文以自然语言推理为案例考察这一探测范式，并表明，即使某些语言属性对于模型训练所针对的任务并非必要，模型仍可能学会编码它们。我们进一步发现，编码这些属性的主要贡献者可能是预训练词嵌入，而非训练任务本身，这凸显了设计探测实验时设置严谨对照的重要性。最后，通过一组受控合成任务，我们证明，即使这些属性以随机噪声的形式分布于数据中，模型对它们的编码也能显著高于随机水平。这使人们需要质疑针对探测任务所得绝对结论的解释。
