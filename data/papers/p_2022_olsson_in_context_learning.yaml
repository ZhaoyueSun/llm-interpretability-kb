abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2209.11895
  en: '"Induction heads"are attention heads that implement a simple algorithm to complete
    token sequences like [A][B] ... [A] ->[B]. In this work, we present preliminary
    and indirect evidence for a hypothesis that induction heads might constitute the
    mechanism for the majority of all"in-context learning"in large transformer models
    (i.e. decreasing loss at increasing token indices). We find that induction heads
    develop at precisely the same point as a sudden sharp increase in in-context learning
    ability, visible as a bump in the training loss. We present six complementary
    lines of evidence, arguing that induction heads may be the mechanistic source
    of general in-context learning in transformer models of any size. For small attention-only
    models, we present strong, causal evidence; for larger models with MLPs, we present
    correlational evidence.'
  zh: >-
    “归纳注意力头”是实现一种简单算法的注意力头，可补全形如 [A][B] … [A] → [B] 的 token 序列。本文给出初步的间接证据，支持这样一种假说：在大型 Transformer 模型中，归纳注意力头可能构成绝大多数“上下文学习”的机制；这里的上下文学习指损失随 token 索引增加而下降。我们发现，归纳注意力头形成的时间点与上下文学习能力突然大幅提高的时间点完全一致，后者在训练损失中表现为一个凸起。我们从六个互为补充的方面提供证据，论证归纳注意力头可能是任意规模 Transformer 模型中一般上下文学习的机制来源。对于仅含注意力层的小模型，我们给出强有力的因果证据；对于包含 MLP 的较大模型，我们给出相关性证据。
