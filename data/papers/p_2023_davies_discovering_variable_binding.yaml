ai_summary:
  basis: PaperKnowledgeBase Docling full text, verified abstract, and project research-question review
  en: |-
    **Research Question.** How can paths and shared circuits implementing a target subcomputation be localized from behavioral constraints? In this paper, *Discovering Variable Binding Circuitry with Desiderata* addresses that question through its specific object of study and tests how far the resulting claim can be supported. Recent work has shown that computation in language models may be human-understandable, with successful efforts to localize and intervene on both single-unit features and input-output circuits.

    **Method.** Here, we introduce an approach which extends causal mediation experiments to automatically identify model components responsible for performing a specific subtask by solely specifying a set of desiderata, or causal attributes of the model components executing that subtask.

    **Validation.** As a proof of concept, we apply our method to automatically discover shared variable binding circuitry in LLaMA-13B, which retrieves variable values for multiple arithmetic tasks.

    **Conclusion & Evidence.** Our method successfully localizes variable binding to only 9 attention heads (of the 1.6k) and one multilayer perceptron (MLP) in the final token's residual stream. The coordinated interventions provide comparatively strong structural causal evidence for the proposed information flow or circuit. Completeness, uniqueness, and transfer to other models still require separate validation.
  zh: |-
    **研究问题。** 能否只指定目标子计算应满足的 causal desiderata，而无需预先给出完整 clean/corrupted 行为模板，就自动学习稀疏组件 mask？这种方法能否在 LLaMA-13B 中定位跨多种算术操作共享的 variable-value binding/copying circuitry？

    **方法。** 本文提出一种方法，把因果中介实验扩展为自动识别负责特定子任务的模型组件；使用者只需指定一组期望条件（desiderata），即执行该子任务的模型组件应具备的因果属性。

    **实验验证。** 作为概念验证，我们应用该方法，在 LLaMA-13B 中自动发现被多个算术任务共同使用、用于检索变量取值的变量绑定回路。

    **结论与证据。** 该方法成功将变量绑定定位到仅 9 个注意力头（总计 1,600 个）以及最后一个 token 残差流中的一个 多层感知机（Multi-Layer Perceptron, MLP）。相互配合的干预为所提出的信息流或电路提供了较强的结构因果证据，但机制的完备性、唯一性以及跨模型迁移仍需独立验证。
