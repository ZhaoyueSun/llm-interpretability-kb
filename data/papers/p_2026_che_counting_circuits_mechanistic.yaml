abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2603.18523
  en: Counting serves as a simple but powerful test of a Large Vision-Language Model's
    (LVLM's) reasoning; it forces the model to identify each individual object and
    then add them all up. In this study, we investigate how LVLMs implement counting
    using controlled synthetic and real-world benchmarks, combined with mechanistic
    analyses. Our results show that LVLMs display a human-like counting behavior,
    with precise performance on small numerosities and noisy estimation for larger
    quantities. We introduce two novel interpretability methods, Visual Activation
    Patching and HeadLens, and use them to uncover a structured "counting circuit"
    that is largely shared across a variety of visual reasoning tasks. Building on
    these insights, we propose a lightweight intervention strategy that exploits simple
    and abundantly available synthetic images to fine-tune arbitrary pretrained LVLMs
    exclusively on counting. Despite the narrow scope of this fine-tuning, the intervention
    not only enhances counting accuracy on in-distribution synthetic data, but also
    yields an average improvement of +8.36% on out-of-distribution counting benchmarks
    and an average gain of +1.54% on complex, general visual reasoning tasks for Qwen2.5-VL.
    These findings highlight the central, influential role of counting in visual reasoning
    and suggest a potential pathway for improving overall visual reasoning capabilities
    through targeted enhancement of counting mechanisms.
  zh: >-
    计数是检验大型视觉语言模型（LVLM）推理能力的一项简单而有力的任务：模型必须识别每个对象，再将它们全部相加。本文结合受控合成基准、真实世界基准和机制分析，研究
    LVLM 如何实现计数。结果表明，LVLM 呈现类似人类的计数行为：对较小数量可以精确处理，对较大数量则进行带噪估计。我们提出两种新的可解释性方法——Visual
    Activation Patching 和 HeadLens——并利用它们揭示一个结构化的“计数回路”；该回路在多种视觉推理任务之间大体共享。在这些认识的基础上，我们提出一种轻量干预策略：利用简单且易于大量获取的合成图像，只针对计数任务对任意预训练
    LVLM 进行微调。尽管微调范围很窄，该干预不仅提高了分布内合成数据上的计数准确率，还使 Qwen2.5-VL
    在分布外计数基准上平均提升 8.36%，在复杂、通用的视觉推理任务上平均提升 1.54%。这些发现凸显了计数在视觉推理中的核心影响，并表明通过有针对性地增强计数机制，可能进一步改善模型的整体视觉推理能力。
