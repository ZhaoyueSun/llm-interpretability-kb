    144 个注意力头时才完全准确，而构造出的引号产物只需三条边即可完成验证。基于朴素发现结果的验证由于可测量的原因而失败；在大规模场景中，我们发现必须主动构造一个能够验证的对象。经验证的对象是经过校准的人工产物，而非未经修改的原模型，并且所有主张都只适用于明确声明的域。
