  en: |-
    **Research Question.** Can mechanistic explanations receive explicit domains of validity, counterexample search, and solver-checkable guarantees? In this paper, *Towards Verifiable Transformers: Solver-Checkable Circuit Explanations* addresses that question through its specific object of study and tests how far the resulting claim can be supported. Mechanistic interpretability typically discovers circuits and then argues what they do from examples and ablations.

    **Method.** We introduce Verifiable Transformers, a framework for turning task-localized circuits into bounded, solver-checkable claims: projected functional equivalence, task-relevant invariance, edge necessity, and robustness to continuous final-residual perturbations. At small scale, we directly verify all four properties for quote-closing and bracket-type circuits, including program-mediated circuits whose attention selection is entirely symbolic. For two alphabet variants of the same opener-detection/copy-type task, untouched gates expose a localization frontier: bracket-type extraction is exact only with all 144 heads, while the constructed quote artifact verifies with three edges.

    **Validation.** At GPT-2 scale, we remove LayerNorm from a sparsemax/LeakyReLU model after training with a +0.0087 OpenWebText loss increase, replace retained attention heads with synthesized restricted-DSL programs, and calibrate only program-local readouts while freezing and hashing every other parameter.

    **Conclusion & Evidence.** The resulting three-edge quote circuit (embedding $\to$ multilayer perceptron (MLP) 0 $\to$ program head $\to$ logits) verifies all four properties over a hash-pinned 1,280-prompt domain in linear real arithmetic: 1,280/1,280 equivalence and invariance, 640 edge-necessity witnesses per edge, and robustness at $ε= 0.01$ with minimum certified radius 0.01515. Naive discovery-based verification failed for measured reasons; at scale, we find we must build the object we can verify. The verified object is a calibrated artifact, not the unmodified model, and all claims are bounded to declared domains. The formal result is strong under its stated assumptions, with experiments or constructions supporting the predicted consequences. Its scope is limited by those assumptions and does not automatically extend to every architecture or training regime.
  zh: |-
    **研究问题。** 能否把 circuit explanations 转化为 solver-checkable bounded claims，验证其在声明域内与 symbolic program 功能等价、边必要、对无关输入不变且对连续扰动稳健？当原生神经电路难以直接证明时，能否构造性地安装并校准可验证的程序电路且禁止新 bypass？

    **方法。** 我们提出 Verifiable Transformers 框架，将针对具体任务定位的回路转化为有明确边界、可由求解器检查的主张，包括：投影后的功能等价性、任务相关不变性、边的必要性，以及对最终残差流连续扰动的稳健性。在 GPT-2 规模上，我们对一个 sparsemax/LeakyReLU 模型训练后移除 LayerNorm，OpenWebText 损失只增加了 0.0087；随后用受限领域专用语言合成的程序替换保留的注意力头，只校准程序局部的读出，同时冻结并对其余所有参数进行哈希固定。

    **实验验证。** 在小规模模型上，我们直接验证了引号闭合回路和括号类型回路的上述四项性质，其中还包括注意力选择完全由符号程序实现的程序介导回路。所得三边引号回路（embedding $\to$ 多层感知机（Multi-Layer Perceptron, MLP） 0 $\to$ 程序头 $\to$ logits）在一个经哈希固定、包含 1,280 条提示的域上，使用线性实数算术验证了全部四项性质：等价性和不变性均为 1,280/1,280；每条边有 640 个必要性见证；在 $ε=0.01$ 时通过稳健性验证，最小认证半径为 0.01515。对于同一“检测起始符并复制类型”任务的两个字母表变体，未经修改的门控暴露出一个局部化边界：括号类型抽取只有在使用全部 144 个注意力头时才完全准确，而构造出的引号产物只需三条边即可完成验证。经验证的对象是经过校准的人工产物，而非未经修改的原模型，并且所有主张都只适用于明确声明的域。

    **结论与证据。** 基于朴素发现结果的验证由于可测量的原因而失败；在大规模场景中，我们发现必须主动构造一个能够验证的对象。形式结果在明确假设下具有较强支持，实验或构造也验证了其预测后果；结论范围受这些假设约束，不能自动推广到所有架构和训练设置。
