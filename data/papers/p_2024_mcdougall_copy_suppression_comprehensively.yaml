  en: 'We present the copy suppression motif: an algorithm implemented by attention
    heads in large language models that reduces loss.If i) language model components
    in earlier layers predict a certain token, ii) this token appears earlier in the
    context and iii) later attention heads in the model suppress prediction of the
    token, then this is copy suppression. To show the importance of copy suppression,
    we focus on reverse-engineering attention head 10.7 (L10H7) in GPT-2 Small. This
    head suppresses naive copying behavior which improves overall model calibration,
    which explains why multiple prior works studying certain narrow tasks found negative
    heads that systematically favored the wrong answer. We uncover the mechanism that
    the negative heads use for copy suppression with weights-based evidence and are
    able to explain 76.9% of the impact of L10H7 in GPT-2 Small, by this motif alone.To
    the best of our knowledge, this is the most comprehensive description of the complete
    role of a component in a language model to date. One major effect of copy suppression
    is its role in self-repair. Self-repair refers to how ablating crucial model components
    results in downstream neural network parts compensating for this ablation. Copy
    suppression leads to self-repair: if an initial overconfident copier is ablated,
    then there is nothing to suppress. We show that self-repair is implemented by
    several mechanisms, one of which is copy suppression, which explains 39% of the
    behavior in a narrow task. Interactive visualizations of the copy suppression
    phenomena may be seen at our web app https://copy-suppression.streamlit.app/.'
  zh: >-
    我们提出“复制抑制”模体：这是大语言模型中的注意力头为降低损失而实现的一种算法。如果（i）较早层中的语言模型组件预测某个 token，（ii）该 token 先前已在上下文中出现，并且（iii）模型中较后的注意力头抑制对该 token 的预测，那么这一过程就是复制抑制。为说明复制抑制的重要性，我们重点对 GPT-2 Small 的注意力头 10.7（L10H7）进行逆向工程。该注意力头通过抑制朴素复制行为来改善模型整体校准，这也解释了为何此前多项研究在某些狭窄任务中发现了系统性偏向错误答案的负向注意力头。我们利用基于权重的证据揭示负向注意力头实施复制抑制的机制，并且仅凭这一模体便能解释 L10H7 在 GPT-2 Small 中 76.9% 的影响。据我们所知，这是迄今对语言模型中单个组件完整作用最全面的描述。复制抑制的一项重要影响体现在自修复中。自修复是指：消融关键模型组件后，下游神经网络部分会对该消融进行补偿。复制抑制会导致自修复——如果最初那个过度自信的复制组件被消融，便不再有需要抑制的对象。我们表明，自修复由多种机制实现，其中之一就是复制抑制；在一个狭窄任务中，它可以解释 39% 的行为。复制抑制现象的交互式可视化可见于我们的 Web 应用：https://copy-suppression.streamlit.app/。
