  en: |-
    **Research Question.** Are apparently abrupt capability transitions driven by smoother changes in internal mechanisms? In this paper, *Progress measures for grokking via mechanistic interpretability* addresses that question through its specific object of study and tests how far the resulting claim can be supported. Neural networks often exhibit emergent behavior, where qualitatively new capabilities arise from scaling up the amount of parameters, training data, or training steps. One approach to understanding emergence is to find continuous progress measures that underlie the seemingly discontinuous qualitative changes.

    **Method.** We argue that progress measures can be found via mechanistic interpretability: reverse-engineering learned behaviors into their individual components. We fully reverse engineer the algorithm learned by these networks, which uses discrete Fourier transforms and trigonometric identities to convert addition to rotation about a circle. Based on this understanding, we define progress measures that allow us to study the dynamics of training and split training into three continuous phases: memorization, circuit formation, and cleanup.

    **Validation.** As a case study, we investigate the recently-discovered phenomenon of ``grokking'' exhibited by small transformers trained on modular addition tasks. We confirm the algorithm by analyzing the activations and weights and by performing ablations in Fourier space.

    **Conclusion & Evidence.** Our results show that grokking, rather than being a sudden shift, arises from the gradual amplification of structured mechanisms encoded in the weights, followed by the later removal of memorizing components. The evidence is primarily descriptive or correlational: it establishes a repeatable pattern in the studied models, but does not by itself identify a necessary causal mechanism or guarantee generalization beyond those settings.
  zh: |-
    **研究问题。** 看似突然出现的 grokking 是否由模型内部更平滑的机制变化驱动？通过逆向工程 modular addition circuit，能否构造在 test accuracy 跃迁之前连续变化且与泛化因果相关的 progress measures，并解释 memorization、circuit formation 与 cleanup 三阶段？

    **方法。** 我们主张，可以通过机制可解释性——把学到的行为逆向工程为各个组成部分——找到这类进展度量。我们完整逆向工程了这些网络学到的算法：它使用离散傅里叶变换和三角恒等式，把加法转换为绕圆旋转。基于这种理解，我们定义了用于研究训练动力学的进展度量，并把训练划分为三个连续阶段：记忆、回路形成和清理。

    **实验验证。** 作为案例研究，我们考察在模加法任务上训练的小型 Transformer 最近表现出的“顿悟”（grokking）现象。我们通过分析激活和权重以及在傅里叶空间中实施消融来验证这一算法。

    **结论与证据。** 结果表明，顿悟并非突然发生的转变，而是源于权重所编码的结构化机制逐步增强，随后记忆型组件又在较晚阶段被移除。证据主要属于描述性或相关性证据：它确认了所研究模型中的可复现规律，但不能单独识别必要的因果机制，也不能保证结论超出这些设置后仍成立。
