abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2209.10652
  en: Neural networks often pack many unrelated concepts into a single neuron - a
    puzzling phenomenon known as 'polysemanticity' which makes interpretability much
    more challenging. This paper provides a toy model where polysemanticity can be
    fully understood, arising as a result of models storing additional sparse features
    in"superposition."We demonstrate the existence of a phase change, a surprising
    connection to the geometry of uniform polytopes, and evidence of a link to adversarial
    examples. We also discuss potential implications for mechanistic interpretability.
  zh: >-
    神经网络经常把许多互不相关的概念装入同一个神经元。这种令人困惑的现象称为“多义性”，会使可解释性研究困难得多。本文给出一个可以完整理解多义性的玩具模型；在该模型中，多义性源于模型以“叠加”方式存储额外的稀疏特征。我们展示了相变的存在、它与均匀多面体几何之间令人意外的联系，以及它与对抗样本相关的证据。我们还讨论了这些发现对机制可解释性的潜在影响。
