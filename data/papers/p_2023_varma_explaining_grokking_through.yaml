abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2309.02390
  en: 'One of the most surprising puzzles in neural network generalisation is grokking:
    a network with perfect training accuracy but poor generalisation will, upon further
    training, transition to perfect generalisation. We propose that grokking occurs
    when the task admits a generalising solution and a memorising solution, where
    the generalising solution is slower to learn but more efficient, producing larger
    logits with the same parameter norm. We hypothesise that memorising circuits become
    more inefficient with larger training datasets while generalising circuits do
    not, suggesting there is a critical dataset size at which memorisation and generalisation
    are equally efficient. We make and confirm four novel predictions about grokking,
    providing significant evidence in favour of our explanation. Most strikingly,
    we demonstrate two novel and surprising behaviours: ungrokking, in which a network
    regresses from perfect to low test accuracy, and semi-grokking, in which a network
    shows delayed generalisation to partial rather than perfect test accuracy.'
  zh: >-
    神经网络泛化中最令人惊讶的谜题之一是“顿悟”（grokking）：一个训练准确率完美但泛化能力很差的网络，在继续训练后会转变为完美泛化。我们提出，当一项任务同时存在泛化解和记忆解，而泛化解虽然学习较慢、效率却更高——即在相同参数范数下产生更大的 logits——时，顿悟就会发生。我们假设，随着训练数据集增大，记忆回路的效率会降低，而泛化回路不会，因此存在一个临界数据集规模，使记忆与泛化具有相同效率。我们针对顿悟提出并证实了四项新预测，为上述解释提供了有力证据。最引人注目的是，我们展示了两种新颖且出人意料的行为：反顿悟，即网络从完美测试准确率退化为较低准确率；以及半顿悟，即网络延迟泛化后只达到部分而非完美的测试准确率。
