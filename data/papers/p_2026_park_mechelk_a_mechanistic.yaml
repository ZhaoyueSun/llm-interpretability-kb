  en: |-
    **Research Question.** How can knowledge that a model has but does not express be distinguished from correlated signals and genuine absence of knowledge? In this paper, *MechELK: A Mechanistic Interpretability Framework for Eliciting Latent Knowledge in Large Language Models* addresses that question through its specific object of study and tests how far the resulting claim can be supported. Large language models (LLMs) frequently encode factual and reasoning knowledge in their internal representations that is not faithfully reflected in their surface-level outputs -- a phenomenon known as latent knowledge. Existing approaches to eliciting latent knowledge, such as Contrastive Consistency Search (CCS), rely on contrastive activation patterns and struggle with complex multi-step reasoning tasks, while mechanistic interpretability tools have primarily been used to understand model behavior rather than to extract hidden knowledge.

    **Method.** We present MechELK, a unified three-stage framework that bridges mechanistic interpretability and latent knowledge elicitation.

    **Validation.** MechELK operates through: (1) Locate -- using Sparse Autoencoder (SAE) feature analysis and activation patching to identify knowledge-bearing representations; (2) Verify -- employing causal probing to distinguish genuine latent knowledge from spurious correlations; and (3) Elicit -- applying representation engineering to surface hidden knowledge without modifying model weights. Evaluated on TruthfulQA, a curated Deceptive Alignment benchmark, and the Quirky LM dataset, MechELK achieves an average elicitation accuracy of 84.7%, outperforming CCS by 6.2% and direct linear probing by 9.1%.

    **Conclusion & Evidence.** Crucially, MechELK successfully identifies latent knowledge in 78.3% of cases where the model's surface output is incorrect or evasive, demonstrating its utility for artificial intelligence (AI) safety applications including deceptive alignment detection. The interventions provide local causal evidence for the targeted components or representations. The conclusion remains bounded to the tested models, tasks, and intervention design and need not constitute a complete mechanism.
  zh: |-
    **研究问题。** 如何把 稀疏自编码器（Sparse Autoencoder, SAE） feature analysis、activation patching 与 representation engineering 组合成 Locate–Verify–Elicit pipeline，以提取模型内部存在但未表达的知识？怎样用 causal knowledge score 区分真实 latent knowledge 与可解码的伪相关或模型根本不知道的内容？

    **方法。** 我们提出 MechELK，一个连接机制可解释性与潜在知识诱发的统一三阶段框架。

    **实验验证。** MechELK 包含：（1）定位——使用稀疏自编码器（SAE）特征分析和激活修补，识别承载知识的表征；（2）验证——使用因果探测区分真正的潜在知识与虚假相关；（3）诱发——应用表征工程，在不修改模型权重的情况下使隐藏知识呈现出来。在 TruthfulQA、经过整理的欺骗性对齐基准和 Quirky 语言模型（Language Model, LM） 数据集上的评估中，MechELK 的平均诱发准确率达到 84.7%，比 对比一致性搜索（Contrast-Consistent Search, CCS） 高 6.2%，比直接线性探测高 9.1%。

    **结论与证据。** 尤其重要的是，在模型表层输出错误或含糊其辞的案例中，MechELK 有 78.3% 能够成功识别潜在知识，体现了它在欺骗性对齐检测等 人工智能（Artificial Intelligence, AI） 安全应用中的价值。这些干预为目标组件或表示提供了局部因果证据；结论仍受所测模型、任务和干预设计限制，也不必然构成完整机制。
