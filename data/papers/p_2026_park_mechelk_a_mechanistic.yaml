abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2605.28825
  en: 'Large language models (LLMs) frequently encode factual and reasoning knowledge
    in their internal representations that is not faithfully reflected in their surface-level
    outputs -- a phenomenon known as \emph{latent knowledge}. Existing approaches
    to eliciting latent knowledge, such as Contrastive Consistency Search (CCS), rely
    on contrastive activation patterns and struggle with complex multi-step reasoning
    tasks, while mechanistic interpretability tools have primarily been used to \emph{understand}
    model behavior rather than to \emph{extract} hidden knowledge. We present \textbf{MechELK},
    a unified three-stage framework that bridges mechanistic interpretability and
    latent knowledge elicitation. MechELK operates through: (1) \textbf{Locate} --
    using Sparse Autoencoder (SAE) feature analysis and activation patching to identify
    knowledge-bearing representations; (2) \textbf{Verify} -- employing causal probing
    to distinguish genuine latent knowledge from spurious correlations; and (3) \textbf{Elicit}
    -- applying representation engineering to surface hidden knowledge without modifying
    model weights. Evaluated on TruthfulQA, a curated Deceptive Alignment benchmark,
    and the Quirky LM dataset, MechELK achieves an average elicitation accuracy of
    84.7\%, outperforming CCS by 6.2\% and direct linear probing by 9.1\%. Crucially,
    MechELK successfully identifies latent knowledge in 78.3\% of cases where the
    model''s surface output is incorrect or evasive, demonstrating its utility for
    AI safety applications including deceptive alignment detection.'
  zh: >-
    大语言模型（LLM）经常在内部表征中编码事实与推理知识，却未能在表层输出中忠实反映这些知识；这种现象称为潜在知识。现有潜在知识诱发方法（例如对比一致性搜索，CCS）依赖对比激活模式，难以处理复杂的多步推理任务；与此同时，机制可解释性工具主要用于理解模型行为，而不是提取隐藏知识。我们提出 MechELK，一个连接机制可解释性与潜在知识诱发的统一三阶段框架。MechELK 包含：（1）定位——使用稀疏自编码器（SAE）特征分析和激活修补，识别承载知识的表征；（2）验证——使用因果探测区分真正的潜在知识与虚假相关；（3）诱发——应用表征工程，在不修改模型权重的情况下使隐藏知识呈现出来。在 TruthfulQA、经过整理的欺骗性对齐基准和 Quirky LM 数据集上的评估中，MechELK 的平均诱发准确率达到 84.7%，比 CCS 高 6.2%，比直接线性探测高 9.1%。尤其重要的是，在模型表层输出错误或含糊其辞的案例中，MechELK 有 78.3% 能够成功识别潜在知识，体现了它在欺骗性对齐检测等 AI 安全应用中的价值。
