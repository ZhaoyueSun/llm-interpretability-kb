abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2304.14997
  en: 'Through considerable effort and intuition, several recent works have reverse-engineered
    nontrivial behaviors of transformer models. This paper systematizes the mechanistic
    interpretability process they followed. First, researchers choose a metric and
    dataset that elicit the desired model behavior. Then, they apply activation patching
    to find which abstract neural network units are involved in the behavior. By varying
    the dataset, metric, and units under investigation, researchers can understand
    the functionality of each component. We automate one of the process'' steps: to
    identify the circuit that implements the specified behavior in the model''s computational
    graph. We propose several algorithms and reproduce previous interpretability results
    to validate them. For example, the ACDC algorithm rediscovered 5/5 of the component
    types in a circuit in GPT-2 Small that computes the Greater-Than operation. ACDC
    selected 68 of the 32,000 edges in GPT-2 Small, all of which were manually found
    by previous work. Our code is available at https://github.com/ArthurConmy/Automatic-Circuit-Discovery.'
  zh: >-
    近期多项工作凭借大量努力与直觉，逆向工程了 Transformer 模型中一些并非平凡的行为。本文将这些工作所遵循的机制可解释性流程系统化。首先，研究者选择能够诱发目标模型行为的指标和数据集；随后应用激活修补，找出哪些抽象神经网络单元参与该行为；通过改变所研究的数据集、指标和单元，研究者可以理解各组件的功能。我们自动化了这一流程中的一个步骤：识别模型计算图中实现指定行为的回路。我们提出多种算法，并通过复现此前的可解释性结果加以验证。例如，ACDC 算法重新发现了 GPT-2 Small 中计算“大于”操作的一个回路里全部五类组件。ACDC 从 GPT-2 Small 的 32,000 条边中选择了 68 条，而这些边此前都已由人工研究发现。代码见 https://github.com/ArthurConmy/Automatic-Circuit-Discovery。
