abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2509.17588
  en: Large Vision-Language Models (LVLMs) answer visual questions by transferring
    information from images to text through a series of attention heads. While this
    image-to-text information flow is central to visual question answering, its underlying
    mechanism remains difficult to interpret due to the simultaneous operation of
    numerous attention heads. To address this challenge, we propose head attribution,
    a technique inspired by component attribution methods, to identify consistent
    patterns among attention heads that play a key role in information transfer. Using
    head attribution, we investigate how LVLMs rely on specific attention heads to
    identify and answer questions about the main object in an image. Our analysis
    reveals that a distinct subset of attention heads facilitates the image-to-text
    information flow. Remarkably, we find that the selection of these heads is governed
    by the semantic content of the input image rather than its visual appearance.
    We further examine the flow of information at the token level and discover that
    (1) text information first propagates to role-related tokens and the final token
    before receiving image information, and (2) image information is embedded in both
    object-related and background tokens. Our work provides evidence that image-to-text
    information flow follows a structured process, and that analysis at the attention-head
    level offers a promising direction toward understanding the mechanisms of LVLMs.
  zh: >-
    大型视觉语言模型（LVLM）通过一系列注意力头把信息从图像传递到文本，从而回答视觉问题。尽管这种图像到文本的信息流是视觉问答的核心，但由于大量注意力头同时运行，其底层机制仍难以解释。为应对这一挑战，我们提出受组件归因方法启发的注意力头归因技术，用于识别在信息传递中发挥关键作用的注意力头之间的一致模式。借助注意力头归因，我们研究大型视觉语言模型如何依靠特定注意力头识别图像中的主要物体并回答相关问题。分析显示，一组明确的注意力头促进了图像到文本的信息流。值得注意的是，这些注意力头的选择由输入图像的语义内容而非视觉外观决定。我们进一步考察 token 层面的信息流，并发现：（1）文本信息首先传播到与角色有关的 token 和最后一个 token，随后才接收图像信息；（2）图像信息同时嵌入与物体有关的 token 和背景 token。我们的工作证明，图像到文本的信息流遵循结构化过程，而在注意力头层面开展分析，是理解大型视觉语言模型机制的一条有前景路径。
