  en: |-
    **Research Question.** Are safety, refusal, and hidden-trigger behaviors implemented by low-dimensional directions or distributed circuits? In this paper, *The Geometry of Refusal: Linear Instability in Safety-Aligned large language models (LLMs)* addresses that question through its specific object of study and tests how far the resulting claim can be supported.

    **Method.** Modern Large Language Models (LLMs) rely on extensive safety alignment, yet the mechanistic basis of refusal remains opaque.In this work, we investigate whether safety compliance is a deep semantic decision or a manipulable linear feature.We introduce Contrastive Logit Steering (CLS), a zero-optimization framework that isolates the "refusal direction" by contrasting hidden states derived from safe and unrestricted system prompts.Unlike representation engineering methods that intervene on internal activations, CLS operates directly on the output distribution, serving as a diagnostic probe for alignment fragility.When coupled with prefix injection to bypass initial refusal reflexes, this method induces a phase transition where guardrails collapse.Our experiments on 7 model families reveal that safety implementation is architecturally deterministic.While models like Llama-3.1 exhibit a "Late Decision" topology that is easily bypassed by CLS (reaching 95% ASR in milliseconds), others like Qwen-2.5 demonstrate "Early Divergence" by integrating safety mid-computation.Direct comparison with established activationlevel steering methods shows that CLS achieves substantially higher attack success rates on Llama 2 (73% vs. 22.6%) and Qwen 7B (91% vs. 79.2%),demonstrating that logit-level intervention exposes alignment vulnerabilities that hidden-state methods underestimate.Beyond attacks, we show that this linearity enables bidirectional control: inverting the steering vector "hardens" models against jailbreaks without retraining.Our findings suggest that current alignment techniques create a steerable "safety axis" that serves as both a critical vulnerability and a precise primitive for defense.

    **Validation.** Modern Large Language Models (LLMs) rely on extensive safety alignment, yet the mechanistic basis of refusal remains opaque.In this work, we investigate whether safety compliance is a deep semantic decision or a manipulable linear feature.We introduce Contrastive Logit Steering (CLS), a zero-optimization framework that isolates the "refusal direction" by contrasting hidden states derived from safe and unrestricted system prompts.Unlike representation engineering methods that intervene on internal activations, CLS operates directly on the output distribution, serving as a diagnostic probe for alignment fragility.When coupled with prefix injection to bypass initial refusal reflexes, this method induces a phase transition where guardrails collapse.Our experiments on 7 model families reveal that safety implementation is architecturally deterministic.While models like Llama-3.1 exhibit a "Late Decision" topology that is easily bypassed by CLS (reaching 95% ASR in milliseconds), others like Qwen-2.5 demonstrate "Early Divergence" by integrating safety mid-computation.Direct comparison with established activationlevel steering methods shows that CLS achieves substantially higher attack success rates on Llama 2 (73% vs. 22.6%) and Qwen 7B (91% vs. 79.2%),demonstrating that logit-level intervention exposes alignment vulnerabilities that hidden-state methods underestimate.Beyond attacks, we show that this linearity enables bidirectional control: inverting the steering vector "hardens" models against jailbreaks without retraining.Our findings suggest that current alignment techniques create a steerable "safety axis" that serves as both a critical vulnerability and a precise primitive for defense.

    **Conclusion & Evidence.** Modern Large Language Models (LLMs) rely on extensive safety alignment, yet the mechanistic basis of refusal remains opaque.In this work, we investigate whether safety compliance is a deep semantic decision or a manipulable linear feature.We introduce Contrastive Logit Steering (CLS), a zero-optimization framework that isolates the "refusal direction" by contrasting hidden states derived from safe and unrestricted system prompts.Unlike representation engineering methods that intervene on internal activations, CLS operates directly on the output distribution, serving as a diagnostic probe for alignment fragility.When coupled with prefix injection to bypass initial refusal reflexes, this method induces a phase transition where guardrails collapse.Our experiments on 7 model families reveal that safety implementation is architecturally deterministic.While models like Llama-3.1 exhibit a "Late Decision" topology that is easily bypassed by CLS (reaching 95% ASR in milliseconds), others like Qwen-2.5 demonstrate "Early Divergence" by integrating safety mid-computation.Direct comparison with established activationlevel steering methods shows that CLS achieves substantially higher attack success rates on Llama 2 (73% vs. 22.6%) and Qwen 7B (91% vs. 79.2%),demonstrating that logit-level intervention exposes alignment vulnerabilities that hidden-state methods underestimate.Beyond attacks, we show that this linearity enables bidirectional control: inverting the steering vector "hardens" models against jailbreaks without retraining.Our findings suggest that current alignment techniques create a steerable "safety axis" that serves as both a critical vulnerability and a precise primitive for defense. The interventions provide local causal evidence for the targeted components or representations. The conclusion remains bounded to the tested models, tasks, and intervention design and need not constitute a complete mechanism.
  zh: |-
    **研究问题。** 安全 fine-tuning 是真正删除有害知识，还是在输出附近叠加可分离的 linear refusal wrapper？通过 contrast safe/unrestricted logits 得到的 refusal vector 能否揭示 late-decision 与 early-divergence 两类安全拓扑，并被减除或反向增强？

    **方法。** 本文研究安全合规究竟是一种深层语义决策，还是可操纵的线性特征。我们提出对比式 Logit 引导（Contrastive Logit Steering，CLS），这是一种无需优化的框架，通过对比安全系统提示和不受限系统提示产生的隐藏状态，分离出“拒答方向”。将其与前缀注入结合以绕过初始拒答反射后，该方法会诱发一道相变，使安全护栏崩溃。

    **实验验证。** 不同于干预内部激活的表征工程方法，CLS 直接作用于输出分布，可作为诊断对齐脆弱性的探针。我们在七个模型家族上的实验表明，安全机制的实现具有架构决定性。与成熟的激活层引导方法直接比较时，CLS 在 Llama 2 上取得 73% 对 22.6%、在 Qwen 7B 上取得 91% 对 79.2% 的更高攻击成功率，说明 logit 层干预揭示了隐藏状态方法低估的对齐漏洞。

    **结论与证据。** Llama-3.1 等模型呈现容易被 CLS 绕过的“后期决策”拓扑，攻击成功率可在毫秒内达到 95%；Qwen-2.5 等模型则在计算中途整合安全信息，表现为“早期分化”。除攻击之外，我们还表明这种线性结构支持双向控制：反转引导向量可以在无需重新训练的情况下增强模型抵抗越狱的能力。结果表明，当前对齐技术会形成一条可引导的“安全轴”，它既是关键漏洞，也可作为精确防御的基本操作单元。这些干预为目标组件或表示提供了局部因果证据；结论仍受所测模型、任务和干预设计限制，也不必然构成完整机制。
