  en: |-
    **Research Question.** Do different modalities use structurally different but functionally related mechanisms for the same task? In this paper, *Sparse Visual Thought Circuits in Vision-Language Models* addresses that question through its specific object of study and tests how far the resulting claim can be supported. Sparse autoencoders (SAEs) improve interpretability in multimodal models, but it remains unclear whether SAE features form modular, composable units for reasoning-an assumption underlying many intervention-based steering methods.

    **Method.** We develop a reproducible causal pipeline to localize and test these sparse visual thought circuits in Qwen3-VL-8B.

    **Validation.** We test this modularity hypothesis and find it often fails: intervening on a task-selective feature set can modestly improve reasoning accuracy, while intervening on the union of two such sets reliably induces output drift (large unintended changes in predictions) and degrades accuracy, even under norm-matched perturbations. This non modular circuit interference is consistent with shared internal pathways where feature unions amplify activation shifts. On a controlled synthetic benchmark with seven task types and three difficulty levels, linear probes identify a mid decoder locus for task type information. We train SAEs at this layer, construct task-selective sets via an explicit rule, and perform inference time scaling and ablation while quantifying accuracy and drift.

    **Conclusion & Evidence.** Our findings-validated with bootstrapped subsamples and permutation controls, and replicated across multiple vision–language model (VLM) families and five diverse datasets clarify the boundaries of SAE feature composability and provide a rigorous diagnostic framework for more reliable VLM control. The counterexamples or controls strongly delimit what the audited method can justify. They do not, on their own, prove that any proposed replacement is universally faithful or sufficient.
  zh: |-
    **研究问题。** 视觉推理是否由可线性组合的稀疏模块组成，还是因表示几何纠缠而本质非模块化？稀疏自编码器（Sparse Autoencoder, SAE） features 对推理是否因果必要且单独可 steering，而其合并为何会因 non-orthogonality 与 off-manifold drift 产生干扰？

    **方法。** 这种非模块化的回路干扰与共享内部路径相一致，因为特征并集会放大激活偏移。

    **实验验证。** 我们检验了该模块化假设，并发现它经常失效：干预一个任务选择性特征集合可以小幅提高推理准确率，但干预两个此类集合的并集会稳定地引起输出漂移，即预测发生大量非预期变化，并降低准确率；即使扰动经过范数匹配，这一现象依然存在。我们建立了一套可复现的因果流程，用于在 Qwen3-VL-8B 中定位并检验这些稀疏视觉思维回路。在一个包含七种任务类型和三个难度等级的受控合成基准上，线性探针识别出解码器中层的任务类型信息位置。我们在该层训练 SAE，依据明确规则构造任务选择性集合，并在量化准确率和漂移的同时进行推理时缩放与消融。

    **结论与证据。** 研究结果通过 bootstrap 子样本和置换对照得到验证，并在多个视觉语言模型家族和五个不同数据集上复现。这些结果厘清了 SAE 特征可组合性的边界，并为更可靠地控制视觉语言模型提供了严格的诊断框架。反例和控制实验有力限定了被审计方法能够支持的结论，但它们本身不能证明任何替代方法普遍忠实或充分。
