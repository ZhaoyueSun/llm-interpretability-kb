ai_summary:
  basis: PaperKnowledgeBase Docling full text, verified abstract, and project research-question review
  en: |-
    **Research Question.** Do fine-tuning and post-training create new mechanisms, or strengthen, suppress, and reorganize existing ones? In this paper, *I Have Covered All the Bases Here: Interpreting Reasoning Features in Large Language Models via Sparse Autoencoders* addresses that question through its specific object of study and tests how far the resulting claim can be supported. Recent LLMs like DeepSeek-R1 have demonstrated state-of-the-art performance by integrating deep thinking and complex reasoning during generation. However, the internal mechanisms behind these reasoning processes remain unexplored.

    **Method.** We hypothesize these words correspond to specific reasoning moments within the models' internal mechanisms. We introduce ReasonScore, an automatic metric to identify active SAE features during these reasoning moments.

    **Validation.** To test this hypothesis, we employ Sparse Autoencoders (SAEs), a technique for sparse decomposition of neural network activations into human-interpretable features. Through steering experiments, we demonstrate that amplifying these features increases performance on reasoning-intensive benchmarks (+2.2%) while producing longer reasoning traces (+20.5%).

    **Conclusion & Evidence.** We observe reasoning LLMs consistently use vocabulary associated with human reasoning processes. We perform manual and automatic interpretation of the features detected by our metric, and find those with activation patterns matching uncertainty, exploratory thinking, and reflection. Using the model diffing technique, we provide evidence that these features are present only in models with reasoning capabilities. Our work provides the first step towards a mechanistic understanding of reasoning in LLMs. The evidence is primarily descriptive or correlational: it establishes a repeatable pattern in the studied models, but does not by itself identify a necessary causal mechanism or guarantee generalization beyond those settings.
  zh: |-
    **研究问题。** reasoning 大语言模型（Large Language Model, LLM） 的 uncertainty、exploration 与 reflection 是否编码为可由 稀疏自编码器（Sparse Autoencoder, SAE） 和 ReasonScore 识别的稀疏方向？这些 features 是否在 reasoning fine-tuning 后出现，并可通过 steering 因果性地延长推理与提升任务表现？

    **方法。** 我们假设，这些词对应于模型内部机制中的特定推理时刻。我们提出 ReasonScore，一种用于识别这些推理时刻中活跃 SAE 特征的自动指标。

    **实验验证。** 为检验该假说，我们采用稀疏自编码器（SAE），把神经网络激活稀疏分解为人类可解释的特征。我们对该指标检测出的特征进行人工和自动解释，并发现一些特征的激活模式分别对应不确定性、探索性思考和反思。引导实验表明，放大这些特征可以提升模型在推理密集型基准上的表现（+2.2%），同时产生更长的推理轨迹（+20.5%）。

    **结论与证据。** 我们观察到，推理型语言模型会持续使用与人类推理过程有关的词汇。借助模型差分技术，我们给出证据表明，这些特征只存在于具备推理能力的模型中。本工作是迈向机制层面理解语言模型推理的第一步。证据主要属于描述性或相关性证据：它确认了所研究模型中的可复现规律，但不能单独识别必要的因果机制，也不能保证结论超出这些设置后仍成立。
