abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2506.09047
  en: 'Vision-Language models (VLMs) show impressive abilities to answer questions
    on visual inputs (e.g., counting objects in an image), yet demonstrate higher
    accuracies when performing an analogous task on text (e.g., counting words in
    a text). We investigate this accuracy gap by identifying and comparing the \textit{circuits}
    - the task-specific computational sub-graphs - in different modalities. We show
    that while circuits are largely disjoint between modalities, they implement relatively
    similar functionalities: the differences lie primarily in processing modality-specific
    data positions (an image or a text sequence). Zooming in on the image data representations,
    we observe they become aligned with the higher-performing analogous textual representations
    only towards later layers, too late in processing to effectively influence subsequent
    positions. To overcome this, we patch the representations of visual data tokens
    from later layers back into earlier layers. In experiments with multiple tasks
    and models, this simple intervention closes a third of the performance gap between
    the modalities, on average. Our analysis sheds light on the multi-modal performance
    gap in VLMs and suggests a training-free approach for reducing it.'
  zh: >-
    视觉语言模型（VLM）在回答有关视觉输入的问题时展现出令人印象深刻的能力（例如统计图像中的物体），但在文本上执行对应任务时（例如统计文本中的单词）准确率更高。我们通过识别并比较不同模态中的回路——即任务特定的计算子图——来研究这一准确率差距。我们发现，不同模态的回路虽然大多互不重叠，但实现的功能相对相似；差异主要在于对模态特定数据位置（图像或文本序列）的处理。进一步观察图像数据表征可以发现，它们直到较后层才与表现更好的对应文本表征对齐，此时在处理流程中已为时过晚，无法有效影响后续位置。为解决这一问题，我们把较后层的视觉数据 token 表征修补回较早层。在涉及多个任务和模型的实验中，这项简单干预平均弥合了模态间性能差距的三分之一。我们的分析揭示了 VLM 多模态性能差距的成因，并提出一种无需训练即可缩小该差距的方法。
