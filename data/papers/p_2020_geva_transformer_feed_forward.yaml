abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2012.14913
  en: Feed-forward layers constitute two-thirds of a transformer model’s parameters,
    yet their role in the network remains under-explored. We show that feed-forward
    layers in transformer-based language models operate as key-value memories, where
    each key correlates with textual patterns in the training examples, and each value
    induces a distribution over the output vocabulary. Our experiments show that the
    learned patterns are human-interpretable, and that lower layers tend to capture
    shallow patterns, while upper layers learn more semantic ones. The values complement
    the keys’ input patterns by inducing output distributions that concentrate probability
    mass on tokens likely to appear immediately after each pattern, particularly in
    the upper layers. Finally, we demonstrate that the output of a feed-forward layer
    is a composition of its memories, which is subsequently refined throughout the
    model’s layers via residual connections to produce the final output distribution.
  zh: >-
    前馈层占据 Transformer 模型约三分之二的参数，但其在网络中的作用仍未得到充分研究。我们表明，基于 Transformer
    的语言模型中的前馈层以键值记忆的形式运作：每个键与训练样例中的文本模式相关，而每个值则诱导输出词表上的一个分布。实验显示，模型学到的模式具有人类可解释性；较低层倾向于捕捉浅层模式，而较高层则学习更具语义性的模式。各个值通过诱导输出分布来补充其键所对应的输入模式；这些分布会将概率质量集中到最可能紧随相应模式出现的
    token 上，且这一现象在较高层尤为明显。最后，我们证明，前馈层的输出是其多项记忆的组合；随后，该组合在模型各层中经由残差连接不断细化，最终形成输出分布。
