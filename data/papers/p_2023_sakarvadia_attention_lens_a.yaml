abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2310.16270
  en: Transformer-based Large Language Models (LLMs) are the state-of-the-art for
    natural language tasks. Recent work has attempted to decode, by reverse engineering
    the role of linear layers, the internal mechanisms by which LLMs arrive at their
    final predictions for text completion tasks. Yet little is known about the specific
    role of attention heads in producing the final token prediction. We propose Attention
    Lens, a tool that enables researchers to translate the outputs of attention heads
    into vocabulary tokens via learned attention-head-specific transformations called
    lenses. Preliminary findings from our trained lenses indicate that attention heads
    play highly specialized roles in language models. The code for Attention Lens
    is available at github.com/msakarvadia/AttentionLens.
  zh: >-
    基于 Transformer 的大语言模型（LLM）代表了自然语言任务的先进水平。近期研究试图通过逆向工程线性层的作用，解码语言模型得出文本补全任务最终预测的内部机制。然而，对于注意力头在生成最终 token 预测中发挥的具体作用，我们仍知之甚少。我们提出 Attention Lens 工具；它使用学习得到的、针对各个注意力头的变换——称为“透镜”——把注意力头输出转换为词汇 token。训练所得透镜的初步结果表明，注意力头在语言模型中承担高度专门化的作用。Attention Lens 代码见 github.com/msakarvadia/AttentionLens。
