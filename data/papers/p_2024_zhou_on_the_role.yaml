abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2410.13708
  en: Large language models (LLMs) achieve state-of-the-art performance on multiple
    language tasks, yet their safety guardrails can be circumvented, leading to harmful
    generations. In light of this, recent research on safety mechanisms has emerged,
    revealing that when safety representations or component are suppressed, the safety
    capability of LLMs are compromised. However, existing research tends to overlook
    the safety impact of multi-head attention mechanisms, despite their crucial role
    in various model functionalities. Hence, in this paper, we aim to explore the
    connection between standard attention mechanisms and safety capability to fill
    this gap in the safety-related mechanistic interpretability. We propose a novel
    metric which tailored for multi-head attention, the Safety Head ImPortant Score
    (Ships), to assess the individual heads' contributions to model safety. Based
    on this, we generalize Ships to the dataset level and further introduce the Safety
    Attention Head AttRibution Algorithm (Sahara) to attribute the critical safety
    attention heads inside the model. Our findings show that the special attention
    head has a significant impact on safety. Ablating a single safety head allows
    aligned model (e.g., Llama-2-7b-chat) to respond to 16 times more harmful queries,
    while only modifying 0.006% of the parameters, in contrast to the ~ 5% modification
    required in previous studies. More importantly, we demonstrate that attention
    heads primarily function as feature extractors for safety and models fine-tuned
    from the same base model exhibit overlapping safety heads through comprehensive
    experiments. Together, our attribution approach and findings provide a novel perspective
    for unpacking the black box of safety mechanisms within large models.
  zh: >-
    大语言模型（LLM）在多项语言任务上取得了最先进的性能，但其安全护栏可能被绕过，从而生成有害内容。鉴于此，近期关于安全机制的研究发现，当安全表征或安全组件受到抑制时，语言模型的安全能力会受损。然而，尽管多头注意力机制对多种模型功能至关重要，现有研究往往忽略它对安全性的影响。为填补安全相关机制可解释性中的这一空白，本文探索标准注意力机制与安全能力之间的联系。我们提出一个为多头注意力定制的新指标——安全注意力头重要性分数（Safety Head ImPortant Score，Ships），用于评估各个注意力头对模型安全性的贡献。在此基础上，我们把 Ships 推广到数据集层面，并进一步提出安全注意力头归因算法（Safety Attention Head AttRibution Algorithm，Sahara），以归因模型内部关键的安全注意力头。研究发现，特定注意力头会显著影响安全性。只消融一个安全注意力头，就会使经过对齐的模型（如 Llama-2-7b-chat）回答的有害问题增至原来的 16 倍，而修改的参数仅占 0.006%；相比之下，既有研究需要修改约 5% 的参数。更重要的是，广泛实验表明，注意力头在安全机制中主要充当特征提取器，并且从同一基础模型微调得到的模型具有相互重叠的安全注意力头。我们的归因方法和研究发现为剖析大模型安全机制这一黑箱提供了新视角。
