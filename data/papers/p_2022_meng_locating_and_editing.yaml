ai_summary:
  basis: PaperKnowledgeBase Docling full text, verified abstract, and project research-question review
  en: |-
    **Research Question.** The paper asks where and in what computational form autoregressive language models store and recall factual associations. It further tests whether a correct localization should make it possible to edit one fact directly while preserving paraphrase generalization and specificity to unrelated facts.

    **Method.** Causal tracing corrupts the subject representation and then restores individual hidden states from a clean run; the increase in the correct object's probability estimates each state's indirect effect. This motivates the hypothesis that middle-layer multilayer perceptrons (MLPs) at the final subject token act as associative memories. Rank-One Model Editing (ROME) then inserts a new subject–object key–value association with a covariance-adjusted rank-one update to an MLP projection matrix.

    **Validation.** Causal tracing is run on 1,000 factual statements in GPT-2 XL. Editing is tested on 10,000 zero-shot relation extraction records and on COUNTERFACT, including 7,500 GPT-2 XL and 2,000 GPT-J cases. Evaluations measure efficacy, paraphrase generalization, interference with neighboring entities, generation consistency, and fluency, with layer–token sweeps, human judgments, and comparisons to fine-tuning, Knowledge Neurons, Knowledge Editor, and Model Editor Networks with Gradient Decomposition.

    **Conclusion & Evidence.** Restoring and editing middle-layer MLP states at the final subject token produces the strongest effects. ROME reaches composite COUNTERFACT scores of 89.2 on GPT-2 XL and 91.5 on GPT-J, with near-perfect edit efficacy and substantially better generalization–specificity balance than the tested baselines. The converging activation and weight interventions provide strong local causal evidence for this site, but do not prove that all knowledge is exclusively stored there or that the mechanism covers logical, numerical, or large-scale multi-fact editing.
  zh: |-
    **研究问题。** 论文研究自回归语言模型在何处、以何种计算形式存储和召回事实关联，并进一步检验：如果定位正确，能否直接修改该局部计算，使模型学会新事实，同时保持改写泛化性以及对无关事实的特异性。

    **方法。** 因果追踪先破坏主语表示，再逐层恢复干净运行中的单个隐藏状态，以正确宾语概率的恢复幅度估计该状态的间接效应。结果导向“中间层多层感知机（Multi-Layer Perceptron, MLP）在主语最后一个 token 上充当联想记忆”的假说。秩一模型编辑（Rank-One Model Editing, ROME）随后用经过协方差校正的秩一权重更新，在 MLP 投影矩阵中写入新的主语—宾语键值关联。

    **实验验证。** 因果追踪在 GPT-2 XL 的 1,000 条事实陈述上进行；模型编辑则在 10,000 条零样本关系抽取记录和 COUNTERFACT 数据集上评估，其中包含 7,500 个 GPT-2 XL 和 2,000 个 GPT-J 测试案例。指标覆盖编辑成功率、改写泛化、邻近实体干扰、生成一致性和流畅性，并配合层—token 扫描、人工评价以及与微调、Knowledge Neurons、Knowledge Editor 和梯度分解模型编辑网络等方法的比较。

    **结论与证据。** 在主语末 token 的中间层 MLP 上恢复或编辑状态会产生最强效果。ROME 在 GPT-2 XL 和 GPT-J 的 COUNTERFACT 综合分分别达到 89.2 和 91.5，编辑成功率接近 100%，泛化—特异性平衡也明显优于所测基线。激活干预与权重干预相互印证，形成较强的局部因果证据；但它不能证明所有知识都只存储在该位置，也未覆盖逻辑、数值或大规模多事实编辑。
