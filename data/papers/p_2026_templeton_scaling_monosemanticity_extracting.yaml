ai_summary:
  basis: PaperKnowledgeBase Docling full text, verified abstract, and project research-question review
  en: |-
    **Research Question.** Can interpretable feature extraction scale to frontier models, all relevant layers and positions, and the long tail of the training distribution? In this paper, *Scaling Monosemanticity: Extracting Interpretable Features from Claude 3 Sonnet* addresses that question through its specific object of study and tests how far the resulting claim can be supported.

    **Method.** We demonstrate that sparse autoencoders can extract interpretable features from Claude 3 Sonnet, a production-scale language model, addressing the open question of whether dictionary learning methods scale beyond small transformers. We trained sparse autoencoders with up to 34 million features on the model's middle layer residual stream, using scaling laws to guide hyperparameter selection. The resulting features are multilingual and multimodal (generalizing to images despite text-only training), respond to both concrete instances and abstract discussions of concepts, and can be used to steer model behavior in ways consistent with their interpretations.

    **Validation.** However, significant limitations remain: our suite of features is incomplete, and we lack rigorous methods for evaluating whether our features faithfully capture model computations.

    **Conclusion & Evidence.** We find features corresponding to famous entities and locations, as well as more abstract concepts like sarcasm or errors in code. We also identify features relevant to ways in which language models might cause harm--including features representing deception, power-seeking, sycophancy, and bias--and show that these causally influence model outputs when manipulated. Additionally, we conduct analyses of feature interpretability, geometry, and computational function. The evidence is primarily descriptive or correlational: it establishes a repeatable pattern in the studied models, but does not by itself identify a necessary causal mechanism or guarantee generalization beyond those settings.
  zh: |-
    **研究问题。** 稀疏字典学习能否扩展到 frontier-scale model，并仍提取可解释、抽象、跨语言/模态且能 steering 行为的 features？模型规模、concept frequency 与所需 dictionary size 之间有什么规律，安全相关特征能否被发现？

    **方法。** 我们证明，稀疏自编码器可以从生产规模的语言模型 Claude 3 Sonnet 中提取可解释特征，从而回答字典学习方法能否扩展到小型 Transformer 之外这一开放问题。我们在模型中间层的残差流上训练了最多包含 3,400 万个特征的稀疏自编码器，并利用缩放定律指导超参数选择。所得特征具有多语言和多模态性质——尽管只用文本训练，却能泛化到图像；它们既响应概念的具体实例，也响应对概念的抽象讨论；还可用于以符合其解释的方式引导模型行为。

    **实验验证。** 不过，仍存在显著局限：现有特征集合并不完整，而且我们缺少严格的方法来评估这些特征是否忠实捕捉了模型计算。

    **结论与证据。** 我们发现了对应著名实体和地点的特征，也发现了讽刺或代码错误等更抽象概念的特征。我们还识别出与语言模型潜在危害方式有关的特征，包括表征欺骗、权力寻求、谄媚和偏见的特征，并表明操纵这些特征会对模型输出产生因果影响。此外，我们分析了特征的可解释性、几何结构和计算功能。证据主要属于描述性或相关性证据：它确认了所研究模型中的可复现规律，但不能单独识别必要的因果机制，也不能保证结论超出这些设置后仍成立。
