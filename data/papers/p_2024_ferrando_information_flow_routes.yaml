  en: 'Information flows by routes inside the network via mechanisms implemented in
    the model. These routes can be represented as graphs where nodes correspond to
    token representations and edges to computations. We automatically build these
    graphs in a top-down manner, for each prediction leaving only the most important
    nodes and edges. In contrast to the existing workflows relying on activation patching,
    we do this through attribution: this allows us to efficiently uncover existing
    circuits with just a single forward pass. Unlike with patching, we do not need
    a human to carefully design prediction templates, and we can extract information
    flow routes for any prediction (not just the ones among the allowed templates).
    As a result, we can analyze model behavior in general, for specific types of predictions,
    or different domains. We experiment with Llama 2 and show that some attention
    head roles are overall important, e.g. previous token heads and subword merging
    heads. Next, we find similarities in Llama 2 behavior when handling tokens of
    the same part of speech. Finally, we show that some model components can be specialized
    on domains such as coding or multilingual texts.'
  zh: >-
    信息沿着由模型内部机制实现的路径在网络中流动。这些路径可以表示为图，其中节点对应 token 表征，边对应计算。我们针对每次预测，以自上而下的方式自动构建这些图，只保留最重要的节点和边。不同于依赖激活修补的现有工作流，我们通过归因完成这一过程，因此只需一次前向传播即可高效发现已有回路。与修补方法不同，我们不需要人工精心设计预测模板，并且能为任意预测提取信息流路径，而不限于允许模板中的预测。因此，我们可以从整体上分析模型行为，也可以针对特定预测类型或不同领域展开分析。我们在 Llama 2 上进行实验，发现某些注意力头角色总体上很重要，例如前一 token 注意力头和子词合并注意力头。随后，我们发现 Llama 2 在处理词性相同的 token 时具有相似行为。最后，我们表明，一些模型组件可能专门处理编程或多语言文本等特定领域。
