abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2107.07436
  en: Shapley values are widely used to explain black-box models, but they are costly
    to calculate because they require many model evaluations. We introduce FastSHAP,
    a method for estimating Shapley values in a single forward pass using a learned
    explainer model. FastSHAP amortizes the cost of explaining many inputs via a learning
    approach inspired by the Shapley value's weighted least squares characterization,
    and it can be trained using standard stochastic gradient optimization. We compare
    FastSHAP to existing estimation approaches, revealing that it generates high-quality
    explanations with orders of magnitude speedup.
  zh: >-
    Shapley 值被广泛用于解释黑箱模型，但其计算成本很高，因为需要进行多次模型评估。我们提出 FastSHAP，一种使用学习得到的解释器模型、只经一次前向传播即可估计 Shapley 值的方法。FastSHAP 采用一种受 Shapley 值加权最小二乘表征启发的学习方法，把解释大量输入的成本摊销到训练过程，并且可以使用标准随机梯度优化进行训练。我们将 FastSHAP 与现有估计方法比较，结果显示，它能以数个数量级的速度提升生成高质量解释。
