abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2607.17770
  en: Within Explainable Artificial Intelligence, mechanistic interpretability uses
    Sparse Autoencoders (SAEs) to extract more interpretable features from neural
    representations. However, assessing their monosemanticity, and thus explanation
    quality, remains challenging. Existing metrics require external concept labels
    or depend on pretrained embedding models, making them sensitive to encoder's geometry.
    We introduce the Tversky Monosemanticity Score (TMS), a label-free metric that
    operationalizes monosemanticity as activation-set coherence of binarized SAE latents,
    and does not require external embedding encoders. We evaluate TMS on SAEs trained
    on features from pretrained vision and vision-language models (DINOv3, CLIP, BLIP2),
    two common SAE regimes (TopK, BatchTopK), multiple sparsity levels, and expansion
    factors. Our results show that TMS is less affected by encoder anisotropy than
    its embedding-based alternative, while remaining aligned with established monosemanticity
    indicators. TMS also reveals distinct SAE training dynamics across base models.
    Moreover, under encoder anisotropy, TMS provides a stronger indication of probe-based
    concept deletion effectiveness, while being competitive otherwise.
  zh: >-
    在可解释人工智能领域，机制可解释性使用稀疏自编码器（SAE）从神经表征中提取更具可解释性的特征。然而，评估这些特征的单义性，进而评估解释质量，仍然充满挑战。现有指标需要外部概念标签，或依赖预训练嵌入模型，因而会受到编码器几何结构的影响。我们提出 Tversky 单义性分数（TMS），这是一种无需标签的指标：它把单义性操作化为二值化 SAE 潜变量的激活集合一致性，并且不需要外部嵌入编码器。我们在以下范围内评估 TMS：基于预训练视觉与视觉—语言模型（DINOv3、CLIP、BLIP2）特征训练的 SAE、两种常见 SAE 方案（TopK、BatchTopK）、多个稀疏度和扩展因子。结果表明，与基于嵌入的替代指标相比，TMS 受编码器各向异性的影响更小，同时仍与已有单义性指标保持一致。TMS 还揭示了不同基础模型上各异的 SAE 训练动力学。此外，在编码器存在各向异性时，TMS 能更有力地指示基于探针的概念删除效果；在其他情况下，它也具有竞争力。
