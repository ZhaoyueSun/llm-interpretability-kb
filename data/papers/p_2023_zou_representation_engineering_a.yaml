abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2310.01405
  en: In this paper, we identify and characterize the emerging area of representation
    engineering (RepE), an approach to enhancing the transparency of AI systems that
    draws on insights from cognitive neuroscience. RepE places population-level representations,
    rather than neurons or circuits, at the center of analysis, equipping us with
    novel methods for monitoring and manipulating high-level cognitive phenomena in
    deep neural networks (DNNs). We provide baselines and an initial analysis of RepE
    techniques, showing that they offer simple yet effective solutions for improving
    our understanding and control of large language models. We showcase how these
    methods can provide traction on a wide range of safety-relevant problems, including
    honesty, harmlessness, power-seeking, and more, demonstrating the promise of top-down
    transparency research. We hope that this work catalyzes further exploration of
    RepE and fosters advancements in the transparency and safety of AI systems.
  zh: >-
    本文识别并刻画了新兴的表征工程（Representation Engineering，RepE）领域。这种增强 AI 系统透明度的方法借鉴了认知神经科学的认识。RepE 将群体层面的表征置于分析中心，而不是聚焦神经元或回路，从而为监测和操纵深度神经网络（DNN）中的高层认知现象提供新方法。我们给出 RepE 技术的基线和初步分析，表明它们能够以简单而有效的方式改善我们对大语言模型的理解和控制。我们展示了这些方法如何推动一系列与安全相关的问题，包括诚实性、无害性、权力寻求等，由此体现自上而下透明度研究的潜力。我们希望本工作能够促进对 RepE 的进一步探索，并推动 AI 系统透明度与安全性的进步。
