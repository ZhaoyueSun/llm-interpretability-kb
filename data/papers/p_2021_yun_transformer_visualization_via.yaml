  en: 'Transformer networks have revolutionized NLP representation learning since
    they were introduced. Though a great effort has been made to explain the representation
    in transformers, it is widely recognized that our understanding is not sufficient.
    One important reason is that there lack enough visualization tools for detailed
    analysis. In this paper, we propose to use dictionary learning to open up these
    ‘black boxes’ as linear superpositions of transformer factors. Through visualization,
    we demonstrate the hierarchical semantic structures captured by the transformer
    factors, e.g., word-level polysemy disambiguation, sentence-level pattern formation,
    and long-range dependency. While some of these patterns confirm the conventional
    prior linguistic knowledge, the rest are relatively unexpected, which may provide
    new insights. We hope this visualization tool can bring further knowledge and
    a better understanding of how transformer networks work. The code is available
    at: https://github.com/zeyuyun1/TransformerVis.'
  zh: >-
    Transformer 网络自问世以来彻底改变了 NLP 表征学习。尽管人们已付出大量努力解释 Transformer 中的表征，当前理解仍被广泛认为并不充分。一个重要原因，是缺少足够的可视化工具来开展细致分析。本文提出使用字典学习，把这些“黑箱”打开为 Transformer 因子的线性叠加。通过可视化，我们展示 Transformer 因子捕捉到的层级语义结构，例如词级多义消歧、句级模式形成和长距离依赖。其中一些模式印证了传统语言学先验知识，另一些则相对出人意料，可能带来新的认识。我们希望这一可视化工具能帮助人们进一步认识并更好地理解 Transformer 网络如何工作。代码见 https://github.com/zeyuyun1/TransformerVis。
