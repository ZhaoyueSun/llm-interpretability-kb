abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2304.05969
  en: Localizing behaviors of neural networks to a subset of the network's components
    or a subset of interactions between components is a natural first step towards
    analyzing network mechanisms and possible failure modes. Existing work is often
    qualitative and ad-hoc, and there is no consensus on the appropriate way to evaluate
    localization claims. We introduce path patching, a technique for expressing and
    quantitatively testing a natural class of hypotheses expressing that behaviors
    are localized to a set of paths. We refine an explanation of induction heads,
    characterize a behavior of GPT-2, and open source a framework for efficiently
    running similar experiments.
  zh: >-
    把神经网络行为定位到网络组件的一个子集，或组件交互的一个子集，是分析网络机制和潜在失效模式的自然起点。现有工作往往是定性的、临时设计的，而且对于如何恰当地评估定位主张尚无共识。我们提出路径修补，这是一种用于表达并定量检验一类自然假说的技术；这类假说认为，某些行为被定位于一组路径。我们改进了对归纳注意力头的解释，刻画了 GPT-2 的一种行为，并开源了一个高效开展类似实验的框架。
