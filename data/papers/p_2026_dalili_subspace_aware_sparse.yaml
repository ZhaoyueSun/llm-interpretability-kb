    $d_i \ge 2$ 的特征重构到误差 $\varepsilon$，所需原子的数量会随 $d_i$
    指数增长。从端到端优化的角度看，这种分裂不仅可能发生，而且会受到目标函数主动偏好。我们证明，从真实的 $d_i$ 维基到
    $\ell_1$ 正则化 SAE 目标的严格更低风险解之间存在一条连续路径，其下降方向会把任何训练得到的字典推向上述指数规模。因此，一个完整连贯的特征会被分散到许多近共线的潜变量中，产生虚假的多重性并掩盖其内在几何。受此启发，我们提出子空间感知稀疏自编码器（SASA）：用学习得到的解码子空间替代单向量解码器，通过
    Top-$s$ 分组门控施加块稀疏性，并使用核范数正则化器自适应调整每个分组的有效秩。随后我们证明，一旦块大小满足
    $r \ge d_i$，单个分组不仅可以表示整个特征切片，而且还是 SASA 目标的全局最优解。这种整合使样本复杂度从关于
