abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/1908.04626
  en: 'Attention mechanisms play a central role in NLP systems, especially within
    recurrent neural network (RNN) models. Recently, there has been increasing interest
    in whether or not the intermediate representations offered by these modules may
    be used to explain the reasoning for a model’s prediction, and consequently reach
    insights regarding the model’s decision-making process. A recent paper claims
    that ‘Attention is not Explanation’ (Jain and Wallace, 2019). We challenge many
    of the assumptions underlying this work, arguing that such a claim depends on
    one’s definition of explanation, and that testing it needs to take into account
    all elements of the model. We propose four alternative tests to determine when/whether
    attention can be used as explanation: a simple uniform-weights baseline; a variance
    calibration based on multiple random seed runs; a diagnostic framework using frozen
    weights from pretrained models; and an end-to-end adversarial attention training
    protocol. Each allows for meaningful interpretation of attention mechanisms in
    RNN models. We show that even when reliable adversarial distributions can be found,
    they don’t perform well on the simple diagnostic, indicating that prior work does
    not disprove the usefulness of attention mechanisms for explainability.'
  zh: >-
    注意力机制在 NLP 系统中发挥核心作用，在循环神经网络（RNN）模型中尤其如此。近年来，人们越来越关注这些模块给出的中间表征能否用于解释模型预测的推理依据，并进一步认识模型的决策过程。近期一篇论文声称“注意力不是解释”（Jain 与 Wallace，2019）。我们质疑该工作的许多底层假设，并指出，这一主张取决于如何定义解释，而且对它的检验需要考虑模型的全部组成部分。我们提出四项替代测试，用于判断注意力何时或能否作为解释：简单的均匀权重基线；基于多次不同随机种子运行的方差校准；使用预训练模型冻结权重的诊断框架；以及端到端的对抗性注意力训练方案。每项测试都允许对 RNN 模型的注意力机制进行有意义的解释。我们表明，即使能找到可靠的对抗性分布，它们在简单诊断测试上的表现也不好，这说明以往工作并未否定注意力机制对于可解释性的价值。
