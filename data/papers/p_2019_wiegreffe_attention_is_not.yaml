  en: |-
    **Research Question.** The paper revisits whether attention weights can serve as explanations. It asks whether earlier negative results used appropriate definitions and controls, and how plausible explanations should be distinguished from faithful accounts of a model's decision process.

    **Method.** The authors propose four model-aware tests: comparison with a uniform-attention baseline, calibration against variability across random seeds, diagnostic models that freeze learned attention, and end-to-end adversarial training that searches for alternative attention distributions while preserving predictions. These tests evaluate necessity, stability, and replaceability without treating post-hoc attention changes as if they came from the original model.

    **Validation.** The framework is evaluated on recurrent neural network (RNN) attention models across several natural-language classification datasets. The experiments compare ordinary attention, uniform weights, random-seed variation, frozen-attention diagnostics, and adversarially trained alternatives, including cases where very different attention distributions yield similar predictions.

    **Conclusion & Evidence.** Alternative attention distributions exist, but their existence alone does not prove that the learned attention is useless as explanation; some fail model-consistent diagnostic tests, and conclusions depend on the intended notion of explanation. The experiments provide strong audit evidence against categorical claims on either side. They do not establish attention weights as universally faithful causal explanations, only that they can carry explanatory value under explicit definitions and controls.
  zh: |-
    **研究问题。** 论文重新审视注意力权重能否充当解释，重点追问此前的否定性结论是否使用了合适的解释定义和控制条件，以及应如何区分“看起来合理的解释”与“忠实反映模型决策过程的解释”。

    **方法。** 作者提出四类考虑完整模型的测试：均匀注意力基线、跨随机种子方差校准、冻结已学习注意力的诊断模型，以及在尽量保持预测不变的同时搜索替代注意力分布的端到端对抗训练。这些测试分别考察注意力的必要性、稳定性和可替代性，并避免把脱离原模型生成的事后注意力修改直接当作原模型解释。

    **实验验证。** 框架在多个自然语言分类数据集上的循环神经网络（Recurrent Neural Network, RNN）注意力模型中验证。实验比较原始注意力、均匀权重、不同随机种子、冻结注意力的诊断模型和对抗训练得到的替代分布，并分析注意力差异很大但预测相近的情形。

    **结论与证据。** 不同注意力分布确实可能产生相似预测，但这一事实本身不足以证明已学习注意力没有解释价值；部分替代分布无法通过与模型一致的诊断测试，结论也取决于所采用的解释定义。论文为反对双方的绝对化主张提供了较强审计证据，但并未证明注意力权重普遍是忠实的因果解释，只说明在明确的定义和控制下它可能具有解释价值。
