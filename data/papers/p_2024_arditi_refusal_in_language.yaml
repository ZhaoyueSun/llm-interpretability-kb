abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2406.11717
  en: Conversational large language models are fine-tuned for both instruction-following
    and safety, resulting in models that obey benign requests but refuse harmful ones.
    While this refusal behavior is widespread across chat models, its underlying mechanisms
    remain poorly understood. In this work, we show that refusal is mediated by a
    one-dimensional subspace, across 13 popular open-source chat models up to 72B
    parameters in size. Specifically, for each model, we find a single direction such
    that erasing this direction from the model's residual stream activations prevents
    it from refusing harmful instructions, while adding this direction elicits refusal
    on even harmless instructions. Leveraging this insight, we propose a novel white-box
    jailbreak method that surgically disables refusal with minimal effect on other
    capabilities. Finally, we mechanistically analyze how adversarial suffixes suppress
    propagation of the refusal-mediating direction. Our findings underscore the brittleness
    of current safety fine-tuning methods. More broadly, our work showcases how an
    understanding of model internals can be leveraged to develop practical methods
    for controlling model behavior.
  zh: >-
    对话式大语言模型同时针对指令遵循和安全性进行微调，因此会服从无害请求、拒绝有害请求。尽管拒绝行为广泛存在于聊天模型中，其底层机制仍未得到充分理解。在本研究中，我们表明，在 13 个常用开源聊天模型中——模型规模最大达到 720 亿参数——拒绝行为均由一个一维子空间介导。具体而言，对每个模型，我们都找到了一个方向：从模型残差流激活中擦除该方向，会使模型不再拒绝有害指令；加入该方向，则会使模型连无害指令也予以拒绝。利用这一认识，我们提出一种新的白盒越狱方法，以外科手术般的方式禁用拒绝机制，同时尽量减少对其他能力的影响。最后，我们从机制层面分析对抗性后缀如何抑制拒绝介导方向的传播。我们的发现凸显了当前安全微调方法的脆弱性。更广泛地说，本工作展示了如何利用对模型内部机制的理解，开发控制模型行为的实用方法。
