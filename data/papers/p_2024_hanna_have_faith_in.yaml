abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2403.17806
  en: 'Many recent language model (LM) interpretability studies have adopted the circuits
    framework, which aims to find the minimal computational subgraph, or circuit,
    that explains LM behavior on a given task. Most studies determine which edges
    belong in a LM''s circuit by performing causal interventions on each edge independently,
    but this scales poorly with model size. Edge attribution patching (EAP), gradient-based
    approximation to interventions, has emerged as a scalable but imperfect solution
    to this problem. In this paper, we introduce a new method - EAP with integrated
    gradients (EAP-IG) - that aims to better maintain a core property of circuits:
    faithfulness. A circuit is faithful if all model edges outside the circuit can
    be ablated without changing the model''s performance on the task; faithfulness
    is what justifies studying circuits, rather than the full model. Our experiments
    demonstrate that circuits found using EAP are less faithful than those found using
    EAP-IG, even though both have high node overlap with circuits found previously
    using causal interventions. We conclude more generally that when using circuits
    to compare the mechanisms models use to solve tasks, faithfulness, not overlap,
    is what should be measured.'
  zh: >-
    近期许多语言模型（LM）可解释性研究采用回路框架，其目标是找出能够解释语言模型在特定任务上行为的最小计算子图，即回路。大多数研究通过分别对每条边进行因果干预来判断它是否属于语言模型回路，但这种方法难以随模型规模扩展。边归因修补（EAP）是对干预的梯度近似，已成为解决该问题的一种可扩展但并不完美的方案。本文提出一种新方法——采用积分梯度的 EAP（EAP-IG），旨在更好地维持回路的一项核心属性：忠实性。如果消融回路之外的所有模型边都不会改变模型在该任务上的表现，那么这个回路就是忠实的；正是忠实性使研究回路而非完整模型具有合理性。实验表明，尽管 EAP 与 EAP-IG 找到的回路都与此前使用因果干预发现的回路具有很高的节点重叠度，但 EAP 找到的回路不如 EAP-IG 找到的回路忠实。更一般地说，我们的结论是：使用回路比较模型解决任务所采用的机制时，应当衡量的是忠实性，而不是重叠度。
