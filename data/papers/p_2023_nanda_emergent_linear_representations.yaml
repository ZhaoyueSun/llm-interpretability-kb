  en: How do sequence models represent their decision-making process? Prior work suggests
    that Othello-playing neural network learned nonlinear models of the board state
    (Li et al., 2023a). In this work, we provide evidence of a closely related linear
    representation of the board. In particular, we show that probing for “my colour”
    vs. “opponent’s colour” may be a simple yet powerful way to interpret the model’s
    internal state. This precise understanding of the internal representations allows
    us to control the model’s behaviour with simple vector arithmetic. Linear representations
    enable significant interpretability progress, which we demonstrate with further
    exploration of how the world model is computed.
  zh: >-
    序列模型如何表征自身的决策过程？以往研究认为，会下 Othello 棋的神经网络学到了棋盘状态的非线性模型（Li 等，2023a）。在本研究中，我们给出证据，证明存在一种密切相关的棋盘线性表征。具体而言，我们表明，探测“我的颜色”与“对手的颜色”可能是一种简单却有力的模型内部状态解释方法。对内部表征的这种精确认识，使我们可以用简单的向量运算控制模型行为。线性表征推动了可解释性的显著进展；我们通过进一步探索世界模型如何计算来展示这一点。
