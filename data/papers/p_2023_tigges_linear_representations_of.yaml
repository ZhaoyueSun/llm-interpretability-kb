  en: 'Sentiment is a pervasive feature in natural language text, yet it is an open
    question how sentiment is represented within Large Language Models (LLMs). In
    this study, we reveal that across a range of models, sentiment is represented
    linearly: a single direction in activation space mostly captures the feature across
    a range of tasks with one extreme for positive and the other for negative. Through
    causal interventions, we isolate this direction and show it is causally relevant
    in both toy tasks and real world datasets such as Stanford Sentiment Treebank.
    Through this case study we model a thorough investigation of what a single direction
    means on a broad data distribution. We further uncover the mechanisms that involve
    this direction, highlighting the roles of a small subset of attention heads and
    neurons. Finally, we discover a phenomenon which we term the summarization motif:
    sentiment is not solely represented on emotionally charged words, but is additionally
    summarized at intermediate positions without inherent sentiment, such as punctuation
    and names. We show that in Stanford Sentiment Treebank zero-shot classification,
    76% of above-chance classification accuracy is lost when ablating the sentiment
    direction, nearly half of which (36%) is due to ablating the summarized sentiment
    direction exclusively at comma positions.'
  zh: >-
    情感是自然语言文本中普遍存在的特征，但情感如何在大语言模型（LLM）内部得到表征仍是一个开放问题。在本研究中，我们发现，在一系列模型中，情感都以线性方式表征：激活空间中的一个方向基本能够跨多种任务捕捉这一特征，其两个极端分别对应正面和负面情感。通过因果干预，我们分离出这一方向，并表明它在玩具任务和 Stanford Sentiment Treebank 等真实数据集中都具有因果相关性。借助这一案例研究，我们示范了如何在广泛的数据分布上深入考察“单一方向”的含义。我们进一步揭示了涉及这一方向的机制，并突出少量注意力头和神经元所发挥的作用。最后，我们发现一种称为“汇总模体”（summarization motif）的现象：情感不仅表征在带有强烈情绪色彩的词上，还会汇总到本身不含情感的中间位置，例如标点符号和人名。在 Stanford Sentiment Treebank 的零样本分类中，消融情感方向会使高于随机水平的分类准确率损失 76%；其中近一半（36%）来自仅在逗号位置消融汇总后的情感方向。
