  en: |-
    **Research Question.** Can a model behavior be reduced to a complete, intervenable, end-to-end component circuit? In this paper, *Reasoning Circuits in Language Models: A Mechanistic Interpretation of Syllogistic Inference* addresses that question through its specific object of study and tests how far the resulting claim can be supported.

    **Method.** Recent studies on reasoning in language models (LMs) have sparked a debate on whether they can learn systematic inferential principles or merely exploit superficial patterns in the training data.To understand and uncover the mechanisms adopted for formal reasoning in LMs, this paper presents a mechanistic interpretation of syllogistic inference.Specifically, we present a methodology for circuit discovery aimed at interpreting content-independent and formal reasoning mechanisms.Through two distinct intervention methods, we uncover a sufficient and necessary circuit involving middle-term suppression that elucidates how LMs transfer information to derive valid conclusions from premises.Furthermore, we investigate how belief biases manifest in syllogistic inference, finding evidence of partial contamination from additional attention heads responsible for encoding commonsense and contextualized knowledge.Finally, we explore the generalization of the discovered mechanisms across various syllogistic schemes, model sizes and architectures.The identified circuit is sufficient and necessary for syllogistic schemes on which the models achieve high accuracy (≥ 60%), with compatible activation patterns across models of different families.Overall, our findings suggest that LMs learn transferable contentindependent reasoning mechanisms, but that, at the same time, such mechanisms do not involve generalizable and abstract logical primitives, being susceptible to contamination by the same world knowledge acquired during pre-training.

    **Validation.** Recent studies on reasoning in language models (LMs) have sparked a debate on whether they can learn systematic inferential principles or merely exploit superficial patterns in the training data.To understand and uncover the mechanisms adopted for formal reasoning in LMs, this paper presents a mechanistic interpretation of syllogistic inference.Specifically, we present a methodology for circuit discovery aimed at interpreting content-independent and formal reasoning mechanisms.Through two distinct intervention methods, we uncover a sufficient and necessary circuit involving middle-term suppression that elucidates how LMs transfer information to derive valid conclusions from premises.Furthermore, we investigate how belief biases manifest in syllogistic inference, finding evidence of partial contamination from additional attention heads responsible for encoding commonsense and contextualized knowledge.Finally, we explore the generalization of the discovered mechanisms across various syllogistic schemes, model sizes and architectures.The identified circuit is sufficient and necessary for syllogistic schemes on which the models achieve high accuracy (≥ 60%), with compatible activation patterns across models of different families.Overall, our findings suggest that LMs learn transferable contentindependent reasoning mechanisms, but that, at the same time, such mechanisms do not involve generalizable and abstract logical primitives, being susceptible to contamination by the same world knowledge acquired during pre-training.

    **Conclusion & Evidence.** Recent studies on reasoning in language models (LMs) have sparked a debate on whether they can learn systematic inferential principles or merely exploit superficial patterns in the training data.To understand and uncover the mechanisms adopted for formal reasoning in LMs, this paper presents a mechanistic interpretation of syllogistic inference.Specifically, we present a methodology for circuit discovery aimed at interpreting content-independent and formal reasoning mechanisms.Through two distinct intervention methods, we uncover a sufficient and necessary circuit involving middle-term suppression that elucidates how LMs transfer information to derive valid conclusions from premises.Furthermore, we investigate how belief biases manifest in syllogistic inference, finding evidence of partial contamination from additional attention heads responsible for encoding commonsense and contextualized knowledge.Finally, we explore the generalization of the discovered mechanisms across various syllogistic schemes, model sizes and architectures.The identified circuit is sufficient and necessary for syllogistic schemes on which the models achieve high accuracy (≥ 60%), with compatible activation patterns across models of different families.Overall, our findings suggest that LMs learn transferable contentindependent reasoning mechanisms, but that, at the same time, such mechanisms do not involve generalizable and abstract logical primitives, being susceptible to contamination by the same world knowledge acquired during pre-training. The coordinated interventions provide comparatively strong structural causal evidence for the proposed information flow or circuit. Completeness, uniqueness, and transfer to other models still require separate validation.
  zh: |-
    **研究问题。** 内容无关的 syllogistic reasoning 在预训练 语言模型（Language Model, LM） 中由什么电路实现？该机制是否与 world knowledge/belief bias 解耦，并能否跨 syllogistic schemes、模型规模与架构泛化？

    **方法。** 具体而言，我们提出一种回路发现方法，用于解释与具体内容无关的形式推理机制。

    **实验验证。** 借助两种不同的干预方法，我们发现了一个涉及中项抑制的充分且必要回路，它说明语言模型如何传递信息，从前提推导出有效结论。

    **结论与证据。** 为了理解并揭示语言模型进行形式推理时采用的机制，本文对三段论推理进行了机制性解释。我们还研究了信念偏差如何在三段论推理中体现，并发现该机制会受到额外注意力头的部分污染；这些注意力头负责编码常识与情境化知识。最后，我们考察了所发现机制在不同三段论模式、模型规模和模型架构之间的泛化能力。对于模型准确率较高（≥ 60%）的三段论模式，该回路既充分又必要，并且不同模型家族呈现兼容的激活模式。总体而言，结果表明语言模型能够学到可迁移、与具体内容无关的推理机制；但这些机制并不包含可泛化的抽象逻辑基元，并且容易受到预训练阶段获得的世界知识污染。相互配合的干预为所提出的信息流或电路提供了较强的结构因果证据，但机制的完备性、唯一性以及跨模型迁移仍需独立验证。
