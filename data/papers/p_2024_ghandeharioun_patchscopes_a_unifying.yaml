abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2401.06102
  en: Understanding the internal representations of large language models (LLMs) can
    help explain models' behavior and verify their alignment with human values. Given
    the capabilities of LLMs in generating human-understandable text, we propose leveraging
    the model itself to explain its internal representations in natural language.
    We introduce a framework called Patchscopes and show how it can be used to answer
    a wide range of questions about an LLM's computation. We show that many prior
    interpretability methods based on projecting representations into the vocabulary
    space and intervening on the LLM computation can be viewed as instances of this
    framework. Moreover, several of their shortcomings such as failure in inspecting
    early layers or lack of expressivity can be mitigated by Patchscopes. Beyond unifying
    prior inspection techniques, Patchscopes also opens up new possibilities such
    as using a more capable model to explain the representations of a smaller model,
    and multihop reasoning error correction.
  zh: >-
    理解大语言模型（LLM）的内部表征，有助于解释模型行为并验证其是否与人类价值观一致。鉴于语言模型能够生成人类可理解的文本，我们提出利用模型自身，以自然语言解释其内部表征。我们引入名为 Patchscopes 的框架，并展示如何用它回答有关语言模型计算的广泛问题。我们说明，许多把表征投影到词汇空间并干预语言模型计算的既有可解释性方法，都可以视为这一框架的实例。此外，Patchscopes 可以缓解这些方法的若干缺陷，例如无法检查早期层或表达能力不足。Patchscopes 不仅统一了以往的检查技术，还带来新的可能性，例如使用能力更强的模型解释较小模型的表征，以及纠正多跳推理错误。
