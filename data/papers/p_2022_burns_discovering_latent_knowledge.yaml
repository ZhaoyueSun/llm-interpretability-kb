abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2212.03827
  en: 'Existing techniques for training language models can be misaligned with the
    truth: if we train models with imitation learning, they may reproduce errors that
    humans make; if we train them to generate text that humans rate highly, they may
    output errors that human evaluators can''t detect. We propose circumventing this
    issue by directly finding latent knowledge inside the internal activations of
    a language model in a purely unsupervised way. Specifically, we introduce a method
    for accurately answering yes-no questions given only unlabeled model activations.
    It works by finding a direction in activation space that satisfies logical consistency
    properties, such as that a statement and its negation have opposite truth values.
    We show that despite using no supervision and no model outputs, our method can
    recover diverse knowledge represented in large language models: across 6 models
    and 10 question-answering datasets, it outperforms zero-shot accuracy by 4\% on
    average. We also find that it cuts prompt sensitivity in half and continues to
    maintain high accuracy even when models are prompted to generate incorrect answers.
    Our results provide an initial step toward discovering what language models know,
    distinct from what they say, even when we don''t have access to explicit ground
    truth labels.'
  zh: >-
    现有语言模型训练技术可能与真相错位：如果使用模仿学习训练模型，它们可能复现人类会犯的错误；如果训练模型生成能获得人类高分评价的文本，它们可能输出人类评估者无法发现的错误。我们提出绕开这一问题，以完全无监督的方式直接从语言模型内部激活中寻找潜在知识。具体而言，我们提出一种方法，只利用未标注的模型激活准确回答是非问题。该方法寻找激活空间中满足逻辑一致性性质的方向，例如一个陈述与其否定应具有相反真值。我们表明，即使不使用监督信号和模型输出，该方法仍能恢复大语言模型所表征的多种知识：在 6 个模型和 10 个问答数据集上，它的准确率平均比零样本方法高 4%。我们还发现，它能把提示敏感性降低一半；即使模型被提示生成错误答案，也仍可保持较高准确率。我们的结果是迈向发现“语言模型知道什么”而非“语言模型说什么”的第一步，即便我们无法获得明确的真值标签也是如此。
