abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2212.04089
  en: Changing how pre-trained models behave -- e.g., improving their performance
    on a downstream task or mitigating biases learned during pre-training -- is a
    common practice when developing machine learning systems. In this work, we propose
    a new paradigm for steering the behavior of neural networks, centered around \textit{task
    vectors}. A task vector specifies a direction in the weight space of a pre-trained
    model, such that movement in that direction improves performance on the task.
    We build task vectors by subtracting the weights of a pre-trained model from the
    weights of the same model after fine-tuning on a task. We show that these task
    vectors can be modified and combined together through arithmetic operations such
    as negation and addition, and the behavior of the resulting model is steered accordingly.
    Negating a task vector decreases performance on the target task, with little change
    in model behavior on control tasks. Moreover, adding task vectors together can
    improve performance on multiple tasks at once. Finally, when tasks are linked
    by an analogy relationship of the form ``A is to B as C is to D", combining task
    vectors from three of the tasks can improve performance on the fourth, even when
    no data from the fourth task is used for training. Overall, our experiments with
    several models, modalities and tasks show that task arithmetic is a simple, efficient
    and effective way of editing models.
  zh: >-
    在开发机器学习系统时，改变预训练模型的行为是一种常见实践，例如提高其在下游任务上的表现，或缓解预训练期间学到的偏见。本文提出一种引导神经网络行为的新范式，其核心是任务向量。任务向量指定预训练模型权重空间中的一个方向，沿该方向移动可以提升任务性能。我们用同一模型在某项任务上微调后的权重减去其预训练权重，以构造任务向量。我们表明，可以通过取负和相加等算术运算修改与组合这些任务向量，所得模型的行为也会随之受到引导。对任务向量取负会降低目标任务的性能，同时几乎不改变模型在控制任务上的行为；把多个任务向量相加，则可以同时提升多项任务的性能。最后，当任务之间存在“A 之于 B，如同 C 之于 D”的类比关系时，组合其中三项任务的任务向量，即使训练时完全未使用第四项任务的数据，也能提高该任务的性能。总体而言，我们在多个模型、模态和任务上的实验表明，任务算术是一种简单、高效且有效的模型编辑方法。
