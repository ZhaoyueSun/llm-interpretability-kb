abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/1810.03292
  en: Saliency methods have emerged as a popular tool to highlight features in an
    input deemed relevant for the prediction of a learned model. Several saliency
    methods have been proposed, often guided by visual appeal on image data. In this
    work, we propose an actionable methodology to evaluate what kinds of explanations
    a given method can and cannot provide. We find that reliance, solely, on visual
    assessment can be misleading. Through extensive experiments we show that some
    existing saliency methods are independent both of the model and of the data generating
    process. Consequently, methods that fail the proposed tests are inadequate for
    tasks that are sensitive to either data or model, such as, finding outliers in
    the data, explaining the relationship between inputs and outputs that the model
    learned, and debugging the model. We interpret our findings through an analogy
    with edge detection in images, a technique that requires neither training data
    nor model. Theory in the case of a linear model and a single-layer convolutional
    neural network supports our experimental findings.
  zh: >-
    显著性方法已成为一种常用工具，用于突出输入中被认为与已训练模型预测有关的特征。已有多种显著性方法被提出，而它们往往受到图像数据上视觉吸引力的引导。本文提出一种可执行的方法论，用于评估给定方法能够和不能够提供哪些类型的解释。我们发现，单纯依赖视觉评估可能产生误导。广泛实验表明，某些现有显著性方法既独立于模型，也独立于数据生成过程。因此，未能通过本文测试的方法不适合用于对数据或模型敏感的任务，例如寻找数据中的异常值、解释模型所学到的输入—输出关系以及调试模型。我们借助图像边缘检测作类比来解释这些发现；边缘检测既不需要训练数据，也不需要模型。针对线性模型和单层卷积神经网络的理论分析支持我们的实验结果。
