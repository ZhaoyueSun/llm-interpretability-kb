  en: |-
    **Research Question.** The paper asks whether visually convincing saliency maps actually depend on learned model parameters and on the relationship between inputs and labels. It seeks general sanity checks that identify which explanatory claims a saliency method can and cannot support.

    **Method.** Two randomization tests are proposed. Model-parameter randomization progressively replaces learned layers with randomly initialized ones; data randomization trains the same architecture after permuting labels. A faithful model-sensitive explanation should change when either the learned computation or the data-generating relationship is destroyed. Similarity between original and randomized saliency maps is measured quantitatively as well as visually.

    **Validation.** The tests are applied to several gradient- and visualization-based methods on standard image classifiers and datasets. The study examines cascading and independent layer randomization, label randomization, and controls based on simple edge detection. Supporting analyses for a linear model and a one-layer convolutional network explain why some maps remain visually stable.

    **Conclusion & Evidence.** Several popular saliency methods produce nearly unchanged maps after the model or labels are randomized, showing that visual plausibility can be driven by input structure rather than learned decision logic. The audit provides strong counterexample-based evidence that such methods cannot support model- or data-sensitive claims. Passing the checks is only a necessary condition, however: it does not by itself prove that a method is faithful, causal, or suitable for every explanatory use.
  zh: |-
    **研究问题。** 论文考察视觉上合理的显著性图是否真的依赖模型学到的参数以及输入—标签关系，并试图建立通用的健全性检验，以判断一种显著性方法能够和不能够支持哪些解释主张。

    **方法。** 作者提出两类随机化检验。模型参数随机化逐步把已训练层替换为随机初始化参数；数据随机化则在打乱标签后重新训练相同架构。如果解释方法确实对模型敏感，那么当已学习的计算或数据生成关系被破坏时，解释也应明显改变。原始显著性图与随机化后显著性图之间的差异同时通过定量相似度和视觉检查衡量。

    **实验验证。** 这些检验被应用于标准图像分类模型与数据集上的多种梯度式和可视化解释方法。实验覆盖级联式与独立式层随机化、标签随机化，并使用简单边缘检测作为对照；针对线性模型和单层卷积网络的分析进一步解释某些显著性图为何会在随机化后保持稳定。

    **结论与证据。** 多种常用方法在模型参数或标签被随机化后仍生成近似不变的显著性图，说明视觉合理性可能主要来自输入的边缘结构，而非模型学到的决策逻辑。这些反例为“相关方法不能支持模型敏感或数据敏感的解释主张”提供了很强的审计证据。不过，通过检验只是必要条件，并不能单独证明某种方法忠实、具有因果意义，或适合所有解释用途。
