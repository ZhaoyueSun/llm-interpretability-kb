abstract:
  source: PaperKnowledgeBase metadata, cross-checked against Docling full text
  source_url: https://arxiv.org/abs/2405.15943
  en: What computational structure are we building into large language models when
    we train them on next-token prediction? Here, we present evidence that this structure
    is given by the meta-dynamics of belief updating over hidden states of the data-generating
    process. Leveraging the theory of optimal prediction, we anticipate and then find
    that belief states are linearly represented in the residual stream of transformers,
    even in cases where the predicted belief state geometry has highly nontrivial
    fractal structure. We investigate cases where the belief state geometry is represented
    in the final residual stream or distributed across the residual streams of multiple
    layers, providing a framework to explain these observations. Furthermore we demonstrate
    that the inferred belief states contain information about the entire future, beyond
    the local next-token prediction that the transformers are explicitly trained on.
    Our work provides a general framework connecting the structure of training data
    to the geometric structure of activations inside transformers.
  zh: >-
    当我们使用下一 token 预测训练大语言模型时，究竟在模型中构建了什么样的计算结构？本文给出证据，表明这种结构由数据生成过程中针对隐藏状态进行信念更新的元动力学所决定。借助最优预测理论，我们预先推导并随后发现：信念状态在线性意义上表征于 Transformer 的残差流中，即使预测出的信念状态几何具有高度非平凡的分形结构也是如此。我们研究了信念状态几何表征在最终残差流中的情况，也研究了它分布于多个层的残差流中的情况，并提供一个解释这些现象的框架。此外，我们证明，推断出的信念状态包含有关整个未来的信息，超出了 Transformer 明确接受训练的局部下一 token 预测。我们的工作提供了一个通用框架，将训练数据的结构与 Transformer 内部激活的几何结构联系起来。
