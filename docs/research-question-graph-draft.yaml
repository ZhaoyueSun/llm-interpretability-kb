schema_version: 0
status: working-draft
source: docs/research-question-timeline-draft.md
updated_at: '2026-10-10'
notes:
  - This is a consolidation draft, not an approved taxonomy or classification source.
  - Primary paper assignments are exhaustive for the current 123-paper corpus.
  - Every paper has exactly one primary RQ; secondary paper assignments are intentionally non-exclusive.
  - Existing Research Object, Technique, and Application metadata must be derived through paper IDs.
  - Edge types describe how the later target question changes the earlier source question.
  - Edge evidence distinguishes direct textual engagement, uncited continuity, and analyst synthesis.

edge_evidence_levels:
  direct-citation: The target papers cite and substantively engage source-node papers in the main text.
  same-lineage: The questions form a clear continuation, but no substantive main-text citation was verified.
  analyst-inference: The connection is a synthesis proposed for this graph and is not attributed to the papers.

families:
  - family_id: representation-form
    label_en: Representation Form
    label_zh: 表示形式
    guiding_question_en: What does the model represent, and in what form?
    guiding_question_zh: 模型表示了什么，以及以什么形式表示？
    meaning_en: >-
      This family studies what information is encoded inside a model and the structural form of that encoding.
      Candidate units include neurons, directions, subspaces, sparse features, task vectors, binding structures, and
      latent world states. The focus is not the analysis technique but the geometry, compositionality, sparsity, and
      organization of the representation itself.
    meaning_zh: >-
      这一类别研究模型内部编码了哪些信息，以及这些信息采用何种结构形式存在。可能的表示单位包括神经元、方向、子空间、
      稀疏特征、任务向量、绑定结构和世界状态。重点不是使用哪种分析技术，而是模型表示本身具有怎样的几何、组合和稀疏结构。
    evolution_en: >-
      Early work asked whether information could be decoded from intermediate layers and whether individual units
      aligned with human concepts. Unsupervised feature discovery then attempted to remove dependence on predefined
      labels. Research on superposition challenged the one-concept–one-neuron assumption and redirected attention
      toward directions, subspaces, and distributed representations. The field subsequently examined world states,
      task vectors, compositional binding, and causally meaningful representation geometry. Sparse representation
      learning sought to recover latent features from superposition, leading to questions about training objectives,
      frontier-scale feature atlases, and failures such as splitting and absorption. The progression is: information
      localization → representational form → latent-feature recovery → functional validation and failure boundaries.
    evolution_zh: >-
      早期研究主要询问信息能否从中间层读出，以及单个神经元是否对应人类概念。随后，无监督特征发现开始尝试摆脱预设标签。
      Superposition 研究进一步挑战了“一个概念对应一个神经元”的假设，推动研究转向方向、子空间和分布式表示。之后，研究扩展到
      世界状态、任务向量、实体—属性绑定和具有因果意义的表示几何。Sparse Autoencoder 等工作则试图从 superposition 中恢复潜在特征，
      继而引出训练目标、规模化特征图谱以及 splitting、absorption 等失败问题。整体脉络是：信息定位 → 表示形式 → 潜在特征恢复 →
      功能验证与失败边界。
    display_order: 1
  - family_id: computational-mechanism
    label_en: Computational Mechanism
    label_zh: 计算机制
    guiding_question_en: How do internal computations produce model behavior?
    guiding_question_zh: 模型如何通过内部计算产生行为？
    meaning_en: >-
      This family concerns the computations actually performed inside a model and how information flows across
      components, layers, token positions, and paths to produce behavior. The relevant objects may be attention heads,
      MLPs, paths, or complete circuits, but the central goal is to explain the computation rather than merely enumerate
      components.
    meaning_zh: >-
      这一类别关注模型内部实际执行了什么计算，以及信息如何在组件、层、token 位置和路径之间流动并最终产生行为。
      研究对象可能是 attention head、MLP、路径或完整电路，但类别的核心是解释计算过程，而不是罗列组件。
    evolution_en: >-
      The line began with the functions of individual components, such as how attention heads move information and how
      MLPs store or promote concepts. Work on knowledge localization and causal abstraction then examined storage,
      routing, and the correspondence between low-level computation and high-level algorithms. Full behavioral-circuit
      studies organized components into end-to-end mechanisms, motivating path localization, automated circuit
      discovery, and analysis at larger scales. More recent branches extend mechanism analysis to safety and refusal,
      multilingual processing, multimodal information flow, knowledge conflict, and multimodal hallucination. The
      progression is: component function → information pathways → complete circuits → automation and scaling → complex
      behaviors and failure mechanisms.
    evolution_zh: >-
      研究最初集中于单个组件的功能，例如 attention head 如何移动信息、MLP 如何存储或促进概念。之后，知识定位和因果抽象研究开始追踪
      信息的存储、路由以及低层计算与高层算法之间的对应。完整行为电路研究进一步把组件组织成端到端机制，并推动路径定位、自动电路发现
      和规模化分析。近期分支把机制分析扩展到安全与拒绝、跨语言处理、多模态信息流、知识冲突以及多模态幻觉等复杂行为。
      总体演化是：组件功能 → 信息路径 → 完整电路 → 自动化与规模化 → 复杂行为和失败机制。
    display_order: 2
  - family_id: mechanism-explanation
    label_en: Mechanism Explanation
    label_zh: 机制解释
    guiding_question_en: How can internal computation be discovered, organized, and expressed as an inspectable explanation?
    guiding_question_zh: 如何把模型内部计算发现、组织并表达为可检查的机制解释？
    meaning_en: >-
      This family studies the explanatory interface between a model's computation and a human analyst. It asks how an
      explanation target should be formalized and how semantic descriptions, causal alignments, paths, circuits, or
      feature graphs can be extracted efficiently. A boundary branch covers post-hoc attribution formalisms such as
      SHAP: they construct inspectable explanation artifacts, but do not by themselves recover an internal causal
      mechanism. This family is distinct from the computation itself and from the evidence required to trust the
      resulting explanation.
    meaning_zh: >-
      这一类别关注模型内部计算与人类分析者之间的解释接口：解释对象应如何形式化，以及如何高效提取语义描述、因果对齐、
      路径、电路或特征因果图。其中一个边界分支是 SHAP 等事后归因形式：它们构造可检查的解释产物，
      但不因此等同于发现了模型内部的因果机制。该类别不等同于模型实际执行的计算，也不等同于证明所得解释可信。
    evolution_en: >-
      Early work formalized attribution targets and automatic semantic descriptions of internal units. The focus then
      shifted to causal alignments, lenses, and path-level hypotheses that make intermediate computation inspectable.
      Automated circuit discovery reduced manual reverse engineering, while sparse features and analytic decompositions
      enabled finer-grained and more scalable explanation graphs. The progression is: explanation target and vocabulary
      → semantic readout and causal alignment → automated path and circuit extraction → scalable feature-level graphs.
    evolution_zh: >-
      早期工作形式化了归因对象，并尝试自动命名内部单元。随后研究转向因果对齐、lens 和路径级假说，使中间计算变得可检查。
      自动电路发现降低了人工逆向工程成本，稀疏特征和解析分解又把解释推向更细粒度和更大规模。整体脉络是：解释对象与语汇 → 语义读出与因果对齐 →
      自动路径和电路提取 → 可扩展的特征级解释图。
    display_order: 3
  - family_id: intervention-control
    label_en: Intervention and Control
    label_zh: 干预与控制
    guiding_question_en: Can mechanistic understanding support predictable and localized changes?
    guiding_question_zh: 对内部机制的理解能否支持可预测、可局部化的改变？
    meaning_en: >-
      This family asks whether interpretability can be translated into reliable changes to a model, including inducing
      structure during training, editing knowledge, and manipulating representations at inference time. It explicitly
      distinguishes a location that causally contributes to behavior from a location that is an effective and localized
      intervention target.
    meaning_zh: >-
      这一类别研究解释是否能够转化为对模型的可靠改变，包括在训练时诱导结构、编辑知识以及在推理时操纵内部表示。
      它特别区分“某个位置对行为具有因果作用”和“该位置是最有效、最局部的修改目标”。
    evolution_en: >-
      The line began with attempts to induce internal structures during training that correspond to human-specified
      causal models. Knowledge-editing research then exposed an important discontinuity: the location at which
      information causally affects behavior is not necessarily the best place to edit it. Representation engineering and
      inference-time intervention extended the question to whether internal directions can serve as stable control
      levers. The emphasis has shifted from merely changing outputs to achieving specificity, transferability, stability,
      and limited side effects. This branch is relatively small in the current corpus but forms the bridge between
      explanation and practical model control.
    evolution_zh: >-
      这一研究线首先尝试在训练阶段直接诱导符合人类高层因果模型的内部结构。随后，知识编辑研究揭示了一个重要断裂：因果定位得到的
      知识使用位置不一定是最佳编辑位置。Representation engineering 和 inference-time intervention 又把问题扩展到内部方向是否可以作为
      稳定的控制杠杆。研究重点也由“是否能够改变输出”逐渐转向改变是否具有特异性、可迁移性、稳定性以及有限副作用。
      当前 corpus 中这一分支规模较小，但它连接了解释和实际模型控制。
    display_order: 4
  - family_id: temporal-development
    label_en: Temporal Development and Learning
    label_zh: 时序学习
    guiding_question_en: How do representations and mechanisms evolve across training, network depth, and generation?
    guiding_question_zh: 表示与机制如何随训练、网络深度和生成过程演化？
    meaning_en: >-
      This family studies how internal representations and mechanisms change across temporal or computational stages.
      Time includes training checkpoints, network depth, post-training, and autoregressive generation steps. It is a
      family of questions about formation, transition, and temporal unfolding rather than a target-object label.
    meaning_zh: >-
      这一类别研究内部表示和机制如何随时间或计算阶段变化。这里的时序包括训练检查点、网络层深、后训练和自回归生成步骤；
      它是关于形成、转变与时序展开的问题，而不是“learning process”对象标签。
    evolution_en: >-
      Early theory examined feature selection and reweighting during training. Checkpoint analysis then traced circuit
      formation and internal progress measures behind apparent capability jumps. Layerwise lenses extended the dynamic
      view to a single forward pass, and later work studied future-token commitments, post-training changes, and causal
      computation across Chain-of-Thought steps. The progression is: feature formation → circuit formation and phase
      transitions → depth-wise prediction dynamics → generation-time and CoT dynamics.
    evolution_zh: >-
      早期理论研究训练中的特征选择与重加权；检查点分析随后开始追踪电路形成，并用内部 progress measures 解释表面突发的能力跃迁。
      层间 lens 把动态视角扩展到单次前向传播，后续研究又进入未来 token 承诺、后训练变化和 Chain-of-Thought 跨步骤因果计算。整体脉络是：
      特征形成 → 电路形成与相变 → 层间预测演化 → 生成时序与 CoT 动态。
    display_order: 5
  - family_id: evidential-standards
    label_en: Evidential Standards
    label_zh: 证据标准
    guiding_question_en: What evidence is sufficient to support an interpretability claim?
    guiding_question_zh: 什么证据足以支持一项解释性主张？
    meaning_en: >-
      This family concerns the justification of interpretability claims. It asks what conclusions attribution, probing,
      intervention, and circuit analysis support, whether explanations depend on the actual model, and whether claims
      survive controls, counterfactuals, alternative explanations, and out-of-distribution tests.
    meaning_zh: >-
      这一类别关注我们凭什么相信某项解释：归因、probe、干预和电路分析分别能支持多强的结论，解释是否依赖真实模型，
      以及主张能否经受对照、反事实、替代解释和分布外测试。
    evolution_en: >-
      Sanity checks first asked whether explanations depend on model parameters. Probe research then calibrated positive
      and null results and separated decodability from causal use. With causal interventions and circuit discovery,
      attention moved to design robustness, behavioral faithfulness, and strong baselines. Recent work studies audit
      limits, staged causal evidence, and solver-checkable guarantees: correlation → causation → behavioral and OOD
      validation → formal verification.
    evolution_zh: >-
      早期 sanity checks 检验解释是否真正依赖模型参数；probe 研究随后校准正结果和空结果，并区分可解码性与因果使用。随着干预和电路发现普及，
      问题转向实验设计稳健性、行为忠实性和强基线。近期研究又进入审计边界、分阶段因果证据与求解器可检查保证：相关 → 因果 → 行为与分布外验证 → 形式验证。
    display_order: 6
  - family_id: generality-transfer
    label_en: Generality and Transfer
    label_zh: 泛化与迁移
    guiding_question_en: Do explanations hold or transfer across tasks, models, scales, architectures, and modalities?
    guiding_question_zh: 解释在任务、模型、规模、架构与模态之间能否成立或迁移？
    meaning_en: >-
      This family studies the scope over which an explanation remains valid. It distinguishes structural recurrence—
      whether the same neurons, features, or circuits reappear—from functional recurrence, in which different models
      implement the same function or abstract algorithm. Successful transfer across models can support shared
      representations without proving that the underlying mechanisms are identical.
    meaning_zh: >-
      这一类别研究解释的适用范围。它区分具体神经元、特征和电路是否重复出现的结构一致性，与不同模型是否实现相同功能或抽象算法的
      功能一致性。跨模型迁移成功可以支持共享表示，但不能自动证明底层机制完全相同。
    evolution_en: >-
      Early mechanistic explanations were usually confined to a single model and task, with generality often left
      implicit. From 2023 onward, researchers began systematically comparing recurring motifs, component reuse, and
      function vectors across data runs, model scales, and architectures. Cross-model alignment, model stitching, and
      feature transfer turned “similar mechanisms” into operational transfer tests. Current evidence generally supports
      partial universality: abstract functions may recur even when concrete components and circuit structures differ. In
      the present corpus this family remains concentrated in one broad RQ and may later split into cross-run stability,
      cross-model transfer, and cross-architecture functional equivalence.
    evolution_zh: >-
      早期机制解释大多局限于单个模型和单项任务，研究者往往默认发现具有一定普遍性。自 2023 年起，研究开始系统比较不同数据运行、
      模型规模和架构中的 recurring motifs、组件复用和功能向量。跨模型表示对齐、model stitching 和特征迁移进一步把“相似机制”转化为
      可操作的迁移检验。现有结果总体支持部分 universality：抽象功能可能复现，但具体组件和电路结构经常变化。当前数据中这一类别仍主要
      集中在一个综合 RQ，未来可能拆分为跨运行稳定性、跨模型迁移和跨架构功能等子问题。
    display_order: 7

nodes:
  - rq_id: rq-attribution-foundations
    family_id: mechanism-explanation
    question_en: >-
      Can local feature attribution be given a unified definition whose desired properties determine a unique solution?
    question_zh: 如何用一组明确原则统一定义局部特征归因，并由这些原则确定唯一解？
    introduction_en: >-
      This question asks what local attribution is estimating and which properties should hold simultaneously.
      It defines the form of an explanation artifact rather than the form of a model's internal representation;
      whether that target is faithful or useful is a separate evidential question.
    introduction_zh: >-
      该问题关注局部归因究竟在估计什么，以及哪些性质应同时成立。它定义的是解释产物的形式，而不是模型内部表示的形式；
      该目标是否忠实、有用，则是另一个证据问题。
    progress_en: >-
      Lundberg and Lee unified several local explanation methods as additive feature attribution and showed that a
      particular solution is uniquely determined under three desired properties. This established the target later
      estimators compute, without establishing that feature attribution is a complete model-mechanism explanation.
    progress_zh: >-
      Lundberg 与 Lee 将多种局部解释统一为 additive feature attribution，并说明三项理想性质会唯一确定特定解。
      这项工作确立了后续估计方法的目标量，但并未证明特征归因已经构成完整的模型机制解释。
    first_date: '2017-05-22'
    primary_paper_ids:
      - p_2017_lundberg_a_unified_approach

  - rq_id: rq-attribution-efficiency
    family_id: mechanism-explanation
    question_en: >-
      How can an expensive attribution quantity be estimated accurately in a single amortized computation?
    question_zh: 如何将昂贵的逐样本归因估计，摊销为准确的单次计算？
    introduction_en: >-
      Once an attribution target is fixed, a separate question is whether its computation can be learned and reused
      across samples without changing the target quantity or its defining constraints. This is explanation
      construction, not a claim about how the explained model internally represents information.
    introduction_zh: >-
      当归因目标已经确定后，还需要回答其计算能否被学习并在样本间复用，同时不改变目标量及其定义约束。
      这是解释的构造问题，不是关于被解释模型如何在内部表示信息的主张。
    progress_en: >-
      FastSHAP reframed Shapley estimation as amortized learning and generated per-sample attributions in one forward
      pass without precomputed Shapley labels. The result addresses explanation cost, not whether Shapley attribution is
      a faithful account of the model's internal mechanism.
    progress_zh: >-
      FastSHAP 将 Shapley 估计重写为摊销学习，无需预先计算 Shapley 标签即可用一次前向传播生成逐样本归因。
      它回答的是解释计算成本，而不是 Shapley 归因是否忠实描述内部机制。
    first_date: '2021-07-15'
    primary_paper_ids:
      - p_2021_jethani_fastshap_real_time_shapley

  - rq_id: rq-explanation-validity
    family_id: evidential-standards
    question_en: >-
      Under what definitions, controls, and counterfactual constraints does an explanation genuinely depend on the model it explains?
    question_zh: 在什么定义、对照和反事实约束下，一个解释才真正依赖被解释模型？
    introduction_en: >-
      Visual plausibility or intuitive credibility is not sufficient evidence of faithfulness.
      This question requires testable dependence on model parameters, training data, and counterfactual changes, while distinguishing plausible from faithful explanations.
    introduction_zh: >-
      视觉上合理或直觉上可信并不足以证明忠实性。该问题要求解释对模型参数、训练数据和反事实变化表现出可检验的依赖，
      并明确 plausible explanation 与 faithful explanation 的边界。
    progress_en: >-
      Parameter- and label-randomization tests showed that visually plausible saliency maps may not depend on the model being explained.
      Work on attention added explicit explanation definitions, baselines, and model-consistent counterfactual tests.
      These studies established necessary negative controls and definitional calibration, but no single faithfulness criterion covers all explanation objects.
    progress_zh: >-
      参数与标签随机化实验表明，视觉上合理的显著性图可能并不依赖被解释模型；围绕 attention 的研究进一步引入解释定义、基线和模型一致的反事实检验。
      现有工作确立了必要的负向对照与定义校准，但尚未形成适用于所有解释对象的单一忠实性判据。
    first_date: '2018-10-08'
    primary_paper_ids:
      - p_2018_adebayo_sanity_checks_for
      - p_2019_wiegreffe_attention_is_not

  - rq_id: rq-conceptual-prediction-explanation
    family_id: mechanism-explanation
    question_en: >-
      How can input attribution and internal concept semantics be combined into an understandable explanation of a prediction mechanism?
    question_zh: 如何把输入归因与内部概念语义结合为可理解的预测机制解释？
    introduction_en: >-
      An explanation should identify not only where the input matters, but also which concepts the model recognized, where they occur, and how they jointly produce the current prediction.
    introduction_zh: >-
      该问题要求解释不仅指出输入哪里重要，还说明模型识别了什么概念、概念出现在哪里，
      以及它们如何在模型内部共同促成当前预测。
    progress_en: >-
      Concept Relevance Propagation integrated input-location attribution, internal concept identification, and concept composition into one sample-level framework, allowing explanations to answer both where and what.
      Evidence currently comes mainly from vision models; extension to language and multimodal models, together with causal validation, remains open.
    progress_zh: >-
      Concept Relevance Propagation 已把输入位置归因、内部概念识别和概念组合纳入同一个样本级解释框架，使解释能同时回答“哪里重要”和“识别了什么”。
      目前证据主要来自视觉模型，向语言模型、多模态模型扩展以及验证概念解释的因果忠实性仍是开放问题。
    first_date: '2022-06-07'
    primary_paper_ids:
      - p_2022_achtibat_from_attribution_maps

  - rq_id: rq-probe-meaning
    family_id: evidential-standards
    question_en: >-
      What conclusions about internal information are supported by a probe's success or failure?
    question_zh: Probe 的成功或失败分别能支持什么关于内部信息的结论？
    introduction_en: >-
      This question separates signal in the representation, capability learned by the probe, and statistical power under finite samples.
      High accuracy does not by itself show that the model uses the information, and a null result does not show that the information is absent.
    introduction_zh: >-
      该问题区分表示中的信号、probe 自身学习出的能力和有限样本下的统计功效。高准确率不自动说明模型使用该信息，
      空结果也不自动说明信息不存在。
    progress_en: >-
      Control tasks and selectivity first separated representational signal from probe memorization; later counterexamples showed that decodability does not imply task use, and recent geometric and statistical theory explains when linear probes produce false negatives.
      The field has moved from controlling probe capacity to calibrating both positive and null results, although conclusions still depend on sample size, representation geometry, and probe class.
    progress_zh: >-
      Control task 与 selectivity 首先用于区分表示信号和 probe 自身的记忆能力；后续反例说明可解码性不等于任务使用，最新几何与统计理论又开始解释线性 probe 何时会产生假阴性。
      研究已从控制 probe 容量推进到校准正结果与空结果的含义，但结论仍依赖样本量、表示几何和 probe 类别。
    first_date: '2019-09-08'
    primary_paper_ids:
      - p_2019_hewitt_designing_and_interpreting
      - p_2026_hai_when_and_why
    secondary_paper_ids:
      - p_2020_ravichander_probing_the_probing

  - rq_id: rq-causal-use
    family_id: evidential-standards
    question_en: >-
      Is information readable from internal representations actually used by the model to produce behavior?
    question_zh: 内部可读出的信息是否被模型实际用于产生行为？
    introduction_en: >-
      This question separates information availability from task relevance.
      Task construction, intervention, or counterfactual geometry must show whether a representation participates in the model's actual computation.
    introduction_zh: >-
      该问题把 information availability 与 task relevance 分开。它要求通过任务构造、干预或反事实几何判断某种表示是否进入了模型的实际计算。
    progress_en: >-
      Constructed experiments showed that an attribute can remain highly decodable even when the main task does not require it.
      Geometric causal probing and world-state interventions then used counterfactual changes to test whether representations enter the computation.
      Availability and causal use are now treated as distinct, but a scalable general test for complex natural behavior is still missing.
    progress_zh: >-
      构造性实验已经证明，即使主任务不需要某种属性，该属性仍可能被高准确率解码；几何因果 probing 和世界状态干预则尝试用反事实变化判断表示是否真正进入计算。
      当前共识是必须把 information availability 与 causal use 分开，但可扩展到复杂自然行为的统一检验仍未建立。
    first_date: '2020-05-02'
    primary_paper_ids:
      - p_2020_ravichander_probing_the_probing
    secondary_paper_ids:
      - p_2023_guerner_a_geometric_notion
      - p_2023_nanda_emergent_linear_representations

  - rq_id: rq-intervention-reliability
    family_id: evidential-standards
    question_en: >-
      How robust are causal-intervention conclusions to metrics, replacement values, and experimental-design choices?
    question_zh: 因果干预结论对指标、替换值和实验设计选择有多稳健？
    introduction_en: >-
      Patching or ablation results can change with the metric, baseline, and corruption scheme.
      This question seeks reproducible design principles and limits strong localization claims drawn from a single experimental setup.
    introduction_zh: >-
      Patching 或 ablation 的结果可能随度量、基线和 corruption scheme 改变。该问题要求干预实验具有可复现的设计原则，
      并限制由单一设置推出过强的定位结论。
    progress_en: >-
      Systematic comparisons showed that activation-patching conclusions vary substantially with metrics, corruption procedures, replacement values, and normalization choices, motivating concrete design recommendations.
      Current progress is largely a best-practice framework validated for one method family; broader replication across tasks, models, and intervention paradigms is still needed.
    progress_zh: >-
      系统比较表明，activation patching 的结论会随度量、corruption、替换值和归一化方式显著变化，并据此提出了实验设计建议。
      当前进展主要是一套经单类方法验证的最佳实践；它在不同任务、模型和其他干预范式上的稳定性仍需更广泛复现。
    first_date: '2023-09-27'
    primary_paper_ids:
      - p_2023_zhang_towards_best_practices

  - rq_id: rq-circuit-faithfulness
    family_id: evidential-standards
    question_en: >-
      How should the faithfulness of a discovered circuit be validated through behavioral preservation rather than component overlap?
    question_zh: 一个被发现的电路应如何以行为保持而非组件重合来验证其忠实性？
    introduction_en: >-
      This question distinguishes finding similar components from preserving the original model computation.
      Central evidence is whether retaining the candidate mechanism preserves the target behavior and removing it produces the expected loss.
    introduction_zh: >-
      该问题区分“找到了相似组件”与“保留了原模型计算”。核心证据是只保留候选机制后能否维持目标行为，
      以及删去候选机制是否产生预期损失。
    progress_en: >-
      Existing work showed that component overlap between candidate circuits is not a substitute for behavioral faithfulness and proposed comparing behavior after retaining or removing the candidate mechanism.
      A function-preserving evaluation framework now exists, but unified benchmarks across discovery methods, distributions, and models remain limited.
    progress_zh: >-
      已有研究指出，候选电路之间的组件重合度不能替代行为忠实性，并提出用保留与删除候选机制后的行为变化比较电路质量。
      该问题已获得面向功能保持的评估框架，但跨发现算法、跨分布和跨模型的统一 benchmark 仍不充分。
    first_date: '2024-03-26'
    primary_paper_ids:
      - p_2024_hanna_have_faith_in

  - rq_id: rq-method-usefulness
    family_id: evidential-standards
    question_en: >-
      Do interpretability methods provide distinctive practical value on causal tasks, realistic distributions, and against strong baselines?
    question_zh: 解释方法在因果任务、现实分布和强基线下是否提供差异化实用价值？
    introduction_en: >-
      Being interpretable, reconstructive, or steerable is not automatically useful.
      A method should demonstrate gains on explicit downstream goals, counterfactual baselines, and out-of-task generalization, while allowing a finding of no added value.
    introduction_zh: >-
      可解释、可重建或可操纵不必然等于有用。该问题要求方法在明确下游目标、反事实基线和任务外泛化上证明优势，
      并允许得到“方法没有增益”的结论。
    progress_en: >-
      RAVEL made representation disentanglement comparable, and subsequent work tested SAEs and related methods through reconstruction, control, sparse probing, and simple steering baselines.
      The results show that greater interpretability does not automatically yield greater causal or practical value, and simple baselines are often competitive.
      Evaluation criteria remain use-case dependent.
    progress_zh: >-
      RAVEL 将表示解缠结转化为可比较任务，随后多项工作以重建、控制、稀疏 probing 和简单 steering baseline 检验 SAE 等方法。
      结果显示“更可解释”不自动意味着更有因果或实用价值，且简单基线经常具有竞争力；不同用途所需的评价指标仍未统一。
    first_date: '2024-02-27'
    primary_paper_ids:
      - p_2024_huang_ravel_evaluating_interpretability
      - p_2024_makelov_towards_principled_evaluations
      - p_2025_wu_axbench_steering_llms
      - p_2025_kantamneni_are_sparse_autoencoders

  - rq_id: rq-audit-limits
    family_id: evidential-standards
    question_en: >-
      Can hidden mechanisms exist that are in principle undiscoverable through behavioral elicitation alone?
    question_zh: 是否存在原则上无法仅靠行为诱导发现的隐蔽机制？
    introduction_en: >-
      This question studies computational limits of interpretability and safety auditing: a mechanism may genuinely control behavior yet resist reliable elicitation through finite queries because of cryptographic or related constructions.
    introduction_zh: >-
      该问题研究解释与安全审计的计算边界：一个机制可以真实存在并控制行为，却因密码学或其他构造而无法通过有限查询可靠诱导出来。
    progress_en: >-
      Cryptographic Transformer circuits constructed backdoors that genuinely control behavior but are difficult to elicit through finite behavioral queries, establishing a principled negative result for auditing.
      This proves that unelicitable mechanisms can exist, but their prevalence in realistic training and feasible defenses remain unresolved.
    progress_zh: >-
      密码学 Transformer 电路构造出真实控制行为却难以通过有限行为查询诱导的 backdoor，为审计能力给出了原则性负面结果。
      它证明了不可诱导机制可以存在，但现实训练中这类机制的普遍性以及可行防御仍未解决。
    first_date: '2024-06-03'
    primary_paper_ids:
      - p_2024_draguns_unelicitable_backdoors_in

  - rq_id: rq-evidence-ladder
    family_id: evidential-standards
    question_en: >-
      How can correlational findings be progressively upgraded into causal, out-of-distribution, and deployment-relevant interpretability evidence?
    question_zh: 如何把相关性发现逐级升级为因果、分布外和部署条件下可信的解释证据？
    introduction_en: >-
      This question treats explanation as staged evidence accumulation.
      Candidate features must pass correlation, localization, intervention, generalization, and cost calibration rather than being called mechanisms after one correlational observation.
    introduction_zh: >-
      该问题把解释看成分阶段证据积累过程，要求候选特征依次通过相关、定位、干预、泛化和成本校准，
      避免把单次相关观察直接称为机制。
    progress_en: >-
      A five-stage workflow now moves from correlational discovery through intervention, mechanism composition, out-of-distribution testing, and deployment-condition auditing, allowing interpretability claims to be graded by strength.
      The main contribution is methodological integration; whether every stage is sufficient and reproducible across model classes and real research workflows remains to be tested.
    progress_zh: >-
      现有工作提出从相关性发现、干预验证、机制组合、分布外检验到部署条件审计的五阶段证据流程，使不同强度的解释性主张可以被分级。
      当前贡献主要是方法论整合，尚需在多类模型和真实研究流程中检验各阶段标准是否充分且可重复。
    first_date: '2026-05-21'
    primary_paper_ids:
      - p_2026_munigety_from_correlation_to

  - rq_id: rq-formal-verification
    family_id: evidential-standards
    question_en: >-
      Can mechanistic explanations receive explicit domains of validity, counterexample search, and solver-checkable guarantees?
    question_zh: 机制解释能否获得明确适用域、反例搜索与 solver-checkable 的形式保证？
    introduction_en: >-
      This question elevates empirical circuit claims into verifiable propositions, requiring checkable proof objects for algorithmic equivalence, edge necessity, irrelevant-input invariance, and perturbation robustness.
    introduction_zh: >-
      该问题把经验性的 circuit claim 提升为可验证命题，要求算法等价、边必要性、无关输入不变性与扰动稳健性具有可检查的证明对象。
    progress_en: >-
      Recent work formulates circuit explanations as formal claims with explicit domains and uses solvers to find counterexamples and check guarantees, moving from empirical to machine-verifiable evidence.
      It remains a proof of concept, constrained by expressiveness, computational scale, and the difficulty of representing approximate neural computation.
    progress_zh: >-
      研究已开始把电路解释写成带明确适用域的形式命题，并利用求解器搜索反例和检查保证，从经验性证据推进到机器可验证证据。
      当前仍处于概念验证阶段，约束表达能力、计算规模以及与近似神经计算的衔接是主要限制。
    first_date: '2026-05-21'
    primary_paper_ids:
      - p_2026_somani_towards_verifiable_transformers

  - rq_id: rq-information-accessibility
    family_id: temporal-development
    question_en: >-
      When, where, and in how readily readable a form does task-relevant information appear inside a network?
    question_zh: 任务相关信息在网络内部何时、何处以及以多容易读取的形式出现？
    introduction_en: >-
      This question uses non-invasive readout to describe information accessibility across depth or training.
      It provides diagnostic evidence but does not itself establish that the model uses the information.
    introduction_zh: >-
      该问题以非侵入式读出描述信息沿网络深度或训练过程的可访问性。它提供诊断线索，但本身不回答模型是否真正使用这些信息。
    progress_en: >-
      Linear classifier probes tracked class information non-invasively across layers and training and exposed training failures not visible in final loss.
      This established a layerwise representation-diagnostic paradigm, while later causal work is still required to determine whether the model actually uses the decoded information.
    progress_zh: >-
      线性 classifier probe 已用于非侵入式追踪类别信息随网络深度和训练过程的可访问性，并能揭示最终 loss 难以发现的训练异常。
      这奠定了层间表示诊断范式，但 probe 结果是否对应模型实际使用该信息，需要后续因果研究补充。
    first_date: '2016-10-05'
    primary_paper_ids:
      - p_2016_alain_understanding_intermediate_layers

  - rq_id: rq-concept-unit-alignment
    family_id: representation-form
    question_en: >-
      Do individual internal units correspond to human-interpretable concepts?
    question_zh: 模型中的单个内部单元是否对应人类可理解的概念？
    introduction_en: >-
      This question asks whether semantic concepts are concentrated in individual neurons or channels, and whether
      such unit–concept correspondence reflects the organization of the representation or appears only in a particular
      coordinate basis. Studies typically compare a unit's activation regions or responsive examples with human
      concept annotations. Such alignment does not establish that the unit is monosemantic or causally used in
      prediction. Automatically generating open-vocabulary unit descriptions is treated as a separate
      explanation-construction question.
    introduction_zh: >-
      该问题考察模型是否将某些语义概念集中编码在单个神经元或通道上，以及这种“单元—概念”对应是表示的真实组织方式，
      还是只有在特定坐标基底下才会显现。研究通常将单元的激活区域或响应样本与人工概念标注进行比较。这样的对齐不等于单元具有单一含义，
      也不能单独证明模型在预测时因果地使用了该概念。如何自动为单元生成开放词汇名称，则属于另一个解释构造问题。
    progress_en: >-
      Network Dissection operationalized unit–concept alignment using the densely annotated Broden dataset and an
      IoU-based detector metric for objects, parts, materials, textures, and other visual concepts. Its rotation
      experiments showed that unit-level interpretability can fall sharply while information content and classification
      performance remain largely unchanged, demonstrating dependence on the representation basis. CLIP-Dissect later
      reduced reliance on dense segmentation labels and fixed concept vocabularies, enabling scalable open-vocabulary
      descriptions. CRP and RelMax further showed that maximally activating examples need not reveal how a unit is
      actually used in a particular prediction, extending the line toward prediction-conditioned relevance and concept
      composition. Unit semantics can now be measured and described at greater scale, but conclusions remain dependent
      on the basis, vocabulary, probe data, and input context, and do not establish monosemanticity or causal necessity.
    progress_zh: >-
      Network Dissection 使用带语义分割标注的 Broden 数据集和 IoU 指标，系统量化了视觉网络中单元与物体、部件、材质、纹理等概念的对应关系。
      随机旋转实验表明：在分类性能和信息量基本不变的情况下，单元级可解释性会显著下降，说明这种对应依赖表示空间的坐标轴。CLIP-Dissect 随后减少了对密集分割标注
      和固定概念词表的依赖，使单元语义能够以开放词汇进行规模化描述。CRP 与 RelMax 进一步指出，最强激活样本不一定反映单元在具体预测中实际发挥的作用，
      并把分析推进到预测条件下的概念相关性与概念组合。当前已经可以较大规模地测量和描述单元语义，但结果仍受坐标基底、候选词表、探测数据和输入情境影响，
      也尚不能据此证明单义性或因果必要性。
    first_date: '2017-04-19'
    primary_paper_ids:
      - p_2017_bau_network_dissection_quantifying
    secondary_paper_ids:
      - p_2022_oikarinen_clip_dissect_automatic_description
      - p_2022_achtibat_from_attribution_maps

  - rq_id: rq-automatic-unit-description
    family_id: mechanism-explanation
    question_en: >-
      How can internal units be given accurate, open-vocabulary semantic descriptions without concept-labelled data?
    question_zh: 如何在没有概念标注数据的情况下，自动为内部单元生成准确的开放词汇语义描述？
    introduction_en: >-
      This question treats semantic labelling as an explanation-construction problem: the target units already exist,
      but their functions must be translated into descriptions without a fixed ontology or expensive dense annotation.
    introduction_zh: >-
      该问题把语义命名视为机制解释的构造过程：内部单元已经存在，但需要在没有固定概念本体和昂贵密集标注的情况下，
      将其功能转换为可理解描述。
    progress_en: >-
      CLIP-Dissect used pretrained vision-language alignment to label hidden visual units with unrestricted concepts,
      improving flexibility and efficiency over fixed-vocabulary dissection. Whether the resulting names capture causal
      function rather than activation correlation remains a separate evidential question.
    progress_zh: >-
      CLIP-Dissect 利用预训练视觉—语言对齐，以开放概念命名视觉网络隐单元，相比固定词汇的 dissection 更灵活高效。
      这些名称是否反映因果功能而非激活相关，仍属于证据标准问题。
    first_date: '2022-04-23'
    primary_paper_ids:
      - p_2022_oikarinen_clip_dissect_automatic_description

  - rq_id: rq-unsupervised-feature-discovery
    family_id: representation-form
    question_en: >-
      Can interpretable representational factors be discovered from model activations without predefined concepts?
    question_zh: 不预设概念时，能否从模型激活中发现可解释的表示因素？
    introduction_en: >-
      This question asks whether recurring directions or latent factors can emerge from model activations without
      beginning with a human-defined concept vocabulary or a specific probing target. Methods such as dictionary
      learning and ICA decompose the activation distribution into candidate factors, whose meanings are then assessed
      using high-response examples, controlled input changes, and downstream tests. Readable factors do not imply a
      unique decomposition, complete coverage of the representation, or causal necessity for model behavior. Unlike
      the later SAE branch, this question concerns hypothesis-free exploratory factor discovery rather than
      specifically recovering latent features from superposition with an overcomplete sparse dictionary.
    introduction_zh: >-
      该问题关注能否不从人工概念词表或特定 probe 目标出发，而让模型激活本身揭示反复出现的表示方向或潜在因素。
      Dictionary learning、ICA 等方法通过分解激活分布得到候选因素，再根据高响应样本、受控输入变化和下游测试判断其是否具有一致语义。
      发现可读因素并不意味着分解结果唯一，也不能证明这些因素覆盖了模型的全部表示或对模型行为具有因果必要性。与后续 SAE 分支相比，
      这里关注的是无预设假说的探索性因素发现，而不是专门检验过完备稀疏字典能否从 superposition 中恢复潜在特征。
    progress_en: >-
      Yun et al. decomposed contextual representations from different BERT layers using a shared nonnegative sparse
      dictionary. High-response contexts and layerwise trajectories exposed factors associated with word-sense
      disambiguation, sentence patterns, and long-range dependencies. This showed that meaningful representational
      hypotheses can be generated without predefined linguistic probes, although the evidence was concentrated in
      selected cases from one model. ICA Lens later extracted non-Gaussian directions from three language models and
      added convergence diagnostics, random-component audits, sparse probing, and targeted perturbations. Its results
      show that many readable and functionally useful directions can be recovered cheaply without training an
      overcomplete dictionary for every layer. Data-driven factor discovery is therefore feasible, but its results
      still depend on the decomposition objective, activation corpus, factor capacity, and human interpretation
      procedure. Whether different methods recover consistent, unique, and broadly transferable factors remains
      unresolved.
    progress_zh: >-
      Yun 等人将不同 BERT 层的上下文化表示分解为同一个非负稀疏字典中的因素，并通过高响应语境和逐层变化轨迹发现词义消歧、句内模式和长距离依赖等结构。
      这表明，不预设具体语言学 probe，也能从激活中提出有意义的表示假说，但证据主要来自少量筛选案例和单一模型。ICA Lens 随后使用独立成分分析，从三个语言模型的激活中提取非高斯方向，
      并加入收敛诊断、随机成分审计、稀疏 probing 和定向扰动。结果表明，无需为每层训练过完备字典，也能低成本获得许多可读且具有一定功能效用的方向。
      目前已经证明数据驱动的因素发现是可行的，但结果仍取决于分解目标、激活语料、因素数量和人工解释过程；不同方法能否恢复一致、唯一且可推广的表示因素，仍未解决。
    first_date: '2021-03-29'
    primary_paper_ids:
      - p_2021_yun_transformer_visualization_via
      - p_2026_liu_ica_lens_interpreting

  - rq_id: rq-neuron-feature-structure
    family_id: representation-form
    question_en: >-
      Are features in large language models represented by individual neurons or neuron populations?
    question_zh: 大语言模型中的特征由单个神经元还是神经元群表示？
    introduction_en: >-
      This question asks whether native model neurons have relatively distinct, interpretable functions or whether features are distributed across neuron populations while individual neurons participate in several features. Studies compare activation sparsity, feature localization, and neuron types across layers and model scales. Sparse probes can show that a small neuron set contains readable information, but do not by themselves establish causal use. The question concerns native units rather than learned SAE latents.
    introduction_zh: >-
      该问题考察模型原生神经元是否具有相对独立、可理解的功能，还是一个特征通常分布在多个神经元中，同时单个神经元也参与多个特征。研究会比较不同层和不同规模模型中的激活稀疏性、特征定位及神经元类型。Sparse probe 能说明少量神经元包含足够的可读信号，但不能单独证明模型实际依赖这些神经元。这里研究的是模型原生单元，不包括 SAE 等方法学习出的潜在特征。
    progress_en: >-
      Sparse-probing studies find both near-monosemantic neurons and distributed or superposed representations. Shallow layers often detect tokens and n-grams, while middle layers contain cleaner contextual-category units. Larger models sometimes represent a feature with fewer neurons, but can also split it across units. Large-scale surveys additionally identify inactive, positional, and lexical-pattern neurons and coordination across layers. Native neuron organization is therefore heterogeneous, and neither a one-feature–one-neuron view nor a fully distributed account is sufficient. Much of the evidence remains observational or decodability-based.
    progress_zh: >-
      Sparse probing 研究发现，大语言模型中既存在接近单义的神经元，也存在分布式和叠加表示。较浅层常检测词元与 n-gram 模式，中间层会出现更清晰的上下文类别单元；模型增大后，部分特征由更少神经元读出，但也可能发生特征分裂。大规模神经元普查进一步发现了大量未激活、位置选择性和词汇模式神经元，并观察到不同层之间的协作。现有证据表明原生神经元的组织方式高度混合，尚不能用“一个特征对应一个神经元”或“所有特征都完全分布式”统一解释；多数结果仍以观察和解码证据为主。
    first_date: '2023-05-02'
    primary_paper_ids:
      - p_2023_gurnee_finding_neurons_in
      - p_2023_voita_neurons_in_large

  - rq_id: rq-superposition
    family_id: representation-form
    question_en: >-
      Why do models represent multiple features in superposition?
    question_zh: 模型为什么会用叠加方式表示多个特征？
    introduction_en: >-
      When the number of useful features exceeds the available representational dimensions, a model can encode
      features along non-orthogonal directions rather than assigning each feature a dedicated dimension. If the
      features rarely co-occur, the cost of occasional interference may be smaller than the benefit of representing
      additional features, making superposition advantageous. This question studies how feature sparsity, importance,
      correlation, nonlinearities, and a limited dimensional budget determine whether a feature is omitted, given a
      dedicated dimension, or made to share capacity, as well as the geometry that shared representations adopt. It
      does not establish how prevalent superposition is in real large models or address how latent features can be
      recovered from it.
    introduction_zh: >-
      当需要表示的特征多于可用维度时，模型可以不为每个特征分配独立维度，而是将多个特征编码为不同的非正交方向。
      如果这些特征很少同时出现，偶发干扰造成的损失可能小于额外表示更多特征带来的收益，叠加因而可能成为更优方案。该问题研究特征的稀疏性、重要性、相关性、
      非线性以及有限的维度预算，如何决定一个特征被舍弃、独占维度或与其他特征共享容量，以及共享时会形成什么几何结构。它不直接回答真实大型模型中叠加有多普遍，
      也不讨论如何从叠加表示中恢复潜在特征。
    progress_en: >-
      Toy Models of Superposition showed in synthetic models with known ground-truth features that sparse features
      rarely activate together, allowing a model to trade occasional interference for representing more features in a
      limited-dimensional space. Feature importance, sparsity, and correlation determine whether features are omitted,
      assigned dedicated dimensions, or placed in superposition, with sharp transitions between solutions and geometric
      arrangements such as antipodal pairs, triangles, pentagons, and tetrahedra. Polysemanticity and Capacity
      subsequently formalized the phenomenon as constrained optimization under a finite capacity budget: high-value
      features receive full capacity, low-value features are omitted, and intermediate features with diminishing returns
      share dimensions; architecture and nonlinearities also affect the size and structure of superposition blocks.
      Together, these studies provide a substantial theory of superposition and polysemanticity in toy models. It
      remains unclear whether real large models satisfy assumptions such as known independent features and transparent
      objectives, or whether the predicted capacity allocations and phase transitions can be measured directly.
    progress_zh: >-
      Toy Models of Superposition 在具有已知真值特征的合成模型中表明，稀疏特征很少同时激活，因此模型可以用少量干扰换取在有限维空间中表示更多特征。
      特征的重要性、稀疏性和相关性决定它们被舍弃、获得独立维度还是进入叠加，最优解之间还会出现清晰的相变；叠加方向则形成反向点对、三角形、五边形和四面体等几何结构。
      Polysemanticity and Capacity 随后把这一现象形式化为有限容量下的约束优化：高价值特征获得完整容量，低价值特征被忽略，具有递减容量收益的中间特征共享维度；
      架构和激活函数还会影响叠加块的大小与结构。这两项工作已经为玩具模型中的 superposition 和 polysemanticity 提供了较完整的理论解释，但真实大型模型是否满足已知、独立特征和透明损失等假设，
      以及理论预测的容量分配与相变能否被直接测量，仍未解决。
    first_date: '2022-09-21'
    primary_paper_ids:
      - p_2022_elhage_toy_models_of
      - p_2022_scherlis_polysemanticity_and_capacity

  - rq_id: rq-sparse-feature-recovery
    family_id: representation-form
    question_en: >-
      Can sparse autoencoders recover interpretable features from superposed representations?
    question_zh: 稀疏自编码器能否从叠加表示中恢复可解释特征？
    introduction_en: >-
      Sparse autoencoders represent model activations as combinations of a small number of latent features. This question asks whether those latents more closely match the representational units actually used by the model than native neurons do, while preserving enough of the original activation for precise intervention. Readability and sparsity do not imply that the recovered features are true, unique, or complete; reconstruction, identifiability, and causal function require separate evaluation.
    introduction_zh: >-
      稀疏自编码器将模型激活表示为少量潜在特征的组合。该问题考察这些潜在特征是否比原生神经元更接近模型内部实际使用的表示单位，同时能否充分重建原始激活并支持更精确的干预。可读或稀疏并不意味着所得特征是真实、唯一或完整的；重构误差、特征可识别性和因果功能需要分别检验。
    progress_en: >-
      Early work by Cunningham et al. showed that sparse autoencoders can extract latent features that are more interpretable than native neurons or principal components. In an indirect-object-identification task, feature-level patching also localized relevant factors more precisely than interventions on raw activation dimensions. This established the feasibility of recovering readable and intervenable features from superposition. Reconstruction nevertheless remains incomplete, automated descriptions can miss or overstate semantics, and overcomplete dictionaries are not equally stable at every activation site. SAEs have therefore not been shown to recover a unique or complete ground-truth feature basis.
    progress_zh: >-
      Cunningham 等人的早期研究表明，稀疏自编码器可以从语言模型激活中提取比原始神经元和主成分更容易解释的潜在特征。在间接宾语识别任务中，特征级 patching 还比直接干预原始激活维度更精确地定位了少量相关因素。这建立了从叠加表示中恢复可读、可干预特征的可行性证据。但重构仍不完整，自动解释可能遗漏或夸大语义，部分激活位置也难以稳定学习过完备字典，因此尚不能认为 SAE 已恢复模型的真实完整特征基。
    first_date: '2023-09-15'
    primary_paper_ids:
      - p_2023_cunningham_sparse_autoencoders_find

  - rq_id: rq-sparse-objective
    family_id: representation-form
    question_en: >-
      How should sparse autoencoders balance sparsity and fidelity?
    question_zh: 稀疏自编码器如何在稀疏性与保真度之间取得平衡？
    introduction_en: >-
      Sparse autoencoders should activate only a small number of features while preserving the information and computation of the original model. Fidelity may refer to activation reconstruction, preservation of downstream hidden states, or preservation of final outputs, and these objectives are not equivalent. This question studies how sparsity penalties, gates, thresholds, and end-to-end losses shape the learned dictionary. A better sparsity–reconstruction frontier does not automatically imply greater interpretability or causal value.
    introduction_zh: >-
      稀疏自编码器既要让每个输入只激活少量特征，又要尽量保留原模型的信息和计算。这里的保真度可能指激活重建、下游隐藏状态保持或最终输出保持，这些目标并不等价。该问题研究稀疏惩罚、门控、阈值和端到端损失如何改变学到的特征。更好的稀疏—重建曲线不自动意味着特征更容易理解或具有更强的因果意义。
    progress_en: >-
      Gated SAEs separate feature detection from magnitude estimation, reducing the shrinkage caused by L1 penalties and improving reconstruction at matched sparsity. End-to-end sparse dictionary learning optimizes model outputs or downstream states rather than only reconstructing one activation layer, prioritizing features that preserve more of the original computation. JumpReLU SAEs use learned thresholds to approximate direct L0 optimization and further improve the sparsity–reconstruction frontier. These studies show that part of the standard SAE trade-off is created by the objective itself, but no objective has yet proved uniformly superior for reconstruction, behavioral fidelity, causal use, and human interpretability.
    progress_zh: >-
      Gated SAE 将“特征是否出现”与“特征强度是多少”分开，减少了 L1 惩罚造成的幅度收缩，并在相同稀疏度下改善重建。端到端稀疏字典学习不再只重建单层激活，而是直接优化模型输出或后续隐藏状态，从而优先保留对原计算更重要的因素。JumpReLU SAE 则通过可学习阈值直接近似优化 L0，进一步改善稀疏—重建前沿。这些工作说明标准 SAE 的部分损失来自目标函数本身，但尚未出现同时在重建、模型行为、因果用途和人工可解释性上都占优的统一目标。
    first_date: '2024-04-24'
    primary_paper_ids:
      - p_2024_rajamanoharan_improving_dictionary_learning
      - p_2024_braun_identifying_functionally_important
      - p_2024_rajamanoharan_jumping_ahead_improving

  - rq_id: rq-sparse-feature-failure
    family_id: representation-form
    question_en: >-
      Why do sparse autoencoders learn misleading features?
    question_zh: 稀疏自编码器为什么会学到误导性的特征？
    introduction_en: >-
      Sparse autoencoders may split one concept across several latents, absorb a broad concept into more specific features, or produce duplicated, dead, or mixed features through optimization. A structural mismatch also arises when a semantic feature is multidimensional but each learned latent is forced to decode along one direction. This question asks when these failures occur, whether they arise from activation geometry or optimization, and how to determine whether an apparently readable feature should be trusted.
    introduction_zh: >-
      稀疏自编码器可能把一个概念拆成多个潜变量，也可能把一个较宽泛的概念吸收到多个更具体的特征中；优化还可能产生重复、死亡或混合特征。如果真实语义本身是多维子空间，而解码器强制每个特征只对应一个方向，也会造成结构性错配。该问题研究这些失败何时出现、来自数据几何还是优化目标，以及如何判断一个看似可读的特征是否值得信任。
    progress_en: >-
      Feature splitting and absorption can hide concepts that the underlying model causally uses even when activation reconstruction is strong. Aligning features across independent SAE runs improves recovery in some settings, although cross-run consistency is only a weak signal. A unified optimization theory further shows that polysemantic, duplicated, or dead features can be genuine global or local optima of standard sparse objectives rather than implementation mistakes. Subspace-aware SAEs show that one-direction latents systematically fragment multidimensional concepts and that grouped latents can mitigate the mismatch. A preliminary account now connects failure types, optimization, and representation geometry, but no reliable general diagnostic separates true features from stable artifacts in large models.
    progress_zh: >-
      Feature splitting 与 absorption 已被证明即使在激活重建良好时仍会遮蔽模型因果使用的概念。跨 SAE 运行进行特征对齐可以提高部分真实因素的恢复率，但一致性仍只是弱信号。统一优化理论进一步表明，多义、重复和死亡特征有时是标准稀疏目标的真实最优解或局部极小，而不只是实现错误。Subspace-aware SAE 则指出，单方向潜变量会系统性地碎片化多维概念，使用组值潜变量可以缓解这一问题。当前已经形成了失败类型、优化原因和几何错配之间的初步解释，但尚无能够在真实大模型中可靠区分真实特征与稳定伪影的统一诊断。
    first_date: '2024-09-22'
    primary_paper_ids:
      - p_2024_chanin_a_is_for
      - p_2024_marks_enhancing_neural_network
      - p_2025_tang_a_unified_theory
      - p_2026_dalili_subspace_aware_sparse

  - rq_id: rq-feature-atlas-scaling
    family_id: representation-form
    question_en: >-
      Can interpretable feature extraction scale across large models, layers, and rare concepts?
    question_zh: 可解释特征提取能否扩展到大型模型的全部层和长尾概念？
    introduction_en: >-
      This question asks whether sparse feature extraction can move from single-layer, small-model experiments to many activation sites in large models, millions of learned features, and rare concepts in the tail of the training distribution. Scaling is not only an engineering problem: dictionary width, training data, and deployment distribution affect feature splitting, coverage, and explanation quality. Releasing a large dictionary does not establish that every feature is real, monosemantic, or causally used.
    introduction_zh: >-
      该问题关注稀疏特征提取能否从单层、小模型实验扩展到大型模型的不同层位、不同激活位置和数百万级特征，同时覆盖训练数据中的稀有概念。规模扩大不仅是工程问题：字典宽度、训练数据和部署分布会影响特征分裂、覆盖率和解释质量。发布大规模字典并不等于证明其中每个特征都真实、单义或具有因果作用。
    progress_en: >-
      Gemma Scope and Llama Scope provide large SAE dictionaries across layers, activation sites, widths, and sparsity levels, establishing the engineering feasibility of model-wide feature extraction and limited transfer to related instruction models or longer contexts. Decoding Dark Matter uses targeted data retrieval and tail-oriented objectives to capture rare domain concepts more efficiently. Scaling Monosemanticity extends dictionary learning to a production-scale multimodal model and tens of millions of features, including directions that transfer across languages or modalities and can steer behavior. The central challenge has shifted from whether such dictionaries can be trained to whether their coverage is complete, features are identifiable, quality can be calibrated, and the original computation is preserved.
    progress_zh: >-
      Gemma Scope 和 Llama Scope 已经发布覆盖多层、不同子层、宽度和稀疏度的大规模 SAE 字典，证明全模型范围的特征提取在工程上可行，并显示部分字典可以迁移到相近的指令模型或更长上下文。Decoding Dark Matter 通过定向数据检索和尾部风险目标提高了稀有领域概念的覆盖效率。Scaling Monosemanticity 又把字典学习扩展到生产级多模态模型和数千万特征，并展示部分跨语言、跨模态及可引导的方向。当前瓶颈已经从“能否训练”转向“覆盖是否完整、特征是否唯一、质量如何校准以及是否保留全模型计算”；尤其是长尾特征和全模型因果闭合性仍未解决。
    first_date: '2024-08-09'
    primary_paper_ids:
      - p_2024_lieberum_gemma_scope_open
      - p_2024_he_llama_scope_extracting
      - p_2024_muhamed_decoding_dark_matter
      - p_2026_templeton_scaling_monosemanticity_extracting

  - rq_id: rq-causal-representation-geometry
    family_id: representation-form
    question_en: >-
      Do models represent semantic concepts as linear directions or subspaces?
    question_zh: 模型是否以线性方向或子空间表示语义概念？
    introduction_en: >-
      This question asks whether a semantic variable corresponds to a direction or low-dimensional subspace that can be measured by projection across inputs and manipulated by moving representations along it. Successful linear probing establishes only decodability. A stronger linear-representation claim must rule out correlated confounds and test whether the direction affects model outputs. Directions and subspaces may also be non-unique and depend on the chosen inner product and representation coordinates.
    introduction_zh: >-
      该问题研究一个语义变量是否对应表示空间中的方向或低维子空间，使不同输入中的同一概念能够通过投影被测量，并通过沿该方向移动而被改变。线性 probe 成功只能说明信息可以被线性读出；更强的线性表示主张还需要排除相关混淆，并检验该方向是否影响模型输出。方向或子空间也可能不唯一，并依赖所采用的内积和表示坐标。
    progress_en: >-
      Causal-probing work adds geometric and causal conditions to concept subspaces and shows that some linguistic variables can be selectively erased or manipulated, although success varies by concept. Sentiment studies identify an approximately shared linear direction across words and contexts and support its causal role through representation interventions and circuit ablations. Theory of linear representation later relates subspaces, probes, and intervention vectors within an appropriate causal geometry. The evidence supports linear structure for some semantic variables, but does not imply that every concept is linear, that its direction is unique, or that the same geometry persists across models.
    progress_zh: >-
      Causal probing 工作为概念子空间加入了几何与因果条件，并证明部分语言变量可以被选择性擦除或操纵，但不同概念的成功程度并不一致。情感研究发现，一条近似共享的线性方向能够跨词汇和语境表示正负情感，并通过干预和电路消融影响预测。线性表示理论随后统一了子空间、线性 probe 和表示操控等定义，说明在合适的因果几何下，词对差分可以同时构造读出方向和控制方向。现有证据支持部分语义变量具有线性结构，但不能推出所有概念都线性、方向唯一或跨模型保持稳定。
    first_date: '2023-07-27'
    primary_paper_ids:
      - p_2023_guerner_a_geometric_notion
      - p_2023_tigges_linear_representations_of
      - p_2023_park_the_linear_representation

  - rq_id: rq-prompt-geometry-monitoring
    family_id: representation-form
    question_en: >-
      Can the internal geometry of a prompt reveal model uncertainty?
    question_zh: Prompt 的内部几何能否反映模型的不确定性？
    introduction_en: >-
      This question treats the token representations produced by one prompt at a layer as a point cloud and asks whether its intrinsic dimension summarizes the complexity of token interactions. Rather than searching for one semantically defined direction, it uses global geometry as a monitoring signal for uncertainty or anomalous inputs. Predictive correlations can support screening, but do not show that high-dimensional geometry causes uncertainty.
    introduction_zh: >-
      该问题把一条 prompt 在某层产生的全部 token 表示看作一个点云，并考察其内在维度是否概括了 token 之间的复杂关系。它不同于寻找某个具有明确语义的方向，而是使用整体几何作为模型不确定性或异常输入的监测信号。几何相关性能够支持预测和筛查，但不自动说明高维结构导致了不确定性。
    progress_en: >-
      Prompt intrinsic dimension often peaks in early-to-middle layers, increases under linguistic perturbations, and correlates strongly with average surprisal. Layerwise dimension profiles can also distinguish some malicious prompts before generation. Replication across models and estimators supports intrinsic dimension as a geometric monitoring signal, but the evidence remains correlational. Reliable estimation generally requires long prompts, and malicious-prompt classification may exploit dataset artifacts, so intrinsic dimension is not yet a general uncertainty or safety guarantee.
    progress_zh: >-
      现有研究发现，prompt 的内在维度通常在模型早中层达到峰值，语言扰动会提高这一维度，逐层维度轮廓与平均 surprisal 存在较强关系，并可在生成前区分部分恶意提示。跨模型和不同内在维度估计器的结果支持它作为几何监测信号，但证据仍是相关性的。可靠估计通常需要较长 prompt，恶意提示分类也可能利用数据集差异，因此尚不能把内在维度视为通用的不确定性或安全风险指标。
    first_date: '2025-01-17'
    primary_paper_ids:
      - p_2025_viswanathan_the_intrinsic_dimension

  - rq_id: rq-world-model-representation
    family_id: representation-form
    question_en: >-
      Do sequence models form and use representations of world state?
    question_zh: 序列预测模型会形成并使用世界状态表示吗？
    introduction_en: >-
      This question asks whether models trained only to predict the next symbol construct a latent state of the process generating the sequence rather than merely memorizing surface patterns. The state may be a definite environment configuration or a belief distribution over possible hidden states under uncertainty. Strong evidence should show that the state is decodable, geometrically structured, and functionally involved in prediction.
    introduction_zh: >-
      该问题考察仅通过预测下一个符号训练的模型，是否会构建产生当前序列的潜在状态，而不只是记忆表面模式。世界状态可以是确定的环境配置，也可以是在信息不完整时对多个潜在状态的信念分布。强证据需要同时说明状态可以被读出、具有可解释的几何，并在被改变时影响模型预测。
    progress_en: >-
      OthelloGPT studies first showed that a sequence model can develop a decodable board state and that modifying the corresponding representation changes legal-move predictions. Later analysis found that this state need not be fundamentally nonlinear: a current-player-relative coordinate system reveals causally effective linear directions. Belief-state work extends the question to uncertain generative processes and shows that Transformer residual streams can reproduce the geometry of Bayesian belief updating rather than only next-symbol probabilities. Evidence is strong in controlled settings, but board games and small hidden-state processes remain far from natural language and do not establish a unified, complete world model in realistic LLMs.
    progress_zh: >-
      OthelloGPT 研究首先表明，序列模型能够形成可解码的棋盘状态，修改相关表示还会改变合法落子预测。后续重新分析发现，棋盘并非必须以非线性方式表示；采用“相对当前玩家”的坐标后，可以找到具有因果作用的线性方向。信念状态研究进一步扩展到具有隐藏状态的不确定生成过程，发现 Transformer 的残差流能够匹配贝叶斯信念更新的几何，而不只编码下一符号概率。现有证据在受控环境中较强，但棋类游戏和小型隐马尔可夫过程与自然语言相距较远，尚不能证明真实语言模型形成了统一、完整且被实际使用的世界模型。
    first_date: '2022-10-24'
    primary_paper_ids:
      - p_2022_li_emergent_world_representations
      - p_2023_nanda_emergent_linear_representations
      - p_2024_shai_transformers_represent_belief

  - rq_id: rq-hidden-state-readout
    family_id: mechanism-explanation
    question_en: >-
      How can a single hidden state reveal model knowledge richer and more expressive than its next-token distribution?
    question_zh: 如何从单个 hidden state 中读出比下一 token 更丰富、更可表达的模型知识？
    introduction_en: >-
      This question compares direct vocabulary projection, learned correction, and cross-context state transplantation to identify the boundary of information present in a hidden state but not yet explicitly emitted.
    introduction_zh: >-
      该问题比较直接词表投影、学习校正和跨上下文 state transplantation，考察 hidden state 中尚未显式输出的信息边界。
    progress_en: >-
      Patchscopes unified several hidden-state inspection methods by using a target model and natural-language prompts, revealing information beyond the current next-token distribution.
      Tuned Lens and Future Lens supplied related precedents for layerwise and future-token readout.
      A more expressive general framework now exists, but outputs remain sensitive to prompts, target models, and mapping design.
    progress_zh: >-
      Patchscopes 用目标模型和自然语言 prompt 统一多种 hidden-state 检查方式，并能读出超出当前 next-token distribution 的信息；Tuned Lens 与 Future Lens 分别提供层间和未来 token 的相关先例。
      当前已形成表达力更强的通用读出框架，但读出结果对 prompt、目标模型和映射设计的依赖仍需校准。
    first_date: '2024-01-11'
    primary_paper_ids:
      - p_2024_ghandeharioun_patchscopes_a_unifying
    secondary_paper_ids:
      - p_2023_belrose_eliciting_latent_predictions
      - p_2023_pal_future_lens_anticipating

  - rq_id: rq-task-function-vectors
    family_id: representation-form
    question_en: >-
      Can models represent tasks as reusable vectors?
    question_zh: 模型能否把任务表示为可复用的向量？
    introduction_en: >-
      This question asks whether a task or function can be compressed into a vector whose addition, removal, or combination predictably changes model behavior. A task vector may be a parameter difference created by fine-tuning or a hidden-state direction produced during in-context learning. These objects live in different spaces and need not reflect the same mechanism. The central issue is whether they can be reused across inputs, composed, and shown to have predictable behavioral effects.
    introduction_zh: >-
      该问题考察一个任务或函数能否被压缩为模型空间中的向量，并通过向量的加入、删除或组合来触发相应行为。任务向量可能来自微调前后的参数差分，也可能来自模型执行上下文学习时的隐藏状态；二者位于不同空间，并不代表同一种内部机制。关键问题是这些向量能否跨输入复用、组合并对行为产生可预测影响。
    progress_en: >-
      Task Arithmetic shows that fine-tuning-induced parameter differences can sometimes suppress behavior when negated, combine tasks when added, and support limited task analogies. Function-vector work later extracts compact activation directions from causally important attention heads and shows that inserting them can trigger a task even when demonstrations are absent or misleading. Together, these lines support vector-like task representations, but parameter task vectors and activation-space function vectors have not been shown to share one mechanism. Composition remains limited by nonlinear interactions, layer choice, scaling, and task compatibility.
    progress_zh: >-
      Task Arithmetic 发现，微调产生的参数差分可以在一定范围内通过取反删除行为、通过相加组合任务，并支持部分任务类比。Function Vectors 随后在激活空间中，从具有因果重要性的注意力头提取出紧凑任务方向；把这些方向加入其他输入后，即使示例缺失或具有误导性，也能触发相应任务。两条研究线共同表明任务信息可以呈现向量化结构，但参数任务向量与激活 function vector 尚未被证明具有统一机制，组合会受到非线性交互、层位置、缩放系数和任务相容性的限制。
    first_date: '2023-10-23'
    primary_paper_ids:
      - p_2023_todd_function_vectors_in
    secondary_paper_ids:
      - p_2022_ilharco_editing_models_with

  - rq_id: rq-compositional-binding
    family_id: representation-form
    question_en: >-
      How do models bind entities to their attributes in context?
    question_zh: 模型如何在上下文中绑定实体及其属性？
    introduction_en: >-
      When a context contains several entities and attributes, a model must preserve which attributes belong to which entities and retrieve the correct pairing when queried. This question asks whether temporary relations are represented through reusable binding identifiers rather than separate circuits for every entity–attribute pair. It concerns the form of the binding representation; the upstream computation that creates the identifiers is a further mechanism question.
    introduction_zh: >-
      当上下文同时出现多个实体及其属性时，模型必须保留哪些属性属于哪个实体，并在查询时取回正确配对。该问题研究这种临时关系是否通过可复用的绑定标识表示，而不是为每一个实体—属性组合建立独立电路。它关注绑定的表示形式；绑定标识由什么上游计算产生，则是进一步的机制问题。
    progress_en: >-
      Current evidence suggests that language models attach approximately additive, position-insensitive binding identifiers to entity–attribute pairs. Paired interventions on these representations can reliably swap which attributes are retrieved for two entities, and some binding directions transfer across positions and tasks. This supports a reusable low-dimensional binding representation rather than an independent circuit for every fact. Evidence remains limited to a small set of models and controlled tasks, transfer is imperfect, and the upstream mechanism that constructs the identifiers has not been fully localized.
    progress_zh: >-
      现有研究发现，语言模型可以为上下文中的实体—属性对加入近似可加、与位置相对独立的绑定标识。对这些表示进行成对干预，可以稳定交换模型为两个实体取回的属性；部分绑定方向还能跨位置和任务迁移。结果支持一种可复用的低维绑定表示，而不是每个事实使用完全独立的电路。但证据目前集中于有限模型和受控任务，跨任务迁移并不总是成功，也尚未定位产生绑定标识的完整上游机制。
    first_date: '2023-10-26'
    primary_paper_ids:
      - p_2023_feng_how_do_language

  - rq_id: rq-component-function
    family_id: computational-mechanism
    question_en: >-
      What information does an individual model component read, transform, and write back within a distributed computation?
    question_zh: 单个模型组件在分布式计算中读取、变换和写回什么信息？
    introduction_en: >-
      This question advances descriptions of attention heads, MLPs, or exceptional activation values from correlated patterns to input conditions, information content, and downstream effects, while allowing component roles to vary with context.
    introduction_zh: >-
      该问题要求把 attention head、MLP 或异常激活值的功能从相关模式推进到输入条件、信息内容和下游效应，
      并允许组件角色随上下文改变。
    progress_en: >-
      Work first described MLPs as key-value memories, then used copy-suppression analysis and massive-value studies to refine the suppression, routing, and contextual-integration roles of components.
      Component descriptions have moved from correlation toward causal decomposition, but roles can change with context and do not by themselves explain complete behavior.
    progress_zh: >-
      研究先将 MLP 描述为 key-value memories，随后用 copy-suppression 分析和 massive-value 研究细化组件的抑制、路由与上下文整合作用。
      组件级功能描述已从相关观察走向因果拆解，但单个组件的角色可能随上下文改变，也不足以单独解释完整行为。
    first_date: '2020-12-29'
    primary_paper_ids:
      - p_2020_geva_transformer_feed_forward
      - p_2024_mcdougall_copy_suppression_comprehensively
      - p_2025_jin_massive_values_in
    secondary_paper_ids:
      - p_2024_dunefsky_transcoders_find_interpretable
      - p_2025_nam_causal_head_gating

  - rq_id: rq-component-semantic-readout
    family_id: mechanism-explanation
    question_en: >-
      How can the information written by an individual component be translated into human-interpretable semantic content?
    question_zh: 如何把单个组件写入残差流的信息，翻译为人可理解的语义内容？
    introduction_en: >-
      This question constructs a semantic interface for component outputs. It is distinct from establishing the
      component's full causal role, which requires downstream mechanism and intervention evidence.
    introduction_zh: >-
      该问题为组件输出构建语义接口。它不等同于确定组件的完整因果角色，后者还需要下游机制和干预证据。
    progress_en: >-
      Attention Lens learned head-specific maps from attention outputs to vocabulary space and revealed specialized
      retrieval content. The approach makes component writes inspectable, but its dependence on lens training data and
      the gap between decoded content and causal use remain unresolved.
    progress_zh: >-
      Attention Lens 学习从 attention-head output 到词表空间的 head-specific 映射，显示出专门化的检索内容。
      它使组件写入变得可检查，但对 lens 训练数据的依赖，以及解码内容与因果使用的差距仍未解决。
    first_date: '2023-10-25'
    primary_paper_ids:
      - p_2023_sakarvadia_attention_lens_a

  - rq_id: rq-distributed-component-role-discovery
    family_id: mechanism-explanation
    question_en: >-
      How can facilitating, interfering, and irrelevant component roles be discovered within distributed computation?
    question_zh: 如何在分布式计算中发现组件的促进、干扰与无关角色？
    introduction_en: >-
      This question asks how to construct component-role explanations without predefined functions or prompt templates,
      while allowing several interacting component subsets to be sufficient for the same task.
    introduction_zh: >-
      该问题研究如何在没有预设功能或 prompt template 的情况下构造组件角色解释，
      并允许多个相互作用的组件子集都足以完成同一任务。
    progress_en: >-
      Causal Head Gating introduced scalable soft gates and a causal role taxonomy, finding multiple sparse sufficient
      subcircuits and context-dependent head roles. The method challenges fixed component labels, while the stability
      and semantic interpretation of the learned roles need further validation.
    progress_zh: >-
      Causal Head Gating 引入可扩展软门控和因果角色分类，发现多个稀疏的充分子电路以及随上下文变化的 head 角色。
      该方法挑战了固定组件标签，但学得角色的稳定性与语义解释仍需进一步验证。
    first_date: '2025-01-01'
    primary_paper_ids:
      - p_2025_nam_causal_head_gating

  - rq_id: rq-knowledge-localization-routing
    family_id: computational-mechanism
    question_en: >-
      Where is factual knowledge stored, routed, combined, and used to generate answers?
    question_zh: 事实知识在哪里被存储、路由、组合并用于生成答案？
    introduction_en: >-
      This question moves from individual knowledge neurons or parameter locations to the factual-recall process unfolding across tokens, layers, components, and coordinated knowledge circuits.
    introduction_zh: >-
      该问题从单个 knowledge neuron 或参数位置，推进到沿 token、层和组件展开的事实召回过程以及协同知识电路。
    progress_en: >-
      Knowledge research advanced from unit-level localization in knowledge neurons to token-by-layer causal tracing, decomposition of factual-recall pathways, and end-to-end knowledge circuits.
      The picture has shifted from static storage to routing and composition, but localization does not consistently predict editing success and stable singular knowledge locations remain disputed.
    progress_zh: >-
      知识研究从 knowledge neurons 的单元定位，推进到 causal tracing 的 token—层定位、事实回忆路径拆解以及端到端 knowledge circuits。
      当前图景已由静态“存在哪里”扩展为“如何被路由和组合”，但定位结果与编辑效果并不总一致，知识是否具有稳定单一位置仍有争议。
    first_date: '2021-04-18'
    primary_paper_ids:
      - p_2021_dai_knowledge_neurons_in
      - p_2022_meng_locating_and_editing
      - p_2023_geva_dissecting_recall_of
      - p_2024_yao_knowledge_circuits_in

  - rq_id: rq-latent-knowledge
    family_id: representation-form
    question_en: >-
      Can knowledge that a model does not express be reliably recovered from its internal representations?
    question_zh: 模型没有说出的知识，能否从内部表示中可靠读出？
    introduction_en: >-
      When a model gives an incorrect, evasive, or misleading answer, its internal representations may still contain information associated with the correct answer. This question asks how to determine whether such knowledge is present without trusting the model’s output, while separating genuine latent knowledge from correlated signals or patterns learned by a probe. Successful readout establishes accessibility; reliably eliciting the answer through intervention provides stronger functional evidence.
    introduction_zh: >-
      模型给出错误、回避或误导性答案时，内部表示中可能仍保留与正确答案有关的信息。该问题研究如何在不直接相信模型输出的情况下判断这种知识是否存在，并区分真正的潜在知识、与答案偶然相关的信号以及 probe 自身学到的模式。读出成功只说明信息可访问；干预后能够稳定引出正确答案，才提供更强的功能证据。
    progress_en: >-
      Contrast-Consistent Search uses logical consistency between positive and negative statements to recover binary answers without labels, often outperforming the model’s verbal response and revealing partially task-general truth directions. It can nevertheless select some other binary structure correlated with truth. Inference-Time Intervention then shows that accessible truth-related signals in a small number of attention heads can causally shift answers, although intervention may increase evasiveness or damage other information. MechELK combines sparse localization with causal validation to distinguish unexpressed knowledge from absent encoding. The line has progressed from unsupervised readout to mechanistic elicitation, but dataset bias, answer leakage, probe learning, and the possibility of creating rather than revealing an answer remain unresolved.
    progress_zh: >-
      Contrast-Consistent Search 利用正反陈述之间的逻辑一致性，在没有真值标签的情况下恢复比模型口头回答更可靠的二元答案，并发现部分跨任务共享的真值方向。但该方法仍可能选择与真值相关的其他二分结构。Inference-Time Intervention 随后表明，少量注意力头中可访问的真实性信号能够通过激活移动改变模型回答，为“模型知道但没有表达”提供局部因果证据，但干预可能增加回避回答或破坏其他信息。MechELK 又把稀疏定位与因果验证结合，用于区分知识未表达与根本未编码。研究已经从无监督读出推进到机制化诱导，但数据偏差、候选答案泄漏、probe 学习和“干预制造答案”的可能性仍未解决。
    first_date: '2022-12-07'
    primary_paper_ids:
      - p_2022_burns_discovering_latent_knowledge
    secondary_paper_ids:
      - p_2023_li_inference_time_intervention
      - p_2026_park_mechelk_a_mechanistic

  - rq_id: rq-causal-abstraction
    family_id: evidential-standards
    question_en: >-
      When does a neural network's low-level mechanism faithfully implement a high-level interpretable causal process?
    question_zh: 神经网络的低层机制何时忠实实现了一个高层可解释因果过程？
    introduction_en: >-
      This question seeks an intervenable and falsifiable correspondence between high-level variables and distributed neural representations.
      Counterfactual agreement constrains the strength of claims made by probing, ablation, and circuit explanations.
    introduction_zh: >-
      该问题要求在高层变量与分布式神经表示之间建立可干预、可证伪的对应，
      并用反事实行为一致性约束 probing、ablation 和 circuit explanation 的解释强度。
    progress_en: >-
      Early frameworks used interchange interventions to test counterfactual agreement between networks and high-level causal models.
      Later theory admitted distributed, overlapping, and nonlinear variables and unified several interpretability
      claims under explicit causal criteria. Selecting the high-level model and scaling the criteria remain unresolved.
    progress_zh: >-
      早期框架用 interchange intervention 检验神经网络与高层因果模型的反事实一致性，后续理论允许分布式、重叠和非线性变量，
      并用明确因果标准统一多种解释性主张。高层模型如何选择，以及这些标准如何规模化，仍未解决。
    first_date: '2021-06-06'
    primary_paper_ids:
      - p_2021_geiger_causal_abstractions_of
      - p_2023_geiger_causal_abstraction_a
    secondary_paper_ids:
      - p_2023_geiger_finding_alignments_between

  - rq_id: rq-causal-variable-alignment
    family_id: mechanism-explanation
    question_en: >-
      How can high-level causal variables be discovered and aligned with distributed neural representations and circuits?
    question_zh: 如何发现高层因果变量，并将其与分布式神经表示和电路对齐？
    introduction_en: >-
      Given a candidate high-level variable, this question concerns the construction of an explanatory alignment rather
      than the criterion that makes the alignment faithful. Search must support distributed and overlapping variables.
    introduction_zh: >-
      在给定候选高层变量后，该问题关注如何构造解释性对齐，而不是什么标准使这种对齐忠实。
      搜索过程需要支持分布式和重叠变量。
    progress_en: >-
      Distributed Alignment Search optimized rotations that align neural subspaces with causal variables, while circuit
      probing learned sparse masks for candidate intermediate variables. These methods automate alignment construction,
      but remain dependent on the analyst's high-level hypothesis and intervention design.
    progress_zh: >-
      Distributed Alignment Search 优化旋转以将神经子空间与因果变量对齐，circuit probing 则为候选中间变量学习稀疏 mask。
      它们自动化了对齐构造，但仍依赖分析者提出的高层假说与干预设计。
    first_date: '2023-03-05'
    primary_paper_ids:
      - p_2023_geiger_finding_alignments_between
      - p_2023_lepori_uncovering_intermediate_variables

  - rq_id: rq-behavior-circuit
    family_id: computational-mechanism
    question_en: >-
      Can a model behavior be reduced to a complete, intervenable, end-to-end component circuit?
    question_zh: 能否把一项模型行为还原为完整、可干预的端到端组件电路？
    introduction_en: >-
      This question goes beyond locating correlated components to explaining how information passes among them to implement an algorithm.
      Candidate circuits should satisfy conditions such as sufficiency, necessity, and minimality.
    introduction_zh: >-
      该问题从定位相关组件推进到解释信息如何在组件之间传递并实现算法，要求候选回路满足 sufficiency、necessity 和 minimality 等条件。
    progress_en: >-
      Case studies of indirect-object identification, numerical comparison, arithmetic, syllogistic inference, and visual counting have demonstrated end-to-end intervenable circuit analysis across capabilities and modalities.
      Results still emphasize carefully selected behaviors and limited models, with circuit completeness, distributional robustness, and replication at frontier scale remaining major bottlenecks.
    progress_zh: >-
      IOI、数值比较、算术、三段论和视觉计数等案例已经展示从行为到端到端可干预电路的完整分析，并把范式扩展到不同能力和模态。
      现有成果仍以精心选择的行为和有限模型为主，电路的完整性、跨分布保持与前沿规模复现仍是主要瓶颈。
    first_date: '2022-11-01'
    primary_paper_ids:
      - p_2022_wang_interpretability_in_the
      - p_2023_hanna_how_does_gpt
      - p_2023_stolfo_a_mechanistic_interpretation
      - p_2025_kim_reasoning_circuits_in
      - p_2026_che_counting_circuits_mechanistic
    secondary_paper_ids:
      - p_2023_lieberum_does_circuit_analysis

  - rq_id: rq-circuit-localization
    family_id: mechanism-explanation
    question_en: >-
      How can paths and shared circuits implementing a target subcomputation be localized from behavioral constraints?
    question_zh: 如何从行为约束出发定位实现目标子计算的路径与共享回路？
    introduction_en: >-
      This question shifts localization from individual components to edges, paths, and subgraphs satisfying behavioral desiderata without requiring the researcher to know the complete algorithm in advance.
    introduction_zh: >-
      该问题把定位单位从单个组件推进到 edges、paths 和满足行为 desiderata 的子图，
      同时避免要求研究者事先知道完整算法。
    progress_en: >-
      Work on variable binding showed that functional desiderata can drive an automated search for reusable shared
      circuitry. The method reduces the need for a complete mechanism hypothesis, but its result is still a localized
      candidate subgraph rather than a complete account of the computation.
    progress_zh: >-
      Variable-binding 研究表明，功能 desiderata 可以驱动对可复用共享回路的自动搜索。
      该方法减少了预先提出完整机制假说的需求，但所得结果仍是局部候选子图，而非对计算的完整说明。
    first_date: '2023-07-07'
    primary_paper_ids:
      - p_2023_davies_discovering_variable_binding
    secondary_paper_ids:
      - p_2023_goldowsky_dill_localizing_model_behavior

  - rq_id: rq-localization-claim-validity
    family_id: evidential-standards
    question_en: >-
      How should a claim that behavior is localized to particular paths be defined, falsified, and iteratively revised?
    question_zh: “行为局部化于特定路径”的主张应如何定义、证伪并迭代修正？
    introduction_en: >-
      This question concerns the evidential content of localization rather than merely producing a ranked component
      list. A useful claim must specify the paths, intervention, behavioral criterion, and where the hypothesis fails.
    introduction_zh: >-
      该问题关注定位主张能够支持什么结论，而不只是产生一份组件排名。
      可检验的主张必须说明路径、干预、行为标准以及假说在哪里失败。
    progress_en: >-
      Generalized path patching turned path-level localization into a quantitative, falsifiable hypothesis and used
      residual error to guide refinement. It strengthens localization evidence, while sensitivity to metrics and
      intervention baselines remains linked to broader intervention-reliability questions.
    progress_zh: >-
      广义 path patching 将路径级定位转化为定量、可证伪的假说，并用剩余误差指导后续修正。
      它强化了定位证据，但对度量和干预基线的敏感性仍与更广泛的干预可靠性问题相连。
    first_date: '2023-04-12'
    primary_paper_ids:
      - p_2023_goldowsky_dill_localizing_model_behavior

  - rq_id: rq-automated-circuit-discovery
    family_id: mechanism-explanation
    question_en: >-
      Can circuit discovery be automated and scaled while preserving the quality of mechanism recovery?
    question_zh: 电路发现能否自动化并扩展，同时保持机制恢复质量？
    introduction_en: >-
      This question compares repeated intervention, gradient approximation, attribution decomposition, and information-flow search, asking whether speed gains sacrifice faithfulness, granularity, or architectural generality.
    introduction_zh: >-
      该问题比较反复干预、梯度近似、归因分解和信息流搜索，关注速度提升是否牺牲 faithfulness、粒度或架构通用性。
    progress_en: >-
      ACDC introduced automated pruning for circuit discovery; attribution patching, information-flow routes, and contextual decomposition subsequently improved speed, coverage, or decomposition efficiency.
      Automation has substantially reduced manual effort, but whether algorithms recover the same underlying mechanism and whether efficiency compromises faithfulness still require standardized evaluation.
    progress_zh: >-
      ACDC 建立了自动剪枝式电路发现流程，attribution patching、information-flow routes 和 contextual decomposition 随后提升了速度、覆盖范围或分解效率。
      自动化已明显降低人工成本，但不同算法恢复的是否是同一真实机制，以及效率提升是否牺牲忠实性，仍需标准化评测。
    first_date: '2023-04-28'
    primary_paper_ids:
      - p_2023_conmy_towards_automated_circuit
      - p_2023_syed_attribution_patching_outperforms
      - p_2024_ferrando_information_flow_routes
      - p_2024_hsu_efficient_automated_circuit

  - rq_id: rq-circuit-scaling
    family_id: generality-transfer
    question_en: >-
      Can manual mechanistic analysis scale to frontier-size models while preserving semantics across the input distribution?
    question_zh: 人工机制分析能否扩展到前沿规模模型并保持跨分布语义？
    introduction_en: >-
      This question asks whether important components found in a large model can receive functional explanations that hold across inputs rather than remaining local localization results.
    introduction_zh: >-
      该问题检验在大模型中找到若干重要组件之后，是否还能给出跨输入成立的功能解释，而不是停留在局部定位结果。
    progress_en: >-
      A study of multiple-choice capabilities in Chinchilla showed that manual analysis can identify components and paths with semantics shared across examples in larger models, providing early evidence for scale.
      Evidence remains concentrated in one capability family and a limited model set, so routine full-circuit analysis at frontier scale has not been demonstrated.
    progress_zh: >-
      Chinchilla 多选能力研究表明，人工机制分析可以在更大模型上发现具有跨样本语义的组件和路径，为规模化提供了早期实证。
      当前证据仍集中于单类能力和有限模型，尚未证明完整电路分析能够常规扩展到前沿模型。
    first_date: '2023-07-18'
    primary_paper_ids:
      - p_2023_lieberum_does_circuit_analysis

  - rq_id: rq-sparse-feature-circuits
    family_id: mechanism-explanation
    question_en: >-
      Can sparse features serve as more interpretable and scalable circuit nodes than native model components?
    question_zh: 稀疏特征能否成为比原生组件更可解释、更可扩展的电路节点？
    introduction_en: >-
      This question connects sparse features or transcoders to circuit analysis, asking whether feature-to-feature causal graphs can be discovered more cheaply while preserving model function.
    introduction_zh: >-
      该问题把 sparse features 或 transcoders 接入 circuit analysis，考察能否以更低成本发现 feature-to-feature causal graphs，
      同时保留模型功能。
    progress_en: >-
      Dictionary features enabled patch-free circuit discovery in Othello; sparse feature circuits, SAE-based circuit identification, and transcoders then recast native-component graphs as interpretable feature graphs.
      Feature-level circuits improve readability and scaling, but their nodes inherit dictionary artifacts and require strict validation that reconstructed graphs preserve the original computation.
    progress_zh: >-
      Dictionary features 已用于 Othello 的免 patch 电路发现，随后 sparse feature circuits、SAE circuit identification 和 transcoders 把原生组件图改写为可解释特征图。
      特征级电路在可读性和规模上显示优势，但其节点受 dictionary artifacts 影响，重建后的图是否忠实保留原计算仍需严格验证。
    first_date: '2024-02-19'
    primary_paper_ids:
      - p_2024_he_dictionary_learning_improves
      - p_2024_marks_sparse_feature_circuits
      - p_2024_o_neill_sparse_autoencoders_enable
      - p_2024_dunefsky_transcoders_find_interpretable

  - rq_id: rq-crossmodal-alignment
    family_id: representation-form
    question_en: >-
      Where do separately trained vision and language models form shared semantic representations?
    question_zh: 分开训练的视觉和语言模型在哪里形成共享语义？
    introduction_en: >-
      When a separately trained vision encoder is connected to a language model through a simple adapter, visual information may already be translated into linguistic form by the adapter or may only become language-usable inside the language model. This question asks where cross-modal semantics converge, which internal units carry them, and whether those units affect multimodal output. It is narrower than tracing the complete multimodal information flow or generation circuit.
    introduction_zh: >-
      当独立训练的视觉编码器通过简单适配器连接到语言模型时，视觉信息可能已经在适配器中被翻译成语言，也可能进入语言模型后才被转换为可用于生成的语义表示。该问题研究跨模态语义在哪里汇合、由什么内部单元承载，以及这些单元是否真正影响跨模态输出。它不同于追踪完整的多模态信息流或解释整个生成电路。
    progress_en: >-
      In LiMBeR-BEIT, the linear adapter output does not by itself fully expose image semantics; a substantial part of visual-to-language translation occurs in intermediate MLP layers of the frozen GPT-J model. The study identifies multimodal neurons that respond to image regions and corresponding language concepts, with cross-dataset activation, vocabulary projections, spatial selectivity, and targeted ablations supporting their role in image description. Separately trained modalities can therefore converge on shared semantic units inside the language model. Evidence currently comes mainly from one model combination, and gradient attribution or large ablations do not isolate every neuron’s contribution or establish cross-architecture stability.
    progress_zh: >-
      在 LiMBeR-BEIT 中，线性适配器的输出不能直接充分解释图像语义；较大一部分视觉—语言转换发生在冻结 GPT-J 的中间 MLP 层。研究识别出同时响应图像区域和对应语言概念的多模态神经元，并通过跨数据集激活、词表投影、空间选择性和定向消融说明这些单元会影响图像描述。这表明分开训练的模态可以在语言模型内部形成共享语义单元。不过证据目前主要来自一种模型组合，梯度归因和大规模消融也不能确定每个神经元的独立作用，跨架构稳定性仍不清楚。
    first_date: '2023-08-03'
    primary_paper_ids:
      - p_2023_schwettmann_multimodal_neurons_in

  - rq_id: rq-multimodal-information-flow
    family_id: computational-mechanism
    question_en: >-
      How is visual information represented, routed, and converted into text predictions after entering a language model?
    question_zh: 视觉信息进入语言模型后如何被表示、路由并转化为文本预测？
    introduction_en: >-
      This question traces information flow among image patches, visual tokens, cross-modal attention, and language components and requires agreement between token-level and component-level attribution.
    introduction_zh: >-
      该问题追踪 image patches、visual tokens、跨模态 attention 和语言组件之间的信息流，
      并要求 token 与 component 两个层级的归因相互一致。
    progress_en: >-
      Work decomposed stages of visual processing in vision-language models and localized attention heads responsible for image-to-text routing.
      Major pathways can now be mapped in several architectures, but no unified mechanism model spans different projectors, vision encoders, and language backbones.
    progress_zh: >-
      研究已分解视觉信息在 VLM 中的处理阶段，并进一步定位承担 image-to-text 路由的 attention heads。
      当前已能描绘若干架构中的主要信息路径，但不同投影器、视觉编码器和语言骨干之间尚无统一机制模型。
    first_date: '2024-10-09'
    primary_paper_ids:
      - p_2024_neo_towards_interpreting_visual
      - p_2025_kim_interpreting_attention_heads
    secondary_paper_ids:
      - p_2023_palit_towards_vision_language
      - p_2023_schwettmann_multimodal_neurons_in

  - rq_id: rq-multimodal-causal-tracing
    family_id: mechanism-explanation
    question_en: >-
      How can causal tracing be adapted to construct mechanism explanations in vision-language architectures?
    question_zh: 如何改造 causal tracing，以在视觉—语言架构中构造机制解释？
    introduction_en: >-
      This question concerns adapting an explanation procedure across modality boundaries so interventions can locate
      image, question, and fusion states that causally affect a multimodal prediction.
    introduction_zh: >-
      该问题关注如何让解释流程跨越模态边界，使干预能够定位对多模态预测产生因果影响的图像、问题和融合状态。
    progress_en: >-
      A causal-tracing tool for BLIP extended mediation analysis to vision-language modules and localized states carrying
      VQA information. It established a multimodal procedure, while later mechanism studies supplied richer accounts of
      the information flow itself.
    progress_zh: >-
      针对 BLIP 的 causal-tracing 工具将 mediation analysis 扩展到视觉—语言模块，并定位承载 VQA 信息的状态。
      它建立了多模态解释流程，而后续机制研究则给出信息流本身的更丰富解释。
    first_date: '2023-08-27'
    primary_paper_ids:
      - p_2023_palit_towards_vision_language
    secondary_paper_ids:
      - p_2024_neo_towards_interpreting_visual

  - rq_id: rq-modality-specific-mechanisms
    family_id: computational-mechanism
    question_en: >-
      Do different modalities use structurally different but functionally related mechanisms for the same task?
    question_zh: 同一任务的不同模态是否使用结构不同但功能相关的机制？
    introduction_en: >-
      This question does not equate equal performance with equal mechanism.
      It compares circuit structure, interchangeability, and feature compositionality across visual and textual pathways.
    introduction_zh: >-
      该问题不把性能相同视为机制相同，而是比较视觉与文本路径的电路结构、可交换性和特征可组合性。
    progress_en: >-
      Cross-modal comparisons show that the same task may be implemented by structurally different but functionally corresponding circuits, while sparse visual-thought circuits add a feature-level view.
      The work begins to separate functional equivalence from structural identity, but coverage across tasks, models, and modalities remains too small to establish generality.
    progress_zh: >-
      跨模态比较发现，同一任务可能由结构不同但功能相应的电路完成；sparse visual thought circuits 又提供了特征级分析视角。
      现有结果开始区分功能等价与结构相同，但覆盖的任务、模型与模态仍较少，尚不能判断这种差异是否普遍。
    first_date: '2025-06-10'
    primary_paper_ids:
      - p_2025_nikankin_same_task_different
    secondary_paper_ids:
      - p_2026_zhou_sparse_visual_thought

  - rq_id: rq-sparse-feature-composability
    family_id: representation-form
    question_en: >-
      Can sparse features be composed like independent modules?
    question_zh: 稀疏特征能否像独立模块一样组合？
    introduction_en: >-
      A sparse feature may correspond to a readable concept and affect behavior when ablated or steered, yet still fail to combine cleanly with other features. This question asks whether individually effective features retain their function under union or joint steering, and how non-orthogonality, normalization, distributed dependencies, and off-manifold shifts disrupt composition. It separates causal effectiveness from modular composability.
    introduction_zh: >-
      一个稀疏特征可以单独对应清晰概念，并在消融或 steering 时影响行为，但这不意味着多个特征可以直接相加或取并集。该问题研究单个有效特征在联合使用时是否仍保持功能，以及非正交方向、幅度归一化、分布式依赖和 off-manifold 偏移如何破坏组合。它把“特征具有因果作用”与“特征是模块化组件”区分开来。
    progress_en: >-
      Sparse Visual Thought Circuits identifies SAE features in vision–language models that are spatially grounded, task-selective, and locally causal. Yet combining individually effective features can reduce performance: directions cancel semantic signal, normalization amplifies residual noise, and joint intervention can move the representation off manifold. This directly challenges the assumption that individually useful features naturally form a circuit through set union. Evidence is limited to selected models, layers, and feature-selection rules, so it does not show that all SAE features are non-composable, but it establishes that modularity requires independent testing.
    progress_zh: >-
      Sparse Visual Thought Circuits 在视觉语言模型中发现了具有空间落地、任务选择性和局部因果作用的 SAE 特征。但把多个单独有效的特征合并后，性能可能下降：方向之间会抵消语义信号，归一化会放大残余噪声，联合干预还可能把表示推离模型熟悉的流形。这直接反驳了“单个有效特征可以通过集合并集自然组成电路”的简单假设。当前证据来自有限模型、层位和特征筛选规则，因此不能推出所有 SAE 特征都不可组合，但已经说明模块性必须单独验证。
    first_date: '2026-03-26'
    primary_paper_ids:
      - p_2026_zhou_sparse_visual_thought

  - rq_id: rq-multimodal-failure-mechanisms
    family_id: computational-mechanism
    question_en: >-
      Do multimodal hallucinations arise from reproducible competing pathways or architectural bottlenecks?
    question_zh: 多模态幻觉是否由可复现的竞争路径或架构瓶颈机制产生？
    introduction_en: >-
      This question traces output errors to causal interactions among visual-evidence pathways, language-prior pathways, and architectural bottlenecks, and tests recurrence across error types and model architectures.
    introduction_zh: >-
      该问题从输出错误追溯到视觉证据路径、语言先验路径和架构 bottleneck 的因果交互，
      并检验机制是否跨错误类型和模型架构复现。
    progress_en: >-
      Recent work explains object hallucination as competition between genuine visual evidence and language-prior pathways and searches for recurrent failure circuits in VQ-tokenized architectures.
      The branch has advanced from output correlation to intervenable mechanism hypotheses, but it contains few studies, narrow architectural coverage, and limited evidence across failure types.
    progress_zh: >-
      最新工作把对象幻觉解释为真实视觉证据路径与语言先验路径的竞争，并在 VQ-tokenized 架构中寻找跨模型复现的故障电路。
      该分支已从输出相关性推进到可干预的失败机制假说，但论文数量少、架构范围窄，跨故障类型的普遍性尚未建立。
    first_date: '2026-05-13'
    primary_paper_ids:
      - p_2026_liu_dual_pathway_circuits
      - p_2026_hegde_where_hallucinations_live

  - rq_id: rq-multilingual-mechanisms
    family_id: computational-mechanism
    question_en: >-
      Which internal units and broadcast mechanisms implement language choice and cross-lingual capability?
    question_zh: 语言选择与跨语言能力由哪些内部单元和广播机制实现？
    introduction_en: >-
      This question distinguishes mechanisms controlling output language, carrying task information, and enabling cross-lingual transfer, while tracing how a language decision forms and propagates before the first generated token.
    introduction_zh: >-
      该问题区分控制输出语言、承载任务信息和促进跨语言迁移的机制，并追踪语言决定在生成首 token 前如何形成和传播。
    progress_en: >-
      Work localized components causing vision-language models to default to English and later proposed first-token
      broadcasters and language-identity head circuits. The line has moved toward generation-level broadcast mechanisms,
      while language choice, knowledge sharing, and transfer still require different explanations.
    progress_zh: >-
      研究先定位导致 VLM 默认英语回复的组件，后续工作进一步提出 first-token broadcasters 与 language-identity head circuits。
      问题正在转向生成级的广播机制，但语言选择、知识共享和迁移仍需不同解释。
    first_date: '2024-07-02'
    primary_paper_ids:
      - p_2024_hinck_why_do_llava
      - p_2026_pillai_ftb_graph_determining
    secondary_paper_ids:
      - p_2024_tang_language_specific_neurons

  - rq_id: rq-safety-mechanisms
    family_id: computational-mechanism
    question_en: >-
      Are safety, refusal, and hidden-trigger behaviors implemented by low-dimensional directions or distributed circuits?
    question_zh: 安全、拒绝与隐蔽触发行为由低维方向还是分布式电路实现？
    introduction_en: >-
      This question localizes structures mediating safety behavior, compares single directions, attention subcircuits, and backdoor mechanisms, and examines task specificity, coordination, and vulnerability to intervention.
    introduction_zh: >-
      该问题定位安全行为的中介结构，比较单一方向、attention 子电路和后门机制，
      并考察其任务专属性、协同性与对干预的脆弱性。
    progress_en: >-
      Studies of backdoors, refusal, and safety have identified early-layer mechanisms, a single refusal direction, critical attention heads, and linear instability of that direction.
      Evidence suggests that low-dimensional control directions and distributed circuits can coexist, while the one-direction account varies across contexts and models.
      A more complete causal account of safety mechanisms remains open.
    progress_zh: >-
      Backdoor、拒绝和安全行为研究分别发现早层机制、单一 refusal direction、关键 attention heads 与方向的线性不稳定性。
      现有证据表明低维控制方向与分布式电路可以同时成立，而“安全由一个方向实现”的结论受上下文和模型影响；更完整的因果安全机制仍待建立。
    first_date: '2023-02-24'
    primary_paper_ids:
      - p_2023_lamparth_analyzing_and_editing
      - p_2024_arditi_refusal_in_language
      - p_2024_zhou_on_the_role
      - p_2026_ratnakar_the_geometry_of

  - rq_id: rq-knowledge-conflict
    family_id: computational-mechanism
    question_en: >-
      How does a model arbitrate between parametric and contextual knowledge when they conflict?
    question_zh: 参数知识与上下文知识发生冲突时，模型如何竞争并选择信息来源？
    introduction_en: >-
      This question studies how the two knowledge sources overlap, compete, and reach a decision across components and paths, and whether source selection can be controlled without damaging other capabilities.
    introduction_zh: >-
      该问题研究两类知识在组件和路径中的叠加、竞争与决策位置，并进一步询问能否在不破坏其余能力的情况下控制来源选择。
    progress_en: >-
      Existing work localized competition between parametric and contextual knowledge to specific attention heads and mitigated conflict by cutting or modulating relevant pathways; later studies pursued more stable control.
      Intervenable local mechanisms have been identified, but tested conflict types, confidence regimes, and cross-model transfer remain limited.
    progress_zh: >-
      已有工作把参数知识与上下文知识的竞争定位到特定 attention heads，并通过切断或调节相关路径缓解冲突；后续研究继续探索更稳定的冲突控制。
      当前已获得可干预的局部机制，但冲突类型、答案置信度和跨模型迁移范围仍较有限。
    first_date: '2024-02-28'
    primary_paper_ids:
      - p_2024_jin_cutting_off_the
      - p_2025_li_taming_knowledge_conflicts

  - rq_id: rq-layerwise-prediction-dynamics
    family_id: temporal-development
    question_en: >-
      How do model predictions form and change across network depth?
    question_zh: 模型的预测如何沿网络深度逐层形成和修正？
    introduction_en: >-
      This question treats each layer's hidden state as an iterative update to the output prediction.
      Readout methods must correct cross-layer representation mismatch and test whether intermediate trajectories are smooth and causally related to final behavior.
    introduction_zh: >-
      该问题把各层 hidden state 视为对输出预测的迭代更新，要求读出方法校正层间表示偏差，
      并检验中间预测轨迹是否平滑且与最终行为因果相关。
    progress_en: >-
      Tuned Lens learned layerwise translators to correct logit-lens bias, enabling more reliable decoding of intermediate prediction trajectories; earlier linear probes and studies of layerwise MLP outputs supplied representational and computational foundations.
      Prediction convergence and revision are now observable, but whether readouts fully capture causal internal state still depends on calibration and intervention.
    progress_zh: >-
      Tuned Lens 通过学习层间翻译器校正 logit lens 偏差，使中间预测轨迹能够被更可靠地解码；早期线性 probe 与 MLP 逐层输出研究提供了表示和计算基础。
      当前可观察预测如何收敛或修正，但中间读出是否完整反映实际因果状态仍依赖校准与干预验证。
    first_date: '2023-03-14'
    primary_paper_ids:
      - p_2023_belrose_eliciting_latent_predictions
    secondary_paper_ids:
      - p_2016_alain_understanding_intermediate_layers
      - p_2020_geva_transformer_feed_forward

  - rq_id: rq-generation-trajectory
    family_id: temporal-development
    question_en: >-
      How far into the future generation trajectory is the current internal state already committed?
    question_zh: 当前内部状态提前承诺了多远的未来生成轨迹？
    introduction_en: >-
      This question extends next-token prediction to multiple later tokens, asking how much future plan or constraint is readable from one state and distinguishing it from later revision during actual generation.
    introduction_zh: >-
      该问题从 next-token prediction 扩展到后续多个 token，考察单个 state 中未来计划或约束的可读范围，
      并与真实生成过程中的后续修正区分开来。
    progress_en: >-
      Future Lens showed that a current hidden state can contain information about multiple not-yet-generated tokens, extending analysis from next-token prediction to future generation plans.
      Current evidence mainly establishes readability; how far the model is causally committed, when it replans, and whether the result generalizes across tasks remain unclear.
    progress_zh: >-
      Future Lens 表明单个当前 hidden state 可包含尚未生成的多个后续 token 信息，使研究从下一 token 预测扩展到未来生成计划。
      现阶段主要证明未来轨迹可被读出，模型究竟提前因果承诺多远、何时重规划以及结论能否跨任务复现仍不清楚。
    first_date: '2023-11-08'
    primary_paper_ids:
      - p_2023_pal_future_lens_anticipating

  - rq_id: rq-sequential-reasoning-dynamics
    family_id: temporal-development
    question_en: >-
      How does causal computation unfold and reorganize across the generated steps of Chain-of-Thought reasoning?
    question_zh: 因果计算如何沿 Chain-of-Thought 的生成步骤展开和重组？
    introduction_en: >-
      This question extends static activation intervention to sequential reasoning, locating the token positions, heads, and cross-step transfers that shift computation from direct answering to Chain-of-Thought-like execution.
    introduction_zh: >-
      该问题把静态 activation intervention 扩展到序列化推理，定位哪些 token positions、heads 和跨步传递使计算从直接作答转向 CoT-like execution。
    progress_en: >-
      Sequential activation patching has begun tracing when information enters, propagates, and reorganizes across Chain-of-Thought steps, providing a direct tool for temporal causal analysis.
      Evidence is still early: written reasoning may not match latent computation, and robustness to prompts, decoding paths, and alternative reasoning trajectories remains untested.
    progress_zh: >-
      Sequential activation patching 已开始沿 Chain-of-Thought 的生成步骤追踪信息何时进入、传递和重组，为时序化因果分析提供了直接工具。
      当前仅有早期实证，仍需检验书面推理链与潜在计算是否一致，以及结果对 prompt、解码路径和替代推理轨迹是否稳健。
    first_date: '2026-08-23'
    primary_paper_ids:
      - p_2026_dura_mechanistic_interpretability_of

  - rq_id: rq-training-feature-dynamics
    family_id: temporal-development
    question_en: >-
      How does a network select, reweight, and progressively form prediction-relevant features during training?
    question_zh: 网络在训练中如何选择、重加权并逐层形成预测相关特征？
    introduction_en: >-
      This question seeks analyzable or computable feature-learning dynamics that explain how finite-width networks depart from fixed kernels and whether the same laws transfer to kernel machines or convolutional architectures.
    introduction_zh: >-
      该问题寻求可解析或可计算的 feature-learning 动力学，解释有限宽网络如何偏离固定 kernel、
      以及这些规律能否迁移到 kernel machines 或卷积架构。
    progress_en: >-
      Infinite-width theory first supplied analyzable limits that retain feature learning, and average-gradient-outer-product laws were later used to explain feature selection and layerwise amplification in fully connected networks and CNNs.
      These works provide mathematical mechanisms of training dynamics, but a large gap remains between controlled architectures and Transformers trained at scale.
    progress_zh: >-
      无限宽理论首先给出保留 feature learning 的可解析极限，随后 average gradient outer product 规律被用于解释全连接网络和 CNN 中的特征选择与逐层增强。
      现有工作建立了训练动力学的数学机制，但从受控架构推广到 Transformer 和大规模预训练仍有明显鸿沟。
    first_date: '2020-11-30'
    primary_paper_ids:
      - p_2020_yang_feature_learning_in
      - p_2022_radhakrishnan_mechanism_of_feature
      - p_2023_beaglehole_mechanism_of_feature

  - rq_id: rq-circuit-formation
    family_id: temporal-development
    question_en: >-
      How do circuits implementing a capability form progressively from random initialization?
    question_zh: 实现能力的电路如何从随机初始化逐步形成？
    introduction_en: >-
      This question follows training checkpoints and subcomputations to understand how matching, copying, causal structure, and other local mechanisms interact and assemble into a complete circuit.
    introduction_zh: >-
      该问题追踪训练检查点和子计算，研究 match、copy、causal structure 等局部机制如何相互作用并组合成完整电路。
    progress_en: >-
      Studies examined how gradient descent learns causal structure and which conditions are required for an induction circuit to form.
      Checkpoint evidence now describes stages from initialization to maturity for some circuits, but the results are concentrated on in-context learning and say little about formation in other abilities or post-training.
    progress_zh: >-
      现有工作分析梯度下降如何学习因果结构，以及 induction circuit 成形所需的条件。
      检查点证据已能描述部分电路从初始化到成熟的阶段，但结论主要集中在 in-context learning，其他能力与后训练机制的形成尚少。
    first_date: '2024-02-22'
    primary_paper_ids:
      - p_2024_nichani_how_transformers_learn
      - p_2024_singh_what_needs_to
    secondary_paper_ids:
      - p_2022_olsson_in_context_learning

  - rq_id: rq-capability-phase-transition
    family_id: temporal-development
    question_en: >-
      Are apparently abrupt capability transitions driven by smoother changes in internal mechanisms?
    question_zh: 表面突发的能力相变是否由更平滑的内部机制变化驱动？
    introduction_en: >-
      This question explains grokking through internal progress measures and competing circuits, distinguishing memorization, formation of a generalizing circuit, and cleanup, and asking why optimization delays selection of a more efficient mechanism.
    introduction_zh: >-
      该问题用内部 progress measures 和竞争电路解释 grokking，区分记忆、泛化电路形成与 cleanup，
      并研究优化为何延迟选择更高效的机制。
    progress_en: >-
      Reverse engineering of grokking found smoothly changing internal progress measures before test accuracy jumps, while circuit-efficiency analysis further explained competition among memorization, generalizing-circuit formation, and cleanup.
      The mechanism accounts for phase transitions in several controlled tasks, but generalization to complex capabilities and large-scale training remains uncertain.
    progress_zh: >-
      Grokking 研究通过电路逆向工程发现，测试准确率突变之前已有平滑变化的内部 progress measures；circuit-efficiency 分析进一步解释了记忆、泛化回路形成与 cleanup 的竞争。
      该机制解释了若干受控任务的表面相变，但是否适用于更复杂能力和大规模训练仍未确定。
    first_date: '2023-01-12'
    primary_paper_ids:
      - p_2023_nanda_progress_measures_for
      - p_2023_varma_explaining_grokking_through

  - rq_id: rq-posttraining-mechanism-change
    family_id: temporal-development
    question_en: >-
      Do fine-tuning and post-training create new mechanisms, or strengthen, suppress, and reorganize existing ones?
    question_zh: Fine-tuning 与后训练产生新机制，还是强化、抑制或重组既有机制？
    introduction_en: >-
      This question compares base and post-trained models to distinguish shared circuits, amplified representations, and genuinely new features while guarding against sparsity artifacts introduced by model-difference tools.
    introduction_zh: >-
      该问题通过 base 与 post-trained 模型比较，区分共享电路、被增强的表示和真正新增的特征，
      同时警惕模型差分工具引入的稀疏伪影。
    progress_en: >-
      Entity-tracking studies suggest that fine-tuning can strengthen an existing mechanism rather than create a new
      one. Reasoning-feature and crosscoder studies provide secondary evidence, but also show why novelty claims require
      separate representational and evidential analysis.
    progress_zh: >-
      Entity tracking 案例表明，fine-tuning 可以强化既有机制，而非必然创建新机制。
      推理特征与 crosscoder 研究提供次级证据，但也说明“新机制”的主张还需单独的表示和证据分析。
    first_date: '2024-02-22'
    primary_paper_ids:
      - p_2024_prakash_fine_tuning_enhances
    secondary_paper_ids:
      - p_2025_galichin_i_have_covered
      - p_2025_minder_overcoming_sparsity_artifacts

  - rq_id: rq-localization-editing
    family_id: intervention-control
    question_en: >-
      Is a causally localized site of information use also the most effective and localized place to edit behavior?
    question_zh: 因果定位出的使用位置是否也是最有效、最局部的编辑位置？
    introduction_en: >-
      This question challenges the intuition that locating where behavior occurs tells us where to modify it, distinguishing mediation, storage, use, and editability.
    introduction_zh: >-
      该问题挑战“找到行为在哪里发生，就知道应该在哪里修改”的直觉，区分 mediation、storage、use 与 editability。
    progress_en: >-
      Direct comparison of causal tracing with knowledge editing found that localization strength generally fails to predict the best editing layer, challenging the assumption that a use site is an edit site.
      Localization and editing are now established as distinct questions, but mechanism-based prediction of efficient, local, low-side-effect edit targets remains unsolved.
    progress_zh: >-
      对 causal tracing 与 knowledge editing 的直接比较发现，定位强度通常不能预测最佳编辑层，挑战了“使用位置就是修改位置”的默认假设。
      该工作已经确立定位和编辑是两个不同问题，但如何从机制信息可靠预测高效、局部且低副作用的编辑目标仍待解决。
    first_date: '2023-01-10'
    primary_paper_ids:
      - p_2023_hase_does_localization_inform
    secondary_paper_ids:
      - p_2022_meng_locating_and_editing

  - rq_id: rq-representation-control
    family_id: intervention-control
    question_en: >-
      Can readable internal directions be manipulated reliably to produce specific and predictable behavioral changes?
    question_zh: 可读出的内部方向能否被稳定操纵，从而产生特异且可预测的行为变化？
    introduction_en: >-
      This question advances from representation description to inference-time control.
      Steering should be causal, transferable, and low in side effects rather than merely changing outputs on a small prompt set.
    introduction_zh: >-
      该问题从表示描述推进到 inference-time control，要求 steering 效果具有因果性、可迁移性和有限副作用，
      而不是仅在少量提示上改变输出。
    progress_en: >-
      Inference-time intervention used internal directions to increase truthful answers, representation engineering generalized directional control, and later theory and vision-language experiments began explaining when it works.
      Representation directions can serve as control levers, but specificity, distributional stability, transferability, and side effects require systematic calibration.
    progress_zh: >-
      Inference-time intervention 用内部方向提高真实回答概率，representation engineering 将方向控制扩展为通用框架，后续理论与 VLM 实验开始解释其有效条件。
      研究已证明表示方向可以成为控制杠杆，但特异性、跨分布稳定性、可迁移性和副作用仍需系统校准。
    first_date: '2023-06-06'
    primary_paper_ids:
      - p_2023_li_inference_time_intervention
      - p_2023_zou_representation_engineering_a
      - p_2025_tian_why_representation_engineering
    secondary_paper_ids:
      - p_2025_galichin_i_have_covered

  - rq_id: rq-interpretable-learning
    family_id: intervention-control
    question_en: >-
      Can training actively induce a human-specified interpretable causal structure inside a network?
    question_zh: 能否在训练时主动使网络获得人类指定的可解释因果结构？
    introduction_en: >-
      Rather than settling for post hoc explanation, this question uses a high-level causal model as a learning constraint and tests whether interpretable structure and systematic generalization can be achieved together.
    introduction_zh: >-
      该问题不满足于事后解释，而把高层 causal model 作为学习约束，检验可解释结构与系统性泛化能否共同成为训练结果。
    progress_en: >-
      Interchange intervention training showed that training can actively induce an internal counterfactual structure aligned with a human-specified causal model and may improve systematic generalization.
      This remains a feasibility demonstration for one training paradigm and limited tasks, with misspecified high-level models, optimization cost, and scaling to large models unresolved.
    progress_zh: >-
      Interchange intervention training 已证明，可以在训练时主动诱导与人类高层因果模型一致的内部反事实结构，并可能改善系统性泛化。
      当前仍是单一训练范式和有限任务上的可行性证明，高层规范错误、优化成本和大模型可扩展性尚未解决。
    first_date: '2021-12-01'
    primary_paper_ids:
      - p_2021_geiger_inducing_causal_structure

  - rq_id: rq-mechanism-universality
    family_id: generality-transfer
    question_en: >-
      Do different training runs, models, and architectures reproduce the same mechanism, or only share an abstract algorithm?
    question_zh: 不同任务运行、模型与架构会复现同一机制，还是只共享抽象算法？
    introduction_en: >-
      This question distinguishes strong universality of concrete features, components, and circuits from weak universality at the functional or algorithmic level, allowing equal performance with different structures.
    introduction_zh: >-
      该问题区分具体 feature、component、circuit 的强 universality 与功能或算法层面的弱 universality，
      并允许性能相同但结构不同。
    progress_en: >-
      A group-operation toy model first separated strong circuit identity from weak algorithmic universality.
      Later work found component reuse across tasks, recurring successor heads, stitchable linear features, and numerical-comparison circuits across architectures.
      The evidence supports greater recurrence of abstract function than exact structure, but equivalence metrics and boundaries across scale remain unsettled.
    progress_zh: >-
      群运算 toy model 首先区分具体电路相同的强 universality 与共享算法的弱 universality，随后研究发现跨任务组件复用、重复出现的 successor heads、可 stitching 的线性特征和跨架构数值比较电路。
      总体证据支持抽象功能比具体结构更普遍，但衡量等价性的标准及其跨规模边界仍未统一。
    first_date: '2023-02-06'
    primary_paper_ids:
      - p_2023_chughtai_a_toy_model
      - p_2023_merullo_circuit_component_reuse
      - p_2023_gould_successor_heads_recurring
      - p_2025_chen_transferring_linear_features
      - p_2026_bhardia_mechanistic_analysis_of

  - rq_id: rq-induction-head-icl-mechanism
    family_id: computational-mechanism
    question_en: >-
      Do induction heads implement most in-context learning through a reusable match-and-copy circuit?
    question_zh: Induction heads 是否通过可复用的 match-and-copy 回路实现了大部分 in-context learning？
    introduction_en: >-
      This question concerns the mechanism responsible for in-context learning. Training phase changes, ablations, and
      cross-scale recurrence are evidence for the mechanism rather than the primary unknown.
    introduction_zh: >-
      该问题关注 in-context learning 的实现机制。训练相变、消融和跨规模复现是支持该机制的证据，而不是主问题本身。
    progress_en: >-
      Induction-head studies identified a concrete match-and-copy circuit, linked its appearance to in-context-learning
      gains, and tested it with ablation and scale comparisons. The mechanism is compelling for repeated-pattern
      induction, while the fraction of broader in-context learning it explains remains disputed.
    progress_zh: >-
      Induction-head 研究识别出具体的 match-and-copy 回路，将其出现与 in-context learning 提升联系起来，并用消融与规模比较进行检验。
      该机制能较好解释重复模式 induction，但它能覆盖多少更广义的上下文学习仍有争议。
    first_date: '2022-09-24'
    primary_paper_ids:
      - p_2022_olsson_in_context_learning

  - rq_id: rq-task-vector-editing
    family_id: intervention-control
    question_en: >-
      Can parameter-difference task vectors support modular deletion, composition, and transfer of model behavior?
    question_zh: 参数差分形成的任务向量能否支持行为的模块化删除、组合与迁移？
    introduction_en: >-
      This question treats task vectors as intervention operators. Their representational structure matters, but the
      central test is whether vector arithmetic predictably edits behavior with limited collateral damage.
    introduction_zh: >-
      该问题把 task vector 视为干预算子。其表示结构很重要，但核心检验是向量运算能否可预测地修改行为且限制附带损害。
    progress_en: >-
      Task arithmetic showed that fine-tuning differences can be negated, added, and used in analogies without access to
      the original training data. Composition is feasible, but interference, calibration, and transfer beyond related
      model families remain open.
    progress_zh: >-
      Task arithmetic 表明，微调参数差分可以取反、相加并用于类比，且不需要原始训练数据。
      这证明了组合的可行性，但干扰、校准和跨不同模型家族的迁移仍待解决。
    first_date: '2022-12-08'
    primary_paper_ids:
      - p_2022_ilharco_editing_models_with
    secondary_paper_ids:
      - p_2023_todd_function_vectors_in

  - rq_id: rq-language-specific-representation
    family_id: representation-form
    question_en: >-
      Do models use language-specific neurons to represent different languages?
    question_zh: 模型是否用特定神经元表示不同语言？
    introduction_en: >-
      This question asks whether language identity is concentrated in a small set of selective neurons and whether those units influence the language in which a model generates. Stronger activation for one language does not imply that a neuron exclusively represents language identity or carries transferable task knowledge. Language selection, language-modeling ability, and cross-lingual transfer must therefore be distinguished.
    introduction_zh: >-
      该问题研究语言身份是否集中在少量选择性神经元中，以及这些单元是否影响模型使用哪种语言生成。对某种语言激活更强并不意味着神经元只承担语言身份功能，也不意味着它承载了可迁移的任务知识。因此需要区分语言选择、语言建模能力和跨语言迁移能力。
    progress_en: >-
      Language-Specific Neurons uses activation-probability entropy across languages to identify selective neurons concentrated in particular layers. Suppressing or increasing their activations changes language perplexity and output language, providing local causal evidence for language-identity representation. Later work finds that manipulating or selectively fine-tuning these neurons does not reliably improve cross-lingual task accuracy, while zeroing them often leaves task performance largely intact. A small neuron set can therefore influence language selection without independently carrying full language competence or transfer mechanisms. Selectivity, output control, and cross-lingual transfer are not interchangeable.
    progress_zh: >-
      Language-Specific Neurons 使用不同语言上的激活概率熵识别语言选择性神经元，并发现这些单元集中在特定层位；抑制或增强其激活会改变语言困惑度和输出语言，为语言身份表示提供局部因果证据。后续研究却发现，在推理时操纵或定向微调这些单元，并不能稳定提高低资源语言的跨语言任务准确率，置零也常常几乎不损害任务表现。现有结果说明，少量神经元可以影响语言选择，但它们并不独立承载完整语言能力或跨语言迁移机制；选择性、输出控制和迁移能力不能相互替代。
    first_date: '2024-02-26'
    primary_paper_ids:
      - p_2024_tang_language_specific_neurons
    secondary_paper_ids:
      - p_2025_mondal_language_specific_neurons

  - rq_id: rq-language-neuron-control
    family_id: intervention-control
    question_en: >-
      Can targeted manipulation of language-selective neurons improve cross-lingual task transfer?
    question_zh: 对语言选择性神经元的定向操作，能否改善跨语言任务迁移？
    introduction_en: >-
      This question tests whether a localized language representation is an effective control target for downstream
      transfer, using activation intervention and targeted fine-tuning rather than output-language changes alone.
    introduction_zh: >-
      该问题检验局部化的语言表示是否是下游迁移的有效控制目标，
      其证据来自激活干预和定向微调，而不只是输出语言的变化。
    progress_en: >-
      Existing tests found that activating or fine-tuning language-specific neurons did not meaningfully improve
      cross-lingual transfer and could disrupt task information because the units are polysemantic. The negative result
      separates descriptive localization from effective control.
    progress_zh: >-
      现有实验发现，激活或微调 language-specific neurons 并未显著改善跨语言迁移，且可能因单元 polysemanticity 而破坏任务信息。
      这一负面结果将描述性定位与有效控制区分开来。
    first_date: '2025-03-21'
    primary_paper_ids:
      - p_2025_mondal_language_specific_neurons

  - rq_id: rq-reasoning-state-features
    family_id: representation-form
    question_en: >-
      Do models represent different reasoning states with sparse features?
    question_zh: 模型是否用稀疏特征表示不同的推理状态？
    introduction_en: >-
      This question asks whether states such as uncertainty, exploration, reflection, and conclusion correspond to identifiable sparse features inside a reasoning model. Internal computational states must be distinguished from surface discourse markers such as “maybe,” “wait,” or “therefore.” Comparing base and reasoning-post-trained models can show whether such features are introduced or amplified, while steering provides only local evidence about their functional role.
    introduction_zh: >-
      该问题研究推理过程中的不确定、探索、反思和结论等状态，是否对应模型内部可识别的稀疏特征。需要区分真正参与推理计算的内部状态与“也许”“等等”“因此”等表面语言标记。比较基础模型与推理后训练模型可以观察这些特征是否被新增或增强，而 steering 只能为其功能作用提供局部证据。
    progress_en: >-
      Current work uses SAEs and a discourse-based ReasonScore to identify sparse features associated with uncertainty, exploration, reflection, and conclusion. Comparisons between base and reasoning-post-trained models suggest that post-training strengthens some readable reasoning features. Steering those features yields modest task improvements rather than only increasing the corresponding marker words. The evidence supports manipulable reasoning-state structure, but performance gains are much smaller than changes in reasoning length, and SAE splitting or absorption remains possible. Existing results do not fully separate computational state from language style or recover the complete reasoning algorithm.
    progress_zh: >-
      现有研究使用 SAE 和基于推理话语模式的 ReasonScore，识别出与不确定、探索、反思和结论阶段相关的稀疏特征。基础模型与推理后训练模型的比较表明，后训练会增强一部分可读推理特征；对这些特征进行 steering 可以带来小幅任务性能提升，而不只是增加相应标记词。结果支持推理过程中存在可操作的状态结构，但性能增益远小于推理轨迹长度的变化，SAE 还可能拆分或吸收概念。现有证据尚不能完全区分真实计算状态与语言风格，也没有恢复完整的推理算法。
    first_date: '2025-03-24'
    primary_paper_ids:
      - p_2025_galichin_i_have_covered

  - rq_id: rq-model-diffing-validity
    family_id: evidential-standards
    question_en: >-
      How can model-difference methods distinguish genuine post-training features from sparsity-induced artifacts?
    question_zh: 模型差分方法如何区分真实的后训练特征与稀疏优化伪影？
    introduction_en: >-
      This question concerns the validity of claims that a feature is unique to a fine-tuned model. Decoder norms and
      sparse objectives can manufacture apparent novelty unless the feature is cross-checked against both models.
    introduction_zh: >-
      该问题关注“某特征是微调模型所独有”这类主张是否有效。
      Decoder norm 和稀疏目标可能制造表面上的新特征，因此必须在两个模型中交叉检验。
    progress_en: >-
      Crosscoder analysis identified complete shrinkage and latent decoupling as sources of false chat-only features,
      introduced Latent Scaling diagnostics, and found BatchTopK more robust. The work supplies controls for novelty
      claims but does not by itself determine the full mechanism of chat tuning.
    progress_zh: >-
      Crosscoder 分析识别出 complete shrinkage 和 latent decoupling 两类伪 chat-only feature 来源，提出 Latent Scaling 诊断，并发现 BatchTopK 更稳健。
      该工作为“新特征”主张提供了对照，但未单独确定 chat tuning 的完整机制。
    first_date: '2025-04-03'
    primary_paper_ids:
      - p_2025_minder_overcoming_sparsity_artifacts

  - rq_id: rq-latent-knowledge-elicitation
    family_id: intervention-control
    question_en: >-
      How can causally verified latent knowledge be reliably elicited when a model does not express it?
    question_zh: 当模型不表达已有知识时，如何将经因果验证的潜在知识可靠地诱导出来？
    introduction_en: >-
      This question turns latent-knowledge diagnosis into intervention. A successful pipeline must distinguish genuine
      hidden knowledge from correlation and absence before changing the model's expressed answer.
    introduction_zh: >-
      该问题将潜在知识诊断推进到干预。成功流程必须先区分真实隐藏知识、相关信号和知识缺失，再改变模型的显式回答。
    progress_en: >-
      MechELK combined sparse-feature analysis, activation patching, and representation engineering into a
      Locate–Verify–Elicit pipeline. It advances from reading latent knowledge to causally supported elicitation, but
      robustness to deceptive, multi-step, and distribution-shifted settings remains open.
    progress_zh: >-
      MechELK 将稀疏特征分析、activation patching 和 representation engineering 组合为 Locate–Verify–Elicit 流程。
      它将研究从读出潜在知识推进到有因果支持的诱导，但对欺骗、多步与分布偏移情形的稳健性仍待检验。
    first_date: '2026-04-07'
    primary_paper_ids:
      - p_2026_park_mechelk_a_mechanistic

  - rq_id: rq-monosemanticity-measurement
    family_id: evidential-standards
    question_en: >-
      How can SAE latent monosemanticity be measured without concept labels or external embedding geometry?
    question_zh: 如何在不依赖概念标签或外部 embedding 几何的情况下，测量 SAE latent 的单义性？
    introduction_en: >-
      This question operationalizes a central interpretability claim. A metric should be self-contained, stable across
      training, and related to causal concept manipulation rather than merely agreeing with external labels.
    introduction_zh: >-
      该问题将“单义性”这一核心解释性主张操作化。指标应当自包含、跨训练稳定，
      并与概念因果操作相关，而不只是与外部标签一致。
    progress_en: >-
      The Tversky Monosemanticity Score used coherence of binary latent activation sets and was tested against training
      dynamics and concept deletion. It provides a label-free metric, while broader agreement with human concepts and
      downstream mechanism quality remains unestablished.
    progress_zh: >-
      Tversky Monosemanticity Score 使用二值 latent activation set 的一致性，并通过训练动态与概念删除进行检验。
      它提供了无标签指标，但与人类概念及下游机制解释质量的更广泛一致性仍未建立。
    first_date: '2026-07-20'
    primary_paper_ids:
      - p_2026_filus_measuring_monosemanticity_in

edges:
  - source: rq-attribution-foundations
    target: rq-attribution-efficiency
