schema_version: 0
status: working-draft
source: docs/research-question-timeline-draft.md
updated_at: '2026-10-10'
notes:
  - This is a consolidation draft, not an approved taxonomy or classification source.
  - Primary paper assignments are exhaustive for the current 123-paper corpus.
  - Every paper has exactly one primary RQ; secondary paper assignments are intentionally non-exclusive.
  - Existing Research Object, Technique, and Application metadata must be derived through paper IDs.
  - Edge types describe how the later target question changes the earlier source question.
  - Edge evidence distinguishes direct textual engagement, uncited continuity, and analyst synthesis.

edge_evidence_levels:
  direct-citation: The target papers cite and substantively engage source-node papers in the main text.
  same-lineage: The questions form a clear continuation, but no substantive main-text citation was verified.
  analyst-inference: The connection is a synthesis proposed for this graph and is not attributed to the papers.

families:
  - family_id: representation-form
    label_en: Representation Form
    label_zh: 表示形式
    guiding_question_en: What does the model represent, and in what form?
    guiding_question_zh: 模型表示了什么，以及以什么形式表示？
    meaning_en: >-
      This family studies what information is encoded inside a model and the structural form of that encoding.
      Candidate units include neurons, directions, subspaces, sparse features, task vectors, binding structures, and
      latent world states. The focus is not the analysis technique but the geometry, compositionality, sparsity, and
      organization of the representation itself.
    meaning_zh: >-
      这一类别研究模型内部编码了哪些信息，以及这些信息采用何种结构形式存在。可能的表示单位包括神经元、方向、子空间、
      稀疏特征、任务向量、绑定结构和世界状态。重点不是使用哪种分析技术，而是模型表示本身具有怎样的几何、组合和稀疏结构。
    evolution_en: >-
      Early work asked whether information could be decoded from intermediate layers and whether individual units
      aligned with human concepts. Unsupervised feature discovery then attempted to remove dependence on predefined
      labels. Research on superposition challenged the one-concept–one-neuron assumption and redirected attention
      toward directions, subspaces, and distributed representations. The field subsequently examined world states,
      task vectors, compositional binding, and causally meaningful representation geometry. Sparse representation
      learning sought to recover latent features from superposition, leading to questions about training objectives,
      frontier-scale feature atlases, and failures such as splitting and absorption. The progression is: information
      localization → representational form → latent-feature recovery → functional validation and failure boundaries.
    evolution_zh: >-
      早期研究主要询问信息能否从中间层读出，以及单个神经元是否对应人类概念。随后，无监督特征发现开始尝试摆脱预设标签。
      Superposition 研究进一步挑战了“一个概念对应一个神经元”的假设，推动研究转向方向、子空间和分布式表示。之后，研究扩展到
      世界状态、任务向量、实体—属性绑定和具有因果意义的表示几何。Sparse Autoencoder 等工作则试图从 superposition 中恢复潜在特征，
      继而引出训练目标、规模化特征图谱以及 splitting、absorption 等失败问题。整体脉络是：信息定位 → 表示形式 → 潜在特征恢复 →
      功能验证与失败边界。
    display_order: 1
  - family_id: computational-mechanism
    label_en: Computational Mechanism
    label_zh: 计算机制
    guiding_question_en: How do internal computations produce model behavior?
    guiding_question_zh: 模型如何通过内部计算产生行为？
    meaning_en: >-
      This family concerns the computations actually performed inside a model and how information flows across
      components, layers, token positions, and paths to produce behavior. The relevant objects may be attention heads,
      MLPs, paths, or complete circuits, but the central goal is to explain the computation rather than merely enumerate
      components.
    meaning_zh: >-
      这一类别关注模型内部实际执行了什么计算，以及信息如何在组件、层、token 位置和路径之间流动并最终产生行为。
      研究对象可能是 attention head、MLP、路径或完整电路，但类别的核心是解释计算过程，而不是罗列组件。
    evolution_en: >-
      The line began with the functions of individual components, such as how attention heads move information and how
      MLPs store or promote concepts. Work on knowledge localization and causal abstraction then examined storage,
      routing, and the correspondence between low-level computation and high-level algorithms. Full behavioral-circuit
      studies organized components into end-to-end mechanisms, motivating path localization, automated circuit
      discovery, and analysis at larger scales. More recent branches extend mechanism analysis to safety and refusal,
      multilingual processing, multimodal information flow, knowledge conflict, and multimodal hallucination. The
      progression is: component function → information pathways → complete circuits → automation and scaling → complex
      behaviors and failure mechanisms.
    evolution_zh: >-
      研究最初集中于单个组件的功能，例如 attention head 如何移动信息、MLP 如何存储或促进概念。之后，知识定位和因果抽象研究开始追踪
      信息的存储、路由以及低层计算与高层算法之间的对应。完整行为电路研究进一步把组件组织成端到端机制，并推动路径定位、自动电路发现
      和规模化分析。近期分支把机制分析扩展到安全与拒绝、跨语言处理、多模态信息流、知识冲突以及多模态幻觉等复杂行为。
      总体演化是：组件功能 → 信息路径 → 完整电路 → 自动化与规模化 → 复杂行为和失败机制。
    display_order: 2
  - family_id: mechanism-explanation
    label_en: Mechanism Explanation
    label_zh: 机制解释
    guiding_question_en: How can internal computation be discovered, organized, and expressed as an inspectable explanation?
    guiding_question_zh: 如何把模型内部计算发现、组织并表达为可检查的机制解释？
    meaning_en: >-
      This family studies the explanatory interface between a model's computation and a human analyst. It asks how an
      explanation target should be formalized and how semantic descriptions, causal alignments, paths, circuits, or
      feature graphs can be extracted efficiently. A boundary branch covers post-hoc attribution formalisms such as
      SHAP: they construct inspectable explanation artifacts, but do not by themselves recover an internal causal
      mechanism. This family is distinct from the computation itself and from the evidence required to trust the
      resulting explanation.
    meaning_zh: >-
      这一类别关注模型内部计算与人类分析者之间的解释接口：解释对象应如何形式化，以及如何高效提取语义描述、因果对齐、
      路径、电路或特征因果图。其中一个边界分支是 SHAP 等事后归因形式：它们构造可检查的解释产物，
      但不因此等同于发现了模型内部的因果机制。该类别不等同于模型实际执行的计算，也不等同于证明所得解释可信。
    evolution_en: >-
      Early work formalized attribution targets and automatic semantic descriptions of internal units. The focus then
      shifted to causal alignments, lenses, and path-level hypotheses that make intermediate computation inspectable.
      Automated circuit discovery reduced manual reverse engineering, while sparse features and analytic decompositions
      enabled finer-grained and more scalable explanation graphs. The progression is: explanation target and vocabulary
      → semantic readout and causal alignment → automated path and circuit extraction → scalable feature-level graphs.
    evolution_zh: >-
      早期工作形式化了归因对象，并尝试自动命名内部单元。随后研究转向因果对齐、lens 和路径级假说，使中间计算变得可检查。
      自动电路发现降低了人工逆向工程成本，稀疏特征和解析分解又把解释推向更细粒度和更大规模。整体脉络是：解释对象与语汇 → 语义读出与因果对齐 →
      自动路径和电路提取 → 可扩展的特征级解释图。
    display_order: 3
  - family_id: intervention-control
    label_en: Intervention and Control
    label_zh: 干预与控制
    guiding_question_en: Can mechanistic understanding support predictable and localized changes?
    guiding_question_zh: 对内部机制的理解能否支持可预测、可局部化的改变？
    meaning_en: >-
      This family asks whether interpretability can be translated into reliable changes to a model, including inducing
      structure during training, editing knowledge, and manipulating representations at inference time. It explicitly
      distinguishes a location that causally contributes to behavior from a location that is an effective and localized
      intervention target.
    meaning_zh: >-
      这一类别研究解释是否能够转化为对模型的可靠改变，包括在训练时诱导结构、编辑知识以及在推理时操纵内部表示。
      它特别区分“某个位置对行为具有因果作用”和“该位置是最有效、最局部的修改目标”。
    evolution_en: >-
      The line began with attempts to induce internal structures during training that correspond to human-specified
      causal models. Knowledge-editing research then exposed an important discontinuity: the location at which
      information causally affects behavior is not necessarily the best place to edit it. Representation engineering and
      inference-time intervention extended the question to whether internal directions can serve as stable control
      levers. The emphasis has shifted from merely changing outputs to achieving specificity, transferability, stability,
      and limited side effects. This branch is relatively small in the current corpus but forms the bridge between
      explanation and practical model control.
    evolution_zh: >-
      这一研究线首先尝试在训练阶段直接诱导符合人类高层因果模型的内部结构。随后，知识编辑研究揭示了一个重要断裂：因果定位得到的
      知识使用位置不一定是最佳编辑位置。Representation engineering 和 inference-time intervention 又把问题扩展到内部方向是否可以作为
      稳定的控制杠杆。研究重点也由“是否能够改变输出”逐渐转向改变是否具有特异性、可迁移性、稳定性以及有限副作用。
      当前 corpus 中这一分支规模较小，但它连接了解释和实际模型控制。
    display_order: 4
  - family_id: temporal-development
    label_en: Temporal Development and Learning
    label_zh: 时序学习
    guiding_question_en: How do representations and mechanisms evolve across training, network depth, and generation?
    guiding_question_zh: 表示与机制如何随训练、网络深度和生成过程演化？
    meaning_en: >-
      This family studies how internal representations and mechanisms change across temporal or computational stages.
      Time includes training checkpoints, network depth, post-training, and autoregressive generation steps. It is a
      family of questions about formation, transition, and temporal unfolding rather than a target-object label.
    meaning_zh: >-
      这一类别研究内部表示和机制如何随时间或计算阶段变化。这里的时序包括训练检查点、网络层深、后训练和自回归生成步骤；
      它是关于形成、转变与时序展开的问题，而不是“learning process”对象标签。
    evolution_en: >-
      Early theory examined feature selection and reweighting during training. Checkpoint analysis then traced circuit
      formation and internal progress measures behind apparent capability jumps. Layerwise lenses extended the dynamic
      view to a single forward pass, and later work studied future-token commitments, post-training changes, and causal
      computation across Chain-of-Thought steps. The progression is: feature formation → circuit formation and phase
      transitions → depth-wise prediction dynamics → generation-time and CoT dynamics.
    evolution_zh: >-
      早期理论研究训练中的特征选择与重加权；检查点分析随后开始追踪电路形成，并用内部 progress measures 解释表面突发的能力跃迁。
      层间 lens 把动态视角扩展到单次前向传播，后续研究又进入未来 token 承诺、后训练变化和 Chain-of-Thought 跨步骤因果计算。整体脉络是：
      特征形成 → 电路形成与相变 → 层间预测演化 → 生成时序与 CoT 动态。
    display_order: 5
  - family_id: evidential-standards
    label_en: Evidential Standards
    label_zh: 证据标准
    guiding_question_en: What evidence is sufficient to support an interpretability claim?
    guiding_question_zh: 什么证据足以支持一项解释性主张？
    meaning_en: >-
      This family concerns the justification of interpretability claims. It asks what conclusions attribution, probing,
      intervention, and circuit analysis support, whether explanations depend on the actual model, and whether claims
      survive controls, counterfactuals, alternative explanations, and out-of-distribution tests.
    meaning_zh: >-
      这一类别关注我们凭什么相信某项解释：归因、probe、干预和电路分析分别能支持多强的结论，解释是否依赖真实模型，
      以及主张能否经受对照、反事实、替代解释和分布外测试。
    evolution_en: >-
      Sanity checks first asked whether explanations depend on model parameters. Probe research then calibrated positive
      and null results and separated decodability from causal use. With causal interventions and circuit discovery,
      attention moved to design robustness, behavioral faithfulness, and strong baselines. Recent work studies audit
      limits, staged causal evidence, and solver-checkable guarantees: correlation → causation → behavioral and OOD
      validation → formal verification.
    evolution_zh: >-
      早期 sanity checks 检验解释是否真正依赖模型参数；probe 研究随后校准正结果和空结果，并区分可解码性与因果使用。随着干预和电路发现普及，
      问题转向实验设计稳健性、行为忠实性和强基线。近期研究又进入审计边界、分阶段因果证据与求解器可检查保证：相关 → 因果 → 行为与分布外验证 → 形式验证。
    display_order: 6
  - family_id: generality-transfer
    label_en: Generality and Transfer
    label_zh: 泛化与迁移
    guiding_question_en: Do explanations hold or transfer across tasks, models, scales, architectures, and modalities?
    guiding_question_zh: 解释在任务、模型、规模、架构与模态之间能否成立或迁移？
    meaning_en: >-
      This family studies the scope over which an explanation remains valid. It distinguishes structural recurrence—
      whether the same neurons, features, or circuits reappear—from functional recurrence, in which different models
      implement the same function or abstract algorithm. Successful transfer across models can support shared
      representations without proving that the underlying mechanisms are identical.
    meaning_zh: >-
      这一类别研究解释的适用范围。它区分具体神经元、特征和电路是否重复出现的结构一致性，与不同模型是否实现相同功能或抽象算法的
      功能一致性。跨模型迁移成功可以支持共享表示，但不能自动证明底层机制完全相同。
    evolution_en: >-
      Early mechanistic explanations were usually confined to a single model and task, with generality often left
      implicit. From 2023 onward, researchers began systematically comparing recurring motifs, component reuse, and
      function vectors across data runs, model scales, and architectures. Cross-model alignment, model stitching, and
      feature transfer turned “similar mechanisms” into operational transfer tests. Current evidence generally supports
      partial universality: abstract functions may recur even when concrete components and circuit structures differ. In
      the present corpus this family remains concentrated in one broad RQ and may later split into cross-run stability,
      cross-model transfer, and cross-architecture functional equivalence.
    evolution_zh: >-
      早期机制解释大多局限于单个模型和单项任务，研究者往往默认发现具有一定普遍性。自 2023 年起，研究开始系统比较不同数据运行、
      模型规模和架构中的 recurring motifs、组件复用和功能向量。跨模型表示对齐、model stitching 和特征迁移进一步把“相似机制”转化为
      可操作的迁移检验。现有结果总体支持部分 universality：抽象功能可能复现，但具体组件和电路结构经常变化。当前数据中这一类别仍主要
      集中在一个综合 RQ，未来可能拆分为跨运行稳定性、跨模型迁移和跨架构功能等子问题。
    display_order: 7

nodes:
  - rq_id: rq-attribution-foundations
    family_id: mechanism-explanation
    question_en: >-
      How should a prediction be attributed to its input features?
    question_zh: 一个预测应如何归因到各个输入特征？
    introduction_en: >-
      This question asks how a single prediction should be allocated among input features and which principles should constrain that allocation. Attribution methods are comparable only after fixing the explanation form, the meaning of feature absence, and the background distribution. Properties such as local accuracy, missingness, and consistency determine a unique solution within additive feature attribution, but this explains how outputs vary with inputs rather than recovering the model’s internal causal mechanism.
    introduction_zh: >-
      该问题研究如何把单次预测分配到不同输入特征，并用明确原则约束这种分配。不同归因方法只有在采用相同的解释形式、特征缺失定义和背景分布时才可以比较。满足局部准确性、缺失性和一致性等性质可以唯一确定加性特征归因中的解，但这种归因解释模型输出如何随输入变化，不等于恢复模型内部的因果机制。
    progress_en: >-
      SHAP unifies several local explanation methods as additive feature attribution and proves that three properties jointly determine a unique Shapley allocation within that class. Kernel SHAP supplies a model-agnostic approximation procedure. The theory and experiments support the framework as a principled way to construct and compare local attributions, but results depend strongly on how feature absence, background samples, and correlated inputs are handled. SHAP therefore provides a principled output attribution, not a unique explanation of internal computation.
    progress_zh: >-
      SHAP 将多种局部解释方法统一为加性特征归因，并证明在这一形式内，三项性质共同确定唯一的 Shapley 归因。Kernel SHAP 又提供了适用于任意模型的近似计算方法。理论与实验支持该框架用于比较和构造局部归因，但结果高度依赖如何模拟“特征缺失”、选择背景样本以及处理相关特征。因此，SHAP 提供的是原则明确的输出归因，而不是模型内部机制的唯一解释。
    first_date: '2017-05-22'
    primary_paper_ids:
      - p_2017_lundberg_a_unified_approach

  - rq_id: rq-attribution-efficiency
    family_id: mechanism-explanation
    question_en: >-
      Can Shapley attributions be generated in real time?
    question_zh: Shapley 归因能否实时生成？
    introduction_en: >-
      Traditional Shapley-value estimation repeatedly queries the explained model for every example, making it impractical for interactive systems or large datasets. This question asks whether a learned explainer can amortize that per-example computation into one forward pass while remaining close to the target Shapley values. Efficiency must be evaluated through attribution accuracy and explanation utility as well as runtime.
    introduction_zh: >-
      传统 Shapley 值估计需要针对每个样本反复调用待解释模型，难以用于交互系统或大规模数据。该问题研究能否预先训练一个解释器，把逐样本优化摊销为一次前向计算，同时保持对真实 Shapley 值的近似精度。效率提升不能只用运行速度衡量，还需要检查归因误差和实际解释效用。
    progress_en: >-
      FastSHAP formulates Shapley estimation as amortized supervised learning, allowing a new example to be explained with one forward pass. On tabular data it approaches computable Shapley targets at orders-of-magnitude lower per-example cost, and on images it performs well under deletion and preservation metrics. Its theoretical optimum nevertheless assumes sufficient data, explainer capacity, and successful optimization, while image experiments lack exact Shapley ground truth. Real-time approximation is feasible, but faithful recovery is not guaranteed for every model or distribution.
    progress_zh: >-
      FastSHAP 把 Shapley 值估计转化为摊销学习，使新样本只需一次前向传播即可获得归因。在表格数据上，它以数量级更低的成本逼近可计算的 Shapley 真值；在图像任务上，也在删除和保留特征等指标中取得较好结果。不过其理论最优性依赖训练数据、解释器容量和优化质量，图像实验也没有精确 Shapley 真值。因此，目前已经证明实时近似可行，但不能保证每个分布和模型上都忠实恢复目标归因。
    first_date: '2021-07-15'
    primary_paper_ids:
      - p_2021_jethani_fastshap_real_time_shapley

  - rq_id: rq-explanation-validity
    family_id: evidential-standards
    question_en: >-
      Does an explanation genuinely depend on the model it claims to explain?
    question_zh: 解释结果是否真正依赖被解释的模型？
    introduction_en: >-
      A visually plausible explanation is not necessarily faithful. This question asks whether an explanation changes
      appropriately with model parameters, training-label relations, or counterfactual model behavior. It also requires
      the explanatory claim to be defined before suitable controls and faithfulness criteria are selected.
    introduction_zh: >-
      看起来合理的解释不一定忠实。该问题检验解释是否会随模型参数、训练标签关系或模型行为的反事实变化而相应改变，
      并要求先明确“解释”试图说明什么，再选择合适的对照和忠实性标准。
    progress_en: >-
      Randomization tests by Adebayo and colleagues showed that some saliency maps remain visually similar after model
      parameters or label relations are destroyed, demonstrating that plausibility is not evidence of faithfulness. Work
      by Wiegreffe and Pinter further showed that the existence of alternative attention distributions does not by itself
      invalidate the original attention explanation; explicit definitions, diagnostic baselines, and seed variation are
      also required. Necessary negative controls now exist, but no single faithfulness criterion covers every explanation
      object.
    progress_zh: >-
      Adebayo 等人的随机化检验发现，一些显著性图在模型参数或标签被破坏后仍保持相似外观，说明视觉合理性不能作为忠实性证据。
      Wiegreffe 与 Pinter 对注意力解释的研究进一步表明，存在替代注意力分布并不能单独否定原注意力的解释价值；
      判断必须结合明确的解释定义、诊断基线和随机种子差异。现有研究建立了必要的负向对照，
      但尚无适用于所有解释对象的统一忠实性标准。
    first_date: '2018-10-08'
    primary_paper_ids:
      - p_2018_adebayo_sanity_checks_for
      - p_2019_wiegreffe_attention_is_not

  - rq_id: rq-conceptual-prediction-explanation
    family_id: mechanism-explanation
    question_en: >-
      Which internal concepts contribute to a model’s current prediction?
    question_zh: 哪些内部概念共同促成了模型的当前预测？
    introduction_en: >-
      This question does not ask what concept an individual internal unit generally represents. Instead, it asks which internal concepts the model actually uses for a specific prediction and how those concepts jointly support the result. Input-attribution maps often identify important pixels or regions without revealing the semantic information used by the model. For example, an attribution map may show that a bird classifier focuses on the bird’s head without revealing whether the decision depends on eye color, stripes, feather texture, or a combination of these concepts. A concept-level explanation should propagate output relevance to internal concepts and distinguish a concept that is merely activated by the input from one that actually contributes to the current prediction.
    introduction_zh: >-
      该问题不再询问单个内部单元通常对应什么概念，而是针对一次具体预测，研究模型实际使用了哪些内部概念，以及这些概念如何共同支持当前结果。输入归因图通常只能指出哪些像素或区域重要，却不能说明模型利用了什么语义信息。例如，归因图可能显示模型主要关注鸟的头部，但不能判断真正影响分类的是眼睛颜色、条纹、羽毛纹理，还是这些概念的组合。概念级解释需要把输出相关性传递到内部概念，并区分“某个概念被输入激活”与“该概念实际影响了当前预测”。
    progress_en: >-
      Concept Relevance Propagation lifts pixel-level attribution to internal concepts, while RelMax retrieves examples that best express a concept and its relevance to an output. Together they expose concept composition and distinguish high activation from actual relevance to a target class. The explanations also help identify and ablate Clever Hans shortcuts. Multi-domain cases and a user study support their diagnostic value, but concepts depend on selected channels and reference data, and participants do not always find them clearer than simpler heat maps. The methods provide useful conceptual explanations without establishing a unique or complete concept decomposition.
    progress_zh: >-
      Concept Relevance Propagation（CRP）把逐像素归因提升到内部概念层级，RelMax 则检索最能体现某个概念及其输出相关性的样本。二者能够展示概念组合，并区分高激活特征与对特定类别真正相关的特征。研究还利用这些解释发现并消融 Clever Hans 式虚假相关。多领域案例和用户实验支持其诊断价值，但概念仍依赖所选通道和参考数据，人工参与者也未始终认为它比简单热图更清晰。现有方法能够产生有用的概念解释，但没有证明概念划分唯一或完备。
    first_date: '2022-06-07'
    primary_paper_ids:
      - p_2022_achtibat_from_attribution_maps

  - rq_id: rq-probe-meaning
    family_id: evidential-standards
    question_en: >-
      What can probe results actually tell us about internal representations?
    question_zh: 探针结果究竟能说明模型内部有什么？
    introduction_en: >-
      This question separates information present in a representation, regularities learned by the probe from finite
      data, and information actually used by the original model. Probe success does not establish causal use, while
      probe failure may reflect insufficient data, unfavorable geometry, or an unsuitable probe class rather than
      absence of information.
    introduction_zh: >-
      该问题区分三件事：表示中存在的信息、探针自身从有限数据中学到的规律，以及原模型是否使用这些信息。
      探针成功不能直接证明因果使用，探针失败也可能来自样本不足、表示几何或探针类别不合适，而不能直接证明信息不存在。
    progress_en: >-
      Hewitt and Liang introduced control tasks and selectivity to expose memorization by the probe. Controlled
      experiments by Ravichander and colleagues then showed that high decodability does not imply relevance to the
      original task. Recent geometric and statistical theory characterizes conditions under which linear probes produce
      false negatives. The field has therefore moved from controlling probe capacity to calibrating both positive and
      null results, although conclusions remain dependent on sample size, representation geometry, and probe assumptions.
    progress_zh: >-
      Hewitt 与 Liang 通过控制任务和选择性指标揭示了探针记忆造成的混淆。Ravichander 等人的受控实验进一步证明，
      高可解码性不意味着信息与原任务相关。最新理论又开始刻画线性探针产生假阴性的几何和统计条件，
      使研究从“控制探针容量”推进到同时校准正结果与空结果。但具体结论仍依赖样本量、表示几何和探针假设。
    first_date: '2019-09-08'
    primary_paper_ids:
      - p_2019_hewitt_designing_and_interpreting
      - p_2026_hai_when_and_why
    secondary_paper_ids:
      - p_2020_ravichander_probing_the_probing

  - rq_id: rq-causal-use
    family_id: evidential-standards
    question_en: >-
      Does the model actually use information that can be decoded from its representations?
    question_zh: 能被读出的信息，是否真的被模型使用？
    introduction_en: >-
      Information being present in a representation does not mean that it participates in the computation producing
      behavior. This question requires controlled tasks, representation interventions, or counterfactual changes to test
      whether decoded information causally affects model outputs.
    introduction_zh: >-
      表示中存在某种信息，不等于该信息参与了模型产生行为的计算。该问题要求通过受控任务、表示干预或反事实变化，
      检验被读出的信息是否会因果影响模型输出。
    progress_en: >-
      Controlled probing experiments show that an attribute can remain highly decodable even when the task does not
      require it. Geometric causal probing then sought to isolate and intervene on concept directions, while OthelloGPT
      experiments directly edited internal board-state directions and observed corresponding counterfactual changes in
      predictions. Decodability and causal use are now clearly distinguished, but a scalable general test for complex
      natural-language behavior remains unavailable.
    progress_zh: >-
      受控探针实验表明，即使任务完全不需要某种属性，它仍可能被高准确率读出。几何因果探针随后尝试隔离概念方向并对其实施干预；
      OthelloGPT 的棋盘状态实验则通过直接修改内部方向，使模型预测随反事实棋局变化。
      现有研究已经明确区分“可读出”与“被使用”，但适用于自然语言复杂行为的通用因果检验仍然缺失。
    first_date: '2020-05-02'
    primary_paper_ids:
      - p_2020_ravichander_probing_the_probing
    secondary_paper_ids:
      - p_2023_guerner_a_geometric_notion
      - p_2023_nanda_emergent_linear_representations

  - rq_id: rq-intervention-reliability
    family_id: evidential-standards
    question_en: >-
      How sensitive are conclusions from intervention experiments to experimental design?
    question_zh: 干预实验的结论对实验设计有多敏感？
    introduction_en: >-
      Activation patching and ablation do not automatically yield a unique localization of mechanism. The corruption
      procedure defines the counterfactual question, while replacement values, output metrics, normalization, and
      intervention scope can change the result. This question seeks designs that produce stable, reproducible, and
      appropriately limited conclusions.
    introduction_zh: >-
      激活修补和消融并不会自动给出唯一的机制定位结果。污染方式定义了反事实问题，替换值、输出指标、
      归一化和干预范围也可能改变结论。该问题研究哪些设计选择能够得到稳定、可复现且不过度推断的结果。
    progress_en: >-
      Systematic comparisons show that activation-patching locations and effect sizes vary substantially with corruption
      procedures, metrics, and single-layer versus windowed interventions; windowed patching can also produce nonlinear
      recovery unsupported by individual layers. These findings motivate concrete recommendations such as
      in-distribution replacements and logit-difference metrics, but no recipe is universally optimal, and validation
      remains concentrated on a limited set of tasks, models, and patching designs.
    progress_zh: >-
      系统比较发现，激活修补得到的位置和效应大小会随污染方式、指标以及单层或窗口式修补而显著变化，
      窗口干预还可能产生单层结果无法预测的非线性恢复。研究已经据此提出分布内替换、logit difference 等具体建议，
      但这些建议并非普遍最优，目前主要在有限任务、模型和激活修补范式中得到验证。
    first_date: '2023-09-27'
    primary_paper_ids:
      - p_2023_zhang_towards_best_practices

  - rq_id: rq-circuit-faithfulness
    family_id: evidential-standards
    question_en: >-
      Does a discovered circuit faithfully preserve the model's target behavior?
    question_zh: 发现的电路是否忠实保留了模型的目标行为？
    introduction_en: >-
      Component overlap with a known circuit does not show that a candidate performs the same computation. This question
      requires direct tests of whether retaining the candidate preserves the target behavior and whether removing
      components inside or outside it produces the expected effects.
    introduction_zh: >-
      候选电路与已有电路包含相似组件，并不能证明它实现了相同计算。该问题要求直接检验：
      只保留候选电路时目标行为能否维持，移除电路外或电路内组件时是否产生符合预期的变化。
    progress_en: >-
      Hanna and colleagues showed that node or edge overlap between candidate circuits does not reliably predict
      behavioral faithfulness and advocated direct functional evaluation by retaining or removing candidate subgraphs.
      Integrated gradients improve edge-attribution patching but do not consistently match exact interventions.
      Behavioral preservation is now an important circuit-evaluation criterion, although faithfulness does not imply
      completeness, minimality, or uniqueness and remains sensitive to task metrics and corruption choices.
    progress_zh: >-
      Hanna 等人发现，候选电路之间的节点或边重合度不能可靠预测行为忠实性，并提出通过保留或删除候选子图直接评估功能。
      积分梯度能够改善边归因修补，但仍不能稳定替代精确干预。行为保持已经成为电路评估的重要标准，
      不过忠实性仍不等于完整性、最小性或唯一性，而且会受任务指标和污染方式影响。
    first_date: '2024-03-26'
    primary_paper_ids:
      - p_2024_hanna_have_faith_in

  - rq_id: rq-method-usefulness
    family_id: evidential-standards
    question_en: >-
      Do interpretability methods provide practical value beyond simple baselines?
    question_zh: 可解释性方法是否比简单基线更有实际价值？
    introduction_en: >-
      Producing readable features, reconstructing activations, or steering outputs does not by itself make a method
      useful. This question evaluates methods on explicit goals such as causal analysis, attribute isolation, behavioral
      control, or prediction, using strong simple baselines and tests on unseen examples or realistic distributions.
    introduction_zh: >-
      一种方法能够产生可读特征、重构激活或操纵输出，并不代表它对研究或应用真正有用。
      该问题要求在明确的因果分析、属性隔离、行为控制或预测任务中，将方法与强而简单的基线公平比较，
      并检查其在新样本和现实分布上的表现。
    progress_en: >-
      RAVEL showed that decodability does not imply causal disentanglement and that methods trained on counterfactual
      objectives often outperform unsupervised decompositions. Task-grounded SAE evaluations added behavioral
      reconstruction, controllable editing, and explanation–function agreement. AxBench and sparse-probing studies
      further found that prompting, mean differences, fine-tuning, and other simple methods often match or outperform
      SAEs. These results reject the assumption that greater interpretability automatically yields greater usefulness,
      while leaving evaluation criteria dependent on the intended use.
    progress_zh: >-
      RAVEL 发现，信息可解码不代表属性能够被因果隔离，直接优化反事实目标的方法通常优于无监督分解。
      面向 SAE 的任务级评估进一步引入行为重构、可控编辑和解释—功能一致性。AxBench 和稀疏探针研究则发现，
      提示、均值差、微调及其他简单方法经常匹配或超过 SAE。现有结果否定了“更可解释必然更有用”，
      但不同用途仍需要不同的评价标准。
    first_date: '2024-02-27'
    primary_paper_ids:
      - p_2024_huang_ravel_evaluating_interpretability
      - p_2024_makelov_towards_principled_evaluations
      - p_2025_wu_axbench_steering_llms
      - p_2025_kantamneni_are_sparse_autoencoders

  - rq_id: rq-audit-limits
    family_id: evidential-standards
    question_en: >-
      Can hidden mechanisms exist that behavioral testing alone cannot discover?
    question_zh: 是否存在仅靠行为测试无法发现的隐藏机制？
    introduction_en: >-
      This question studies computational limits of interpretability and safety auditing. A model may contain a
      mechanism that genuinely controls behavior while remaining difficult to trigger through any computationally
      bounded prompt search or behavioral elicitation. Failure to observe dangerous behavior therefore need not
      establish that the mechanism is absent.
    introduction_zh: >-
      该问题研究解释和安全审计的计算边界：模型内部可能存在真实控制行为的机制，
      但任何计算资源有限的提示搜索或行为诱导都很难触发它。无法观察到危险行为，因此不一定证明危险机制不存在。
    progress_en: >-
      Cryptographic Transformer circuits construct backdoors triggered by passwords, NP-complete search conditions, or
      cryptographically hidden predicates and show that increasingly strong behavioral searches may still fail to elicit
      them. This establishes that behaviorally unelicitable mechanisms can exist, but it is an existence result under
      computational assumptions rather than evidence that such backdoors are common in naturally trained models. Weight
      inspection, provenance controls, and internal analysis may also bypass limitations of behavioral auditing alone.
    progress_zh: >-
      密码学 Transformer 电路已经构造出由密码、NP 完全搜索和密码学隐藏条件触发的后门，
      并展示更强的行为搜索仍可能无法可靠诱导这些机制。这证明“不可行为诱导的机制可以存在”，
      但属于存在性与条件性结果，不能说明现实训练模型中普遍存在此类后门；
      权重检查、来源控制或内部分析也可能绕开纯行为审计的限制。
    first_date: '2024-06-03'
    primary_paper_ids:
      - p_2024_draguns_unelicitable_backdoors_in

  - rq_id: rq-evidence-ladder
    family_id: evidential-standards
    question_en: >-
      How can interpretability evidence progress from correlation to causal and deployment validation?
    question_zh: 解释证据如何从相关性推进到因果与部署验证？
    introduction_en: >-
      This question treats mechanistic explanation as a progressively strengthened chain of evidence. A readable or
      selective candidate feature must also pass causal intervention, mechanism-composition, out-of-distribution, and
      deployment-cost tests before supporting stronger explanatory or practical claims.
    introduction_zh: >-
      该问题把机制解释看成逐步加强的证据链。一个可读或选择性较强的候选特征，
      需要继续接受因果干预、机制组合、分布外检验和部署成本评估，才能支持更强的解释或应用主张。
    progress_en: >-
      A five-stage framework organizes feature discovery, causal validation, mechanism composition, distribution-shift
      testing, and deployment auditing into one workflow, allowing claims of different strength to be distinguished
      explicitly. Its main contribution is methodological integration rather than proof that every stage is sufficient.
      Validation remains limited to a small model and task, and reproducibility in realistic research workflows has not
      been established.
    progress_zh: >-
      现有五阶段框架把特征发现、因果验证、机制组合、分布偏移检验和部署审计组织在同一流程中，
      使研究者能够明确区分不同强度的结论。其主要贡献是整合已有证据标准，而不是证明每一步已经充分。
      当前验证限于较小模型和任务，各阶段能否在真实研究流程中稳定复现仍待检验。
    first_date: '2026-05-21'
    primary_paper_ids:
      - p_2026_munigety_from_correlation_to

  - rq_id: rq-formal-verification
    family_id: evidential-standards
    question_en: >-
      Can mechanistic explanations receive machine-checkable formal guarantees?
    question_zh: 机制解释能否得到机器可验证的形式保证？
    introduction_en: >-
      Empirical tests show only that an explanation works on the evaluated examples. This question seeks to express
      mechanistic explanations as formal propositions with explicit domains and to generate checkable proofs or
      counterexamples for functional equivalence, edge necessity, invariance to irrelevant inputs, and robustness to
      internal perturbations.
    introduction_zh: >-
      经验实验通常只能说明解释在已测试样本上成立。该问题尝试把机制解释写成带有明确适用域的形式命题，
      并为功能等价、边必要性、无关输入不变性和内部扰动稳健性生成可检查的证明或反例。
    progress_en: >-
      Recent work uses solvers to check circuit explanations and find counterexamples in deliberately verifiable
      Transformers, showing that some mechanistic claims can be upgraded from empirical support to formal guarantees
      within a declared domain. The verified object is typically a calibrated circuit or controlled model rather than
      the original large dense model. Domain expressiveness, solver scale, and approximate neural computation remain
      major obstacles.
    progress_zh: >-
      近期工作已经在专门设计的可验证 Transformer 上，用求解器检查电路解释并自动寻找反例，
      证明部分机制主张可以从经验支持提升为声明域内的形式保证。但被验证的通常是校准后的电路或受控模型，
      而不是原始大规模密集模型；适用域表达、求解规模和近似神经计算仍是主要瓶颈。
    first_date: '2026-05-21'
    primary_paper_ids:
      - p_2026_somani_towards_verifiable_transformers

  - rq_id: rq-information-accessibility
    family_id: temporal-development
    question_en: >-
      Does task-relevant information become more linearly decodable as network depth and training progress?
    question_zh: 任务相关信息是否会随网络加深和训练推进而更容易被线性读出？
    introduction_en: >-
      This question asks whether task-relevant information, such as class identity or attributes, becomes increasingly
      accessible to a simple readout across network layers or training checkpoints. Readability usually means improved
      linear separability. It can reveal representational development and training failures, but does not show that the
      original model uses the decoded information.
    introduction_zh: >-
      该问题研究类别、属性等任务相关信息，是否随着网络逐层计算或训练推进而变得更容易被简单读出器提取。
      这里的“容易读出”通常指线性可分性提高，可以用来观察表示形成过程并诊断训练异常，但不代表原模型实际使用了这些信息。
    progress_en: >-
      Alain and Bengio showed that linear-probe error decreases almost monotonically with depth in ResNet-50 and
      Inception v3, while training checkpoints reveal class information becoming progressively more accessible. Probes
      also expose inactive network regions that final loss can miss. This established readout trajectories as a
      diagnostic of representation formation, but the evidence is concentrated on image classifiers and establishes
      linear accessibility rather than causal use.
    progress_zh: >-
      Alain 与 Bengio 发现，线性探针的分类误差在 ResNet-50 和 Inception v3 中几乎随网络加深而持续下降，
      训练检查点也显示类别信息逐渐变得更容易读出。探针还能发现最终损失没有暴露的无效网络区域。
      这建立了用读出轨迹观察表示形成的基本范式，但证据主要来自图像分类器，只说明线性可访问性，不能证明信息被模型因果使用。
    first_date: '2016-10-05'
    primary_paper_ids:
      - p_2016_alain_understanding_intermediate_layers

  - rq_id: rq-concept-unit-alignment
    family_id: representation-form
    question_en: >-
      Do individual internal units correspond to human-interpretable concepts?
    question_zh: 模型中的单个内部单元是否对应人类可理解的概念？
    introduction_en: >-
      This question asks whether semantic concepts are concentrated in individual neurons or channels, and whether
      such unit–concept correspondence reflects the organization of the representation or appears only in a particular
      coordinate basis. Studies typically compare a unit's activation regions or responsive examples with human
      concept annotations. Such alignment does not establish that the unit is monosemantic or causally used in
      prediction. Automatically generating open-vocabulary unit descriptions is treated as a separate
      explanation-construction question.
    introduction_zh: >-
      该问题考察模型是否将某些语义概念集中编码在单个神经元或通道上，以及这种“单元—概念”对应是表示的真实组织方式，
      还是只有在特定坐标基底下才会显现。研究通常将单元的激活区域或响应样本与人工概念标注进行比较。这样的对齐不等于单元具有单一含义，
      也不能单独证明模型在预测时因果地使用了该概念。如何自动为单元生成开放词汇名称，则属于另一个解释构造问题。
    progress_en: >-
      Network Dissection operationalized unit–concept alignment using the densely annotated Broden dataset and an
      IoU-based detector metric for objects, parts, materials, textures, and other visual concepts. Its rotation
      experiments showed that unit-level interpretability can fall sharply while information content and classification
      performance remain largely unchanged, demonstrating dependence on the representation basis. CLIP-Dissect later
      reduced reliance on dense segmentation labels and fixed concept vocabularies, enabling scalable open-vocabulary
      descriptions. CRP and RelMax further showed that maximally activating examples need not reveal how a unit is
      actually used in a particular prediction, extending the line toward prediction-conditioned relevance and concept
      composition. Unit semantics can now be measured and described at greater scale, but conclusions remain dependent
      on the basis, vocabulary, probe data, and input context, and do not establish monosemanticity or causal necessity.
    progress_zh: >-
      Network Dissection 使用带语义分割标注的 Broden 数据集和 IoU 指标，系统量化了视觉网络中单元与物体、部件、材质、纹理等概念的对应关系。
      随机旋转实验表明：在分类性能和信息量基本不变的情况下，单元级可解释性会显著下降，说明这种对应依赖表示空间的坐标轴。CLIP-Dissect 随后减少了对密集分割标注
      和固定概念词表的依赖，使单元语义能够以开放词汇进行规模化描述。CRP 与 RelMax 进一步指出，最强激活样本不一定反映单元在具体预测中实际发挥的作用，
      并把分析推进到预测条件下的概念相关性与概念组合。当前已经可以较大规模地测量和描述单元语义，但结果仍受坐标基底、候选词表、探测数据和输入情境影响，
      也尚不能据此证明单义性或因果必要性。
    first_date: '2017-04-19'
    primary_paper_ids:
      - p_2017_bau_network_dissection_quantifying
    secondary_paper_ids:
      - p_2022_oikarinen_clip_dissect_automatic_description
      - p_2022_achtibat_from_attribution_maps

  - rq_id: rq-automatic-unit-description
    family_id: mechanism-explanation
    question_en: >-
      Can internal model units be described automatically with an open vocabulary?
    question_zh: 能否自动为模型内部单元生成开放词汇描述？
    introduction_en: >-
      Fixed concept datasets test only predefined labels and can miss rare or unexpected semantics. This question asks whether activation patterns over natural images can be matched to an open vocabulary using a vision–language model. The resulting label summarizes a unit’s observed behavior; it does not establish that the unit is monosemantic or causally controls the named concept.
    introduction_zh: >-
      固定概念数据集只能检验预先列出的标签，也会遗漏长尾或意外语义。该问题研究能否根据内部单元在自然图像上的激活模式，利用视觉—语言模型从开放词汇中选择描述。生成的标签是对单元行为的语义摘要，不自动说明该单元是单义的或对相应概念具有因果作用。
    progress_en: >-
      CLIP-Dissect compares image-level neuron activation profiles with candidate text concepts using CLIP, without pixel-segmentation labels, a fixed ontology, or an additional trained explanation model. It outperforms tested alternatives on known output labels, human evaluation, and runtime, while allowing the vocabulary to be replaced. Labels nevertheless inherit biases from CLIP, the candidate vocabulary, and highly activating images, and a single phrase can hide conditional or polysemantic behavior. Automatic open-vocabulary naming is feasible, but an accurate label is not a complete or causal account of a unit.
    progress_zh: >-
      CLIP-Dissect 使用 CLIP 比较神经元的图像级激活轨迹与候选文本概念，无需像素分割标注、固定概念本体或额外训练解释模型。它在已知输出标签、人类评价和速度比较中优于所测替代方法，并允许按需要更换词汇表。但标签会继承 CLIP、候选词表和高激活样本的偏差，条件性或多义功能也可能被单一短语掩盖。自动开放词汇命名已经可行，但标签准确并不等于单元语义完整或因果有效。
    first_date: '2022-04-23'
    primary_paper_ids:
      - p_2022_oikarinen_clip_dissect_automatic_description

  - rq_id: rq-unsupervised-feature-discovery
    family_id: representation-form
    question_en: >-
      Can interpretable representational factors be discovered from model activations without predefined concepts?
    question_zh: 不预设概念时，能否从模型激活中发现可解释的表示因素？
    introduction_en: >-
      This question asks whether recurring directions or latent factors can emerge from model activations without
      beginning with a human-defined concept vocabulary or a specific probing target. Methods such as dictionary
      learning and ICA decompose the activation distribution into candidate factors, whose meanings are then assessed
      using high-response examples, controlled input changes, and downstream tests. Readable factors do not imply a
      unique decomposition, complete coverage of the representation, or causal necessity for model behavior. Unlike
      the later SAE branch, this question concerns hypothesis-free exploratory factor discovery rather than
      specifically recovering latent features from superposition with an overcomplete sparse dictionary.
    introduction_zh: >-
      该问题关注能否不从人工概念词表或特定 probe 目标出发，而让模型激活本身揭示反复出现的表示方向或潜在因素。
      Dictionary learning、ICA 等方法通过分解激活分布得到候选因素，再根据高响应样本、受控输入变化和下游测试判断其是否具有一致语义。
      发现可读因素并不意味着分解结果唯一，也不能证明这些因素覆盖了模型的全部表示或对模型行为具有因果必要性。与后续 SAE 分支相比，
      这里关注的是无预设假说的探索性因素发现，而不是专门检验过完备稀疏字典能否从 superposition 中恢复潜在特征。
    progress_en: >-
      Yun et al. decomposed contextual representations from different BERT layers using a shared nonnegative sparse
      dictionary. High-response contexts and layerwise trajectories exposed factors associated with word-sense
      disambiguation, sentence patterns, and long-range dependencies. This showed that meaningful representational
      hypotheses can be generated without predefined linguistic probes, although the evidence was concentrated in
      selected cases from one model. ICA Lens later extracted non-Gaussian directions from three language models and
      added convergence diagnostics, random-component audits, sparse probing, and targeted perturbations. Its results
      show that many readable and functionally useful directions can be recovered cheaply without training an
      overcomplete dictionary for every layer. Data-driven factor discovery is therefore feasible, but its results
      still depend on the decomposition objective, activation corpus, factor capacity, and human interpretation
      procedure. Whether different methods recover consistent, unique, and broadly transferable factors remains
      unresolved.
    progress_zh: >-
      Yun 等人将不同 BERT 层的上下文化表示分解为同一个非负稀疏字典中的因素，并通过高响应语境和逐层变化轨迹发现词义消歧、句内模式和长距离依赖等结构。
      这表明，不预设具体语言学 probe，也能从激活中提出有意义的表示假说，但证据主要来自少量筛选案例和单一模型。ICA Lens 随后使用独立成分分析，从三个语言模型的激活中提取非高斯方向，
      并加入收敛诊断、随机成分审计、稀疏 probing 和定向扰动。结果表明，无需为每层训练过完备字典，也能低成本获得许多可读且具有一定功能效用的方向。
      目前已经证明数据驱动的因素发现是可行的，但结果仍取决于分解目标、激活语料、因素数量和人工解释过程；不同方法能否恢复一致、唯一且可推广的表示因素，仍未解决。
    first_date: '2021-03-29'
    primary_paper_ids:
      - p_2021_yun_transformer_visualization_via
      - p_2026_liu_ica_lens_interpreting

  - rq_id: rq-neuron-feature-structure
    family_id: representation-form
    question_en: >-
      Are features in large language models represented by individual neurons or neuron populations?
    question_zh: 大语言模型中的特征由单个神经元还是神经元群表示？
    introduction_en: >-
      This question asks whether native model neurons have relatively distinct, interpretable functions or whether features are distributed across neuron populations while individual neurons participate in several features. Studies compare activation sparsity, feature localization, and neuron types across layers and model scales. Sparse probes can show that a small neuron set contains readable information, but do not by themselves establish causal use. The question concerns native units rather than learned SAE latents.
    introduction_zh: >-
      该问题考察模型原生神经元是否具有相对独立、可理解的功能，还是一个特征通常分布在多个神经元中，同时单个神经元也参与多个特征。研究会比较不同层和不同规模模型中的激活稀疏性、特征定位及神经元类型。Sparse probe 能说明少量神经元包含足够的可读信号，但不能单独证明模型实际依赖这些神经元。这里研究的是模型原生单元，不包括 SAE 等方法学习出的潜在特征。
    progress_en: >-
      Sparse-probing studies find both near-monosemantic neurons and distributed or superposed representations. Shallow layers often detect tokens and n-grams, while middle layers contain cleaner contextual-category units. Larger models sometimes represent a feature with fewer neurons, but can also split it across units. Large-scale surveys additionally identify inactive, positional, and lexical-pattern neurons and coordination across layers. Native neuron organization is therefore heterogeneous, and neither a one-feature–one-neuron view nor a fully distributed account is sufficient. Much of the evidence remains observational or decodability-based.
    progress_zh: >-
      Sparse probing 研究发现，大语言模型中既存在接近单义的神经元，也存在分布式和叠加表示。较浅层常检测词元与 n-gram 模式，中间层会出现更清晰的上下文类别单元；模型增大后，部分特征由更少神经元读出，但也可能发生特征分裂。大规模神经元普查进一步发现了大量未激活、位置选择性和词汇模式神经元，并观察到不同层之间的协作。现有证据表明原生神经元的组织方式高度混合，尚不能用“一个特征对应一个神经元”或“所有特征都完全分布式”统一解释；多数结果仍以观察和解码证据为主。
    first_date: '2023-05-02'
    primary_paper_ids:
      - p_2023_gurnee_finding_neurons_in
      - p_2023_voita_neurons_in_large

  - rq_id: rq-superposition
    family_id: representation-form
    question_en: >-
      Why do models represent multiple features in superposition?
    question_zh: 模型为什么会用叠加方式表示多个特征？
    introduction_en: >-
      When the number of useful features exceeds the available representational dimensions, a model can encode
      features along non-orthogonal directions rather than assigning each feature a dedicated dimension. If the
      features rarely co-occur, the cost of occasional interference may be smaller than the benefit of representing
      additional features, making superposition advantageous. This question studies how feature sparsity, importance,
      correlation, nonlinearities, and a limited dimensional budget determine whether a feature is omitted, given a
      dedicated dimension, or made to share capacity, as well as the geometry that shared representations adopt. It
      does not establish how prevalent superposition is in real large models or address how latent features can be
      recovered from it.
    introduction_zh: >-
      当需要表示的特征多于可用维度时，模型可以不为每个特征分配独立维度，而是将多个特征编码为不同的非正交方向。
      如果这些特征很少同时出现，偶发干扰造成的损失可能小于额外表示更多特征带来的收益，叠加因而可能成为更优方案。该问题研究特征的稀疏性、重要性、相关性、
      非线性以及有限的维度预算，如何决定一个特征被舍弃、独占维度或与其他特征共享容量，以及共享时会形成什么几何结构。它不直接回答真实大型模型中叠加有多普遍，
      也不讨论如何从叠加表示中恢复潜在特征。
    progress_en: >-
      Toy Models of Superposition showed in synthetic models with known ground-truth features that sparse features
      rarely activate together, allowing a model to trade occasional interference for representing more features in a
      limited-dimensional space. Feature importance, sparsity, and correlation determine whether features are omitted,
      assigned dedicated dimensions, or placed in superposition, with sharp transitions between solutions and geometric
      arrangements such as antipodal pairs, triangles, pentagons, and tetrahedra. Polysemanticity and Capacity
      subsequently formalized the phenomenon as constrained optimization under a finite capacity budget: high-value
      features receive full capacity, low-value features are omitted, and intermediate features with diminishing returns
      share dimensions; architecture and nonlinearities also affect the size and structure of superposition blocks.
      Together, these studies provide a substantial theory of superposition and polysemanticity in toy models. It
      remains unclear whether real large models satisfy assumptions such as known independent features and transparent
      objectives, or whether the predicted capacity allocations and phase transitions can be measured directly.
    progress_zh: >-
      Toy Models of Superposition 在具有已知真值特征的合成模型中表明，稀疏特征很少同时激活，因此模型可以用少量干扰换取在有限维空间中表示更多特征。
      特征的重要性、稀疏性和相关性决定它们被舍弃、获得独立维度还是进入叠加，最优解之间还会出现清晰的相变；叠加方向则形成反向点对、三角形、五边形和四面体等几何结构。
      Polysemanticity and Capacity 随后把这一现象形式化为有限容量下的约束优化：高价值特征获得完整容量，低价值特征被忽略，具有递减容量收益的中间特征共享维度；
      架构和激活函数还会影响叠加块的大小与结构。这两项工作已经为玩具模型中的 superposition 和 polysemanticity 提供了较完整的理论解释，但真实大型模型是否满足已知、独立特征和透明损失等假设，
      以及理论预测的容量分配与相变能否被直接测量，仍未解决。
    first_date: '2022-09-21'
    primary_paper_ids:
      - p_2022_elhage_toy_models_of
      - p_2022_scherlis_polysemanticity_and_capacity

  - rq_id: rq-sparse-feature-recovery
    family_id: representation-form
    question_en: >-
      Can sparse autoencoders recover interpretable features from superposed representations?
    question_zh: 稀疏自编码器能否从叠加表示中恢复可解释特征？
    introduction_en: >-
      Sparse autoencoders represent model activations as combinations of a small number of latent features. This question asks whether those latents more closely match the representational units actually used by the model than native neurons do, while preserving enough of the original activation for precise intervention. Readability and sparsity do not imply that the recovered features are true, unique, or complete; reconstruction, identifiability, and causal function require separate evaluation.
    introduction_zh: >-
      稀疏自编码器将模型激活表示为少量潜在特征的组合。该问题考察这些潜在特征是否比原生神经元更接近模型内部实际使用的表示单位，同时能否充分重建原始激活并支持更精确的干预。可读或稀疏并不意味着所得特征是真实、唯一或完整的；重构误差、特征可识别性和因果功能需要分别检验。
    progress_en: >-
      Early work by Cunningham et al. showed that sparse autoencoders can extract latent features that are more interpretable than native neurons or principal components. In an indirect-object-identification task, feature-level patching also localized relevant factors more precisely than interventions on raw activation dimensions. This established the feasibility of recovering readable and intervenable features from superposition. Reconstruction nevertheless remains incomplete, automated descriptions can miss or overstate semantics, and overcomplete dictionaries are not equally stable at every activation site. SAEs have therefore not been shown to recover a unique or complete ground-truth feature basis.
    progress_zh: >-
      Cunningham 等人的早期研究表明，稀疏自编码器可以从语言模型激活中提取比原始神经元和主成分更容易解释的潜在特征。在间接宾语识别任务中，特征级 patching 还比直接干预原始激活维度更精确地定位了少量相关因素。这建立了从叠加表示中恢复可读、可干预特征的可行性证据。但重构仍不完整，自动解释可能遗漏或夸大语义，部分激活位置也难以稳定学习过完备字典，因此尚不能认为 SAE 已恢复模型的真实完整特征基。
    first_date: '2023-09-15'
    primary_paper_ids:
      - p_2023_cunningham_sparse_autoencoders_find

  - rq_id: rq-sparse-objective
    family_id: representation-form
    question_en: >-
      How should sparse autoencoders balance sparsity and fidelity?
    question_zh: 稀疏自编码器如何在稀疏性与保真度之间取得平衡？
    introduction_en: >-
      Sparse autoencoders should activate only a small number of features while preserving the information and computation of the original model. Fidelity may refer to activation reconstruction, preservation of downstream hidden states, or preservation of final outputs, and these objectives are not equivalent. This question studies how sparsity penalties, gates, thresholds, and end-to-end losses shape the learned dictionary. A better sparsity–reconstruction frontier does not automatically imply greater interpretability or causal value.
    introduction_zh: >-
      稀疏自编码器既要让每个输入只激活少量特征，又要尽量保留原模型的信息和计算。这里的保真度可能指激活重建、下游隐藏状态保持或最终输出保持，这些目标并不等价。该问题研究稀疏惩罚、门控、阈值和端到端损失如何改变学到的特征。更好的稀疏—重建曲线不自动意味着特征更容易理解或具有更强的因果意义。
    progress_en: >-
      Gated SAEs separate feature detection from magnitude estimation, reducing the shrinkage caused by L1 penalties and improving reconstruction at matched sparsity. End-to-end sparse dictionary learning optimizes model outputs or downstream states rather than only reconstructing one activation layer, prioritizing features that preserve more of the original computation. JumpReLU SAEs use learned thresholds to approximate direct L0 optimization and further improve the sparsity–reconstruction frontier. These studies show that part of the standard SAE trade-off is created by the objective itself, but no objective has yet proved uniformly superior for reconstruction, behavioral fidelity, causal use, and human interpretability.
    progress_zh: >-
      Gated SAE 将“特征是否出现”与“特征强度是多少”分开，减少了 L1 惩罚造成的幅度收缩，并在相同稀疏度下改善重建。端到端稀疏字典学习不再只重建单层激活，而是直接优化模型输出或后续隐藏状态，从而优先保留对原计算更重要的因素。JumpReLU SAE 则通过可学习阈值直接近似优化 L0，进一步改善稀疏—重建前沿。这些工作说明标准 SAE 的部分损失来自目标函数本身，但尚未出现同时在重建、模型行为、因果用途和人工可解释性上都占优的统一目标。
    first_date: '2024-04-24'
    primary_paper_ids:
      - p_2024_rajamanoharan_improving_dictionary_learning
      - p_2024_braun_identifying_functionally_important
      - p_2024_rajamanoharan_jumping_ahead_improving

  - rq_id: rq-sparse-feature-failure
    family_id: representation-form
    question_en: >-
      Why do sparse autoencoders learn misleading features?
    question_zh: 稀疏自编码器为什么会学到误导性的特征？
    introduction_en: >-
      Sparse autoencoders may split one concept across several latents, absorb a broad concept into more specific features, or produce duplicated, dead, or mixed features through optimization. A structural mismatch also arises when a semantic feature is multidimensional but each learned latent is forced to decode along one direction. This question asks when these failures occur, whether they arise from activation geometry or optimization, and how to determine whether an apparently readable feature should be trusted.
    introduction_zh: >-
      稀疏自编码器可能把一个概念拆成多个潜变量，也可能把一个较宽泛的概念吸收到多个更具体的特征中；优化还可能产生重复、死亡或混合特征。如果真实语义本身是多维子空间，而解码器强制每个特征只对应一个方向，也会造成结构性错配。该问题研究这些失败何时出现、来自数据几何还是优化目标，以及如何判断一个看似可读的特征是否值得信任。
    progress_en: >-
      Feature splitting and absorption can hide concepts that the underlying model causally uses even when activation reconstruction is strong. Aligning features across independent SAE runs improves recovery in some settings, although cross-run consistency is only a weak signal. A unified optimization theory further shows that polysemantic, duplicated, or dead features can be genuine global or local optima of standard sparse objectives rather than implementation mistakes. Subspace-aware SAEs show that one-direction latents systematically fragment multidimensional concepts and that grouped latents can mitigate the mismatch. A preliminary account now connects failure types, optimization, and representation geometry, but no reliable general diagnostic separates true features from stable artifacts in large models.
    progress_zh: >-
      Feature splitting 与 absorption 已被证明即使在激活重建良好时仍会遮蔽模型因果使用的概念。跨 SAE 运行进行特征对齐可以提高部分真实因素的恢复率，但一致性仍只是弱信号。统一优化理论进一步表明，多义、重复和死亡特征有时是标准稀疏目标的真实最优解或局部极小，而不只是实现错误。Subspace-aware SAE 则指出，单方向潜变量会系统性地碎片化多维概念，使用组值潜变量可以缓解这一问题。当前已经形成了失败类型、优化原因和几何错配之间的初步解释，但尚无能够在真实大模型中可靠区分真实特征与稳定伪影的统一诊断。
    first_date: '2024-09-22'
    primary_paper_ids:
      - p_2024_chanin_a_is_for
      - p_2024_marks_enhancing_neural_network
      - p_2025_tang_a_unified_theory
      - p_2026_dalili_subspace_aware_sparse

  - rq_id: rq-feature-atlas-scaling
    family_id: representation-form
    question_en: >-
      Can interpretable feature extraction scale across large models, layers, and rare concepts?
    question_zh: 可解释特征提取能否扩展到大型模型的全部层和长尾概念？
    introduction_en: >-
      This question asks whether sparse feature extraction can move from single-layer, small-model experiments to many activation sites in large models, millions of learned features, and rare concepts in the tail of the training distribution. Scaling is not only an engineering problem: dictionary width, training data, and deployment distribution affect feature splitting, coverage, and explanation quality. Releasing a large dictionary does not establish that every feature is real, monosemantic, or causally used.
    introduction_zh: >-
      该问题关注稀疏特征提取能否从单层、小模型实验扩展到大型模型的不同层位、不同激活位置和数百万级特征，同时覆盖训练数据中的稀有概念。规模扩大不仅是工程问题：字典宽度、训练数据和部署分布会影响特征分裂、覆盖率和解释质量。发布大规模字典并不等于证明其中每个特征都真实、单义或具有因果作用。
    progress_en: >-
      Gemma Scope and Llama Scope provide large SAE dictionaries across layers, activation sites, widths, and sparsity levels, establishing the engineering feasibility of model-wide feature extraction and limited transfer to related instruction models or longer contexts. Decoding Dark Matter uses targeted data retrieval and tail-oriented objectives to capture rare domain concepts more efficiently. Scaling Monosemanticity extends dictionary learning to a production-scale multimodal model and tens of millions of features, including directions that transfer across languages or modalities and can steer behavior. The central challenge has shifted from whether such dictionaries can be trained to whether their coverage is complete, features are identifiable, quality can be calibrated, and the original computation is preserved.
    progress_zh: >-
      Gemma Scope 和 Llama Scope 已经发布覆盖多层、不同子层、宽度和稀疏度的大规模 SAE 字典，证明全模型范围的特征提取在工程上可行，并显示部分字典可以迁移到相近的指令模型或更长上下文。Decoding Dark Matter 通过定向数据检索和尾部风险目标提高了稀有领域概念的覆盖效率。Scaling Monosemanticity 又把字典学习扩展到生产级多模态模型和数千万特征，并展示部分跨语言、跨模态及可引导的方向。当前瓶颈已经从“能否训练”转向“覆盖是否完整、特征是否唯一、质量如何校准以及是否保留全模型计算”；尤其是长尾特征和全模型因果闭合性仍未解决。
    first_date: '2024-08-09'
    primary_paper_ids:
      - p_2024_lieberum_gemma_scope_open
      - p_2024_he_llama_scope_extracting
      - p_2024_muhamed_decoding_dark_matter
      - p_2026_templeton_scaling_monosemanticity_extracting

  - rq_id: rq-causal-representation-geometry
    family_id: representation-form
    question_en: >-
      Do models represent semantic concepts as linear directions or subspaces?
    question_zh: 模型是否以线性方向或子空间表示语义概念？
    introduction_en: >-
      This question asks whether a semantic variable corresponds to a direction or low-dimensional subspace that can be measured by projection across inputs and manipulated by moving representations along it. Successful linear probing establishes only decodability. A stronger linear-representation claim must rule out correlated confounds and test whether the direction affects model outputs. Directions and subspaces may also be non-unique and depend on the chosen inner product and representation coordinates.
    introduction_zh: >-
      该问题研究一个语义变量是否对应表示空间中的方向或低维子空间，使不同输入中的同一概念能够通过投影被测量，并通过沿该方向移动而被改变。线性 probe 成功只能说明信息可以被线性读出；更强的线性表示主张还需要排除相关混淆，并检验该方向是否影响模型输出。方向或子空间也可能不唯一，并依赖所采用的内积和表示坐标。
    progress_en: >-
      Causal-probing work adds geometric and causal conditions to concept subspaces and shows that some linguistic variables can be selectively erased or manipulated, although success varies by concept. Sentiment studies identify an approximately shared linear direction across words and contexts and support its causal role through representation interventions and circuit ablations. Theory of linear representation later relates subspaces, probes, and intervention vectors within an appropriate causal geometry. The evidence supports linear structure for some semantic variables, but does not imply that every concept is linear, that its direction is unique, or that the same geometry persists across models.
    progress_zh: >-
      Causal probing 工作为概念子空间加入了几何与因果条件，并证明部分语言变量可以被选择性擦除或操纵，但不同概念的成功程度并不一致。情感研究发现，一条近似共享的线性方向能够跨词汇和语境表示正负情感，并通过干预和电路消融影响预测。线性表示理论随后统一了子空间、线性 probe 和表示操控等定义，说明在合适的因果几何下，词对差分可以同时构造读出方向和控制方向。现有证据支持部分语义变量具有线性结构，但不能推出所有概念都线性、方向唯一或跨模型保持稳定。
    first_date: '2023-07-27'
    primary_paper_ids:
      - p_2023_guerner_a_geometric_notion
      - p_2023_tigges_linear_representations_of
      - p_2023_park_the_linear_representation

  - rq_id: rq-prompt-geometry-monitoring
    family_id: representation-form
    question_en: >-
      Can the internal geometry of a prompt reveal model uncertainty?
    question_zh: Prompt 的内部几何能否反映模型的不确定性？
    introduction_en: >-
      This question treats the token representations produced by one prompt at a layer as a point cloud and asks whether its intrinsic dimension summarizes the complexity of token interactions. Rather than searching for one semantically defined direction, it uses global geometry as a monitoring signal for uncertainty or anomalous inputs. Predictive correlations can support screening, but do not show that high-dimensional geometry causes uncertainty.
    introduction_zh: >-
      该问题把一条 prompt 在某层产生的全部 token 表示看作一个点云，并考察其内在维度是否概括了 token 之间的复杂关系。它不同于寻找某个具有明确语义的方向，而是使用整体几何作为模型不确定性或异常输入的监测信号。几何相关性能够支持预测和筛查，但不自动说明高维结构导致了不确定性。
    progress_en: >-
      Prompt intrinsic dimension often peaks in early-to-middle layers, increases under linguistic perturbations, and correlates strongly with average surprisal. Layerwise dimension profiles can also distinguish some malicious prompts before generation. Replication across models and estimators supports intrinsic dimension as a geometric monitoring signal, but the evidence remains correlational. Reliable estimation generally requires long prompts, and malicious-prompt classification may exploit dataset artifacts, so intrinsic dimension is not yet a general uncertainty or safety guarantee.
    progress_zh: >-
      现有研究发现，prompt 的内在维度通常在模型早中层达到峰值，语言扰动会提高这一维度，逐层维度轮廓与平均 surprisal 存在较强关系，并可在生成前区分部分恶意提示。跨模型和不同内在维度估计器的结果支持它作为几何监测信号，但证据仍是相关性的。可靠估计通常需要较长 prompt，恶意提示分类也可能利用数据集差异，因此尚不能把内在维度视为通用的不确定性或安全风险指标。
    first_date: '2025-01-17'
    primary_paper_ids:
      - p_2025_viswanathan_the_intrinsic_dimension

  - rq_id: rq-world-model-representation
    family_id: representation-form
    question_en: >-
      Do sequence models form and use representations of world state?
    question_zh: 序列预测模型会形成并使用世界状态表示吗？
    introduction_en: >-
      This question asks whether models trained only to predict the next symbol construct a latent state of the process generating the sequence rather than merely memorizing surface patterns. The state may be a definite environment configuration or a belief distribution over possible hidden states under uncertainty. Strong evidence should show that the state is decodable, geometrically structured, and functionally involved in prediction.
    introduction_zh: >-
      该问题考察仅通过预测下一个符号训练的模型，是否会构建产生当前序列的潜在状态，而不只是记忆表面模式。世界状态可以是确定的环境配置，也可以是在信息不完整时对多个潜在状态的信念分布。强证据需要同时说明状态可以被读出、具有可解释的几何，并在被改变时影响模型预测。
    progress_en: >-
      OthelloGPT studies first showed that a sequence model can develop a decodable board state and that modifying the corresponding representation changes legal-move predictions. Later analysis found that this state need not be fundamentally nonlinear: a current-player-relative coordinate system reveals causally effective linear directions. Belief-state work extends the question to uncertain generative processes and shows that Transformer residual streams can reproduce the geometry of Bayesian belief updating rather than only next-symbol probabilities. Evidence is strong in controlled settings, but board games and small hidden-state processes remain far from natural language and do not establish a unified, complete world model in realistic LLMs.
    progress_zh: >-
      OthelloGPT 研究首先表明，序列模型能够形成可解码的棋盘状态，修改相关表示还会改变合法落子预测。后续重新分析发现，棋盘并非必须以非线性方式表示；采用“相对当前玩家”的坐标后，可以找到具有因果作用的线性方向。信念状态研究进一步扩展到具有隐藏状态的不确定生成过程，发现 Transformer 的残差流能够匹配贝叶斯信念更新的几何，而不只编码下一符号概率。现有证据在受控环境中较强，但棋类游戏和小型隐马尔可夫过程与自然语言相距较远，尚不能证明真实语言模型形成了统一、完整且被实际使用的世界模型。
    first_date: '2022-10-24'
    primary_paper_ids:
      - p_2022_li_emergent_world_representations
      - p_2023_nanda_emergent_linear_representations
      - p_2024_shai_transformers_represent_belief

  - rq_id: rq-hidden-state-readout
    family_id: mechanism-explanation
    question_en: >-
      How can hidden states be translated into inspectable predictions and semantic explanations?
    question_zh: 如何将隐藏状态转化为可检查的预测与语义解释？
    introduction_en: >-
      Intermediate hidden states are not directly interpretable, and projecting them through the final vocabulary head can be distorted by representation mismatch across layers. This question asks how to construct an explanatory interface that translates a hidden state into inspectable next-token predictions, future tokens, or semantic descriptions. Approaches include learning layer-specific vocabulary mappings and transplanting a hidden state into a target prompt so that the model continues the interpretation itself. The central issue is not the representational form of the hidden state, but whether the readout is faithful and whether its output comes from the original state or from additional computation introduced by the interpreter.
    introduction_zh: >-
      模型的中间隐藏状态不能被人直接理解，直接将其投影到词表还可能受到层间表示错位影响。该问题研究如何构造解释接口，把隐藏状态转化为可检查的下一词元预测、未来词元或语义描述。方法包括学习逐层的词表映射，以及把隐藏状态移植到目标提示中、让模型自身继续解释。核心问题不是隐藏状态究竟采用什么表示形式，而是这些读出方法是否忠实，以及读出的内容来自原状态还是解释器额外补充的计算。
    progress_en: >-
      Tuned Lens learns layer-specific translators that reduce the distribution mismatch caused by applying the final unembedding directly and more faithfully track intermediate predictions under perturbation. Future Lens shows that a single middle-layer state contains limited information about subsequent tokens and that reusing the pretrained model through learned prompts is more expressive than linear decoding. Patchscopes unifies vocabulary projection, probing, and activation transplantation by placing a source state into a target prompt and allowing the model to continue computing; it can expose attributes and repair selected multi-hop errors. Readout has become substantially more expressive, but remains sensitive to the target prompt, target model, and mapping, and does not guarantee that every generated detail originated in the source state.
    progress_zh: >-
      Tuned Lens 为每一层学习转换器，减少直接套用最终反嵌入产生的分布偏移，并更可靠地追踪中间预测及其对扰动的响应。Future Lens 发现，中层单个位置的隐藏状态包含有限的后续词元信息，使用可学习提示重新送入模型比线性解码更有表达力。Patchscopes 将词表投影、probe 和激活迁移统一为“把源状态移植到目标提示后让模型继续计算”，能够读出属性信息并修复少量多跳推理错误。读出能力已明显增强，但结果对目标提示、目标模型和映射设计敏感，也不能保证输出完全来自源状态。
    first_date: '2024-01-11'
    primary_paper_ids:
      - p_2024_ghandeharioun_patchscopes_a_unifying
    secondary_paper_ids:
      - p_2023_belrose_eliciting_latent_predictions
      - p_2023_pal_future_lens_anticipating

  - rq_id: rq-task-function-vectors
    family_id: representation-form
    question_en: >-
      Can models represent tasks as reusable vectors?
    question_zh: 模型能否把任务表示为可复用的向量？
    introduction_en: >-
      This question asks whether a task or function can be compressed into a vector whose addition, removal, or combination predictably changes model behavior. A task vector may be a parameter difference created by fine-tuning or a hidden-state direction produced during in-context learning. These objects live in different spaces and need not reflect the same mechanism. The central issue is whether they can be reused across inputs, composed, and shown to have predictable behavioral effects.
    introduction_zh: >-
      该问题考察一个任务或函数能否被压缩为模型空间中的向量，并通过向量的加入、删除或组合来触发相应行为。任务向量可能来自微调前后的参数差分，也可能来自模型执行上下文学习时的隐藏状态；二者位于不同空间，并不代表同一种内部机制。关键问题是这些向量能否跨输入复用、组合并对行为产生可预测影响。
    progress_en: >-
      Task Arithmetic shows that fine-tuning-induced parameter differences can sometimes suppress behavior when negated, combine tasks when added, and support limited task analogies. Function-vector work later extracts compact activation directions from causally important attention heads and shows that inserting them can trigger a task even when demonstrations are absent or misleading. Together, these lines support vector-like task representations, but parameter task vectors and activation-space function vectors have not been shown to share one mechanism. Composition remains limited by nonlinear interactions, layer choice, scaling, and task compatibility.
    progress_zh: >-
      Task Arithmetic 发现，微调产生的参数差分可以在一定范围内通过取反删除行为、通过相加组合任务，并支持部分任务类比。Function Vectors 随后在激活空间中，从具有因果重要性的注意力头提取出紧凑任务方向；把这些方向加入其他输入后，即使示例缺失或具有误导性，也能触发相应任务。两条研究线共同表明任务信息可以呈现向量化结构，但参数任务向量与激活 function vector 尚未被证明具有统一机制，组合会受到非线性交互、层位置、缩放系数和任务相容性的限制。
    first_date: '2023-10-23'
    primary_paper_ids:
      - p_2023_todd_function_vectors_in
    secondary_paper_ids:
      - p_2022_ilharco_editing_models_with

  - rq_id: rq-compositional-binding
    family_id: representation-form
    question_en: >-
      How do models bind entities to their attributes in context?
    question_zh: 模型如何在上下文中绑定实体及其属性？
    introduction_en: >-
      When a context contains several entities and attributes, a model must preserve which attributes belong to which entities and retrieve the correct pairing when queried. This question asks whether temporary relations are represented through reusable binding identifiers rather than separate circuits for every entity–attribute pair. It concerns the form of the binding representation; the upstream computation that creates the identifiers is a further mechanism question.
    introduction_zh: >-
      当上下文同时出现多个实体及其属性时，模型必须保留哪些属性属于哪个实体，并在查询时取回正确配对。该问题研究这种临时关系是否通过可复用的绑定标识表示，而不是为每一个实体—属性组合建立独立电路。它关注绑定的表示形式；绑定标识由什么上游计算产生，则是进一步的机制问题。
    progress_en: >-
      Current evidence suggests that language models attach approximately additive, position-insensitive binding identifiers to entity–attribute pairs. Paired interventions on these representations can reliably swap which attributes are retrieved for two entities, and some binding directions transfer across positions and tasks. This supports a reusable low-dimensional binding representation rather than an independent circuit for every fact. Evidence remains limited to a small set of models and controlled tasks, transfer is imperfect, and the upstream mechanism that constructs the identifiers has not been fully localized.
    progress_zh: >-
      现有研究发现，语言模型可以为上下文中的实体—属性对加入近似可加、与位置相对独立的绑定标识。对这些表示进行成对干预，可以稳定交换模型为两个实体取回的属性；部分绑定方向还能跨位置和任务迁移。结果支持一种可复用的低维绑定表示，而不是每个事实使用完全独立的电路。但证据目前集中于有限模型和受控任务，跨任务迁移并不总是成功，也尚未定位产生绑定标识的完整上游机制。
    first_date: '2023-10-26'
    primary_paper_ids:
      - p_2023_feng_how_do_language

  - rq_id: rq-component-function
    family_id: computational-mechanism
    question_en: >-
      What functions do individual attention heads, MLPs, or activation dimensions perform?
    question_zh: 单个注意力头、MLP 或激活维度承担什么功能？
    introduction_en: >-
      This question asks what information a local model component reads, what transformation it performs, and what it writes back to the residual stream or output. Assigning a function requires more than correlating a component with an input pattern: studies should examine when it activates, how it affects downstream predictions, and whether its role changes with context or collaborating components. The question concerns local computational roles rather than a complete end-to-end circuit.
    introduction_zh: >-
      该问题研究模型中的局部组件在一次计算中读取什么信息、执行什么变换，以及向残差流或输出写回什么。这里的“功能”不仅要求观察组件与某类输入相关，还要说明它在什么条件下激活、如何影响下游预测，以及其作用是否随上下文或协作组件变化。它关注局部组件的计算角色，不要求同时恢复完整的端到端行为电路。
    progress_en: >-
      Early work described Transformer FFNs as key–value memories: lower-layer keys tend to match surface patterns, upper-layer keys capture more semantic contexts, and many memories jointly determine a layer’s output. Copy Suppression later provided a more complete natural-distribution account of one attention head, showing that it reads contextual token identity and prediction confidence, suppresses over-copying, and participates in ablation-induced self-repair. Work on massive values further suggests that extreme Q/K activations support contextual-knowledge routing and are partly produced by RoPE. Transcoders and causal head gating extend the analysis through sparse substitutes and learned interventions, while also revealing multiple sufficient component sets. The field has progressed from asking what a component responds to toward what computation it performs, but component roles remain context-dependent and rarely belong uniquely to one unit.
    progress_zh: >-
      早期研究把 Transformer FFN 描述为键—值记忆：低层键多匹配表面模式，高层键更偏向语义上下文，多个记忆共同形成层输出。随后，Copy Suppression 在自然文本上对单个注意力头进行了更完整的机制分析，证明它读取上下文词元及当前预测置信度，并抑制过度复制，同时参与消融后的自修复。对 massive values 的研究又发现，Q/K 支路中的极大激活主要支持上下文知识路由，其集中形成与 RoPE 有关。Transcoder 和 causal head gating 等工作进一步表明，组件功能可以借助稀疏替代模块或学习式干预进行分析，但一个任务往往存在多个充分组件集合。研究已从“组件响应什么”推进到“组件实际执行什么计算”，不过功能仍具有上下文依赖性，也很少能唯一归因于单个组件。
    first_date: '2020-12-29'
    primary_paper_ids:
      - p_2020_geva_transformer_feed_forward
      - p_2024_mcdougall_copy_suppression_comprehensively
      - p_2025_jin_massive_values_in
    secondary_paper_ids:
      - p_2024_dunefsky_transcoders_find_interpretable
      - p_2025_nam_causal_head_gating

  - rq_id: rq-component-semantic-readout
    family_id: mechanism-explanation
    question_en: >-
      How can the information written by an attention head be translated into words?
    question_zh: 如何把注意力头写入的信息翻译成词语？
    introduction_en: >-
      The vector written by an attention head may not be directly interpretable through the model’s final vocabulary projection because different heads can use different local representational conventions. This question asks whether a head-specific vocabulary map can make retrieved or written content readable. The resulting words form a semantic interface and still require intervention evidence to show that downstream computation actually uses the decoded information.
    introduction_zh: >-
      注意力头写入残差流的向量通常不能直接通过最终词表投影解释，因为不同注意力头可能使用不同的局部表示方式。该问题研究能否为每个头学习专门的词表映射，使其检索或写入的内容变得可读。得到的词语描述只是语义接口，仍需干预证据确认该信息是否被下游计算实际使用。
    progress_en: >-
      Attention Lens learns a separate mapping from each attention-head output into vocabulary space. Compared with direct unembedding, it produces more coherent word-level descriptions and suggests specialized information-retrieval roles for some heads. Evidence is still primarily qualitative and limited to GPT-2; the training objective may simply approximate final logits, and the lens is trained on data different from the model’s original corpus. Head-level semantic readout is feasible, but causal faithfulness, cross-model transfer, and quantitative evaluation remain unestablished.
    progress_zh: >-
      Attention Lens 为每个注意力头学习从头输出到词表空间的独立映射。相较直接反嵌入，它产生更连贯的词语描述，并提示部分头具有专门化的信息检索角色。但目前证据主要来自 GPT-2 的定性案例；lens 的训练目标可能只是逼近最终 logits，训练语料也与原模型不同。该方法证明头级语义读出具有可行性，但尚未建立因果忠实度、跨模型迁移或定量解释标准。
    first_date: '2023-10-25'
    primary_paper_ids:
      - p_2023_sakarvadia_attention_lens_a

  - rq_id: rq-distributed-component-role-discovery
    family_id: mechanism-explanation
    question_en: >-
      How can facilitating, interfering, and irrelevant attention heads be distinguished for a task?
    question_zh: 如何区分任务中促进、干扰和无关的注意力头？
    introduction_en: >-
      A component’s importance cannot always be determined through isolated ablation: a head may be useful only within a particular collaborating set or may interfere with the task in the full model. This question asks how learned gating and causal intervention can identify jointly sufficient component sets and distinguish facilitating, interfering, and irrelevant roles. It does not assume that every behavior has one unique circuit.
    introduction_zh: >-
      组件的重要性不能只由单独消融决定：一个头可能只在特定协作集合中有用，也可能在完整模型中干扰任务。该问题研究如何通过学习式门控和因果干预，识别能够共同支持任务的组件集合，并区分促进、干扰和无关角色。它不假设每项行为只有一个唯一电路。
    progress_en: >-
      Causal Head Gating learns continuous head gates to find sparse task-supporting subsets without fixed prompt templates or predefined target labels. A task can have several sufficient attention-head sets, removing interfering heads can improve behavior, and instruction following only partially overlaps with in-context-learning heads. Ablation and mediation analyses support the functional relevance of these roles, but results depend on the objective and data distribution and omit interactions with MLPs. The evidence argues against fixed global head roles and a unique circuit per task, but does not yet provide a stable cross-task role taxonomy.
    progress_zh: >-
      Causal Head Gating 学习连续头门控，在不依赖固定提示模板或预设目标标签的情况下寻找稀疏任务子集。研究发现，同一任务可以存在多个充分的注意力头集合，删除干扰头还可能改善行为；指令遵循和上下文学习所依赖的头也只有部分重合。消融和中介分析支持这些角色具有功能意义，但结果依赖优化目标与数据分布，也没有覆盖 MLP 等其他组件。当前证据反对“每个头具有固定全局角色”和“任务只有唯一电路”，但尚未形成跨任务稳定的角色定义。
    first_date: '2025-01-01'
    primary_paper_ids:
      - p_2025_nam_causal_head_gating

  - rq_id: rq-knowledge-localization-routing
    family_id: computational-mechanism
    question_en: >-
      How is factual knowledge localized, retrieved, and routed to an answer?
    question_zh: 事实知识如何被定位、检索并传递到答案？
    introduction_en: >-
      This question asks how a factual association enters model computation: whether it is concentrated in particular neurons or weights, how it is retrieved from a subject and relation, and how it is routed through layers and components to the answer position. Being able to edit a fact at one location does not show that the fact is stored only there. A fuller account must distinguish storage, retrieval, routing, and answer generation.
    introduction_zh: >-
      该问题研究一条事实知识如何进入模型计算：它是否集中在少量神经元或权重中，如何从主语和关系中被取回，又如何经过不同层和组件传递到最终答案位置。“能够在某处编辑事实”不等于“事实只存储在那里”；完整解释需要区分知识存储、信息检索、跨位置路由和答案生成。
    progress_en: >-
      Knowledge Neurons first identified small sets of FFN neurons with causal effects on particular factual expressions, although neurons are shared across facts and editing succeeds only partially. ROME then used causal tracing to locate middle-layer MLPs at the final subject token and rewrote associations through rank-one updates, establishing high-leverage write locations without proving exclusive storage. Later work decomposed recall into early MLP enrichment of subject representations followed by late attention-head transport to the answer position. Knowledge Circuits incorporated embeddings, MLPs, and attention heads into end-to-end graphs, showing that factual expression depends on coordinated components. The picture has shifted from isolated “knowledge neurons” to distributed storage, retrieval, and routing, but unique knowledge locations and the ability of localization to predict editing success remain disputed.
    progress_zh: >-
      Knowledge Neurons 首先发现少量 FFN 神经元与特定事实表达存在因果联系，但同一关系会共享神经元，编辑成功率也有限。ROME 随后通过 causal tracing 定位主语末词元的中层 MLP，并以秩一更新改写事实关联，证明这些位置是高杠杆写入点，但没有证明知识只存于此处。事实回忆路径研究进一步把过程拆成两个阶段：早期 MLP 在主语位置丰富属性信息，后期注意力头将其传递到答案位置。Knowledge Circuits 又把嵌入、MLP 和注意力头纳入端到端电路，显示知识表达依赖多类组件协作。当前图景已经从“知识神经元”转向分布式的存储、检索和路由过程，但是否存在稳定唯一的知识位置，以及定位结果能否可靠预测编辑效果，仍无定论。
    first_date: '2021-04-18'
    primary_paper_ids:
      - p_2021_dai_knowledge_neurons_in
      - p_2022_meng_locating_and_editing
      - p_2023_geva_dissecting_recall_of
      - p_2024_yao_knowledge_circuits_in

  - rq_id: rq-latent-knowledge
    family_id: representation-form
    question_en: >-
      Can knowledge that a model does not express be reliably recovered from its internal representations?
    question_zh: 模型没有说出的知识，能否从内部表示中可靠读出？
    introduction_en: >-
      When a model gives an incorrect, evasive, or misleading answer, its internal representations may still contain information associated with the correct answer. This question asks how to determine whether such knowledge is present without trusting the model’s output, while separating genuine latent knowledge from correlated signals or patterns learned by a probe. Successful readout establishes accessibility; reliably eliciting the answer through intervention provides stronger functional evidence.
    introduction_zh: >-
      模型给出错误、回避或误导性答案时，内部表示中可能仍保留与正确答案有关的信息。该问题研究如何在不直接相信模型输出的情况下判断这种知识是否存在，并区分真正的潜在知识、与答案偶然相关的信号以及 probe 自身学到的模式。读出成功只说明信息可访问；干预后能够稳定引出正确答案，才提供更强的功能证据。
    progress_en: >-
      Contrast-Consistent Search uses logical consistency between positive and negative statements to recover binary answers without labels, often outperforming the model’s verbal response and revealing partially task-general truth directions. It can nevertheless select some other binary structure correlated with truth. Inference-Time Intervention then shows that accessible truth-related signals in a small number of attention heads can causally shift answers, although intervention may increase evasiveness or damage other information. MechELK combines sparse localization with causal validation to distinguish unexpressed knowledge from absent encoding. The line has progressed from unsupervised readout to mechanistic elicitation, but dataset bias, answer leakage, probe learning, and the possibility of creating rather than revealing an answer remain unresolved.
    progress_zh: >-
      Contrast-Consistent Search 利用正反陈述之间的逻辑一致性，在没有真值标签的情况下恢复比模型口头回答更可靠的二元答案，并发现部分跨任务共享的真值方向。但该方法仍可能选择与真值相关的其他二分结构。Inference-Time Intervention 随后表明，少量注意力头中可访问的真实性信号能够通过激活移动改变模型回答，为“模型知道但没有表达”提供局部因果证据，但干预可能增加回避回答或破坏其他信息。MechELK 又把稀疏定位与因果验证结合，用于区分知识未表达与根本未编码。研究已经从无监督读出推进到机制化诱导，但数据偏差、候选答案泄漏、probe 学习和“干预制造答案”的可能性仍未解决。
    first_date: '2022-12-07'
    primary_paper_ids:
      - p_2022_burns_discovering_latent_knowledge
    secondary_paper_ids:
      - p_2023_li_inference_time_intervention
      - p_2026_park_mechelk_a_mechanistic

  - rq_id: rq-causal-abstraction
    family_id: evidential-standards
    question_en: >-
      When can a neural network be faithfully explained as a high-level causal process?
    question_zh: 神经网络何时可以被忠实地解释为高层因果过程？
    introduction_en: >-
      This question requires an intervenable and falsifiable correspondence between high-level variables and low-level
      neural states. A network can be said to implement a high-level causal process only when interventions on the
      aligned neural states reproduce the counterfactual behavior predicted by that process, rather than merely
      revealing correlated information.
    introduction_zh: >-
      该问题要求高层变量与低层神经状态之间建立可干预、可证伪的对应。
      只有当替换低层状态能够复现高层因果模型预测的反事实行为时，才能说网络实现了该高层过程，而不只是包含相关信息。
    progress_en: >-
      Early work used interchange interventions to test whether BERT implements intermediate computations from a
      natural-logic program. Later theory generalized causal abstraction into a formal framework encompassing multiple
      mechanistic-interpretability claims and allowing distributed, overlapping, or nonlinear variables. The criterion
      is stronger than probe accuracy, but still requires an analyst-specified high-level model, variables, and
      intervention set. Finding and validating such correspondences in large natural models remains difficult.
    progress_zh: >-
      早期研究通过 interchange intervention 检验 BERT 是否实现了自然逻辑程序中的部分中间计算。
      后续理论把因果抽象扩展为统一多种机制解释主张的形式框架，并允许变量采用分布式、重叠或非线性表示。
      该标准比探针准确率更强，但仍需要分析者预先提出高层模型、变量和干预范围；
      在大型自然模型中搜索并验证这些对应仍然困难。
    first_date: '2021-06-06'
    primary_paper_ids:
      - p_2021_geiger_causal_abstractions_of
      - p_2023_geiger_causal_abstraction_a
    secondary_paper_ids:
      - p_2023_geiger_finding_alignments_between

  - rq_id: rq-causal-variable-alignment
    family_id: mechanism-explanation
    question_en: >-
      How can distributed neural representations be aligned with high-level causal variables?
    question_zh: 如何将分布式神经表示与高层因果变量对齐？
    introduction_en: >-
      A high-level variable may be represented across multiple neurons and overlapping subspaces, making it impossible to localize through individual units alone. This question begins with a candidate high-level causal variable and searches for a corresponding direction, subspace, or parameter set in the distributed neural representation. The alignment is then tested by asking whether counterfactual interventions through it change the model as predicted by the proposed high-level causal model. The question concerns constructing an explanatory alignment; whether the high-level variable is appropriate and what evidence makes the alignment faithful are separate evidential questions.
    introduction_zh: >-
      模型可能通过多个神经元和相互重叠的子空间表示一个高层变量，因此无法依靠单个神经元直接定位。该问题从候选高层因果变量出发，在分布式神经表示中寻找对应的方向、子空间或参数集合，并检验通过这一对应实施反事实干预时，模型是否按照候选高层因果模型的预测发生变化。它关注如何构造解释性对齐；候选高层变量是否合理，以及什么证据足以证明这种对齐忠实，属于进一步的证据标准问题。
    progress_en: >-
      Distributed Alignment Search learns rotations that expose distributed subspaces corresponding to proposed causal variables and evaluates them through held-out interchange interventions. Circuit Probing learns sparse parameter masks for candidate intermediate variables, testing whether the model computes and uses the variable rather than merely allowing a high-capacity probe to decode it. Both recover known variables in controlled tasks and extend to selected linguistic phenomena. Results nevertheless depend on analyst-specified variables, intervention locations, and sparsity assumptions, and alignments can be non-unique. Candidate causal correspondences can now be searched automatically, but the uniquely correct high-level explanation cannot.
    progress_zh: >-
      Distributed Alignment Search 通过学习旋转，在预设位置寻找与高层因果变量对应的分布式子空间，并用留出 interchange intervention 检验反事实控制。Circuit Probing 则为候选中间变量学习稀疏参数掩码，以判断模型是否真正计算并使用该变量，而不只是能被高容量 probe 解码。两类方法都能在受控任务中恢复已知变量，并扩展到部分语言现象。但结果依赖分析者提出的高层变量、干预位置和稀疏性假设，对齐也可能不唯一。当前能够自动搜索候选因果对应，尚不能自动发现唯一正确的高层解释。
    first_date: '2023-03-05'
    primary_paper_ids:
      - p_2023_geiger_finding_alignments_between
      - p_2023_lepori_uncovering_intermediate_variables

  - rq_id: rq-behavior-circuit
    family_id: computational-mechanism
    question_en: >-
      Can a specific model behavior be explained as an end-to-end computational circuit?
    question_zh: 一个具体行为能否被解释为端到端计算电路？
    introduction_en: >-
      This question attempts to decompose a specific model behavior into connected components, explaining what each component computes, how information travels along the resulting paths, and whether the circuit is sufficient and necessary for the behavior. It differs from merely ranking high-attribution components and from studying circuit-discovery algorithms. The intended result is an interventionally tested, task-level computational explanation.
    introduction_zh: >-
      该问题尝试把模型的一项具体行为分解为一组相互连接的组件，并说明每个组件执行什么操作、信息如何沿路径传递，以及该电路对行为是否充分且必要。它不同于只寻找高归因组件，也不同于研究自动发现电路的方法；核心产物是一个经干预检验的、任务级计算解释。
    progress_en: >-
      A study of indirect object identification (IOI) first provided a functionally organized end-to-end attention circuit in GPT-2 Small and explicitly tested its faithfulness, completeness, and minimality. Research on numerical comparison then connected attention-based information transport with numerical transformations in late MLPs. Studies of simple arithmetic used causal mediation to localize operand and result flows, while work on syllogistic inference found a partially reusable middle-term suppression pathway and identified interference from commonsense beliefs. Visual counting extended circuit analysis to a perception-to-number-abstraction mechanism. Work on 70B Chinchilla also localized a compact multiple-choice output mechanism, though not the complete upstream computation. These studies establish the feasibility of end-to-end explanations in small models and controlled tasks, but circuits are rarely unique, may be obscured by redundancy and self-repair, and seldom transfer unchanged across tasks or scales.
    progress_zh: >-
      针对间接宾语识别（Indirect Object Identification, IOI）的研究，首次为 GPT-2 Small 给出了功能分工明确的端到端注意力电路，并检验了该电路的保真性、完整性和最小性。随后，对数值大小比较的研究把注意力头的信息传递与晚层 MLP 的数值变换连接起来；对简单算术的研究使用因果中介分析定位操作数与结果的信息流；对三段论推理的研究发现了可在部分论式间复用的中项抑制路径，同时揭示常识知识造成的信念偏置。视觉计数研究又将电路分析扩展为“个体感知—数字抽象”机制。在 70B 参数的 Chinchilla 中，研究者也定位出了多项选择题输出阶段的紧凑机制，但尚未恢复完整的上游计算。现有工作证明，在小模型和受控任务中构建端到端电路解释是可行的；不过电路通常并不唯一，会受到冗余与自修复影响，也很少能够原样迁移到新任务或更大模型。
    first_date: '2022-11-01'
    primary_paper_ids:
      - p_2022_wang_interpretability_in_the
      - p_2023_hanna_how_does_gpt
      - p_2023_stolfo_a_mechanistic_interpretation
      - p_2025_kim_reasoning_circuits_in
      - p_2026_che_counting_circuits_mechanistic
    secondary_paper_ids:
      - p_2023_lieberum_does_circuit_analysis

  - rq_id: rq-circuit-localization
    family_id: mechanism-explanation
    question_en: >-
      Can a circuit be localized from behavioral requirements alone?
    question_zh: 只给定行为要求，能否定位实现该行为的电路？
    introduction_en: >-
      An analyst may know which counterfactual behaviors a target subcomputation should satisfy without knowing its algorithm or implementation. This question asks whether such behavioral requirements can be converted into optimization criteria that locate the relevant paths or shared components. The result is a candidate circuit satisfying the chosen requirements, not an automatically complete, minimal, or unique mechanism.
    introduction_zh: >-
      研究者有时知道目标子计算应满足哪些反事实行为，却不知道它由什么算法或组件实现。该问题研究能否把这些行为要求转化为可优化的定位条件，从模型中找出相应路径或共享组件。所得结果是满足指定要求的候选电路，不自动保证完整、最小或唯一。
    progress_en: >-
      Variable Binding Circuitry uses functional desiderata such as preserving a bound variable and reusing it across operations to locate a shared numerical-copying circuit without specifying the full algorithm in advance, then validates it on unseen operations. Related path-patching work formalizes localization claims through a computation graph, input distribution, counterfactual, retained paths, and error metric, allowing failures to refine a candidate explanation. Behavioral constraints can therefore guide path-level localization, but the result depends on the chosen desiderata, patching distribution, and sparsity penalty and cannot rule out equivalent alternative circuits.
    progress_zh: >-
      Variable Binding Circuitry 使用“保持被绑定变量”“跨不同运算复用”等功能要求，在无需预先给出完整算法的情况下定位出共享数值复制电路，并在未见运算上进行干预验证。Path Patching 的相关工作则把局部化主张形式化为计算图、输入分布、反事实、保留路径和误差指标的组合，使解释失败的位置能够被用于修正候选机制。现有方法证明行为约束可以指导路径级定位，但结果依赖要求、修补分布和稀疏惩罚，也无法排除其他等效电路。
    first_date: '2023-07-07'
    primary_paper_ids:
      - p_2023_davies_discovering_variable_binding
    secondary_paper_ids:
      - p_2023_goldowsky_dill_localizing_model_behavior

  - rq_id: rq-localization-claim-validity
    family_id: evidential-standards
    question_en: >-
      How can claims that behavior is localized to specific computational paths be tested?
    question_zh: 如何检验行为是否真的局部化在特定计算路径中？
    introduction_en: >-
      Localization should amount to more than a ranking of important components. A testable localization claim must
      specify the computational graph, input and counterfactual distributions, retained or replaced paths, behavioral
      metric, and examples on which the claim fails.
    introduction_zh: >-
      定位不应只是输出一份组件重要性排名。一个可检验的定位主张必须明确计算图、输入与反事实分布、
      被保留或替换的路径、目标行为指标，以及在什么样本上主张不成立。
    progress_en: >-
      Generalized path patching turns the claim that a behavior is localized to particular paths into a quantitative,
      falsifiable hypothesis and uses residual error to identify omitted paths and revise the mechanism. This advances
      localization from one-shot attribution to iterative testing. Results nevertheless remain sensitive to input
      distributions, counterfactual construction, and metrics, linking the problem closely to broader intervention
      reliability.
    progress_zh: >-
      广义路径修补把“行为位于某些路径中”写成定量、可证伪的假说，并利用未被解释的剩余误差寻找遗漏路径和修正机制。
      它把路径定位从一次性归因推进为迭代检验过程。不过结果仍会随输入分布、反事实构造和指标变化，
      因此与更一般的干预可靠性问题密切相关。
    first_date: '2023-04-12'
    primary_paper_ids:
      - p_2023_goldowsky_dill_localizing_model_behavior

  - rq_id: rq-automated-circuit-discovery
    family_id: mechanism-explanation
    question_en: >-
      How can candidate circuits explaining model behavior be extracted automatically?
    question_zh: 如何自动提取解释模型行为的候选电路？
    introduction_en: >-
      Manual component-by-component patching does not scale to large computation graphs. This question asks how nodes, edges, or paths relevant to a target behavior can be selected automatically while reducing the number of model evaluations. Speed is not sufficient: the resulting subgraph should preserve the behavior, recover known mechanisms where available, and remain reasonably stable to counterfactual construction and thresholds. The resulting circuit is still a candidate explanation whose completeness, uniqueness, and causal faithfulness require separate validation.
    introduction_zh: >-
      人工逐组件修补难以扩展到大型计算图。该问题研究如何自动筛选与目标行为相关的节点、边和路径，构造可供分析者检查的候选电路解释。自动方法不仅要减少模型运行次数，还要检验所得子图能否保留原行为、恢复已知机制，并对反事实构造和筛选阈值保持稳定。所得电路仍是候选解释；它是否完整、唯一和因果忠实，需要进一步验证。
    progress_en: >-
      ACDC recursively removes unimportant edges through causal patching and recovers much of several known small circuits, but its cost and output depend on the corrupted distribution and metric. Edge Attribution Patching later uses a single gradient calculation to rank all edges, greatly improving speed and motivating a coarse-to-fine workflow. Information Flow Routes removes the need for fixed contrastive templates and produces attribution paths for arbitrary next-token predictions, while contextual decomposition enables second-scale node selection through algebraic decomposition. Automation has progressed from repeated intervention to gradient and analytic approximations, but these scores usually produce candidate graphs rather than proving joint sufficiency or recovering a unique true circuit.
    progress_zh: >-
      ACDC 使用递归因果修补删除不重要边，能够恢复多个已知小型电路的大部分结构，但成本和结果都依赖损坏分布与指标。Edge Attribution Patching 随后用一次梯度近似同时排序全部边，大幅提高速度，并提出“快速筛选后再精细修补”的流程。Information Flow Routes 进一步摆脱固定对比模板，为任意下一词元预测生成归因路径；基于 contextual decomposition 的方法则以代数分解实现秒级节点筛选。自动发现已经从反复干预推进到梯度和解析近似，但这些分数通常只提供候选图，不证明联合保留后的充分性，也不能保证恢复唯一真实电路。
    first_date: '2023-04-28'
    primary_paper_ids:
      - p_2023_conmy_towards_automated_circuit
      - p_2023_syed_attribution_patching_outperforms
      - p_2024_ferrando_information_flow_routes
      - p_2024_hsu_efficient_automated_circuit

  - rq_id: rq-circuit-scaling
    family_id: generality-transfer
    question_en: >-
      Can manual mechanistic analysis scale to frontier-size models while preserving semantics across the input distribution?
    question_zh: 人工机制分析能否扩展到前沿规模模型并保持跨分布语义？
    introduction_en: >-
      This question asks whether important components found in a large model can receive functional explanations that hold across inputs rather than remaining local localization results.
    introduction_zh: >-
      该问题检验在大模型中找到若干重要组件之后，是否还能给出跨输入成立的功能解释，而不是停留在局部定位结果。
    progress_en: >-
      A study of multiple-choice capabilities in Chinchilla showed that manual analysis can identify components and paths with semantics shared across examples in larger models, providing early evidence for scale.
      Evidence remains concentrated in one capability family and a limited model set, so routine full-circuit analysis at frontier scale has not been demonstrated.
    progress_zh: >-
      Chinchilla 多选能力研究表明，人工机制分析可以在更大模型上发现具有跨样本语义的组件和路径，为规模化提供了早期实证。
      当前证据仍集中于单类能力和有限模型，尚未证明完整电路分析能够常规扩展到前沿模型。
    first_date: '2023-07-18'
    primary_paper_ids:
      - p_2023_lieberum_does_circuit_analysis

  - rq_id: rq-sparse-feature-circuits
    family_id: mechanism-explanation
    question_en: >-
      Can interpretable model circuits be built from sparse features?
    question_zh: 能否用稀疏特征构建可解释的模型电路？
    introduction_en: >-
      When attention heads, MLPs, or neurons serve as circuit nodes, one node may participate in several functions, making circuits difficult to label and scale. This question asks whether SAE or transcoder features can replace native components to produce finer and more semantically legible causal graphs. Readability does not guarantee preservation of the original computation because the graph nodes themselves come from an approximate decomposition.
    introduction_zh: >-
      以注意力头、MLP 或神经元为电路节点时，一个节点可能同时参与多种功能，导致电路难以命名和扩展。该问题研究能否用 SAE 特征或 transcoder 特征替代原生组件，构建粒度更细、语义更清楚的因果图。特征图的可读性不自动保证其保留原模型计算，因为节点本身来自近似分解。
    progress_en: >-
      Work on Othello-GPT first combines dictionary features with algebraic attribution to recover state variables and information flow without patching every edge. Sparse Feature Circuits then constructs feature-level causal graphs in language tasks and uses feature semantics to guide removal of spurious classification signals. Another approach uses discrete SAE codes to identify task-relevant attention heads and head pairs efficiently, while transcoders directly approximate MLP input–output mappings so feature connections through nonlinear sublayers become traceable. Feature-level circuits improve readability and scale but inherit SAE reconstruction error, dead features, threshold sensitivity, and uninterpretable error nodes. They are promising explanatory units, but have not been shown to dominate native-component circuits generally.
    progress_zh: >-
      Othello-GPT 研究首先将字典特征与代数归因结合，在不逐边修补的情况下恢复状态变量及其信息流。Sparse Feature Circuits 随后在语言任务中构建特征级因果图，并利用特征语义指导虚假分类信号的定向移除。另一项工作使用离散 SAE 编码快速识别任务相关注意力头和头对；Transcoder 则直接近似 MLP 输入—输出映射，使穿过非线性子层的特征连接可追踪。特征级电路提高了可读性和规模，但仍受 SAE 重建误差、死亡特征、阈值和不可解释误差节点影响。它们是更有希望的解释图单位，尚未被证明普遍优于原生组件电路。
    first_date: '2024-02-19'
    primary_paper_ids:
      - p_2024_he_dictionary_learning_improves
      - p_2024_marks_sparse_feature_circuits
      - p_2024_o_neill_sparse_autoencoders_enable
      - p_2024_dunefsky_transcoders_find_interpretable

  - rq_id: rq-crossmodal-alignment
    family_id: representation-form
    question_en: >-
      Where do separately trained vision and language models form shared semantic representations?
    question_zh: 分开训练的视觉和语言模型在哪里形成共享语义？
    introduction_en: >-
      When a separately trained vision encoder is connected to a language model through a simple adapter, visual information may already be translated into linguistic form by the adapter or may only become language-usable inside the language model. This question asks where cross-modal semantics converge, which internal units carry them, and whether those units affect multimodal output. It is narrower than tracing the complete multimodal information flow or generation circuit.
    introduction_zh: >-
      当独立训练的视觉编码器通过简单适配器连接到语言模型时，视觉信息可能已经在适配器中被翻译成语言，也可能进入语言模型后才被转换为可用于生成的语义表示。该问题研究跨模态语义在哪里汇合、由什么内部单元承载，以及这些单元是否真正影响跨模态输出。它不同于追踪完整的多模态信息流或解释整个生成电路。
    progress_en: >-
      In LiMBeR-BEIT, the linear adapter output does not by itself fully expose image semantics; a substantial part of visual-to-language translation occurs in intermediate MLP layers of the frozen GPT-J model. The study identifies multimodal neurons that respond to image regions and corresponding language concepts, with cross-dataset activation, vocabulary projections, spatial selectivity, and targeted ablations supporting their role in image description. Separately trained modalities can therefore converge on shared semantic units inside the language model. Evidence currently comes mainly from one model combination, and gradient attribution or large ablations do not isolate every neuron’s contribution or establish cross-architecture stability.
    progress_zh: >-
      在 LiMBeR-BEIT 中，线性适配器的输出不能直接充分解释图像语义；较大一部分视觉—语言转换发生在冻结 GPT-J 的中间 MLP 层。研究识别出同时响应图像区域和对应语言概念的多模态神经元，并通过跨数据集激活、词表投影、空间选择性和定向消融说明这些单元会影响图像描述。这表明分开训练的模态可以在语言模型内部形成共享语义单元。不过证据目前主要来自一种模型组合，梯度归因和大规模消融也不能确定每个神经元的独立作用，跨架构稳定性仍不清楚。
    first_date: '2023-08-03'
    primary_paper_ids:
      - p_2023_schwettmann_multimodal_neurons_in

  - rq_id: rq-multimodal-information-flow
    family_id: computational-mechanism
    question_en: >-
      How does visual information flow through a vision-language model to its textual output?
    question_zh: 视觉信息如何在视觉语言模型中流向文本输出？
    introduction_en: >-
      This question traces how visual evidence is encoded after entering a vision-language model, converted into a form usable by the language model, and transported to the textual positions that generate an answer. It distinguishes where information can be detected from which components actually use it, and seeks a continuous path linking image patches, visual tokens, intermediate MLPs, attention heads, and answer positions.
    introduction_zh: >-
      该问题追踪图像进入模型后，视觉证据如何被编码、转换为语言可用的表示，并传递到生成答案的文本位置。研究需要区分信息“出现在哪里”和“通过哪些组件被实际使用”，并把图像块、视觉词元、中间 MLP、注意力头和答案位置连接成连续的信息流。
    progress_en: >-
      BLIP causal tracing first extended state patching to visual question answering and found that late encoder and decoder layers were especially important for answer recovery, although single-state restoration did not reveal a complete path. Multimodal Neurons then showed that part of visual-to-language translation occurs inside intermediate MLPs of a frozen language model rather than entirely in the linear adapter. Later work found that object information begins in spatially corresponding image patches, becomes progressively more vocabulary-aligned, and flows to the answer position in middle-to-late layers. Attention-head analysis further identified distributed sets of image-to-text routing heads whose identities depend more on image semantics than visual style. Major pathways can now be described in adapter-based models, but evidence remains dominated by simple recognition tasks and does not yet unify different vision encoders, projectors, and language backbones.
    progress_zh: >-
      BLIP causal tracing 首先把状态修补扩展到视觉问答，发现编码器和解码器晚层对答案恢复最重要，但单状态修补尚不能给出完整路径。Multimodal Neurons 随后表明，部分视觉—语言转换发生在冻结语言模型的中间 MLP 中，而不是全部由线性适配器完成。之后的研究发现，物体信息首先局限于对应图像块，随后逐层形成更接近语言词表的表示，并在中后层流向答案位置。注意力头层面的研究进一步识别了负责 image-to-text 路由的分布式头集合，并发现头的选择更多取决于图像语义而非视觉风格。当前已能描绘适配器式模型中的主要信息路径，但简单物体识别仍占多数，不同视觉编码器、投影器和语言骨干之间尚无统一机制。
    first_date: '2024-10-09'
    primary_paper_ids:
      - p_2024_neo_towards_interpreting_visual
      - p_2025_kim_interpreting_attention_heads
    secondary_paper_ids:
      - p_2023_palit_towards_vision_language
      - p_2023_schwettmann_multimodal_neurons_in

  - rq_id: rq-multimodal-causal-tracing
    family_id: mechanism-explanation
    question_en: >-
      How can answer-relevant internal states be traced in vision-language models?
    question_zh: 如何在视觉语言模型中追踪影响答案的内部状态？
    introduction_en: >-
      Vision-language models combine a visual encoder, cross-modal interface, and language generator, so corruption-and-restoration procedures from text-only models cannot be transferred directly. This question asks how image, question, and fused states can be intervened on separately and how restoring one state changes the answer probability. It concerns constructing a cross-modal causal-tracing explanation; the complete route followed by visual information is a computational-mechanism question.
    introduction_zh: >-
      视觉语言模型包含视觉编码器、跨模态连接模块和语言生成器，纯文本模型中的污染—恢复实验不能直接套用。该问题研究如何分别干预图像、问题和融合状态，并测量恢复某个状态对答案概率的影响。它关注如何构造跨模态因果追踪解释；视觉信息实际沿什么完整路径流动，则属于计算机制问题。
    progress_en: >-
      A BLIP-specific method extends causal tracing to visual question answering by corrupting image or question representations and restoring individual states, finding the strongest answer recovery in encoder layer 11 and decoder layers 9–11. This establishes that cross-modal states can be studied through a common mediation procedure, but the experiment covers only a small set of color questions, restores one state at a time, and may favor late layers because of downstream overwrite effects. Later visual-information-flow work adds patch localization, logit-lens analysis, targeted ablation, and attention blocking to form richer pathway hypotheses. A multimodal causal-tracing tool now exists, but it does not independently recover a complete or unique mechanism.
    progress_zh: >-
      针对 BLIP 的方法把 causal tracing 扩展到视觉问答，通过污染图像或问题表示并逐状态恢复，发现编码器第 11 层和解码器第 9—11 层具有最高答案恢复效果。该结果证明跨模态状态可以接受统一的中介分析，但目前只覆盖少量颜色问题，每次恢复单个状态，晚层占优也可能来自下游覆盖效应。后续视觉信息流研究加入图像块定位、logit lens、定向消融和注意力阻断，提供了更完整的路径假说。因果追踪工具已经建立，但尚不能单独恢复完整或唯一的多模态机制。
    first_date: '2023-08-27'
    primary_paper_ids:
      - p_2023_palit_towards_vision_language
    secondary_paper_ids:
      - p_2024_neo_towards_interpreting_visual

  - rq_id: rq-modality-specific-mechanisms
    family_id: computational-mechanism
    question_en: >-
      Do models use the same mechanism for equivalent tasks in text and images?
    question_zh: 模型对等价的文本任务和图像任务会使用相同机制吗？
    introduction_en: >-
      This question compares whether a vision-language model uses the same internal circuits and computational stages for semantically equivalent tasks presented as text or images. The two modalities may implement similar high-level operations through different components because their representations become available at different depths or follow different routes. The focus is cross-modal mechanism correspondence rather than visual information flow in general.
    introduction_zh: >-
      该问题比较视觉语言模型处理内容等价、输入模态不同的任务时，是否调用相同的内部电路和计算步骤。两个模态可以执行相似的高层操作，却因为表示形成时间、路由方式或可用计算深度不同而使用不同组件。这里关注的是跨模态机制对应关系，而不是一般性的视觉信息流。
    progress_en: >-
      The main study on matched textual and visual counting tasks finds largely different circuits across modalities, even though their components perform related functions. Visual representations become text-like only at relatively late layers, leaving insufficient downstream depth for the shared decoder; patching those late visual states into earlier layers improves predictions. This suggests that cross-modal performance gaps can arise from representational timing rather than the absence of high-level operations. Evidence is currently limited to a narrow task family and a small set of models, and backward patching creates unnatural activation trajectories. Sparse Visual Thought Circuits further suggests that even functionally related sparse features across modalities do not necessarily combine into one modular mechanism.
    progress_zh: >-
      目前的核心研究在匹配的文本计数和视觉计数任务上发现，两种模态主要使用不同电路，但相关组件承担相似功能。视觉信息在网络中较晚才形成接近文本表示的状态，导致下游共享解码器缺少足够计算深度；把较晚视觉表示回补到较早层可以改善预测。这说明跨模态性能差距未必来自缺少高层推理操作，也可能来自表示到达时间不同。不过证据目前主要来自一个任务族和有限模型，回修补还会制造非自然激活轨迹，因此尚不能推广为所有跨模态差距的统一解释。Sparse Visual Thought Circuits 进一步显示，即使不同模态中能找到功能相关的稀疏特征，它们也未必可以直接组合成统一模块。
    first_date: '2025-06-10'
    primary_paper_ids:
      - p_2025_nikankin_same_task_different
    secondary_paper_ids:
      - p_2026_zhou_sparse_visual_thought

  - rq_id: rq-sparse-feature-composability
    family_id: representation-form
    question_en: >-
      Can sparse features be composed like independent modules?
    question_zh: 稀疏特征能否像独立模块一样组合？
    introduction_en: >-
      A sparse feature may correspond to a readable concept and affect behavior when ablated or steered, yet still fail to combine cleanly with other features. This question asks whether individually effective features retain their function under union or joint steering, and how non-orthogonality, normalization, distributed dependencies, and off-manifold shifts disrupt composition. It separates causal effectiveness from modular composability.
    introduction_zh: >-
      一个稀疏特征可以单独对应清晰概念，并在消融或 steering 时影响行为，但这不意味着多个特征可以直接相加或取并集。该问题研究单个有效特征在联合使用时是否仍保持功能，以及非正交方向、幅度归一化、分布式依赖和 off-manifold 偏移如何破坏组合。它把“特征具有因果作用”与“特征是模块化组件”区分开来。
    progress_en: >-
      Sparse Visual Thought Circuits identifies SAE features in vision–language models that are spatially grounded, task-selective, and locally causal. Yet combining individually effective features can reduce performance: directions cancel semantic signal, normalization amplifies residual noise, and joint intervention can move the representation off manifold. This directly challenges the assumption that individually useful features naturally form a circuit through set union. Evidence is limited to selected models, layers, and feature-selection rules, so it does not show that all SAE features are non-composable, but it establishes that modularity requires independent testing.
    progress_zh: >-
      Sparse Visual Thought Circuits 在视觉语言模型中发现了具有空间落地、任务选择性和局部因果作用的 SAE 特征。但把多个单独有效的特征合并后，性能可能下降：方向之间会抵消语义信号，归一化会放大残余噪声，联合干预还可能把表示推离模型熟悉的流形。这直接反驳了“单个有效特征可以通过集合并集自然组成电路”的简单假设。当前证据来自有限模型、层位和特征筛选规则，因此不能推出所有 SAE 特征都不可组合，但已经说明模块性必须单独验证。
    first_date: '2026-03-26'
    primary_paper_ids:
      - p_2026_zhou_sparse_visual_thought

  - rq_id: rq-multimodal-failure-mechanisms
    family_id: computational-mechanism
    question_en: >-
      What internal mechanisms cause object hallucinations in vision-language models?
    question_zh: 视觉语言模型为什么会产生物体幻觉？
    introduction_en: >-
      This question traces object hallucinations from output errors back to internal causal mechanisms: how grounded visual evidence competes with language priors, which pathways promote nonexistent objects, and whether particular visual representations install or amplify those pathways. The goal is not merely to predict hallucination but to alter it through targeted intervention and test whether the mechanism recurs across examples and architectures.
    introduction_zh: >-
      该问题试图把物体幻觉从输出错误追溯到内部因果机制：真实视觉证据与语言先验如何竞争，哪些路径会推动不存在的物体进入输出，以及特定视觉编码方式是否会安装或放大这些路径。目标不仅是预测幻觉，还要通过定向干预改变错误，并检验机制能否跨样本和架构复现。
    progress_en: >-
      Dual-Pathway Circuits explains object hallucination as competition between a visually grounded pathway and hallucination-promoting pathways. Grounding components can reverse polarity on incorrect examples, while hallucination signals are distributed across several directions; selectively suppressing the latter reduces some errors. Where Hallucinations Live further identifies a recurring early-layer hallucination circuit in VQ-tokenized models and uses constructive experiments to show that VQ modules can couple existing backbone pathways into this mechanism. Targeted ablation outperforms generic logit correction in some open-generation settings. Current evidence supports both competing-pathway and architecture-installed bottleneck accounts, but remains limited to object hallucination and selected VQ architectures.
    progress_zh: >-
      Dual-Pathway Circuits 把物体幻觉解释为视觉落地路径与促幻觉路径的竞争。落地组件在错误样本上可能发生极性翻转，而幻觉信号分布在多个方向；选择性抑制促幻觉路径可以降低部分错误。Where Hallucinations Live 进一步在 VQ-tokenized 模型中发现跨架构复现的早层幻觉电路，并通过构造实验表明 VQ 模块能够耦合骨干已有路径、形成该机制。定向消融在部分开放生成场景中优于通用 logit 修正。现有证据支持“竞争路径”和“架构安装的瓶颈电路”两类机制，但范围仍限于物体幻觉和部分 VQ 架构，不能代表所有多模态错误。
    first_date: '2026-05-13'
    primary_paper_ids:
      - p_2026_liu_dual_pathway_circuits
      - p_2026_hegde_where_hallucinations_live

  - rq_id: rq-multilingual-mechanisms
    family_id: computational-mechanism
    question_en: >-
      How do models decide which language to answer in?
    question_zh: 模型如何决定用哪种语言作答？
    introduction_en: >-
      This question asks how output-language choice is formed and propagated inside a model: which units represent language identity, which attention heads aggregate and broadcast the decision before the first generated token, and why nonlinguistic inputs such as images can bias the model toward one language. It is distinct from explaining full multilingual competence or cross-lingual knowledge transfer.
    introduction_zh: >-
      该问题研究输出语言的选择如何在模型内部形成并传播，包括语言身份由哪些单元表示、首个生成词元之前哪些注意力头负责汇总和广播，以及图像等非语言输入为什么会使模型偏向某种语言。它不等同于研究完整的多语言能力或跨语言知识迁移。
    progress_en: >-
      Language-Specific Neurons identifies a small set of FFN units selective for language identity; intervening on them changes perplexity and output language without showing that they carry full linguistic competence. Work on LLaVA then finds that adding an image can shift non-English answers toward English, mainly because the language backbone interprets out-of-distribution visual embeddings rather than because the projector directly maps images near English tokens. FTB Graph advances the question to first-token decision circuits and identifies deep attention heads that act as language-choice broadcasters. However, precise patching overturns some gradient-attribution results, and component necessity differs across models. The line has progressed from selective units to generation-level broadcast mechanisms, but no stable cross-architecture circuit has been established.
    progress_zh: >-
      Language-Specific Neurons 发现少量 FFN 单元对语言身份具有较强选择性，干预这些单元可以改变困惑度和输出语言，但不能证明它们承载完整语言能力。LLaVA 研究进一步发现，加入图像会让非英语回答偏向英语，主要原因不是投影器把图像直接映射到英语词元，而是语言骨干如何解释分布外视觉嵌入。FTB Graph 随后把研究推进到首词元决策电路，发现深层注意力头充当语言选择的广播枢纽，但精确修补会推翻部分梯度归因结果，而且不同模型中的必要性并不一致。当前已从语言选择性单元推进到生成级广播机制，但尚未得到跨架构稳定的完整电路。
    first_date: '2024-07-02'
    primary_paper_ids:
      - p_2024_hinck_why_do_llava
      - p_2026_pillai_ftb_graph_determining
    secondary_paper_ids:
      - p_2024_tang_language_specific_neurons

  - rq_id: rq-safety-mechanisms
    family_id: computational-mechanism
    question_en: >-
      What internal mechanisms produce refusal behavior?
    question_zh: 模型的拒答行为由哪些内部机制产生？
    introduction_en: >-
      This question asks how a safety-aligned model detects harmful requests and enters a refusal state, and whether the behavior is mediated by a low-dimensional direction, a small set of attention heads, or a more distributed computation. The ability to disable refusal through one direction establishes a high-leverage control variable, but does not imply that the complete safety judgment is one-dimensional.
    introduction_zh: >-
      该问题研究安全对齐模型如何识别有害请求并进入拒答状态，以及这种行为主要由低维表示方向、少量注意力头还是更分布式的计算共同实现。能够通过一个方向关闭拒答，只能证明它是高杠杆控制变量，不一定意味着完整的安全判断过程也是一维的。
    progress_en: >-
      Refusal in Language Models shows that refusal in several open-weight chat models can be strongly controlled through a single linear direction: removing it disables much refusal, while adding it induces refusal. Attention-head studies further find a small number of components with disproportionate effects, acting more like harmful-content detectors than complete refusal generators. The Geometry of Refusal suggests that different architectures share manipulable linear refusal axes but integrate the decision at different depths: late-layer safety wrappers are easier to bypass, whereas earlier integration is more robust. The evidence supports a low-dimensional control interface for refusal, but the underlying safety judgment may remain distributed, and refusal is not equivalent to actual safety or general capability.
    progress_zh: >-
      Refusal in Language Models 发现，多种开放权重聊天模型的拒答可由单一线性方向强力控制：移除该方向可关闭拒答，加入它可诱发拒答。注意力头研究进一步发现少量组件对拒答具有不成比例的影响，其作用更接近危险特征提取，而不是独立生成完整拒答。Geometry of Refusal 又表明，不同架构都可能存在可操控的线性拒答轴，但该决策进入模型计算的深度不同：晚层包装更容易绕过，早层整合相对稳健。现有证据表明拒答具有低维控制界面，但安全判断本身仍可能是分布式的；拒答、真实安全性和一般模型能力也不能等同。
    first_date: '2024-06-17'
    primary_paper_ids:
      - p_2024_arditi_refusal_in_language
      - p_2024_zhou_on_the_role
      - p_2026_ratnakar_the_geometry_of

  - rq_id: rq-backdoor-mechanism
    family_id: computational-mechanism
    question_en: >-
      How do trigger tokens activate backdoor behavior inside a model?
    question_zh: 触发词如何在模型内部激活后门行为？
    introduction_en: >-
      This question asks how a backdoor trigger is represented and propagated through a model, how it overrides normal behavior to produce an attacker-chosen output, and whether the responsible mechanism can be localized, edited, or blocked during training. It concerns deliberately implanted conditional behavior and should be kept separate from normally learned safety-refusal mechanisms.
    introduction_zh: >-
      该问题研究后门触发信号进入模型后经过哪些内部位置和表示，如何压倒正常行为并产生攻击者指定的输出，以及这些机制能否被定位、编辑或在训练阶段阻断。它研究的是人为植入的条件行为，不应与模型正常学习到的安全拒答机制合并。
    progress_en: >-
      Existing work finds that a simple toxic backdoor relies heavily on the trigger embedding and early MLPs, with a low-rank activation subspace sufficient to reproduce or continuously modulate much of the behavior. Ablation, representation projection, activation replacement, and training-time freezing provide convergent causal evidence, with partial replication in GPT-2 Medium. The study covers only one relatively simple poisoning scheme, low-rank editing can damage general language modeling, and causal-patching results are not fully consistent. Current evidence therefore shows that some backdoors form localized, low-rank control mechanisms, but does not yet generalize to more covert or sophisticated attacks.
    progress_zh: >-
      现有研究发现，简单有毒后门主要依赖触发词嵌入和早期 MLP，其激活中的低秩子空间足以重现或连续调节大部分后门行为。消融、表示投影、激活替换和训练阶段冻结形成了相互印证的因果证据，并在 GPT-2 Medium 上得到部分复现。但研究仅覆盖一种较简单的投毒方式，低秩编辑有时会损害一般语言建模能力，因果修补结果也不完全一致。因此目前只能说明部分后门可以形成局部、低秩的控制机制，尚不能推广到更隐蔽或更复杂的攻击。
    first_date: '2023-02-24'
    primary_paper_ids:
      - p_2023_lamparth_analyzing_and_editing

  - rq_id: rq-knowledge-conflict
    family_id: computational-mechanism
    question_en: >-
      How do models arbitrate between parametric and contextual knowledge?
    question_zh: 参数知识与上下文冲突时，模型如何决定相信哪一个？
    introduction_en: >-
      This question asks how internally memorized facts and conflicting information in the current prompt are retrieved, routed, and made to compete at the answer position. A useful model must resist misleading context while accepting correct updates when its parametric knowledge is outdated, so neither always trusting memory nor always trusting context constitutes a complete mechanism.
    introduction_zh: >-
      该问题研究模型内部记忆的事实与当前提示提供的信息不一致时，两类信息如何被检索、路由并在答案位置竞争。模型既需要抵抗错误上下文，也需要在内部知识过时后接受正确的新信息，因此“总是相信参数”或“总是相信上下文”都不是完整机制。
    progress_en: >-
      Cutting Off the Head Ends the Conflict finds that late attention heads with different source preferences deliver parametric and contextual attributes to the answer position, where they compete; selectively suppressing one group changes which source controls the answer. Taming Knowledge Conflicts later shows that these are not cleanly separated “memory heads” and “context heads”: both signals are often superposed within the same components, making one-pass head scaling unstable. Its calibrated two-run method improves both resistance to misleading context and acceptance of correct updates across several models. The account has therefore shifted from competition between separate pathways toward dynamic arbitration over overlapping representations, but upstream retrieval, multi-step conflicts, and open-ended generation remain unexplained.
    progress_zh: >-
      Cutting Off the Head Ends the Conflict 发现，参数属性和上下文属性由不同偏好的晚层注意力头送往答案位置，并在此发生竞争；选择性抑制一组头可以改变模型偏向的知识来源。Taming Knowledge Conflicts 随后指出，这些头并不是互斥的“记忆头”和“上下文头”，两种信息往往在同一组件中叠加，因此单次头缩放容易产生不稳定副作用。其双运行方法分别提取两种预测并进行校准，在多个模型上同时改善抵抗错误上下文和接受正确上下文的能力。研究已经从“两条独立路线竞争”推进到“重叠表示中的动态裁决”，但仍未解释上游检索、多步冲突和开放式生成中的完整机制。
    first_date: '2024-02-28'
    primary_paper_ids:
      - p_2024_jin_cutting_off_the
      - p_2025_li_taming_knowledge_conflicts

  - rq_id: rq-layerwise-prediction-dynamics
    family_id: temporal-development
    question_en: >-
      How do model predictions form and change across layers?
    question_zh: 模型的预测如何在层间逐步形成和修正？
    introduction_en: >-
      This question treats each hidden state as an intermediate stage in the formation of the final prediction. It asks
      when candidate answers appear, strengthen, or are replaced. Because intermediate states are not distributed like
      the final-layer representation, reliable analysis must correct this mismatch and distinguish a decoded trajectory
      from the model's native computation.
    introduction_zh: >-
      该问题把每层隐藏状态看作最终预测形成过程中的一个中间状态，研究候选答案何时出现、如何增强或被替换。
      由于中间层表示与最终输出层并不处于同一坐标分布，可靠的分析需要校正这种层间偏差，并区分解码器展示的轨迹与模型真实计算过程。
    progress_en: >-
      Tuned Lens learns layer-specific translators into the final output space and produces smoother, more accurate
      prediction trajectories than the Logit Lens across GPT-2, OPT, Pythia, BLOOM, and LLaMA-family models.
      Perturbation experiments also show better alignment with actual output changes. It nevertheless remains a
      separately trained probe with approximation error and does not establish that token distributions are the model's
      native intermediate representation.
    progress_zh: >-
      Tuned Lens 为各层学习到最终输出空间的转换器，在 GPT-2、OPT、Pythia、BLOOM 和 LLaMA 等模型上得到比
      Logit Lens 更平滑、准确的预测轨迹。内部扰动实验还表明，它通常能更好地跟踪模型输出的实际变化。
      不过它仍是一个额外训练的探针，存在自身的近似误差，不能证明解码出的 token 分布就是模型原生采用的表示形式。
    first_date: '2023-03-14'
    primary_paper_ids:
      - p_2023_belrose_eliciting_latent_predictions
    secondary_paper_ids:
      - p_2016_alain_understanding_intermediate_layers
      - p_2020_geva_transformer_feed_forward

  - rq_id: rq-generation-trajectory
    family_id: temporal-development
    question_en: >-
      How far ahead can future generation be decoded from a single hidden state?
    question_zh: 单个隐藏状态能提前读出多远的后续生成？
    introduction_en: >-
      This question asks whether the hidden state at the current token already contains information about tokens beyond
      the immediate next one, and how that readability changes with prediction horizon and layer. Decodable future
      information indicates short-range anticipation, but does not imply that the model has committed to a fixed
      multi-token plan.
    introduction_zh: >-
      该问题研究当前 token 的隐藏状态是否已经包含下一 token 之外的后续生成信息，以及这种可读性如何随预测距离和网络层数变化。
      能够提前读出未来 token，说明模型具有短期预期信息，但不等于模型已经确定了不可修改的多步生成计划。
    progress_en: >-
      Future Lens shows that middle-layer states in GPT-J contain decodable information about several subsequent tokens,
      and that routing the state through the remaining pretrained computation exposes more information than a simple
      linear projection. Accuracy declines with distance and model uncertainty, and only one model and three future
      offsets were tested. The evidence therefore supports short-range anticipatory information, not commitment to a
      complete future trajectory.
    progress_zh: >-
      Future Lens 表明，GPT-J 的中层隐藏状态包含未来数个 token 的可读信息，将状态重新送入预训练模型的后续计算，
      比简单线性投影能提取更多信息。准确率会随预测距离增加和模型置信度下降而衰减，而且实验只覆盖一个模型及三个未来偏移。
      因此，目前证据支持“短期未来信息可被读出”，尚不支持“模型已经提前承诺整段生成轨迹”。
    first_date: '2023-11-08'
    primary_paper_ids:
      - p_2023_pal_future_lens_anticipating

  - rq_id: rq-sequential-reasoning-dynamics
    family_id: temporal-development
    question_en: >-
      How does internal computation evolve across Chain-of-Thought steps?
    question_zh: 思维链生成过程中，内部计算如何随步骤演化？
    introduction_en: >-
      This question asks whether Chain-of-Thought prompting merely changes the generated text or causally reorganizes
      computation across the reasoning process. The object of analysis is no longer one static token or component, but
      how information moves across generated positions and how groups of attention heads jointly support intermediate
      reasoning and the final answer.
    introduction_zh: >-
      该问题研究思维链提示是否只改变了生成文本，还是会使模型内部计算沿整个推理过程发生因果变化。
      分析对象不再是某个静态 token 或单一组件，而是信息如何跨生成位置传递，以及不同注意力头如何共同支持中间推理和最终答案。
    progress_en: >-
      Sequential Activation Patching extends activation intervention across complete generation trajectories. Current
      results identify overlapping head sets involved in maintaining the reasoning trajectory, separating demonstrations
      from the target question, generating numbers, and anchoring the answer; joint patching and zero ablation provide
      causal support. Written reasoning may nevertheless diverge from latent computation, and the evidence remains
      limited to a narrow mathematical setting and relatively coarse trajectory aggregation.
    progress_zh: >-
      Sequential Activation Patching 将激活修补扩展到完整生成轨迹。现有结果表明，维持推理过程、区分示例与问题、
      生成数字和确定答案依赖不同但相互重叠的注意力头集合；联合修补和置零消融也支持这些集合具有因果作用。
      不过书面思维链未必忠实反映潜在计算，当前实验的数学任务、模型和轨迹聚合方式也较受限。
    first_date: '2026-08-23'
    primary_paper_ids:
      - p_2026_dura_mechanistic_interpretability_of

  - rq_id: rq-training-feature-dynamics
    family_id: temporal-development
    question_en: >-
      How do neural networks learn and select useful features during training?
    question_zh: 神经网络如何在训练中学习和选择有用特征？
    introduction_en: >-
      This question asks how gradient-based training changes internal features so that task-relevant structure is
      progressively selected and amplified, rather than leaving the model equivalent to a fixed initial kernel. It
      covers both the conditions that permit genuine feature evolution and mathematical laws that describe feature
      selection, amplification, and propagation.
    introduction_zh: >-
      该问题研究梯度训练如何改变内部特征，使模型逐渐突出与任务相关的结构，而不是始终依赖固定的初始特征。
      它既关注哪些训练设定能够产生真正的特征变化，也试图寻找可计算的规律来解释特征选择、增强和跨层传播。
    progress_en: >-
      Yang and Hu showed that standard and NTK parameterizations approach fixed-kernel behavior at infinite width,
      whereas µP preserves nontrivial feature learning. Radhakrishnan and colleagues then found that the average gradient
      outer product predicts directions amplified by fully connected networks and used it to build recursively
      feature-learning kernels. Beaglehole and colleagues extended the principle to convolutional networks and local
      visual features. These results provide mathematical mechanisms in controlled architectures, but do not yet
      explain feature formation in large-scale Transformer pretraining.
    progress_zh: >-
      Yang 与 Hu 证明，标准参数化和 NTK 参数化在无限宽极限下趋向固定核，而 µP 可以保留非平凡的特征学习。
      随后，Radhakrishnan 等人发现平均梯度外积能够预测全连接网络放大的特征方向，并据此构造递归学习特征的核方法；
      Beaglehole 等人又把这一规律扩展到卷积网络和局部视觉特征。现有结果在受控网络中提供了较明确的数学机制，
      但尚未解释大规模 Transformer 预训练中的特征形成。
    first_date: '2020-11-30'
    primary_paper_ids:
      - p_2020_yang_feature_learning_in
      - p_2022_radhakrishnan_mechanism_of_feature
      - p_2023_beaglehole_mechanism_of_feature

  - rq_id: rq-circuit-formation
    family_id: temporal-development
    question_en: >-
      How do circuits for specific capabilities form during training?
    question_zh: 实现特定能力的电路如何在训练中形成？
    introduction_en: >-
      Starting from an identified functional circuit, this question asks when its matching, copying, routing, and other
      subcomputations emerge, how they depend on one another, and why several smoothly developing components can produce
      an apparently abrupt capability. Evidence typically combines training checkpoints, theoretical dynamics, and
      interventions applied throughout training.
    introduction_zh: >-
      该问题从已经识别出的功能电路继续向前追问：组成电路的匹配、复制、路由等子计算分别在何时形成，
      它们如何相互依赖，以及多个平滑变化的部件为何会产生看似突然出现的完整能力。
      研究通常结合训练检查点、理论动力学和贯穿训练过程的内部干预。
    progress_en: >-
      Olsson and colleagues first observed that induction heads emerge alongside a phase change in in-context-learning
      loss. Nichani and colleagues then showed that, in a controlled two-layer Transformer, early gradients recover
      latent dependency structure through token mutual information, after which the second layer learns matching and
      retrieval. Singh and colleagues found that matching, previous-token routing, and label-copying subcircuits develop
      smoothly, while their multiplicative or cooperative interaction produces the apparent transition; multiple
      induction heads also form redundant paths. The account is strong in synthetic settings but has not been established
      for complex circuits in natural-language models.
    progress_zh: >-
      Olsson 等人首先观察到 induction heads 与上下文学习的损失相变同步出现。Nichani 等人进一步证明，
      在受控两层 Transformer 中，早期梯度通过 token 间互信息恢复潜在依赖结构，随后第二层形成匹配与检索操作。
      Singh 等人则发现 induction circuit 的多个匹配、前一 token 路由和标签复制子电路会平滑成长，
      其乘性或协同作用造成最终突变；多个 induction heads 还形成冗余路径。现有解释在合成任务中较强，
      但尚不能说明自然语言模型中的复杂电路遵循相同形成过程。
    first_date: '2024-02-22'
    primary_paper_ids:
      - p_2024_nichani_how_transformers_learn
      - p_2024_singh_what_needs_to
    secondary_paper_ids:
      - p_2022_olsson_in_context_learning

  - rq_id: rq-capability-phase-transition
    family_id: temporal-development
    question_en: >-
      Why does a model suddenly shift from memorization to generalization?
    question_zh: 模型为何会突然从记忆转向泛化？
    introduction_en: >-
      This question concerns grokking: why test performance can rise abruptly long after a model has already fit the
      training set. By examining internal circuits and continuous progress measures, it asks whether the visible
      transition results from smoother formation, competition, and replacement between memorizing and generalizing
      mechanisms.
    introduction_zh: >-
      该问题关注 grokking：模型已经完全拟合训练集之后，为何测试性能会在很久以后突然上升。
      研究通过内部电路和连续进展指标，检验这种表面突变是否来自记忆机制与泛化机制之间较为平滑的形成、竞争和替代。
    progress_en: >-
      Nanda and colleagues identified a gradually forming Fourier generalization circuit in modular addition and
      separated training into memorization, circuit formation, and cleanup phases; internal measures change continuously
      before test accuracy jumps. Varma and colleagues proposed a circuit-efficiency account: memorizing circuits learn
      faster, but generalizing circuits produce the same training outputs with lower parameter norm and eventually
      dominate under weight decay. The account successfully predicted ungrokking and semi-grokking, but remains grounded
      in controlled algorithmic tasks rather than general capability emergence in large models.
    progress_zh: >-
      Nanda 等人在模加法模型中识别出逐渐形成的 Fourier 泛化电路，并把训练过程分为记忆、泛化电路形成和清理阶段；
      内部指标在测试准确率突升前已经连续变化。Varma 等人进一步提出电路效率解释：记忆电路学习较快，
      但泛化电路能以更小参数范数产生相同训练输出，因此在权重衰减下最终占据主导。
      该理论成功预测了 ungrokking 和 semi-grokking，但仍主要适用于受控算法任务，尚未解释大模型中的一般能力涌现。
    first_date: '2023-01-12'
    primary_paper_ids:
      - p_2023_nanda_progress_measures_for
      - p_2023_varma_explaining_grokking_through

  - rq_id: rq-posttraining-mechanism-change
    family_id: temporal-development
    question_en: >-
      Does fine-tuning create new mechanisms or reorganize existing ones?
    question_zh: 微调会创造新机制，还是重组已有机制？
    introduction_en: >-
      This question compares base and fine-tuned models to determine whether behavioral changes arise from genuinely new
      representations and circuits or from strengthening, suppressing, extending, and recombining existing mechanisms.
      Because model-difference methods can mistake activation shifts or sparse-optimization artifacts for novel features,
      claims of a new mechanism require both representational and causal evidence.
    introduction_zh: >-
      该问题比较基础模型与微调后模型的内部计算，判断性能变化来自全新的表示和电路，
      还是来自对已有机制的强化、抑制、扩展或重新组合。由于模型差分方法可能把激活变化或稀疏优化伪影误判成新特征，
      因此“出现新机制”需要表示和因果两方面的证据。
    progress_en: >-
      Entity-tracking studies find that arithmetic fine-tuning largely preserves and strengthens an existing
      positional-routing circuit while recruiting additional heads, rather than replacing the algorithm. SAE analyses
      of reasoning models similarly suggest that post-training amplifies features associated with uncertainty,
      exploration, and reflection, but cannot show that these features were completely absent from the base model.
      Crosscoder studies further demonstrate that many apparently chat-specific features arise from shrinkage or feature
      splitting induced by sparse objectives. Current evidence therefore favors strengthening and reorganization in
      several cases, but does not establish a general law of post-training.
    progress_zh: >-
      实体追踪研究发现，算术微调模型主要保留并增强基础模型已有的位置路由电路，同时招募更多注意力头，
      而不是替换整个算法。对推理模型的 SAE 分析也发现后训练会增强与不确定、探索和反思相关的特征，
      但尚不能证明这些特征在基础模型中完全不存在。Crosscoder 研究进一步表明，许多看似“聊天模型独有”的特征
      其实来自稀疏目标造成的收缩或特征拆分。当前证据更支持后训练经常强化和重组已有机制，但还不足以形成普遍规律。
    first_date: '2024-02-22'
    primary_paper_ids:
      - p_2024_prakash_fine_tuning_enhances
    secondary_paper_ids:
      - p_2025_galichin_i_have_covered
      - p_2025_minder_overcoming_sparsity_artifacts

  - rq_id: rq-localization-editing
    family_id: intervention-control
    question_en: >-
      Is the location where knowledge is used also the best place to edit it?
    question_zh: 知识被调用的位置，也是最佳编辑位置吗？
    introduction_en: >-
      Causal localization can identify layers or activation sites that affect how a model expresses a fact, whereas knowledge editing changes model parameters. A site that is important during inference need not be the easiest, most effective, or most localized place to modify, because other layers may compensate for or overwrite the change. This question asks whether localization scores predict editing success, generalization, and specificity, and under what conditions localization and editability are related.
    introduction_zh: >-
      因果定位可以识别哪些层或激活位置会影响模型表达某条知识，但知识编辑改变的是模型参数。一个位置在推理时非常重要，并不意味着修改对应层的权重最容易、最有效或副作用最小；其他层可能补偿或覆盖该位置的变化。该问题研究因果定位分数能否预测编辑成功率、泛化能力和局部性，以及定位与编辑究竟在什么条件下相关。
    progress_en: >-
      ROME combines causal tracing with targeted weight editing, identifying middle-layer MLPs at the final subject token as high-leverage sites for factual recall and successful local rewriting. This result invites the assumption that stronger localization implies a better editing target. Does Localization Inform Editing? tests that assumption across models, datasets, localization methods, editors, and evaluation metrics, finding that example-level localization scores are usually nearly uncorrelated with editing success. Restoring an activation at a site can affect factual expression without making the corresponding weights the best editing target, because downstream layers may overwrite the edit. The evidence rejects causal localization as a direct layer-selection rule for editing without undermining its value for explaining knowledge use during inference.
    progress_zh: >-
      ROME 将 causal tracing 与定向权重编辑结合，在主语末词元的中层 MLP 中定位事实回忆的高杠杆位置，并成功进行局部事实改写。这一结果容易使人推断：定位分数越高的位置越适合编辑。Does Localization Inform Editing? 系统比较了不同模型、数据集、定位方法、编辑器和评价指标，却发现逐样本定位分数与编辑成功率通常接近零相关。在一个位置恢复激活能够影响事实表达，不代表修改该位置的权重就是最佳编辑方案，因为下游层可能覆盖编辑结果。现有证据因此否定了“因果定位可以直接作为编辑选层规则”的简单假设，但并未否定定位对解释推理时知识调用的价值。
    first_date: '2023-01-10'
    primary_paper_ids:
      - p_2023_hase_does_localization_inform
    secondary_paper_ids:
      - p_2022_meng_locating_and_editing

  - rq_id: rq-representation-control
    family_id: intervention-control
    question_en: >-
      Can model behavior be controlled reliably by manipulating internal directions?
    question_zh: 能否通过操纵内部方向稳定控制模型行为？
    introduction_en: >-
      Decoding a direction associated with truthfulness, emotion, safety, or reasoning state does not imply that moving activations along that direction will control behavior reliably. This question asks whether internal directions can serve as inference-time control interfaces: whether interventions remain effective across inputs and distributions, produce predictable and reversible changes, and avoid destroying other information, increasing evasiveness, or merely changing surface style.
    introduction_zh: >-
      从模型激活中读出与真实性、情绪、安全性或推理状态相关的方向，并不意味着沿该方向移动就能可靠控制行为。该问题研究内部方向能否作为推理时的控制接口：干预是否跨输入和数据分布保持有效，行为变化是否可预测且可逆，以及是否会同时破坏其他信息、增加回避回答或只改变表面表达风格。
    progress_en: >-
      Inference-Time Intervention first shows that linearly accessible truth-related signals in a small number of attention heads can shift answers and partially transfer out of distribution. Strong intervention, however, can increase evasive answers and damage other information carried by the same activations. Representation Engineering extends directional control to high-level properties such as honesty, harmlessness, emotion, power seeking, and factuality, showing that simple linear patterns can support both diagnosis and reversible behavior change. Work in vision-language models further suggests that control persists across layers when a dominant activity direction remains aligned with successive updates. Experiments on SAE reasoning features also obtain modest performance gains by steering reflection or uncertainty features, although reasoning length changes more strongly. Internal directions can therefore provide useful local control interfaces, but their stability, specificity, and cross-model generality remain insufficient for a universal control guarantee.
    progress_zh: >-
      Inference-Time Intervention 首先发现，少量注意力头中可线性读出的真实性信号可以通过激活移动改变回答，在部分分布外数据上也能迁移；但强干预会增加回避回答，并可能破坏同一激活中的其他信息。Representation Engineering 随后把方向控制扩展到诚实、无害、情绪、权力倾向和事实性等高层属性，显示简单线性模式既可用于诊断，也能产生可逆行为变化。针对视觉语言模型的研究进一步提出，当主导活动方向与逐层更新保持对齐时，控制效果更容易跨层维持。SAE 推理特征实验还表明，操纵反思或不确定性特征可以小幅改善任务表现，但对推理长度的影响更明显。当前已证明内部方向可以成为有效的局部控制接口，但稳定性、特异性和跨模型泛化仍不足以支持通用控制保证。
    first_date: '2023-06-06'
    primary_paper_ids:
      - p_2023_li_inference_time_intervention
      - p_2023_zou_representation_engineering_a
      - p_2025_tian_why_representation_engineering
    secondary_paper_ids:
      - p_2025_galichin_i_have_covered

  - rq_id: rq-interpretable-learning
    family_id: intervention-control
    question_en: >-
      Can training make a model implement a specified causal structure?
    question_zh: 能否在训练中让模型形成指定的因果结构？
    introduction_en: >-
      Most interpretability methods search for internal structure after training. This question instead asks whether an analyst can specify an interpretable high-level causal model in advance and train a neural network whose internal representations and counterfactual behavior align with it. The goal is not only correct outputs but computation through the specified intermediate variables and causal relations, potentially improving systematic generalization while making the internal mechanism easier to interpret.
    introduction_zh: >-
      多数解释方法是在训练完成后寻找模型已经形成的内部结构。该问题反过来研究，能否事先给出一个人类可理解的高层因果模型，并在训练过程中要求神经网络的内部表示和反事实行为与它对应。目标不仅是获得正确输出，还要使模型按照指定的中间变量和因果关系完成计算，从而改善系统性泛化并使内部机制更容易解释。
    progress_en: >-
      Inducing Causal Structure trains with interchange interventions, aligning intermediate variables in a high-level causal model with internal neural locations and requiring swaps of those representations to produce the corresponding high-level counterfactual outputs. Across vision, embodied navigation, and natural-language inference, this internal counterfactual training improves agreement with the specified causal structure and often improves systematic generalization over ordinary supervision, multitask probe objectives, and selected data augmentation methods. A zero-loss result provides a conditional formal guarantee, while held-out intervention accuracy tests approximate realization under finite training. The main limitation is that the high-level causal model and alignment locations must be supplied by the analyst; discovering the correct structure for complex real tasks remains unresolved.
    progress_zh: >-
      Inducing Causal Structure 使用 interchange intervention 训练，把高层因果模型中的中间变量与网络内部位置对齐，并要求交换这些表示后得到与高层反事实一致的输出。在视觉、具身导航和自然语言推断任务中，这种内部反事实训练提高了对指定因果结构的符合度，也经常改善系统性泛化，优于普通监督、多任务 probe 目标和部分数据增强方法。零损失结果提供了条件性的形式保证，留出干预准确率则检验有限训练下的近似实现。主要限制是高层因果模型及其对齐位置必须由研究者预先给出；如何在复杂真实任务中发现正确结构仍未解决。
    first_date: '2021-12-01'
    primary_paper_ids:
      - p_2021_geiger_inducing_causal_structure

  - rq_id: rq-mechanism-universality
    family_id: generality-transfer
    question_en: >-
      Do different training runs, models, and architectures reproduce the same mechanism, or only share an abstract algorithm?
    question_zh: 不同任务运行、模型与架构会复现同一机制，还是只共享抽象算法？
    introduction_en: >-
      This question distinguishes strong universality of concrete features, components, and circuits from weak universality at the functional or algorithmic level, allowing equal performance with different structures.
    introduction_zh: >-
      该问题区分具体 feature、component、circuit 的强 universality 与功能或算法层面的弱 universality，
      并允许性能相同但结构不同。
    progress_en: >-
      A group-operation toy model first separated strong circuit identity from weak algorithmic universality.
      Later work found component reuse across tasks, recurring successor heads, stitchable linear features, and numerical-comparison circuits across architectures.
      The evidence supports greater recurrence of abstract function than exact structure, but equivalence metrics and boundaries across scale remain unsettled.
    progress_zh: >-
      群运算 toy model 首先区分具体电路相同的强 universality 与共享算法的弱 universality，随后研究发现跨任务组件复用、重复出现的 successor heads、可 stitching 的线性特征和跨架构数值比较电路。
      总体证据支持抽象功能比具体结构更普遍，但衡量等价性的标准及其跨规模边界仍未统一。
    first_date: '2023-02-06'
    primary_paper_ids:
      - p_2023_chughtai_a_toy_model
      - p_2023_merullo_circuit_component_reuse
      - p_2023_gould_successor_heads_recurring
      - p_2025_chen_transferring_linear_features
      - p_2026_bhardia_mechanistic_analysis_of

  - rq_id: rq-induction-head-icl-mechanism
    family_id: computational-mechanism
    question_en: >-
      How do induction heads support in-context learning?
    question_zh: Induction head 如何支持上下文学习？
    introduction_en: >-
      This question asks whether the match-and-copy circuit implemented by induction heads provides a general mechanism for in-context learning. The model matches the current token to an earlier occurrence and copies what followed that occurrence, allowing it to exploit repeated or analogous structures in context. Three increasingly strong claims must be distinguished: that the circuit can implement the algorithm, that it emerges alongside in-context learning during training, and that it explains most in-context learning in large models.
    introduction_zh: >-
      该问题研究 induction head 的 match-and-copy 电路是否构成上下文学习的一种通用机制：模型先匹配当前词元与先前出现的位置，再复制先前位置之后的内容，从而利用上下文中的重复或类比结构。需要区分“能够执行该算法”“训练时与上下文学习同时出现”和“解释大模型中的大部分上下文学习”这三种强度不同的主张。
    progress_en: >-
      In small attention-only models, researchers reconstruct a two-layer circuit involving previous-token heads and induction heads and show through ablation and architectural interventions that it explains most of the measured improvement in in-context loss. Small models with MLPs also exhibit a training phase transition in which induction heads and in-context learning emerge together. Larger models show evidence of a progression from exact repetition to more abstract pattern matching, but have not received equally strong causal ablation tests. Induction heads can therefore be treated as an important in-context-learning mechanism, particularly for match-and-copy over repeated or analogous sequences, but the claim that they explain most in-context learning in large models remains insufficiently supported.
    progress_zh: >-
      在小型纯注意力模型中，研究完整重构了由前序词元头与 induction head 组成的两层电路，并通过消融和架构干预证明它解释了大部分所测上下文损失改善。含 MLP 的小模型中也观察到 induction head 出现与上下文学习能力的训练相变同步。在更大模型中，相关头表现出从精确重复到更抽象模式匹配的迹象，但没有获得同等强度的因果消融证据。当前可以较有把握地说 induction head 是上下文学习的重要机制之一，尤其负责重复和类比序列中的匹配—复制；但“它解释大模型中的大部分上下文学习”仍属于证据不足的强主张。
    first_date: '2022-09-24'
    primary_paper_ids:
      - p_2022_olsson_in_context_learning

  - rq_id: rq-task-vector-editing
    family_id: intervention-control
    question_en: >-
      Can parameter task vectors remove or combine model capabilities?
    question_zh: 能否用参数任务向量删除或组合模型能力？
    introduction_en: >-
      The parameter difference between a base model and a model fine-tuned for a task can be treated as a task vector.
      This question asks whether such vectors can act as modular editing operators: negation should remove a behavior,
      addition should combine capabilities, and vector analogies should transfer task relations to new tasks.
      Behavioral success does not imply that parameter space is intrinsically linear, and evaluation must account for
      scaling, task interference, and collateral effects on other capabilities.
    introduction_zh: >-
      模型针对某项任务微调前后的参数差分，可以被视为一个任务向量。该问题研究这些向量能否作为模块化编辑算子：
      取反后删除相应行为，相加后组合多项能力，或通过向量类比把任务关系迁移到新任务。
      行为上的成功并不意味着参数空间真正线性，也需要检查缩放系数、任务冲突和对其他能力的副作用。
    progress_en: >-
      Task Arithmetic shows that parameter differences induced by fine-tuning exhibit approximately linear structure
      across many tasks. Negating a vector can selectively suppress behavior, adding vectors can combine capabilities,
      and some analogies improve a target task without target-task training data. The experiments span vision and
      language and measure trade-offs with control-task performance. Coefficients nevertheless require tuning, and
      unrelated tasks, large parameter shifts, or incompatible capabilities produce nonlinear interference. Function
      Vectors provide related but distinct evidence in activation space: tasks can also appear as injectable
      hidden-state directions, but these are not the same object as parameter task vectors. Task vectors are useful
      editing tools, but general interference-free modular arithmetic over capabilities has not been established.
    progress_zh: >-
      Task Arithmetic 表明，微调形成的参数差分在多项任务中具有近似线性结构。向量取反可以选择性压制某些行为，
      多个向量相加能够组合能力，部分类比关系还能在没有目标任务训练数据时提高性能。
      这些结果覆盖视觉与语言任务，并检验了编辑效果与控制任务性能之间的权衡。不过系数通常需要调节，
      无关任务、大幅参数移动和不相容能力会产生非线性交互。Function Vectors 在激活空间中提供了相关但不同的证据：
      任务也可以表现为可注入的隐藏状态方向，但它不等同于参数任务向量。现有研究支持任务向量作为实用编辑工具，
      尚未证明模型能力可以普遍进行无干扰的模块化运算。
    first_date: '2022-12-08'
    primary_paper_ids:
      - p_2022_ilharco_editing_models_with
    secondary_paper_ids:
      - p_2023_todd_function_vectors_in

  - rq_id: rq-language-specific-representation
    family_id: representation-form
    question_en: >-
      Do models use language-specific neurons to represent different languages?
    question_zh: 模型是否用特定神经元表示不同语言？
    introduction_en: >-
      This question asks whether language identity is concentrated in a small set of selective neurons and whether those units influence the language in which a model generates. Stronger activation for one language does not imply that a neuron exclusively represents language identity or carries transferable task knowledge. Language selection, language-modeling ability, and cross-lingual transfer must therefore be distinguished.
    introduction_zh: >-
      该问题研究语言身份是否集中在少量选择性神经元中，以及这些单元是否影响模型使用哪种语言生成。对某种语言激活更强并不意味着神经元只承担语言身份功能，也不意味着它承载了可迁移的任务知识。因此需要区分语言选择、语言建模能力和跨语言迁移能力。
    progress_en: >-
      Language-Specific Neurons uses activation-probability entropy across languages to identify selective neurons concentrated in particular layers. Suppressing or increasing their activations changes language perplexity and output language, providing local causal evidence for language-identity representation. Later work finds that manipulating or selectively fine-tuning these neurons does not reliably improve cross-lingual task accuracy, while zeroing them often leaves task performance largely intact. A small neuron set can therefore influence language selection without independently carrying full language competence or transfer mechanisms. Selectivity, output control, and cross-lingual transfer are not interchangeable.
    progress_zh: >-
      Language-Specific Neurons 使用不同语言上的激活概率熵识别语言选择性神经元，并发现这些单元集中在特定层位；抑制或增强其激活会改变语言困惑度和输出语言，为语言身份表示提供局部因果证据。后续研究却发现，在推理时操纵或定向微调这些单元，并不能稳定提高低资源语言的跨语言任务准确率，置零也常常几乎不损害任务表现。现有结果说明，少量神经元可以影响语言选择，但它们并不独立承载完整语言能力或跨语言迁移机制；选择性、输出控制和迁移能力不能相互替代。
    first_date: '2024-02-26'
    primary_paper_ids:
      - p_2024_tang_language_specific_neurons
    secondary_paper_ids:
      - p_2025_mondal_language_specific_neurons

  - rq_id: rq-language-neuron-control
    family_id: intervention-control
    question_en: >-
      Can manipulating language-selective neurons improve cross-lingual transfer?
    question_zh: 操纵语言选择性神经元能否改善跨语言迁移？
    introduction_en: >-
      Some neurons are strongly selective for particular languages and can influence which language a model generates.
      This descriptive localization does not imply that they carry transferable linguistic knowledge. This question
      tests, through inference-time activation manipulation and targeted fine-tuning, whether language-selective neurons
      provide an effective control target for improving low-resource-language task performance rather than merely
      changing the output language.
    introduction_zh: >-
      一些神经元对特定语言表现出较强选择性，并能影响模型使用哪种语言生成。但这种描述性定位不意味着它们承载了可迁移的语言知识。
      该问题通过推理时激活操纵和定向微调，检验语言选择性神经元能否成为改善低资源语言任务表现的有效控制目标，
      而不只是改变输出语言。
    progress_en: >-
      Existing work tests increasing target-language-neuron activations, suppressing source-language neurons, and
      fine-tuning only the selected language neurons, but none reliably improves cross-lingual task accuracy. Zeroing
      these neurons often causes little task-performance loss, suggesting that transferable multilingual competence is
      not independently concentrated in them. The negative result does not deny their influence on output-language
      choice; instead, it separates language-identity control from cross-lingual knowledge transfer. Localizing and
      manipulating a language representation is therefore insufficient to establish an effective transfer lever.
    progress_zh: >-
      现有研究分别尝试增强目标语言神经元的激活、抑制源语言神经元，以及只微调被选中的语言神经元，
      但均未稳定改善跨语言任务准确率。将这些神经元置零也常常几乎不损害任务表现，说明跨语言能力并未独立集中在这些单元中。
      负面结果不否定语言选择性神经元会影响输出语言，而是表明语言身份控制与跨语言知识迁移属于不同功能。
      当前证据因此构成一个重要边界：能够定位和操纵语言身份表示，并不足以得到有效的迁移杠杆。
    first_date: '2025-03-21'
    primary_paper_ids:
      - p_2025_mondal_language_specific_neurons

  - rq_id: rq-reasoning-state-features
    family_id: representation-form
    question_en: >-
      Do models represent different reasoning states with sparse features?
    question_zh: 模型是否用稀疏特征表示不同的推理状态？
    introduction_en: >-
      This question asks whether states such as uncertainty, exploration, reflection, and conclusion correspond to identifiable sparse features inside a reasoning model. Internal computational states must be distinguished from surface discourse markers such as “maybe,” “wait,” or “therefore.” Comparing base and reasoning-post-trained models can show whether such features are introduced or amplified, while steering provides only local evidence about their functional role.
    introduction_zh: >-
      该问题研究推理过程中的不确定、探索、反思和结论等状态，是否对应模型内部可识别的稀疏特征。需要区分真正参与推理计算的内部状态与“也许”“等等”“因此”等表面语言标记。比较基础模型与推理后训练模型可以观察这些特征是否被新增或增强，而 steering 只能为其功能作用提供局部证据。
    progress_en: >-
      Current work uses SAEs and a discourse-based ReasonScore to identify sparse features associated with uncertainty, exploration, reflection, and conclusion. Comparisons between base and reasoning-post-trained models suggest that post-training strengthens some readable reasoning features. Steering those features yields modest task improvements rather than only increasing the corresponding marker words. The evidence supports manipulable reasoning-state structure, but performance gains are much smaller than changes in reasoning length, and SAE splitting or absorption remains possible. Existing results do not fully separate computational state from language style or recover the complete reasoning algorithm.
    progress_zh: >-
      现有研究使用 SAE 和基于推理话语模式的 ReasonScore，识别出与不确定、探索、反思和结论阶段相关的稀疏特征。基础模型与推理后训练模型的比较表明，后训练会增强一部分可读推理特征；对这些特征进行 steering 可以带来小幅任务性能提升，而不只是增加相应标记词。结果支持推理过程中存在可操作的状态结构，但性能增益远小于推理轨迹长度的变化，SAE 还可能拆分或吸收概念。现有证据尚不能完全区分真实计算状态与语言风格，也没有恢复完整的推理算法。
    first_date: '2025-03-24'
    primary_paper_ids:
      - p_2025_galichin_i_have_covered

  - rq_id: rq-model-diffing-validity
    family_id: evidential-standards
    question_en: >-
      Are novel features found by model diffing genuine changes or methodological artifacts?
    question_zh: 模型差分发现的新特征是真实变化还是方法伪影？
    introduction_en: >-
      A sparse feature that differs between a base and fine-tuned model does not automatically indicate that
      post-training created a new mechanism. Decoder norms, sparsity objectives, and feature splitting can manufacture
      apparent model specificity. Novelty claims must therefore be cross-checked through activation, reconstruction
      contribution, and causal effects in both models.
    introduction_zh: >-
      基础模型与微调模型之间出现不同的稀疏特征，并不自动说明后训练创造了新机制。
      解码器范数、稀疏目标和特征拆分可能制造表面上的模型特异性，因此新特征必须在两个模型的激活、重构贡献和因果作用中交叉验证。
    progress_en: >-
      Crosscoder studies identify complete shrinkage and latent decoupling as major artifacts, showing that many
      features labeled chat-specific by decoder norm remain functionally present in the base model. Latent Scaling
      provides an alternative diagnostic, while BatchTopK reduces these artifacts. Evidence remains concentrated on one
      model pair and layer and cannot yet fully distinguish genuinely new concepts, amplification of existing concepts,
      and shifts in activation distributions.
    progress_zh: >-
      Crosscoder 研究识别出 complete shrinkage 和 latent decoupling 两种主要伪影，
      说明许多按解码器范数判断的“聊天模型独有”特征实际上仍在基础模型中发挥作用。
      Latent Scaling 提供了新的诊断方法，BatchTopK 也减少了相关伪影。但证据目前主要来自一个模型对和单一层，
      尚不能彻底区分新概念、旧概念增强与激活分布变化。
    first_date: '2025-04-03'
    primary_paper_ids:
      - p_2025_minder_overcoming_sparsity_artifacts

  - rq_id: rq-latent-knowledge-elicitation
    family_id: intervention-control
    question_en: >-
      How can a model be made to express knowledge it has internally but does not reveal?
    question_zh: 如何让模型说出内部已有但未表达的知识？
    introduction_en: >-
      When a model gives an incorrect, evasive, or deceptive answer, changing the output does not show that the correct
      knowledge was already present internally. This question asks how to distinguish encoded-but-unexpressed knowledge
      from knowledge that was never encoded, then localize the relevant representation, verify its causal relation to
      the correct answer, and use a localized intervention to make it reliably influence generation. The central risk
      is that the intervention may create a new answer rather than reveal existing knowledge.
    introduction_zh: >-
      当模型给出错误、回避或欺骗性回答时，直接改变输出并不能说明正确知识原本已经存在。
      该问题研究如何先区分“知识已编码但没有表达”与“模型根本没有编码”，再定位相关内部表示、验证它对正确答案具有因果作用，
      并通过尽量局部的干预使知识稳定影响生成。核心风险是干预可能制造一个新答案，而不是揭示模型原有知识。
    progress_en: >-
      MechELK decomposes latent-knowledge elicitation into three stages: sparse representations localize candidate
      knowledge features, interventions test whether those features causally affect the correct answer, and only
      validated directions are used to steer generation. Compared with contrast consistency or correlational readout
      alone, the pipeline elicits hidden answers more effectively on deceptive, evasive, and multi-step tasks, while
      stage ablations suggest that causal validation removes some invalid candidates. The experiments nevertheless use
      known candidate answers and ground truth and depend on the quality of public SAEs; leakage during validation could
      still cause the intervention to manufacture an answer. The line has advanced from reading latent knowledge to
      eliciting it after causal validation, but reliability under genuine strategic deception and open-ended answering
      remains unestablished.
    progress_zh: >-
      MechELK 将潜在知识诱导拆成三个阶段：用稀疏表示定位候选知识特征，通过干预验证这些特征是否影响正确答案，
      再利用通过验证的方向引导生成。与纯对比一致性或相关读出相比，该流程在欺骗、回避和多步问题上更能诱导隐藏答案；
      阶段消融也表明因果验证能够排除部分无效候选。不过实验使用已知候选答案和真值，效果依赖公开 SAE 的特征质量；
      如果验证过程发生信息泄漏，干预仍可能是在制造答案。研究已经从“能否读出潜在知识”推进到“能否在因果验证后诱导表达”，
      但真实策略性欺骗和开放式答案中的可靠性仍未建立。
    first_date: '2026-04-07'
    primary_paper_ids:
      - p_2026_park_mechelk_a_mechanistic

  - rq_id: rq-monosemanticity-measurement
    family_id: evidential-standards
    question_en: >-
      How can SAE feature monosemanticity be measured without concept labels?
    question_zh: 如何在没有概念标签时衡量 SAE 特征的单义性？
    introduction_en: >-
      This question seeks to turn the claim that an SAE feature expresses one concept into a computable evaluation
      criterion. An ideal metric should not require human concept labels or external embedding geometry and should
      relate to feature stability during training and selective causal manipulation.
    introduction_zh: >-
      该问题尝试把“一个 SAE 特征只表达一个概念”转化为可计算的评价标准。
      理想指标不应依赖人工概念标签或外部嵌入空间，并应与特征在训练中的稳定性以及选择性因果操作能力相关。
    progress_en: >-
      The Tversky Monosemanticity Score measures monosemanticity through coherence among the examples activating a
      latent. It is less distorted by anisotropy than external-embedding metrics and, in some settings, better predicts
      whether a concept can be selectively removed. This provides a label-free measure, but continuous activations are
      reduced to binary sets and results depend on thresholds and sampling. Concept deletion also does not necessarily
      imply selective effects on model behavior, so the metric is not a final standard of monosemanticity.
    progress_zh: >-
      Tversky Monosemanticity Score 根据一个潜变量所激活样本集合的内部一致性衡量单义性，
      相比外部嵌入指标更少受各向异性影响，并能在部分设置中更好预测概念是否可被选择性删除。
      这提供了一种无标签测量方案，但连续激活被简化为二值集合，结果依赖阈值和采样；
      概念删除也不等于对模型行为产生选择性影响，因此尚未形成单义性的最终标准。
    first_date: '2026-07-20'
    primary_paper_ids:
      - p_2026_filus_measuring_monosemanticity_in

